<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VitchMarket</title>
<meta name="description" content="Simulador de supermercado: cajero/a y jefe de tu propio súper de barrio.">
<meta name="theme-color" content="#e5383b">
<meta name="color-scheme" content="light">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="VitchMarket">
<meta name="application-name" content="VitchMarket">
<meta name="format-detection" content="telephone=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout: HUD arriba, cola de clientes, mostrador (cinta) a la izquierda y caja registradora a la derecha. */
:root{
  --floor:#17352f; --floor2:#1d443b; --paper:#f6f1e4; --ink:#1b1f1d;
  --sign:#e5383b; --tag:#ffd23f; --ok:#2a9d5c; --mute:#7c8a84; --belt:#2b2f2e;
  --display:'Fredoka',system-ui,sans-serif; --body:'Nunito',system-ui,sans-serif; --led:'VT323',ui-monospace,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;}
body{
  background:var(--floor);
  background-image:
    linear-gradient(var(--floor2) 1px,transparent 1px),
    linear-gradient(90deg,var(--floor2) 1px,transparent 1px);
  background-size:48px 48px;
  color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.4;
  -webkit-user-select:none;user-select:none;
}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--tag);outline-offset:2px}
#app{max-width:1060px;margin:0 auto;padding:0 16px 40px;display:flex;flex-direction:column;gap:12px}
.sticky{position:sticky;top:0;z-index:10;display:flex;flex-direction:column;gap:12px;padding:12px 0 8px;background:var(--floor);box-shadow:0 8px 12px -6px rgba(0,0,0,.45)}

/* HUD */
.hud{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;background:var(--sign);color:#fff;padding:10px 16px;border-radius:6px;border-bottom:5px solid #9f1d20}
.brand{font-family:var(--display);font-size:20px;letter-spacing:.5px;margin-right:auto;line-height:1}
.brand small{display:block;font-family:var(--body);font-size:11px;letter-spacing:2px;opacity:.85;margin-top:4px}
.stat{display:flex;flex-direction:column;align-items:flex-end;min-width:64px}
.stat span{font-size:10px;letter-spacing:1.5px;opacity:.8;text-transform:uppercase}
.stat b{font-family:var(--led);font-size:30px;line-height:.9;font-weight:400;color:var(--tag)}
.daybar{height:6px;background:rgba(0,0,0,.25);border-radius:3px;overflow:hidden;flex-basis:100%}
.daybar i{display:block;height:100%;width:0;background:var(--tag)}
.mute{background:rgba(0,0,0,.25);border-radius:4px;padding:4px 8px;font-size:12px}

/* Cola */
.queue-wrap{background:rgba(0,0,0,.22);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.queue{display:flex;gap:10px;align-items:flex-end}
.cust,.slot{width:64px;flex:0 0 64px;display:flex;flex-direction:column;align-items:center;gap:4px}
.slot{height:68px;border:2px dashed rgba(255,255,255,.18);border-radius:8px}
.face{font-size:34px;line-height:1;filter:grayscale(.25)}
.cust.front .face{font-size:46px;filter:none}
.cust.front{flex-basis:84px;width:84px}
.pbar{width:100%;height:7px;background:rgba(0,0,0,.35);border-radius:4px;overflow:hidden}
.pbar i{display:block;height:100%;width:100%;background:var(--ok)}
.pbar i.mid{background:var(--tag)}.pbar i.low{background:var(--sign)}
.bubble{background:var(--paper);border-radius:10px;padding:8px 12px;font-size:13px;min-height:36px;display:flex;align-items:center;gap:8px;position:relative}
.chat{min-height:22px;color:#fff;font-size:13px;display:flex;align-items:center;gap:8px}
.chat .who{font-size:20px;line-height:1}
.chat.angry{color:var(--tag)}
.bubble.muted{background:transparent;color:rgba(255,255,255,.6);padding-left:0}

/* Escenario */
.stage{display:grid;grid-template-columns:1.25fr 1fr;gap:12px;align-items:start}
.counter{background:#e4dccb;border-radius:6px;padding:12px;border-bottom:6px solid #b8ad94;display:flex;flex-direction:column;gap:8px;min-height:340px}
.zone-title{font-family:var(--display);font-size:11px;letter-spacing:2px;color:#5b5646}
.belt{background:var(--belt);background-image:repeating-linear-gradient(90deg,transparent 0 22px,rgba(255,255,255,.06) 22px 24px);border-radius:6px;padding:12px;min-height:128px;display:flex;flex-wrap:wrap;gap:10px;align-content:flex-start}
.hint{color:rgba(255,255,255,.4);align-self:center;margin:auto}
.item{position:relative;width:84px;background:var(--paper);border-radius:8px;padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 3px 0 rgba(0,0,0,.35);transition:transform .08s}
.item:active{transform:translateY(3px);box-shadow:0 0 0 rgba(0,0,0,.35)}
.item .em{font-size:30px;line-height:1}
.item .nm{font-size:11px;text-align:center;line-height:1.1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .fm{font-size:9px;color:var(--mute);text-align:center;line-height:1.05}
.item .code{font-size:11px;color:var(--sign);letter-spacing:2px}
.item.dmg{outline:2px dashed var(--sign);outline-offset:-3px}
.item .age{position:absolute;top:-6px;right:-6px;background:var(--sign);color:#fff;font-size:10px;font-weight:500;border-radius:10px;padding:1px 6px}
.item.flash{animation:shake .25s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.bagged{display:flex;flex-wrap:wrap;gap:6px;min-height:42px;background:rgba(0,0,0,.08);border-radius:6px;padding:8px;font-size:24px;line-height:1}
.bagged .none{font-size:12px;color:#7a735f;align-self:center}

/* Caja */
.register{background:#d9d4c7;border-radius:6px;padding:12px;border-bottom:6px solid #a49d8a;display:flex;flex-direction:column;gap:10px}
.led{background:#0d1f1a;color:#6dffb0;font-family:var(--led);border-radius:4px;padding:6px 12px;display:flex;justify-content:space-between;align-items:baseline;border:3px solid #3a403d}
.led small{font-size:18px;opacity:.7;letter-spacing:2px}
.led b{font-size:46px;font-weight:400;line-height:1}
.receipt{background:var(--paper);padding:10px 12px 16px;max-height:176px;overflow:auto;font-size:12px;
  -webkit-mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/12px 100%;mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/12px 100%}
.receipt .ln{display:flex;justify-content:space-between;gap:8px}
.receipt .ln.den{text-decoration:line-through;color:var(--mute)}
.receipt.empty{color:var(--mute);text-align:center;padding:24px 12px}
.row{display:flex;gap:8px}
.btn{flex:1;background:var(--paper);border-radius:6px;padding:10px 8px;font-weight:500;box-shadow:0 3px 0 rgba(0,0,0,.3);text-align:center}
.btn:active{transform:translateY(3px);box-shadow:none}
.btn.on{background:var(--tag)}
.btn.go{background:var(--ok);color:#fff}
.btn.no{background:var(--sign);color:#fff}
.btn[disabled]{opacity:.4;cursor:not-allowed;transform:none;box-shadow:0 3px 0 rgba(0,0,0,.3)}
.idcard{background:#cfe8f5;border:2px solid #6aa5c4;border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px}
.idcard h4{margin:0;font-family:var(--display);font-size:12px;letter-spacing:1.5px;font-weight:400;color:#2a5a75}
.idcard dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:2px 10px}
.idcard dt{color:#2a5a75;font-size:11px}.idcard dd{margin:0;font-weight:500}
.cashrow{display:flex;justify-content:space-between;align-items:baseline;padding:2px 2px}
.cashrow b{font-family:var(--led);font-size:28px;font-weight:400}
.cashrow.tray b{color:var(--sign)}
.cashrow.due{background:var(--tag);border-radius:4px;padding:2px 8px}
.denoms{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.dn{position:relative;padding:10px 0;border-radius:5px;font-weight:500;box-shadow:0 3px 0 rgba(0,0,0,.3);text-align:center}
.dn:active{transform:translateY(3px);box-shadow:none}
.dn.bill{background:#bfe0c8}.dn.coin{background:#e6d7a3}
.dn .cnt{position:absolute;top:-6px;right:-4px;background:var(--ink);color:#fff;font-size:10px;border-radius:9px;padding:0 5px}
.proc{height:14px;background:rgba(0,0,0,.2);border-radius:7px;overflow:hidden}
.proc i{display:block;height:100%;width:0;background:var(--ok);animation:proc 1.2s linear forwards}
@keyframes proc{to{width:100%}}
.paywait{text-align:center;color:#5b5646}

/* Avisos emergentes: carril dentro de la barra roja (.tlane reserva el sitio; #toast se coloca encima con toastPlace).
   Sin carril visible (portada, cierre, reunión), #toast.fl flota arriba al centro. */
.tlane{flex-basis:100%;height:44px;border-radius:10px;background:rgba(0,0,0,.16)}
.gs-hud .tlane{grid-column:1/-1;order:9}
#toast{position:fixed;left:0;top:0;width:0;height:0;display:flex;gap:8px;align-items:stretch;overflow:hidden;pointer-events:none;z-index:30}
#toast:empty{display:none}
#toast .tst{flex:0 1 auto;min-width:0;max-width:100%;display:flex;align-items:center;gap:8px;background:#fff8ef;color:#3a1012;border-left:6px solid #ffb400;border-radius:9px;padding:2px 12px;font:600 16px/1.2 var(--display);pointer-events:auto;cursor:pointer;animation:tstIn .2s ease-out;transition:opacity .25s}
#toast .tst>span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#toast .tst.good{border-left-color:#1f9a55}#toast .tst.bad{border-left-color:#d62f3a;background:#fff0f0}
#toast .tst.out{opacity:0}
#toast .tst .tn{flex:none;padding:0 7px;border-radius:9px;background:#3a1012;color:#fff;font-size:.8em}
#toast.fl{top:auto;bottom:118px;left:50%;transform:translateX(-50%);width:min(620px,94vw);height:auto;flex-direction:column}
@media (min-width:1100px){#toast.fl{left:12px;transform:none;bottom:12px;width:min(320px,calc((100vw - 780px)/2))}}
#toast.fl .tst{padding:8px 14px;border:2px solid #7a0d12;border-left-width:6px;box-shadow:0 6px 18px rgba(0,0,0,.3)}
@keyframes tstIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (max-width:820px){.tlane{height:42px}.hud .tlane{flex-basis:calc(100% + 56px);margin-right:-56px}#toast .tst{font-size:15px;padding:2px 10px}}
@media (prefers-reduced-motion:reduce){#toast .tst{animation:none;transition:none}}

/* Overlay */
#overlay{position:fixed;inset:0;background:rgba(10,24,20,.82);display:none;align-items:flex-start;justify-content:center;padding:16px;z-index:20;overflow:auto}
#overlay.show{display:flex}
.card{margin:auto;background:var(--paper);border-radius:8px;max-width:520px;width:100%;padding:22px;display:flex;flex-direction:column;gap:12px;box-shadow:0 10px 0 rgba(0,0,0,.35)}
.card h1,.card h2{font-family:var(--display);font-weight:400;margin:0;line-height:1.05}
.card h1{font-size:44px;color:var(--sign)}.card h2{font-size:26px}
.card ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.card .sum{display:grid;grid-template-columns:minmax(55%,1fr) auto;gap:2px 12px}
.card .sum b{text-align:right}
.card .sum .tot{border-top:2px dashed var(--ink);padding-top:6px;margin-top:4px;font-weight:500}
.shop{display:flex;flex-direction:column;gap:6px}
.gshelf.inv5{grid-template-columns:repeat(5,1fr)}.gshelf.inv5 .fc{min-height:44px}.gshelf.inv5 .fc .pk{font-size:22px}
.numpad{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.nk{font-family:var(--led);font-size:22px;background:linear-gradient(#4a5157,#353b40);color:#e9f1ec;border-radius:8px;padding:8px 0;box-shadow:0 3px 0 #0d0f10}
.nk:active{transform:translateY(2px);box-shadow:0 1px 0 #0d0f10}
.ordleg{font-size:10px;color:#5b5646;text-align:center}
.ordl{position:relative;display:grid;grid-template-columns:26px 1fr auto 60px;gap:8px;align-items:center;width:100%;min-height:44px;padding:4px 8px;background:#fff;border:2px solid #e3dccb;border-radius:9px;text-align:left;box-shadow:0 2px 0 #d8cfb9;transition:background .15s,border-color .15s}
.ordl .ock{width:24px;height:24px;border-radius:50%;border:2px solid #b9b09a;display:grid;place-items:center;font-size:14px;font-weight:900;color:#fff;background:#fff}
.ordl .onm{min-width:0;display:flex;flex-direction:column;gap:3px}.ordl .onm b{font-size:13px;line-height:1.15;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}.ordl .ol2{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.ordl .ol2 small{font-size:9px;color:#5b5646;white-space:nowrap}
.ordl .gauge{display:flex;gap:2px}.ordl .gauge i{width:9px;height:9px;border-radius:2px;background:#e9e3d4;border:1px solid #d5ccb6}.ordl .gauge i.f{background:#2a9d5c;border-color:#1f7a47}.ordl.low .gauge i.f{background:var(--sign,#e5383b);border-color:#a61e22}
.ordl .oq{font-family:var(--led);font-size:28px;line-height:1;min-width:22px;text-align:center}.ordl.low .oq{color:var(--sign,#e5383b)}
.ordl .opr{font-family:var(--led);font-size:13px;text-align:right;white-space:nowrap}
.ordl.on{background:#fff1f1;border-color:var(--sign,#e5383b);box-shadow:0 2px 0 #a61e22}.ordl.on .ock{background:var(--sign,#e5383b);border-color:#a61e22}
.ordl .ostamp{position:absolute;right:8px;top:-8px;transform:rotate(-6deg);border:2px solid var(--sign,#e5383b);color:var(--sign,#e5383b);font-weight:900;font-size:11px;letter-spacing:1px;padding:0 5px;border-radius:4px;background:rgba(255,255,255,.85);pointer-events:none}
.ordl.rv{cursor:default}.ordl.rv.r-ok{background:#e8f6ee;border-color:#2a9d5c}.ordl.rv.r-miss,.ordl.rv.r-waste{background:#fff1f1;border-color:var(--sign,#e5383b)}.ordl.rv.r-no{opacity:.55}
.ordl .ovd{font-weight:900;font-size:11px;text-align:right;white-space:nowrap}.r-ok .ovd{color:#1f7a47}.r-miss .ovd,.r-waste .ovd{color:var(--sign,#e5383b)}
.ordrows{display:flex;flex-direction:column;gap:5px}
@media (max-width:480px){.ordl{grid-template-columns:24px 1fr auto 50px;gap:6px;padding:4px 6px}.ordl .ock{width:22px;height:22px}.ordl .gauge{gap:1px}.ordl .gauge i{width:7px}.ordl .ol2{gap:4px}.ordl .opr{font-size:11px}.ordl .onm b{font-size:12px}.ordl .oq{font-size:24px}}
.ordt{display:flex;justify-content:space-between;font-weight:700;font-size:13px;padding-top:4px}.ordt b{font-family:var(--led);font-weight:400;font-size:16px}.ordt.bad{color:var(--sign)}
.kk{display:none;font-style:normal;font-family:var(--led);font-size:11px;background:rgba(0,0,0,.12);border-radius:4px;padding:0 4px;margin-right:4px}
.kbd{display:none;font-size:10px;color:var(--mute);text-align:center;padding:4px 0 0;line-height:1.5}.kbd b{font-family:var(--led);font-weight:400;background:#fff;border:1px solid #cfc8b6;border-radius:4px;padding:0 4px;color:var(--ink)}
@media (hover:hover) and (pointer:fine){.kbd{display:block}.kk{display:inline}}
.card.screen.ws-screen{max-width:1680px}
.scr-body>.ws{flex:1;min-height:0}
.th-atc{--thc:#2a9d5c}
.ws{display:flex;flex-direction:column;gap:10px;min-height:0}
.ws-head{display:grid;grid-template-columns:auto 1fr auto;gap:10px 16px;align-items:center;background:linear-gradient(135deg,var(--thc),color-mix(in srgb,var(--thc) 70%,#000));color:#fff;border-radius:14px;padding:10px 14px;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.ws-id{display:flex;gap:10px;align-items:center}
.ws-ic{font-size:32px;background:rgba(255,255,255,.2);border-radius:12px;width:52px;height:52px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.ws-id b{font-family:var(--display);font-size:22px;letter-spacing:1px;display:block;line-height:1.1}.ws-id small{opacity:.92;font-size:12px}
.ws-shift{display:flex;flex-direction:column;gap:4px;min-width:0}.ws-st{font-size:11px}.ws-st b{color:#fff}
.ws-clock{display:flex;align-items:center;gap:8px;font-size:12px}.ws-clock b{font-family:var(--led);font-size:18px;font-weight:400}
.ws-bar{flex:1;height:8px;background:rgba(0,0,0,.25);border-radius:99px;overflow:hidden;display:block;min-width:40px}.ws-bar i{display:block;height:100%;background:var(--tag);border-radius:99px}
.ws-kpis{display:flex;gap:6px;align-items:center}.ws-kpis span{background:rgba(0,0,0,.22);border-radius:10px;padding:4px 10px;display:flex;flex-direction:column;align-items:center}
.ws-kpis small{font-size:9px;letter-spacing:1px;opacity:.85}.ws-kpis b{font-family:var(--led);font-size:18px;font-weight:400;color:var(--tag);white-space:nowrap}
.ws-kpis .btn{width:auto;padding:8px 10px}
.ws-grid{flex:1;min-height:0;display:grid;grid-template-columns:1.05fr 1.35fr .95fr;gap:12px}
.ws-col{min-height:0;overflow:auto;scrollbar-width:thin;background:#fffaf0;border:2px solid #e3dccb;border-top:5px solid var(--thc);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.ws-col h4{font-family:var(--display);font-size:13px;letter-spacing:1px;margin:2px 0;color:var(--ink)}
.ws-col h5{font-size:10px;letter-spacing:1.5px;color:var(--mute);margin:6px 0 0;display:flex;flex-wrap:wrap;align-items:center;gap:4px}.ws-col h5 small{letter-spacing:0;font-weight:400}
.wcard{background:#fff;border:2px solid #e3dccb;border-radius:10px;padding:8px 10px;font-size:12px;line-height:1.4}
.wcard.mine{border-color:var(--ok);background:#effaf3;animation:fxok .4s}.wcard.mine b{display:block;font-size:14px}.wcard.mine small{color:#1d6e40}
.wcard.alertc{display:flex;gap:10px;align-items:center;border-left:6px solid var(--thc)}
.wcard.alertc>div{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}.wcard.alertc b{font-size:13px}.wcard.alertc small{color:#5b5646;font-size:11px}
.wcard.alertc .btn{width:auto;display:flex;flex-direction:column;align-items:center;white-space:nowrap;padding:8px 12px}.wcard.alertc .btn small{font-size:10px;color:inherit;opacity:.85}
.wcard .ws-bar{background:#eee}.wcard .ws-bar i{background:var(--thc)}
.wcard.warn{background:#fff8e1;border-color:#f1d27a}
.wcard.boss{background:#fff3c4;border-color:#f1d27a}.wcard.boss.bad{background:#ffe9e7;border-color:#f3b3ad}
.wempty{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;color:var(--mute);font-size:12px;padding:18px 10px}.wempty span{font-size:40px}
.wempty.small{padding:6px;flex-direction:row;justify-content:center}
.wbig{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--ok);color:#fff;border-radius:14px;padding:14px;box-shadow:0 4px 0 #1d6e40;width:100%}.wbig span{font-size:36px}.wbig b{font-size:18px}.wbig small{font-size:11px;opacity:.9}
.wrow{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-size:12px;padding:5px 0;border-bottom:1px dashed #e3dccb}.wrow small{color:var(--mute)}
.wbtns{margin-left:auto;display:flex;gap:4px}.wbtns .btn{width:auto}
.wtiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:6px}.wtiles.two{grid-template-columns:1fr 1fr}
.wtile{background:#fff;border:2px solid #e3dccb;border-radius:10px;padding:6px 8px;display:flex;flex-direction:column;min-width:0}
.wtile small{font-size:9px;letter-spacing:1px;color:var(--mute);text-transform:uppercase}.wtile b{font-family:var(--led);font-size:20px;font-weight:400;white-space:nowrap}

.job:hover:not([disabled]){transform:translateY(-3px);box-shadow:0 8px 0 var(--ink)}

.slots{display:flex;gap:3px}.slots i{width:14px;height:7px;border-radius:2px;background:#d9d2bf}.slots i.on{background:var(--ok)}
@media (prefers-reduced-motion:reduce){.live i{animation:none}.job{transition:none}}
.sel{-webkit-user-select:all;user-select:all;word-break:break-all}
.rerr{background:#fde2e1;color:#8a1c1f;border-radius:6px;padding:6px 10px;font-size:13px}
.rok{background:#dff3e6;color:#1d5c37;border-radius:6px;padding:6px 10px;font-size:13px}

.camhead{display:flex;justify-content:space-between;align-items:center;gap:8px;color:#9fd8b4;font-size:10px;padding:2px 2px 4px}

.alerts{display:flex;flex-direction:column;gap:6px}

.tabs{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;padding:2px 0}

.tab{flex:1 0 auto;display:flex;align-items:center;justify-content:center;gap:5px;background:#1b2823;color:#d8e8de;border:2px solid #000;border-bottom-width:4px;border-radius:8px;padding:6px 10px;font-family:var(--display);font-size:14px;cursor:pointer;position:relative}
.tab.on{background:var(--tag);color:var(--ink);transform:translateY(2px);border-bottom-width:2px}
.force{font:inherit;font-size:11px;padding:4px 6px;border-radius:6px;border:2px solid var(--ink);background:#fff;color:var(--ink);max-width:170px}

.dept{display:flex;flex-direction:column;gap:12px}
.dept[hidden],.stage[hidden]{display:none}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr));gap:12px;align-items:start}

.dcard b{font-family:var(--display);font-weight:400;font-size:15px}.dcard span{font-size:11px;color:#5c5a50}
@media (max-width:640px){.tab span{display:none}.tab{font-size:18px;padding:5px 8px}}
.alert{background:var(--tag);border-radius:6px;padding:6px 8px;display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-size:12px;color:var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.3)}

.alert .who .btn small{opacity:.6}

.alert .tb{flex-basis:100%;height:4px;background:rgba(0,0,0,.15);border-radius:2px;overflow:hidden}
.alert .tb i{display:block;height:100%;width:100%;background:var(--sign)}
.mood{font-size:20px;line-height:1}
.emp{background:#fff;border-radius:6px;padding:8px 10px;display:flex;flex-direction:column;gap:5px;font-size:12px}
.eh{display:flex;align-items:center;gap:8px}
.ef{font-size:28px;line-height:1}
.eh .t{flex:1;font-size:11px;color:#5b5646}.eh .t b{display:block;font-size:14px;color:var(--ink)}
.es{font-size:11px;color:#5b5646}
.ev{font-weight:500}
.ea{flex-wrap:wrap}.ea .btn{padding:6px 4px;font-size:11px;min-width:64px}
.qa{font-size:11px;color:#2a5a75}.qa i{display:block;color:var(--ink)}
@media (max-width:820px){
  .stage{grid-template-columns:1fr}
  .brand{font-size:17px}
  .card h1{font-size:36px}
  /* Cabecera sticky compacta: que no tape el total ni el cambio al cobrar */
  .sticky{gap:6px;padding:6px 0}
  .hud{gap:2px 12px;padding:6px 10px;border-bottom-width:3px}
  .brand{font-size:14px;flex-basis:100%;margin-right:0}
  .brand small{display:inline;margin-left:8px;font-size:10px}
  .stat{min-width:0}
  .stat span{font-size:8px;letter-spacing:1px}
  .stat b{font-size:20px}
  .mute{padding:2px 6px;margin-left:auto}
  .daybar{height:4px}
  .queue-wrap{padding:6px 8px;gap:4px}
  .queue{gap:6px}
  .cust,.slot{width:40px;flex-basis:40px}
  .slot{height:40px}
  .face{font-size:22px}
  .cust.front{width:52px;flex-basis:52px}
  .cust.front .face{font-size:30px}
  .bubble{padding:4px 10px;min-height:28px;font-size:12px}
  .chat{min-height:18px;font-size:12px}
  .chat .who{font-size:16px}
  /* Avisos compactos: texto en una línea y botones en una fila deslizable */
  .alerts{gap:4px}
  .alert{padding:4px 6px;gap:3px 6px}
  .alert .at{flex-basis:100%;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .alert .who{flex:1 1 100%;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .alert .who::-webkit-scrollbar{display:none}
  .alert .who .btn{padding:3px 6px}
  .alert .who .btn small{display:none}
}
@media (max-width:420px){
  .hud{gap:2px 8px;padding:6px 8px}
  .stat span{font-size:7px;letter-spacing:.3px}
  .stat b{font-size:18px}
  .mute{padding:1px 4px;font-size:11px}
}
@media (prefers-reduced-motion:reduce){.item.flash{animation:none}.proc i{animation-duration:.01s}}
/* sensación de juego en la caja: monedas al bote, pastilla que late, registradora que tiembla al fallar */
.jcoin{position:fixed;z-index:17;font-size:22px;line-height:1;pointer-events:none;will-change:transform,opacity;margin:-11px 0 0 -11px}
.stat.jpulse{animation:jPulse .32s cubic-bezier(.2,.8,.2,1)}
@keyframes jPulse{0%{transform:scale(1)}40%{transform:scale(1.14);filter:brightness(1.25)}100%{transform:scale(1)}}
.register.jshake{animation:jShake .2s cubic-bezier(.2,.8,.2,1)}
@keyframes jShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}50%{transform:translateX(4px)}75%{transform:translateX(-2px)}}
@media (prefers-reduced-motion:reduce){.stat.jpulse,.register.jshake{animation:none}.jcoin{display:none}}

/* ---------- Marco de juego: todo cabe en la ventana, sin desplazar la página ---------- */
html,body{height:100%;overflow:hidden}
#app{height:100vh;height:100dvh;max-width:1480px;padding:8px 12px;gap:8px;display:flex;flex-direction:column}
.play{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:10px}
.mainc{min-height:0;display:flex;flex-direction:column;gap:8px}
.stage{flex:1;min-height:0;align-items:stretch}
.counter{min-height:0;overflow:hidden}
.belt{flex:1;min-height:90px;overflow:hidden}
.side{min-height:0}
.register{flex:1;min-height:0;overflow:auto;scrollbar-width:thin}
.dept{flex:1;min-height:0;overflow:auto;scrollbar-width:thin}
body:not([data-tab="caja"]) .queue-wrap{display:none}
.sidebar{min-height:0;overflow:auto;scrollbar-width:thin;display:flex;flex-direction:column;gap:8px;background:rgba(0,0,0,.28);border-radius:8px;padding:8px}
.sidehead{display:flex;align-items:center;justify-content:space-between;color:#d8e8de;font-family:var(--display);font-size:13px;letter-spacing:1px}
.sideclose,.alertbtn{display:none}
.sidehead .aall:disabled{opacity:1;background:transparent;box-shadow:none;border:2px dashed #3d6b55;color:#a9cdb9;cursor:default}
.sidehead .aall{flex:0 0 auto;width:auto;height:auto;min-height:32px;padding:6px 12px;font-size:12px;line-height:1.2;white-space:nowrap;margin-left:auto;margin-right:6px;font-family:var(--body);letter-spacing:0}
.sidebar .tasks{padding:8px;gap:6px}
.camwin{position:static;width:auto;box-shadow:none;border:0;padding:0;z-index:auto}
.camwin.show{display:block}
.ordlist.tall{max-height:none}
@media (max-width:820px){
  #app{padding:4px 6px;gap:4px}
  .stage:has(.denoms) .counter,.register:has(.denoms) .receipt{display:none}
  @media (max-height:700px){.receipt{max-height:52px}.cashrow b{font-size:18px}.led b{font-size:28px}.register{gap:4px}.queue-wrap .chat{display:none}}
  .play{grid-template-columns:1fr}
  .stage{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr);gap:6px}
  .counter{padding:8px;gap:4px;min-height:0;border-bottom-width:3px}
  .counter .zone-title{display:none}
  .belt{min-height:0;max-height:34vh;padding:6px;gap:6px}
  .item{width:68px;padding:5px 3px 4px}.item .em{font-size:24px}.item .fm{display:none}
  .bagged{min-height:30px;padding:4px;font-size:18px}
  .register{padding:8px;gap:6px;border-bottom-width:3px}
  .led b{font-size:34px}.led small{font-size:14px}
  .receipt{max-height:80px;padding:6px 10px 12px}
  .dn{padding:7px 0}.denoms{gap:4px}.cashrow b{font-size:22px}
  .btn{padding:8px 6px}
  /* Avisos: panel que sube desde abajo, sin empujar nada */
  .sidebar{position:fixed;left:0;right:0;bottom:0;max-height:72vh;z-index:18;border-radius:14px 14px 0 0;background:#10201b;box-shadow:0 -10px 30px rgba(0,0,0,.6);transform:translateY(105%);transition:transform .2s}
  .sidebar.open{transform:none}
  .sideclose{display:block;flex:0 0 auto;width:auto;height:auto;min-width:36px;min-height:32px;padding:4px 10px;font-size:14px;line-height:1}
  .alertbtn{display:flex;align-items:center;gap:4px;position:fixed;right:10px;bottom:10px;z-index:17;background:var(--ink);color:#fff;border:2px solid var(--tag);border-radius:99px;padding:8px 14px;font-size:18px;box-shadow:0 4px 12px rgba(0,0,0,.5)}
  .alertbtn b{font-family:var(--led);font-size:22px;font-weight:400;color:var(--tag)}

}
@media (prefers-reduced-motion:reduce){.alertbtn.hot{animation:none}.sidebar{transition:none}}
.register{gap:8px}
/* Pantallas del cierre y la reunión: fijas, con pestañas y páginas */

}
@media (max-width:820px){.card.screen{inset:4px;padding:10px 12px;gap:8px}.scr-head h2{font-size:18px}.stab{font-size:10px;padding:4px 7px}.scr-foot .supd{flex-basis:100%}}
.receipt{flex:0 1 auto;min-height:44px}
.cashrow{padding:0 2px}.cashrow b{font-size:24px}
.denoms{grid-template-columns:repeat(6,1fr);gap:5px}
.dn{padding:8px 0;font-size:12px}
@media (max-height:760px) and (min-width:821px){.register{gap:5px;padding:10px}.cashrow b{font-size:20px}.led{padding:3px 10px}.led b{font-size:34px}.receipt{max-height:64px}.queue-wrap{padding:6px 10px;gap:4px}.cust.front .face{font-size:38px}.face{font-size:28px}.slot{height:54px}}
/* ===== Minijuegos: escenas por departamento ===== */
.mgc{position:relative;overflow:hidden}
.mgc.th-alm{background:linear-gradient(#f3eee2,#efe8d6)}
.mgc.th-back{background:linear-gradient(#f4efe6,#ece3d2)}
.mgc.th-rrpp{background:linear-gradient(#eef3f8,#e2ebf3)}
.mgc.th-rrhh{background:linear-gradient(#f5f1ea,#eae2d4)}
.mgc[class*=th-]:before{content:'';position:absolute;left:0;right:0;top:0;height:6px;background:var(--thc,#999)}
.th-alm{--thc:#f08a24}.th-back{--thc:#2f6db5}.th-rrpp{--thc:#d6336c}.th-rrhh{--thc:#7b4bb7}
.mgc .dept-badge{display:inline-flex;align-items:center;gap:6px;font-size:10px;letter-spacing:1.5px;font-weight:700;color:#fff;background:var(--thc);border-radius:99px;padding:2px 10px;align-self:flex-start}
.brief{background:rgba(255,255,255,.75);border-left:4px solid var(--thc,#999);border-radius:4px;padding:6px 10px;font-size:12px;line-height:1.45}
.supd.bad{color:var(--sign);font-weight:700}
.fx-ok{animation:fxok .45s ease-out}
.fx-bad{animation:fxbad .35s ease-in-out;outline:3px solid var(--sign)!important}
@keyframes fxok{0%{transform:scale(1)}40%{transform:scale(1.08);box-shadow:0 0 0 6px rgba(42,157,92,.4)}100%{transform:scale(1)}}
@keyframes fxbad{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}

/* Almacén: estantería industrial con cajas de cartón */
.wh{background:repeating-linear-gradient(90deg,#5d646b 0 18px,#666e75 18px 20px);border-radius:8px;padding:12px 10px 0;box-shadow:inset 0 -18px 0 #8a8d8f}
.rack{position:relative;padding:0 14px}
.rack .up{position:absolute;top:-6px;bottom:0;width:10px;background:repeating-linear-gradient(#1f5fa8 0 8px,#174a85 8px 10px);border-radius:2px}
.rack .up.l{left:0}.rack .up.r{right:0}
.lvl{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:6px 6px 0}
.beam{display:block;height:9px;background:linear-gradient(#ff9d3c,#d96f12);border-radius:2px;box-shadow:0 3px 0 rgba(0,0,0,.35);margin-bottom:12px}
.cbox{position:relative;min-height:74px;background:linear-gradient(160deg,#d7b07a,#c49358 70%,#b98549);border-radius:4px;box-shadow:inset 0 6px 0 rgba(255,255,255,.12),inset 0 -4px 0 rgba(0,0,0,.12),0 3px 0 rgba(0,0,0,.35);display:flex;align-items:flex-end;justify-content:center;padding:8px 6px 6px;color:var(--ink);transition:transform .1s}
.cbox:hover:not([disabled]){transform:translateY(-2px)}
.cbox .tape{position:absolute;left:50%;top:0;bottom:0;width:16px;margin-left:-8px;background:rgba(238,214,160,.75)}
.cbox .lbl{position:relative;background:#fff;border-radius:2px;padding:4px 6px;font-size:10px;line-height:1.15;text-align:left;width:100%;box-shadow:0 1px 0 rgba(0,0,0,.2)}
.cbox .lbl b{display:block;font-size:11px}.cbox .lbl small{color:#5b5646}
.cbox .bc{display:block;height:8px;margin-top:3px;background:repeating-linear-gradient(90deg,#222 0 1px,transparent 1px 3px,#222 3px 5px,transparent 5px 6px)}
.cbox.sm{min-height:58px}.cbox.sel{outline:3px solid var(--sign);transform:translateY(-3px)}
.cbox.gone{visibility:hidden}
.cbox.cold{background:linear-gradient(160deg,#cfe3f2,#9fc3df 70%,#86b0d1)}
.cbox .frost{display:block;letter-spacing:1px}

/* Góndola del súper y mural refrigerado */
.gondola{background:radial-gradient(circle,#c9ced2 1.2px,transparent 1.5px) 0 0/10px 10px,#dfe3e6;border-radius:8px;padding:8px;border:3px solid #b9c0c5;display:flex;flex-direction:column;gap:2px}
.gondola.fridge{background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0) 30%),linear-gradient(#cfe9fb,#a9d3f1);border-color:#7fa9c8;box-shadow:inset 0 0 18px rgba(255,255,255,.8)}
.fridge-top{text-align:center;font-size:10px;letter-spacing:1px;color:#1d4f75;font-weight:700}
.gshelf{display:grid;grid-template-columns:44px repeat(4,1fr);gap:6px;align-items:end}
.gshelf em{font-style:normal;font-size:8px;letter-spacing:1px;color:#5b6670;align-self:center}
.gshelf.back .fc{transform:scale(.88);filter:brightness(.93)}
.rail{height:16px;background:#fff;border-top:2px solid #9aa3a9;border-bottom:3px solid #6f787e;display:flex;align-items:center;padding-left:52px;margin-bottom:6px}
.ptag{display:flex;align-items:center;gap:6px;background:var(--tag);height:14px;padding:0 6px;font-size:10px;border-radius:2px}
.ptag small{font-size:8px;max-width:110px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.fc{position:relative;min-height:58px;background:linear-gradient(#fff,#f1f1f1);border-radius:8px 8px 4px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 2px 0 rgba(0,0,0,.25);padding:4px 2px}
.fc .pk{font-size:26px;line-height:1}
.fc .stk{font-style:normal;font-size:8px;font-weight:700;background:#ff8c42;color:#fff;border-radius:99px;padding:1px 5px}
.fc .stk.new{background:var(--ok)}.fc .stk.lot{background:#8a9aa5}
.fc.broken{background:linear-gradient(#fff,#efe4e4)}
.fc .crack{position:absolute;inset:6px;background:linear-gradient(115deg,transparent 45%,#7a1f1f 46%,transparent 48%),linear-gradient(60deg,transparent 52%,#7a1f1f 53%,transparent 55%);opacity:.7;pointer-events:none}
.fc.empty{background:rgba(255,255,255,.25);box-shadow:inset 0 0 0 2px dashed rgba(0,0,0,.15);border:2px dashed rgba(0,0,0,.18);color:#5b6670;font-size:20px}
button.fc.empty:hover{background:rgba(42,157,92,.15)}
.fc.gone{background:transparent;box-shadow:none;opacity:.6}
.fc.isnew{box-shadow:0 0 0 2px var(--ok),0 2px 0 rgba(0,0,0,.25)}

/* PDA de mano */
.pdadev{background:linear-gradient(#2b2f33,#1b1e21);border-radius:16px;padding:8px 10px 10px;box-shadow:0 6px 0 #0d0f10,inset 0 1px 0 rgba(255,255,255,.12);max-width:420px;align-self:center;width:100%}
.pdahead{display:flex;justify-content:space-between;color:#b7c2c9;font-size:10px;letter-spacing:1px;padding:0 4px 6px}
.pdascr{position:relative;background:linear-gradient(#bfe8c9,#a5d8b3);border-radius:6px;padding:6px;font-family:var(--led);color:#13361f;display:flex;flex-direction:column;gap:3px;overflow:hidden;box-shadow:inset 0 2px 6px rgba(0,0,0,.35)}
.pdat{font-size:16px;letter-spacing:1px;border-bottom:1px dashed #13361f;padding-bottom:2px}
.pdarow{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;text-align:left;font-family:var(--led);font-size:17px;color:#13361f;padding:2px 4px;border-radius:3px}
.pdarow small{font-size:13px;opacity:.75}
button.pdarow:hover{background:rgba(19,54,31,.15)}
.pdarow.ro{grid-template-columns:1fr auto}
.laser{position:absolute;left:0;right:0;height:2px;background:rgba(229,56,59,.8);box-shadow:0 0 6px #e5383b;animation:laser 1.6s ease-in-out infinite alternate;pointer-events:none}
@keyframes laser{from{top:26px}to{top:calc(100% - 4px)}}
.pdakeys{display:flex;justify-content:center;gap:10px;padding-top:8px}.pdakeys i{width:26px;height:8px;border-radius:4px;background:#3c4247}

/* Portapapeles con el albarán */
.clip{position:relative;background:linear-gradient(135deg,#a77b4f,#8e6438);border-radius:10px;padding:16px 10px 10px;box-shadow:0 5px 0 rgba(0,0,0,.35)}
.clamp{position:absolute;left:50%;top:-6px;width:90px;margin-left:-45px;height:22px;border-radius:6px;background:linear-gradient(#e2e6e9,#9aa3a9);box-shadow:0 2px 0 rgba(0,0,0,.35)}
.paper{background:repeating-linear-gradient(#fffef9 0 23px,#e6eef6 23px 24px);border-radius:2px;padding:10px;display:flex;flex-direction:column;gap:6px;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.phd{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--ink);padding-bottom:4px;font-size:12px}.phd small{font-size:10px;color:#5b5646}
.pl{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center;padding:4px 0;border-bottom:1px dashed #c9c1ad}
.plt b{display:block;font-size:12px}.plt small{font-size:10px;color:#5b5646}
.pgot{display:flex;align-items:center;gap:3px;flex-wrap:wrap;justify-content:flex-end}.pgot small{font-size:9px;color:#5b5646;width:100%;text-align:right}
.pgot .mini{width:16px;height:13px;background:linear-gradient(#d7b07a,#b98549);border-radius:2px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.pgot .mini.rota{background:linear-gradient(135deg,#b98549 45%,#7a1f1f 46%,#7a1f1f 52%,#b98549 53%)}
.stamps{grid-column:1/-1;display:flex;gap:6px}
.stamp{flex:1;border:2px dashed currentColor;border-radius:6px;padding:4px 0;font-family:var(--display);font-size:11px;letter-spacing:1px;opacity:.45;transform:rotate(-2deg);background:transparent}
.stamp.s-ok{color:#1d7a46}.stamp.s-falta{color:#b46b00}.stamp.s-roto{color:#b3261e}
.stamp.on{opacity:1;border-style:solid;background:rgba(255,255,255,.6);transform:rotate(-5deg) scale(1.04)}
.sign{text-align:center;font-family:cursive;font-size:13px;color:#5b5646;padding-top:4px}

/* Muelle de carga */
.dockfl{position:relative;background:linear-gradient(#4a4f53,#3b4044 30%,#8d9195 30%,#9a9ea2);border-radius:8px;padding:8px 8px 18px}
.truck{color:#fff;font-size:10px;letter-spacing:2px;text-align:center;padding:4px 0 8px}
.pallet{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px;background:repeating-linear-gradient(90deg,#c69c6d 0 14px,#a97f50 14px 16px);padding:8px;border-radius:4px}
.hazard{position:absolute;left:0;right:0;bottom:0;height:10px;border-radius:0 0 8px 8px;background:repeating-linear-gradient(45deg,#f2c230 0 10px,#1b1f1d 10px 20px)}
.doors{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.door{display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:8px 8px 2px 2px;padding:10px 4px 8px;color:#fff;font-size:10px;line-height:1.1;text-align:center;box-shadow:inset 0 -6px 0 rgba(0,0,0,.25),0 3px 0 rgba(0,0,0,.35);background-image:repeating-linear-gradient(rgba(255,255,255,.08) 0 3px,transparent 3px 9px)}
.door span{font-size:22px}
.door.z-frio{background-color:#3d7fb8;box-shadow:inset 0 -6px 0 rgba(0,0,0,.25),0 3px 0 rgba(0,0,0,.35),inset 0 0 14px rgba(255,255,255,.55)}
.door.z-fruta{background-color:#3f8f45}.door.z-drog{background-color:#7b4bb7}.door.z-seco{background-color:#8e6438}
.door[disabled]{opacity:.55}

/* Suelo del pasillo con el derrame */
.floor{position:relative;height:190px;border-radius:8px;overflow:hidden;background:repeating-conic-gradient(#e9ecef 0 25%,#d6dbdf 0 50%) 0 0/36px 36px;box-shadow:inset 0 0 0 3px #c4cbd1}
.wetsign{position:absolute;left:10px;top:12px;width:62px;height:76px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:8px;z-index:2}
.wetsign:before{content:'';position:absolute;inset:0;background:var(--tag);clip-path:polygon(50% 0,100% 100%,0 100%);opacity:.35;transition:.2s}
.wetsign.on:before{opacity:1}
.wetsign span{position:relative;font-size:18px}.wetsign small{position:relative;font-size:7px;font-weight:700;line-height:1;text-align:center}
.wetsign:not(.on){animation:nudge 1.4s ease-in-out infinite}
@keyframes nudge{50%{transform:translateY(-3px)}}
.puddle{position:absolute;width:74px;height:40px;border-radius:50%;background:radial-gradient(ellipse at 40% 40%,rgba(255,255,255,.7),rgba(106,170,230,.75) 40%,rgba(64,124,190,.65));box-shadow:0 0 0 2px rgba(64,124,190,.25)}
.puddle.w1{transform:scale(.6);opacity:.75}
.puddle.dry{background:none;box-shadow:none;display:flex;align-items:center;justify-content:center;font-size:16px}
.p0{left:90px;top:20px}.p1{left:180px;top:60px}.p2{left:100px;top:110px}.p3{left:200px;top:130px}.p4{left:260px;top:20px}
.shard{position:absolute;width:20px;height:20px;background:linear-gradient(135deg,#fff,#a8d8ff);clip-path:polygon(50% 0,100% 70%,30% 100%,0 40%);box-shadow:0 0 6px #fff;z-index:2;animation:glint 1.2s ease-in-out infinite}
.shard.s0{left:140px;top:70px}.shard.s1{left:230px;top:100px}.shard.s2{left:160px;top:150px}
@keyframes glint{50%{filter:brightness(1.5)}}
.mop{position:absolute;right:10px;bottom:6px;font-size:30px}
.miniShelf{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:#dfe3e6;border-radius:8px;padding:8px;border-bottom:6px solid #9aa3a9}

/* Mostrador de atención (reclamación de agotado) */
.desk1{display:flex;flex-direction:column;gap:8px}
.ccust{display:flex;align-items:flex-start;gap:8px}.ccust>span{font-size:34px;line-height:1}.ccust .bubble{flex:1;font-size:13px}

@media (max-width:420px){.floor{height:170px}.p3{left:170px}.p4{left:230px}.shard.s1{left:200px}.doors{grid-template-columns:repeat(2,1fr)}}
@media (prefers-reduced-motion:reduce){.laser,.wetsign,.shard{animation:none}}
/* Backoffice: mesa de oficina, ticket térmico, cajón de caja, datáfono y vale */
.office{background:linear-gradient(90deg,rgba(0,0,0,.05) 1px,transparent 1px) 0 0/34px 100%,linear-gradient(#a7774b,#8f6239);border-radius:10px;padding:12px;box-shadow:inset 0 0 0 3px #6f4a29,0 4px 0 rgba(0,0,0,.3);display:flex;flex-direction:column;gap:10px}
.desk-row{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.desk-side{flex:1 1 140px;display:flex;flex-direction:column;gap:8px}
.thermal{flex:1 1 220px;max-width:300px;background:#fbfbf7;font-family:var(--body);font-size:11px;color:#2d2d2d;padding:10px 10px 18px;display:flex;flex-direction:column;gap:1px;box-shadow:0 3px 8px rgba(0,0,0,.35);transform:rotate(-1.2deg);
  -webkit-mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/10px 100%;mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/10px 100%}
.th-logo{font-family:var(--display);text-align:center;font-size:14px;letter-spacing:1px}
.th-sub{text-align:center;font-size:9px;color:#6b6b6b;border-bottom:1px dashed #999;padding-bottom:4px;margin-bottom:4px}
.thermal .tl{display:flex;justify-content:space-between;gap:6px;padding:2px 4px;border-radius:40%;text-align:left;font-size:11px;color:#2d2d2d}
.thermal .tl.circled{box-shadow:0 0 0 2px #c62828;background:rgba(198,40,40,.06)}
.thermal .tt{display:flex;justify-content:space-between;border-top:1px dashed #999;margin-top:4px;padding-top:4px;font-weight:700}
.thermal .tp{font-size:9px;color:#555}
.th-bc{display:block;height:22px;margin:6px 8px 2px;background:repeating-linear-gradient(90deg,#222 0 2px,transparent 2px 3px,#222 3px 4px,transparent 4px 7px)}
.th-thanks{text-align:center;font-size:9px;color:#777}
.shelflabel{background:var(--tag);border-radius:4px;padding:6px 8px;box-shadow:0 3px 0 rgba(0,0,0,.3);display:flex;flex-direction:column;transform:rotate(1.5deg)}
.shelflabel small{font-size:8px;letter-spacing:1px}.shelflabel b{font-family:var(--led);font-size:30px;line-height:1}.shelflabel span{font-size:10px}
.note{background:#fff59d;padding:8px;font-size:11px;box-shadow:0 3px 0 rgba(0,0,0,.25);transform:rotate(-2deg);font-family:cursive}
.drawer{background:linear-gradient(#3a3f44,#2a2e32);border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:6px;box-shadow:inset 0 3px 8px rgba(0,0,0,.6)}
.dr-bills{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.dr-coins{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.slot{position:relative;background:#1f2326;border-radius:5px;min-height:46px;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 2px 4px rgba(0,0,0,.6);padding:4px}
.slot:active .money{transform:translateY(-4px)}
.money{font-style:normal;font-weight:700;display:flex;align-items:center;justify-content:center;color:#1b1f1d;transition:transform .08s}
.money.bill{width:100%;height:32px;border-radius:3px;font-size:11px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.35),0 1px 0 rgba(0,0,0,.4)}
.money.under{position:absolute;inset:auto 6px 4px;height:28px;opacity:.55;z-index:-0;pointer-events:none}
.slot .money:not(.under){position:relative;z-index:1}
.money.b50{background:linear-gradient(90deg,#f6a65a,#ef8b33)}.money.b20{background:linear-gradient(90deg,#86aee9,#5b8fd9)}.money.b10{background:linear-gradient(90deg,#ec8f89,#e0645f)}.money.b5{background:linear-gradient(90deg,#a9d0a5,#7cb87a)}
.money.coin{width:34px;height:34px;border-radius:50%;font-size:9px;box-shadow:inset 0 -2px 0 rgba(0,0,0,.25),0 1px 0 rgba(0,0,0,.5)}
.money.coin.bi{background:radial-gradient(circle,#dfe3e6 0 52%,#d8b24a 54%);}
.money.coin.au{background:radial-gradient(circle at 35% 35%,#f5dc7a,#c99a2e)}
.money.coin.cu{background:radial-gradient(circle at 35% 35%,#e9a374,#b4602f);color:#fff}
.money.tiny{display:inline-flex;width:auto;height:auto;min-width:22px;padding:1px 4px;font-size:8px;border-radius:3px}
.money.coin.tiny{width:18px;height:18px;border-radius:50%;padding:0}

.phone{position:relative;align-self:center;width:min(330px,100%);background:#111;border-radius:34px;padding:12px 10px 18px;box-shadow:0 10px 24px rgba(0,0,0,.4),inset 0 0 0 2px #333}

.ph-feed{background:#fff;padding:8px 10px;display:flex;flex-direction:column;gap:8px;min-height:150px}

.plan-aisles{display:grid;grid-template-columns:repeat(9,1fr);gap:5px}
.pa{position:relative;height:120px;display:flex;justify-content:center;background:transparent}
.pa .sh{position:absolute;top:30px;bottom:18px;width:38%;background:repeating-linear-gradient(#7d6a4f 0 6px,#a8916d 6px 8px);border-radius:3px;box-shadow:0 2px 0 rgba(0,0,0,.25)}
.pa .sh.l{left:4%}.pa .sh.r{right:4%}
.pa .sign{position:absolute;top:0;left:50%;transform:translateX(-50%);width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 2px 0 rgba(0,0,0,.3),0 0 0 2px var(--thc);display:flex;align-items:center;justify-content:center;font-size:15px;z-index:1}
.pa b{position:absolute;bottom:0;font-size:11px;background:var(--ink);color:#fff;border-radius:4px;padding:0 5px}
.pa:hover .sh{filter:brightness(1.15)}.pa:hover .sign{transform:translateX(-50%) scale(1.12)}
.pa.no{opacity:.4}.pa.no:after{content:'✖';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:var(--sign);font-size:24px;font-weight:700}
.plan-front{display:flex;align-items:center;gap:6px;font-size:11px;border-top:3px dashed #9aa3a9;padding-top:8px}
.chk{background:#4b5550;color:#fff;border-radius:4px;padding:3px 6px}.you{flex:1;text-align:center;font-weight:700}.pdoor{font-size:20px}
.mgc>.btn.mini{flex:0 0 auto;align-self:center;padding:5px 12px;white-space:nowrap;width:auto;min-width:max-content}
.qas .qa{padding:5px 8px}

  .paper{gap:2px;padding:6px 8px}.pl{padding:2px 0}.ordl{min-height:44px;padding:3px 8px}.ordl .oq{font-size:24px}.ordrows{gap:3px}.stamp{padding:2px 0;font-size:10px}.phd{font-size:11px}
  .clip{padding:12px 8px 8px}.pallet{gap:4px;padding:5px}.cbox.sm{min-height:46px;padding:5px 4px 4px}.door{padding:6px 4px 5px}.door span{font-size:18px}
  .wh{padding:8px 8px 0}.cbox{min-height:60px}.gondola{padding:5px}.fc{min-height:48px}.fc .pk{font-size:22px}
  .floor{height:150px}.thermal{font-size:10px;padding:8px 8px 14px}.slot{min-height:38px}.money.coin{width:28px;height:28px}
  .plan .pa{height:86px}.qas .qa{font-size:11px}
}
@media (max-height:760px){.phone{padding:8px 8px 10px;border-radius:24px}.ph-status{display:none}.ph-notch{display:none}.ph-feed{min-height:0;gap:5px}.ph-home{display:none}.sp-act{display:none}.chip{padding:5px 8px;font-size:11px}}
.gshelf.three{grid-template-columns:repeat(3,1fr)}
.gshelf.three .fc{min-height:70px}.gshelf.three .fc .pk{font-size:32px}

/* RR.HH.: despacho con currículum, entrevista, contrato y sala de descanso */

.cq{align-self:flex-end;max-width:80%;background:var(--thc);color:#fff;border-radius:12px 12px 2px 12px;padding:5px 9px;font-size:11px}

.ca>span{font-size:22px}.ca>div{background:#fff;border-radius:12px 12px 12px 2px;padding:5px 9px;font-size:12px;font-style:italic;box-shadow:0 1px 0 rgba(0,0,0,.1)}

.flag.on{opacity:1;filter:none;animation:fxok .3s}
.qcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.qcard{background:#fff;border:1px solid #d9d0e6;border-left:4px solid var(--thc);border-radius:6px;padding:7px 8px;text-align:left;font-size:12px;box-shadow:0 2px 0 rgba(0,0,0,.12)}
.qcard:hover{background:#f6f0fc}
.contract{background:repeating-linear-gradient(#fffef9 0 21px,#eef1f6 21px 22px);border:1px solid #d8d2c4;border-radius:2px;box-shadow:0 3px 8px rgba(0,0,0,.25);padding:10px;display:flex;flex-direction:column;gap:8px}
.contract>b{font-family:var(--display);font-weight:400;font-size:15px;text-align:center}.contract>small{text-align:center;font-size:10px;color:#5b5646}

.breakroom{border-radius:10px;overflow:hidden;box-shadow:inset 0 0 0 3px #b9a98a}
.br-wall{display:flex;justify-content:space-between;padding:6px 12px;font-size:20px;background:repeating-linear-gradient(90deg,#efe3c8 0 30px,#e6d8b9 30px 31px)}
.br-scene{display:flex;align-items:flex-end;justify-content:space-between;gap:6px;padding:8px;background:linear-gradient(#e6d8b9,#e6d8b9 60%,#9b8462 60%)}

.fface{font-size:40px;line-height:1}
.fperson b{font-size:12px}.fperson small{font-size:9px;color:#fff;background:rgba(0,0,0,.35);border-radius:99px;padding:0 6px}
.fbub{order:-1;position:relative;background:#fff;border-radius:10px;padding:5px 7px;font-size:11px;line-height:1.3;margin-bottom:6px;box-shadow:0 2px 0 rgba(0,0,0,.2)}

@media (max-height:760px){.cq,.ca>div{padding:3px 7px;font-size:10px}.ca>span{font-size:18px}.chatlog{gap:2px}.postit{padding:4px;font-size:9px}.cvsec{padding:1px 6px}.cvband{padding:2px 8px}.fface{font-size:30px}.br-wall{display:none}.folder{padding:12px 6px 4px;font-size:10px}.cvtop{padding:4px 6px}.cvphoto{flex-basis:38px;height:44px;font-size:24px}}
#vtag{position:fixed;left:4px;bottom:2px;z-index:9999;font:10px monospace;color:#fff;background:rgba(0,0,0,.45);padding:1px 5px;border-radius:4px;pointer-events:none}

/* ================= TEMA «VITCHMARKET» (pixel art rosa y morado) =================
   Capa de estilo por encima de todo lo anterior: paleta, fuentes, HUD con pastillas, pestañas,
   paneles con barra de título y botones. Las reglas de maquetación de arriba siguen valiendo. */
:root{
  --pk:#e5383b;--pk2:#a8161c;--pu:#c62828;--pu2:#7f0f14;--navy:#3a1012;--navy2:#b3141c;--cream:#fffdfc;--line:#7a1418;
  --display:'Fredoka',system-ui,sans-serif;--body:'Nunito',system-ui,sans-serif;--pix:'Pixelify Sans','VT323',monospace;
}
body{background:linear-gradient(180deg,#ffffff 0%,#fff1f1 45%,#ffdede 100%);background-attachment:fixed;font-weight:600;color:#2b1d1d}
body::before{content:'';position:fixed;inset:0;pointer-events:none;opacity:.35;background-image:radial-gradient(#fff 1.2px,transparent 1.4px);background-size:22px 22px;z-index:0}
#app{position:relative;z-index:1}
/* HUD */
.hud{background:linear-gradient(180deg,#e5383b,var(--navy2));border:3px solid #6b0b0f;border-bottom-width:6px;border-radius:16px;padding:8px 12px;gap:8px 10px;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:28px;letter-spacing:1px;color:#ff4d4f;text-shadow:3px 3px 0 #6b0b0f,-1px -1px 0 #6b0b0f,1px -1px 0 #6b0b0f,-1px 1px 0 #6b0b0f}
.brand small{font-family:var(--body);font-weight:700;font-size:11px;letter-spacing:.5px;color:#ffe0e0;text-shadow:none;opacity:1}
.logo-cart{font-style:normal;font-size:30px;background:#fff;border-radius:12px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 -4px 0 #ffd0d0,0 3px 0 #6b0b0f;text-shadow:none}
.stat{flex-direction:row;align-items:center;gap:6px;background:#8f1015;border:2px solid #c9252b;border-radius:12px;padding:3px 10px 3px 4px;min-width:0}
.stat i{font-style:normal;font-size:20px;width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff8,transparent 60%),#c9252b;display:flex;align-items:center;justify-content:center}
.stat.s-money i{background:radial-gradient(circle at 35% 30%,#fff8,transparent 60%),#f5b301}
.stat.s-rep i{background:radial-gradient(circle at 35% 30%,#fff8,transparent 60%),#ffcf3f}
.stat span{display:none}
.stat b{font-family:var(--pix);font-weight:700;font-size:20px;color:#ffe066;line-height:1}
.mute{background:#c9252b;color:#fff;border-radius:10px;padding:6px 9px;box-shadow:0 3px 0 #6b0b0f}
.daybar{height:8px;background:#6b0b0f;border-radius:99px}.daybar i{background:linear-gradient(90deg,#ff4d4f,#ffd23f);border-radius:99px}
/* Pestañas */
.tab{background:linear-gradient(180deg,#e04345,var(--pu2));color:#fff;border:3px solid #5c0a0d;border-bottom-width:5px;border-radius:14px;font-family:var(--display);font-weight:600;font-size:16px;padding:6px 12px;text-shadow:0 2px 0 rgba(0,0,0,.3)}
.tab.on{background:linear-gradient(180deg,#ff5a5c,var(--pk2));color:#fff;border-color:#6b0b0f;transform:translateY(2px);border-bottom-width:3px}
.tab i{background:#ffd23f;color:#3a1d00}
/* Paneles con barra de título */
.queue-wrap,.counter,.register,.sidebar,.dept,.isostore{background:var(--cream);border:3px solid var(--line);border-radius:16px;box-shadow:0 5px 0 var(--line);color:#2b1d1d}
.queue-wrap{padding:8px 10px}
.counter{border-bottom-width:3px}
.register{border-bottom-width:3px}
.sidebar{padding:0 8px 8px}
.sidehead{margin:0 -8px 4px;padding:7px 10px;background:linear-gradient(180deg,#ff4d4f,var(--pk2));color:#fff;border-radius:12px 12px 0 0;font-family:var(--display);font-weight:600;font-size:16px;letter-spacing:.5px;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.sidehead .aall:disabled{border-color:#ffd6d6;color:#fff}
.zone-title{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.5px;color:#fff;background:linear-gradient(180deg,#ff4d4f,var(--pk2));border-radius:10px;padding:4px 10px;align-self:flex-start;text-shadow:0 1px 0 rgba(0,0,0,.25);box-shadow:0 2px 0 #6b0b0f}
.tasks{background:#f6f1f0;border:2px solid #e3cccc;border-bottom-width:2px}
.task{background:#fff;border:2px solid #ecdcdc}
.crew{color:#4a3a3a}
.bubble{background:#fff;border:2px solid #ecdcdc}
.bubble.muted{background:transparent;border:0;color:#a37878}
.chat{color:#6b3d3d}.chat.angry{color:var(--pk2)}
.slot{border-color:#e3cccc}
.pbar{background:#ecdcdc}
.belt{background:#3b2f2f;background-image:repeating-linear-gradient(90deg,transparent 0 22px,rgba(255,255,255,.07) 22px 24px);border:3px solid #5c0a0d}
.item{background:#fff;border:2px solid #ecdcdc;border-radius:12px}
.bagged{background:#f6f1f0}
.led{border-color:#5c0a0d;border-radius:10px}
.receipt{border-radius:8px}
/* Botones */
.btn{font-family:var(--display);font-weight:600;border-radius:12px;background:#fff;border:2px solid #e3cccc;box-shadow:0 3px 0 #c9a5a5;color:#3a2323}
.btn.go{background:linear-gradient(180deg,#3fcf7e,#1f9a55);border-color:#136b3a;box-shadow:0 4px 0 #136b3a;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.25)}
.btn.no{background:linear-gradient(180deg,#ff6b6b,#d62f3a);border-color:#8e1a22;box-shadow:0 4px 0 #8e1a22;color:#fff}
.btn.on{background:#ffd23f;border-color:#b08a00}
.dn{border-radius:10px;font-family:var(--display);font-weight:600}
.alert{background:#fff4c2;border:2px solid #f0c94a;border-radius:12px;box-shadow:0 3px 0 #d6a91f}
.force{border-radius:10px;border-color:#c9a5a5}
/* Ventanas y pantallas */
#overlay{background:rgba(42,30,72,.7)}
#mg{background:rgba(42,30,72,.6)}
.card{background:var(--cream);border:3px solid var(--line);border-radius:18px;box-shadow:0 8px 0 var(--line)}
.card h1,.card h2,.card h3{font-family:var(--display);font-weight:700;color:#4a1414}
.card h1{color:var(--pk)}
.logo{font-family:var(--display);font-weight:700;color:#ff4d4f;text-shadow:3px 3px 0 #3a1012}
.stab{font-family:var(--display);font-weight:600;border-radius:12px}
.stab.on{background:linear-gradient(180deg,#ff5a5c,var(--pk2));color:#fff;border-color:#6b0b0f}
.dpanel{background:var(--cream);border:3px solid var(--line);border-radius:16px;box-shadow:0 5px 0 var(--line)}
.dpanel h2{font-family:var(--display);font-weight:700;color:#4a1414}
.up,.emp{border:2px solid #ecdcdc;border-radius:12px}
.supd{color:#7a5a5a}
#vtag{background:rgba(42,30,72,.7)}
/* La tienda en directo (isométrica, pixel art) */
.isostore{display:none;min-height:0;flex-direction:column;overflow:hidden;padding:0}
.isostore .ptitle{display:flex;justify-content:space-between;align-items:center;padding:7px 12px;background:linear-gradient(180deg,#ff4d4f,var(--pk2));color:#fff;font-family:var(--display);font-weight:600;font-size:16px;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.isostore .ptitle small{font-family:var(--body);font-size:11px;opacity:.9}
#isoslot{flex:1;min-height:0;position:relative;background:linear-gradient(180deg,#ffffff,#fde3e3)}
#isoslot canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;cursor:pointer}
@media (min-width:1280px){
  #app{max-width:1880px}
  .play{grid-template-columns:minmax(450px,1fr) minmax(0,1.2fr) 310px}
  .isostore{display:flex}
  .camb{display:none}
  .sidebar .camwin{display:none!important}
}

.isobottom{flex:0 0 auto;display:grid;grid-template-columns:1fr 1.4fr 1.3fr;gap:8px;padding:8px;background:#f7eeee;border-top:3px solid var(--line)}
.ib{background:#fff;border:2px solid #ecd2d2;border-radius:12px;padding:6px 8px;display:flex;flex-direction:column;gap:3px;min-width:0;box-shadow:0 3px 0 #ecd2d2}
.ibt{font-family:var(--display);font-weight:600;font-size:13px;color:#fff;background:linear-gradient(180deg,#e5383b,var(--pu2));margin:-6px -8px 4px;padding:3px 8px;border-radius:10px 10px 0 0}
.ibrow{display:flex;align-items:center;gap:6px}.bigstar{font-size:28px}.pct{font-family:var(--pix);font-size:28px;color:#4a1414}
.stars5{color:#f5b301;font-size:16px;letter-spacing:1px}.stars5 i{font-style:normal;color:#e6dce9}
.ib small{font-size:11px;color:#7a5a5a}
.petrow{display:flex;align-items:center;gap:8px}.dog{font-size:40px;line-height:1;background:#ffecec;border-radius:50%;width:56px;height:56px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;animation:idle 2.4s ease-in-out infinite}
.say{position:relative;background:#fffdfc;border:2px solid #f0caca;border-radius:12px;padding:6px 8px;font-size:12px;line-height:1.3;max-height:62px;overflow:hidden}
.say.good{border-color:#9be0b5;background:#effaf3}.say.bad{border-color:#f3b3ad;background:#fff3f2}
.gl{display:grid;grid-template-columns:18px 1fr auto;gap:4px;align-items:center;font-size:11px}.gl i{font-style:normal}.gl small{font-family:var(--pix);font-size:12px;color:#7a5a5a}.gl.ok span{color:#1f9a55}
.gbar{height:8px;background:#ecdcdc;border-radius:99px;overflow:hidden;margin-top:2px}.gbar i{display:block;height:100%;background:linear-gradient(90deg,#3fcf7e,#1f9a55)}
.gcount{font-family:var(--pix);font-size:14px;align-self:flex-end;margin-top:-14px}
@media (min-width:1280px){.led{flex-wrap:wrap;gap:0 8px}.led b{font-size:clamp(24px,2.1vw,40px);white-space:nowrap}}
@media (max-height:820px){.isobottom{grid-template-columns:1fr 1.4fr 1.3fr;padding:6px}.dog{width:44px;height:44px;font-size:30px}.ib small{display:none}}

@media (max-width:820px){
  .hud{padding:5px 8px;gap:4px 6px;border-radius:12px;border-bottom-width:4px}
  .brand{font-size:18px;gap:6px;flex:1 1 auto}.brand small{display:none}.logo-cart{width:30px;height:30px;font-size:20px;border-radius:8px}
  .stat{padding:2px 7px 2px 2px;gap:4px;border-radius:10px}.stat i{width:22px;height:22px;font-size:13px}.stat b{font-size:14px}
  .mute{padding:3px 6px;font-size:12px}
  .tab{border-width:2px;border-bottom-width:4px;border-radius:11px}
}
@media (max-width:420px){.stat.s-tk,.stat.s-out{display:none}}

.gs-iso{position:relative;flex:1.6 1 0;min-height:150px;background:linear-gradient(180deg,#ffffff,#fde3e3);border-bottom:4px solid rgba(0,0,0,.12)}
.gs-iso canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
.gs-zone{position:absolute;left:8px;top:6px;z-index:2;background:rgba(42,30,72,.8);color:#fff;font-size:11px;border-radius:99px;padding:2px 10px;font-weight:700}
.gs-scene .gs-objs{flex:1 1 0}
@media (max-width:560px){.gs-iso{flex:0 0 130px;min-height:130px}}
/* Puesto del empleado: con la tienda cerrada, cartel arriba (no tapa la sala) y sin el plano en directo */
.gs-scene>*{order:2}.gs-scene>.gs-wall{order:0}
/* En el móvil las pantallas fijas (puesto, cierre, reunión, portada) van a sangre: sin marco ni márgenes que coman sitio */
@media (max-width:820px){
  .card.screen{inset:0;border:0;border-radius:0;box-shadow:none;padding:0 6px 6px;max-width:none}
  .card.screen.ws-screen{padding:0 0 6px}
  .ws-screen .gs-hud,.ws-screen .gs-scene,.ws-screen .gs-feed{border-radius:0;border-left:0;border-right:0}
  .ws-screen .gs-status,.ws-screen .rerr,.ws-screen .rok,.ws-screen .gs-bar2{margin-left:6px;margin-right:6px}
}
@media (max-width:560px){.gs-status.relay{display:block!important;font-size:12px;background:#fff3c4;border-radius:10px;padding:6px 10px}}
.gs-closed{order:1;position:relative;left:auto;top:auto;transform:none;max-width:none;margin:10px 12px 0;flex-direction:row;align-items:center;justify-content:center;flex-wrap:wrap;gap:4px 10px;padding:8px 12px;z-index:2}
.gs-scene.shut .gs-iso{display:none}
.gs-objs.g4{grid-template-columns:repeat(2,1fr)}
.gs-feed .rpt-t{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:6px 10px}
@media (max-width:1000px){
  /* en vertical la pantalla se desplaza antes que aplastar la sala: los objetos no se pisan */
  .ws-screen .scr-body{overflow-y:auto}
  .ws-screen .gs,.ws-screen .gs-main{flex:none;min-height:auto}
  .ws-screen .gs-main{grid-template-rows:auto auto}
  .ws-screen .gs-scene{min-height:auto}
  .ws-screen .gs-objs{flex:none;grid-auto-rows:minmax(96px,auto)}
  .ws-screen .gs-feed{max-height:none;overflow:visible}
}

.card.screen{padding:0 18px 14px;border-radius:20px}
.card.screen>.scr-head{margin:0 -18px;padding:10px 18px;background:linear-gradient(180deg,#ff5a5c,var(--pk2));border-radius:17px 17px 0 0;border-bottom:3px solid var(--line)}
.card.screen>.scr-head h2{color:#fff;text-shadow:2px 2px 0 rgba(42,30,72,.45)}
.card.screen>.scr-head .logo{color:#fff;text-shadow:3px 3px 0 #3a1012}
.card.screen>.scr-head .stab{background:#fff;color:#7a1418;border:2px solid #6b0b0f;box-shadow:0 3px 0 #6b0b0f}
.card.screen>.scr-head .stab.on{background:#ffd23f;color:#3a1d00;border-color:#8a6500;box-shadow:0 3px 0 #8a6500}
.card.screen>.scr-head .stab i{background:#3a1012;color:#fff}
.howto li{background:#fff;border:2px solid #ecdcdc;border-radius:12px;box-shadow:0 3px 0 #ecdcdc}
.card .sum span.hd,.fin .sum .hd{color:#e5383b}

.hero{position:relative;flex:1 1 200px;min-height:150px;border-radius:16px;overflow:hidden;background:linear-gradient(180deg,#ffffff,#fde3e3);border:3px solid var(--line);box-shadow:0 4px 0 var(--line)}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
.htag{position:absolute;left:12px;top:10px;z-index:2;background:#3a1012;color:#ffe0e0;border-radius:99px;padding:4px 12px;font-family:var(--display);font-weight:600;font-size:14px}
@media (max-height:700px){.hero{flex-basis:110px;min-height:100px}}

/* Colores corporativos: rojo y blanco */
body{background:linear-gradient(180deg,#ffffff 0%,#fff3f3 55%,#ffe2e2 100%)}
body::before{background-image:radial-gradient(rgba(229,56,59,.18) 1.2px,transparent 1.4px);opacity:1}
.hud{background:linear-gradient(180deg,#ef4447,#c41d24);border-color:#7a0d12}
.brand{color:#fff;text-shadow:3px 3px 0 #7a0d12,-1px -1px 0 #7a0d12,1px -1px 0 #7a0d12,-1px 1px 0 #7a0d12}
.brand small{color:#ffe0e0}
.stat{background:#fff;border-color:#7a0d12}.stat b{color:#c41d24}
.stat i{background:radial-gradient(circle at 35% 30%,#fff8,transparent 60%),#e5383b}
.mute{background:#fff;color:#c41d24;box-shadow:0 3px 0 #7a0d12}
.daybar{background:#7a0d12}.daybar i{background:linear-gradient(90deg,#fff,#ffd23f)}
.tab{background:#fff;color:#c41d24;border-color:#7a0d12;text-shadow:none}
.tab.on{background:linear-gradient(180deg,#ef4447,#b3141c);color:#fff;border-color:#6b0b0f}
.logo{color:#e5383b;text-shadow:3px 3px 0 #6b0b0f}
.ibt{background:linear-gradient(180deg,#3a3a3a,#1f1f1f)}
.gs-feed{background:#2b2b2b}

/* Todos los cargos con los colores corporativos (el departamento se distingue por su icono y su sala) */
.th-alm,.th-back,.th-rrpp,.th-rrhh,.th-atc{--thc:#e5383b}
.gs-hud{background:linear-gradient(180deg,#ef4447,#c41d24);border:3px solid #7a0d12;box-shadow:0 5px 0 #7a0d12}
.gs-ic{background:#fff;box-shadow:inset 0 -3px 0 #ffd0d0}
.gs-stats span{background:#fff}.gs-stats small{color:#7a0d12;opacity:1}.gs-stats .gled{color:#c41d24;text-shadow:none}
.gs-clock .gled{color:#fff;text-shadow:0 2px 0 #7a0d12}.gs-bar i{background:#fff}
.gs-scene{border-color:#7a1418}
.gs-wall{background:repeating-linear-gradient(90deg,#fff 0 60px,#f4eeee 60px 62px);border-bottom-color:#e5383b}
.gs-wall span{background:#e5383b;color:#fff}
.sc-rrpp .gs-objs{background:repeating-conic-gradient(#f4efef 0 25%,#ffffff 0 50%) 0 0/40px 40px}
.sc-atc .gs-objs{background:repeating-conic-gradient(#efe9e9 0 25%,#ffffff 0 50%) 0 0/46px 46px}
.obj{border-color:#fff}.obj.hot{border-color:#e5383b}
.hk{background:linear-gradient(#ef4447,#b3141c)}
.wtool{background:#e5383b}
.gf.al{border-left-color:#ffd23f}
.mgc .dept-badge{background:#e5383b}

/* 3D */
.till3d{display:none;position:relative;flex:1.3 1 0;min-height:170px;border-radius:12px;overflow:hidden;background:linear-gradient(#ffffff,#f7e9e9);border:3px solid #7a1418}
body.b3d .till3d{display:block}
body.b3d #belt{display:none}
canvas.pixcv{position:absolute;inset:0;width:100%!important;height:100%!important;display:block;cursor:pointer;image-rendering:pixelated}
@media (max-width:820px){.till3d{min-height:150px}}

.vacs{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px}
.vac{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#fff;border:2px solid #ecdcdc;border-radius:12px;padding:6px 8px}
.vac.on{border-color:#e5383b;background:#fff4f4}
.vac span:first-child{display:flex;flex-direction:column;font-size:13px}.vac small{font-size:10px;color:#7a5a5a}
.vbtn{display:flex;align-items:center;gap:6px}.vbtn b{font-family:var(--pix);font-size:18px;min-width:16px;text-align:center}
.vbtn .btn{width:auto;min-width:32px;min-height:30px;padding:2px 8px}
.job .seb{position:absolute;top:-8px;left:50%;transform:translateX(-50%);background:#e5383b;color:#fff;font-size:10px;font-weight:800;border-radius:99px;padding:1px 8px;white-space:nowrap;box-shadow:0 2px 0 #7a0d12}
.job{position:relative}

/* 3D: la ventanilla arriba (cliente de frente) y la cinta abajo */
.win3d{display:none;position:relative;height:clamp(150px,24vh,250px);border-radius:12px;overflow:hidden;border:3px solid #7a1418;background:#fdf3f3}
body.b3d .counter .bagt,body.b3d #bagged{display:none}
body.b3d .till3d{flex:1 1 0;min-height:200px}
@media (max-width:820px){.win3d{height:clamp(120px,20vh,180px)}}

/* Avisos emergentes y campana arriba, para no tapar la caja ni las herramientas */
@media (max-width:820px){
  .alertbtn{top:6px;bottom:auto;right:6px;padding:5px 10px;font-size:15px;border-width:2px}
  .alertbtn b{font-size:17px}
  .hud{margin-right:62px}
}

@media (min-width:1280px){
  body.b3d .stage{grid-template-columns:1fr;grid-template-rows:minmax(200px,42%) minmax(0,1fr);gap:8px}
  body.b3d .counter{padding:8px}
  body.b3d .counter>.zone-title{display:none}
  body.b3d .side{min-height:0}
  body.b3d .register{overflow:auto}
}

/* El contenedor de los departamentos no lleva marco: con el de las tarjetas basta */
.dept{background:transparent;border:0;box-shadow:none;border-radius:0;padding:0}

.vac .vn{display:grid!important;grid-template-columns:auto 1fr;column-gap:8px;align-items:center}.vac .vn i{grid-row:1/3;font-style:normal;font-size:22px}.vac .vn b{font-size:13px}

/* ===== Caja en pixel art: escena + caja registradora, encajadas y sin huecos ===== */
body.b3d #queue{display:none}
body.b3d .queue-wrap{padding:6px 10px;gap:2px}
body.b3d .queue-wrap .bubble{min-height:0;padding:6px 10px}
body.b3d .stage{grid-template-columns:minmax(0,1.55fr) minmax(290px,1fr);align-items:stretch}
body.b3d .counter{position:relative;padding:0;overflow:hidden;min-height:0}
body.b3d .counter>.zone-title{display:none}
body.b3d .till3d{position:absolute;inset:0;border:0;border-radius:13px;min-height:0;background:#ece6e2}
body.b3d .register{display:flex;flex-direction:column;gap:8px}
body.b3d .register .receipt{flex:1 1 auto;max-height:none;min-height:60px}
body.b3d .register .kbd{margin-top:auto}
body.b3d .queue-wrap .chat:empty{display:none}
@media (min-width:1280px){
  body.b3d .stage{grid-template-columns:1fr;grid-template-rows:minmax(260px,1fr) auto}
  body.b3d .register .receipt{flex:0 1 auto;max-height:84px}
  body.b3d:not(.rem) .register .kbd{display:none}
  body.b3d:not(.rem) .register{padding:8px;gap:6px}
  body.b3d:not(.rem) .register .led b{font-size:30px}
}
@media (max-width:820px){
  body.b3d .stage{grid-template-columns:1fr;grid-template-rows:minmax(200px,1fr) auto}
  body.b3d .register .receipt{flex:0 1 auto;max-height:90px}
  body.b3d .stage:has(.denoms){grid-template-rows:1fr}
}

/* Cajero real: sin la columna de la tienda (es del jefe); escena y caja registradora lado a lado */
body.rem .isostore{display:none!important}
@media (min-width:821px){
  body.rem .play{grid-template-columns:minmax(0,1fr) 300px}
  body.rem.b3d .stage{grid-template-columns:minmax(0,1.6fr) minmax(300px,1fr);grid-template-rows:1fr}
  body.rem.b3d .register .receipt{flex:1 1 auto;max-height:none}
}

.receipt .rhead{text-align:center;font-family:var(--led);font-size:15px;letter-spacing:1px;color:#3a2323;border-bottom:2px dashed #c9b9a8;padding-bottom:6px;margin-bottom:6px;display:flex;flex-direction:column}
.receipt .rhead small{font-size:12px;color:#8a7466;letter-spacing:0}
.receipt .ln.mute2{color:#a08f84;font-style:italic}

/* La sala de espera del jefe tiene poca información: ventana pequeña y centrada (en el móvil, a pantalla completa como las demás) */
@media (min-width:821px){
  .card.screen.sc-lobby{position:relative;inset:auto;margin:auto;width:100%;max-width:640px;height:auto;max-height:calc(100dvh - 32px)}
  .card.screen.sc-lobby .scr-body{flex:0 1 auto}
}
.card.screen>.scr-head small.sub{color:#ffe1e1;opacity:.9}
/* Cierre: departamentos y bolsillo del jefe */
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px}
.dcard{background:#fff;border:2px solid #f0c9c9;border-left:6px solid var(--mute);border-radius:10px;padding:5px 8px;display:flex;flex-direction:column;gap:3px;min-width:0}
.dcard.ga{border-left-color:var(--ok)}.dcard.gb{border-left-color:#7cc36b}.dcard.gc{border-left-color:#f0a020}.dcard.gd{border-left-color:#e5383b}
.dch{display:flex;align-items:center;gap:6px}.dch b{font-family:var(--display);font-size:14px;flex:1;white-space:nowrap}.dpp{font-size:11px;color:var(--mute)}
.grade{font-family:var(--display);font-weight:700;font-size:14px;line-height:1.2;border-radius:8px;padding:0 7px;white-space:nowrap;color:#fff;background:var(--mute)}
.ga .grade{background:var(--ok)}.gb .grade{background:#5ea94d}.gc .grade{background:#e08a00}.gd .grade{background:#e5383b}
.card .dcard .sum{font-size:12px;gap:0 8px;line-height:1.3}.dcard .sum b{text-align:right}.dcard .sum b.neg{color:#e5383b}
.dhint{font-size:11px;font-weight:700;color:#7a1418;background:#fff6f4;border-radius:6px;padding:2px 6px}
.dhint.ok{color:#2f6b25;background:#f1faee}
.pocket{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:6px;padding:5px 10px;border:2px dashed #c9a227;border-radius:10px;background:#fffbea;font-size:13px}
.pocket small{color:var(--mute)}.pocket b{white-space:nowrap;font-family:var(--pix);font-weight:400;font-size:16px;color:#8a6500}
.divb{display:flex;flex-wrap:wrap;gap:6px}.divb .btn{flex:1 1 90px}.divb .btn small{font-size:10px;font-weight:400}
/* Cierre: tarjetas con las cifras clave y ventana a la medida en pantalla grande */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.dscene{position:relative;width:100%;max-height:320px;border-radius:14px;overflow:hidden;border:3px solid #7a0d12;background:#ece6e2;margin-bottom:10px;flex:0 0 auto}
.dscene .gs-zone{position:absolute;left:8px;top:6px;z-index:2}
@media (max-width:820px){.dscene{max-height:230px;margin-bottom:8px}}
.dkpis{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.bal{margin-bottom:6px}.balk{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.balk span{background:#fff;border:2px solid #f0c9c9;border-radius:12px;padding:6px 8px;display:flex;flex-direction:column;min-width:0}
.balk small{font-size:11px;color:var(--mute);white-space:nowrap}.balk b{font-family:var(--pix);font-weight:400;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.balk .neg b{color:#e5383b}.balk .pos b{color:var(--ok)}.bal .sum{font-size:13px}.bal .sum .neg{color:#e5383b}.bal .sum .pos{color:var(--ok)}
.balbar{height:6px;background:#eee;border-radius:3px;margin:6px 0 4px;overflow:hidden}.balbar i{display:block;height:100%;background:var(--ok)}.balbar.on i{background:#e5383b}
.stat.neg b{color:#fff;background:#e5383b;border-radius:6px;padding:0 4px}
@media (max-width:520px){.balk b{font-size:14px}.balk small{font-size:10px}}
.dkpi{background:#fff;border:2px solid #f0c9c9;border-radius:12px;padding:6px 8px;display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left;min-width:0;cursor:pointer}
.dkpi.on{border-color:#e5383b;box-shadow:0 3px 0 #b3141c}
.dkpi small{font-size:11px;color:var(--mute);white-space:nowrap}.dkpi b{font-family:var(--pix);font-weight:400;font-size:18px;white-space:nowrap}
.dkpi em{font-style:normal;font-size:10px;font-weight:700;color:var(--mute);white-space:normal;line-height:1.15}.dkpi em.up{color:var(--ok)}.dkpi em.down{color:#e5383b}
.dchart{width:100%;height:190px;display:block;background:#fff;border:2px solid #f0c9c9;border-radius:12px;margin-top:6px}

/* ===== QUICK WINS de la auditoría de arte ===== */

/* QW1 · Causa raíz de los paneles de 214 px: la línea 1197 redefine .dgrid con auto-FILL (crea 7 pistas aunque solo haya 2 paneles).
   Con auto-FIT las pistas vacías se colapsan y cada panel crece hasta llenar el ancho. */
.dgrid{grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr))}
/* Opcional (QW1b): en pestañas de departamento la tienda grande sobra, porque #deptscene ya enseña su zona.
@media (min-width:1280px){body:not([data-tab="caja"]) .play{grid-template-columns:minmax(0,1fr) 310px}body:not([data-tab="caja"]) .isostore{display:none}} */

/* QW2 · El dinero nunca se corta con «…»: tamaño fluido y rejilla que salta de línea. */
.balk{grid-template-columns:repeat(auto-fit,minmax(128px,1fr))}
.balk b{overflow:visible;text-overflow:clip;font-size:clamp(15px,1.05vw,19px)}
.dkpis{grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}   /* línea 1214: 4 columnas fijas cortaban «+237,8…» */
.sups{grid-template-columns:repeat(auto-fit,minmax(110px,1fr))}

/* QW3 · Los avisos emergentes no tapan minijuegos ni el cierre: quedan debajo de #overlay (20), #mg (25) y #scene. */
#toast{z-index:18}

/* QW4 · Contraste AA: botón «no» y textos verdes/grises. */
:root{--mute:#5d6a64;--ok:#1e7d47}
.btn.no{background:linear-gradient(180deg,#e5383b,#a8161c)}
.btn.go{background:linear-gradient(180deg,#178043,#0f6234)}
.balk .pos b,.bal .sum .pos{color:#1e7d47}

/* QW5 · Billetes y monedas de la caja con los mismos colores que el arqueo de Backoffice (.money.b50…), y el valor en grande. */
.dn{font-family:var(--pix);font-size:15px;font-weight:700;color:#1b1f1d;border:2px solid rgba(0,0,0,.25)}
.dn.bill[data-v="5000"]{background:linear-gradient(90deg,#f6a65a,#ef8b33)}
.dn.bill[data-v="2000"]{background:linear-gradient(90deg,#86aee9,#5b8fd9)}
.dn.bill[data-v="1000"]{background:linear-gradient(90deg,#ec8f89,#e0645f)}
.dn.bill[data-v="500"]{background:linear-gradient(90deg,#a9d0a5,#7cb87a)}
.dn.coin[data-v="200"],.dn.coin[data-v="100"]{background:radial-gradient(circle,#dfe3e6 0 45%,#d8b24a 47%);border-radius:999px}
.dn.coin[data-v="50"],.dn.coin[data-v="20"],.dn.coin[data-v="10"]{background:radial-gradient(circle at 35% 35%,#f5dc7a,#c99a2e);border-radius:999px}
.dn.coin[data-v="5"],.dn.coin[data-v="2"],.dn.coin[data-v="1"]{background:radial-gradient(circle at 35% 35%,#e9a374,#b4602f);color:#fff;border-radius:999px}

/* QW6 · Pestañas en móvil con nombre corto bajo el icono (hoy solo icono). */
@media (max-width:640px){
  .tab{flex-direction:column;gap:0;line-height:1.05;padding:4px 2px}
  .tab span{display:block;font-family:var(--body);font-weight:800;font-size:10px;letter-spacing:0;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
}

/* QW7 · Tamaño mínimo de texto 12 px en etiquetas de datos (hoy 9–11 px). */
.balk small,.dkpi small,.isostore .ptitle small,.brand small{font-size:12px}

/* QW8 · El agujero de «etiqueta de precio» en los botones de las escenas parecía un botón de radio: se quita. */
.scn-ch .btn::before{display:none}

/* ===== SISTEMA DE DISEÑO (guía de estilo de la auditoría de arte) =====
   Última capa: tokens de color con significado, escala de letra de 6 pasos y mínimo de 12 px.
   Marca (--brand) = cromo: HUD, barras de título, pestaña activa. Pérdida o peligro (--danger) es OTRO rojo, más hondo,
   y siempre va con «−», ▼ o ⚠; ganancia (--gain) con «+» o ▲. Nada se lee solo por el color. */
:root{
  --brand:#e5383b;--brand-700:#a8161c;--brand-900:#7a0d12;
  --danger:#b3141c;--danger-bg:#fff0f0;--gain:#1e7d47;--gain-bg:#eef8f1;--warn:#ffd23f;--warn-bg:#fffbea;--info:#2f6db5;--info-bg:#f1f6fd;
  --fs-xs:12px;--fs-s:14px;--fs-m:16px;--fs-l:20px;--fs-xl:26px;--fs-xxl:34px;
  --ok:var(--gain);--sign:var(--brand);
}

/* Mínimo de 12 px donde más pesa (medido en caja, Dirección, Almacén y minijuegos a 1920 y 390 px) */
.supd,.crew,.ord .os,.ord .on small,.gl,.ib small,.pct small,.zl,.zrep small,.mgc .dept-badge,.gs-zone,.alert,.alert .who .btn,
.balk small,.dkpi small,.dkpi em,.kpi>small,.kpi>b small,.divb .btn small,.dleg,.adv,.slot small,#vtag{font-size:var(--fs-xs)}

.card .dcard .sum,.scr-body .dcard .sum,.card .dpp,.card .dhint,.fin .sum .hd,.card .fin .sum span.hd,.stab i,.card.screen>.scr-head .stab i,.pocket small{font-size:var(--fs-xs)}
.dcard span{font-size:var(--fs-xs)}.card .dcard .grade{font-size:var(--fs-s);color:#fff}.gd .grade{background:var(--danger)}.card .dcard .sum b.neg{color:var(--danger)}

function repAdd(x,why){

  const L=run.repL||(run.repL={}),o=L[why]||(L[why]={d:0,n:0});o.d+=d;o.n++;

}
function repWhy(neg){

  ((meta&&meta.repH)||[]).forEach(h=>add(h.L));if(run&&run.repL&&!run.repArch)add(run.repL);
