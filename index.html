<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VitchMarket</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=DM+Mono:wght@400;500&family=VT323&display=swap" rel="stylesheet">
<style>
/* Layout: HUD arriba, cola de clientes, mostrador (cinta) a la izquierda y caja registradora a la derecha. */
:root{
  --floor:#17352f; --floor2:#1d443b; --paper:#f6f1e4; --ink:#1b1f1d;
  --sign:#e5383b; --tag:#ffd23f; --ok:#2a9d5c; --mute:#7c8a84; --belt:#2b2f2e;
  --display:'Bungee',Impact,sans-serif; --body:'DM Mono',ui-monospace,Menlo,monospace; --led:'VT323',ui-monospace,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;}
body{
  background:var(--floor);
  background-image:
    linear-gradient(var(--floor2) 1px,transparent 1px),
    linear-gradient(90deg,var(--floor2) 1px,transparent 1px);
  background-size:48px 48px;
  color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.4;
  -webkit-user-select:none;user-select:none;
}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--tag);outline-offset:2px}
#app{max-width:1060px;margin:0 auto;padding:0 16px 40px;display:flex;flex-direction:column;gap:12px}
.sticky{position:sticky;top:0;z-index:10;display:flex;flex-direction:column;gap:12px;padding:12px 0 8px;background:var(--floor);box-shadow:0 8px 12px -6px rgba(0,0,0,.45)}

/* HUD */
.hud{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;background:var(--sign);color:#fff;padding:10px 16px;border-radius:6px;border-bottom:5px solid #9f1d20}
.brand{font-family:var(--display);font-size:20px;letter-spacing:.5px;margin-right:auto;line-height:1}
.brand small{display:block;font-family:var(--body);font-size:11px;letter-spacing:2px;opacity:.85;margin-top:4px}
.stat{display:flex;flex-direction:column;align-items:flex-end;min-width:64px}
.stat span{font-size:10px;letter-spacing:1.5px;opacity:.8;text-transform:uppercase}
.stat b{font-family:var(--led);font-size:30px;line-height:.9;font-weight:400;color:var(--tag)}
.daybar{height:6px;background:rgba(0,0,0,.25);border-radius:3px;overflow:hidden;flex-basis:100%}
.daybar i{display:block;height:100%;width:0;background:var(--tag)}
.mute{background:rgba(0,0,0,.25);border-radius:4px;padding:4px 8px;font-size:12px}

/* Cola */
.queue-wrap{background:rgba(0,0,0,.22);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.queue{display:flex;gap:10px;align-items:flex-end}
.cust,.slot{width:64px;flex:0 0 64px;display:flex;flex-direction:column;align-items:center;gap:4px}
.slot{height:68px;border:2px dashed rgba(255,255,255,.18);border-radius:8px}
.face{font-size:34px;line-height:1;filter:grayscale(.25)}
.cust.front .face{font-size:46px;filter:none}
.cust.front{flex-basis:84px;width:84px}
.pbar{width:100%;height:7px;background:rgba(0,0,0,.35);border-radius:4px;overflow:hidden}
.pbar i{display:block;height:100%;width:100%;background:var(--ok)}
.pbar i.mid{background:var(--tag)}.pbar i.low{background:var(--sign)}
.bubble{background:var(--paper);border-radius:10px;padding:8px 12px;font-size:13px;min-height:36px;display:flex;align-items:center;gap:8px;position:relative}
.chat{min-height:22px;color:#fff;font-size:13px;display:flex;align-items:center;gap:8px}
.chat .who{font-size:20px;line-height:1}
.chat.angry{color:var(--tag)}
.bubble.muted{background:transparent;color:rgba(255,255,255,.6);padding-left:0}

/* Escenario */
.stage{display:grid;grid-template-columns:1.25fr 1fr;gap:12px;align-items:start}
.counter{background:#e4dccb;border-radius:6px;padding:12px;border-bottom:6px solid #b8ad94;display:flex;flex-direction:column;gap:8px;min-height:340px}
.zone-title{font-family:var(--display);font-size:11px;letter-spacing:2px;color:#5b5646}
.belt{background:var(--belt);background-image:repeating-linear-gradient(90deg,transparent 0 22px,rgba(255,255,255,.06) 22px 24px);border-radius:6px;padding:12px;min-height:128px;display:flex;flex-wrap:wrap;gap:10px;align-content:flex-start}
.hint{color:rgba(255,255,255,.4);align-self:center;margin:auto}
.item{position:relative;width:84px;background:var(--paper);border-radius:8px;padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 3px 0 rgba(0,0,0,.35);transition:transform .08s}
.item:active{transform:translateY(3px);box-shadow:0 0 0 rgba(0,0,0,.35)}
.item .em{font-size:30px;line-height:1}
.item .nm{font-size:11px;text-align:center;line-height:1.1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .fm{font-size:9px;color:var(--mute);text-align:center;line-height:1.05}
.item .code{font-size:11px;color:var(--sign);letter-spacing:2px}
.item.dmg{outline:2px dashed var(--sign);outline-offset:-3px}
.item .age{position:absolute;top:-6px;right:-6px;background:var(--sign);color:#fff;font-size:10px;font-weight:500;border-radius:10px;padding:1px 6px}
.item.flash{animation:shake .25s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.bagged{display:flex;flex-wrap:wrap;gap:6px;min-height:42px;background:rgba(0,0,0,.08);border-radius:6px;padding:8px;font-size:24px;line-height:1}
.bagged .none{font-size:12px;color:#7a735f;align-self:center}

/* Caja */
.register{background:#d9d4c7;border-radius:6px;padding:12px;border-bottom:6px solid #a49d8a;display:flex;flex-direction:column;gap:10px}
.led{background:#0d1f1a;color:#6dffb0;font-family:var(--led);border-radius:4px;padding:6px 12px;display:flex;justify-content:space-between;align-items:baseline;border:3px solid #3a403d}
.led small{font-size:18px;opacity:.7;letter-spacing:2px}
.led b{font-size:46px;font-weight:400;line-height:1}
.receipt{background:var(--paper);padding:10px 12px 16px;max-height:176px;overflow:auto;font-size:12px;
  -webkit-mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/12px 100%;mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/12px 100%}
.receipt .ln{display:flex;justify-content:space-between;gap:8px}
.receipt .ln.den{text-decoration:line-through;color:var(--mute)}
.receipt.empty{color:var(--mute);text-align:center;padding:24px 12px}
.row{display:flex;gap:8px}
.btn{flex:1;background:var(--paper);border-radius:6px;padding:10px 8px;font-weight:500;box-shadow:0 3px 0 rgba(0,0,0,.3);text-align:center}
.btn:active{transform:translateY(3px);box-shadow:none}
.btn.on{background:var(--tag)}
.btn.go{background:var(--ok);color:#fff}
.btn.no{background:var(--sign);color:#fff}
.btn[disabled]{opacity:.4;cursor:not-allowed;transform:none;box-shadow:0 3px 0 rgba(0,0,0,.3)}
.idcard{background:#cfe8f5;border:2px solid #6aa5c4;border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px}
.idcard h4{margin:0;font-family:var(--display);font-size:12px;letter-spacing:1.5px;font-weight:400;color:#2a5a75}
.idcard dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:2px 10px}
.idcard dt{color:#2a5a75;font-size:11px}.idcard dd{margin:0;font-weight:500}
.cashrow{display:flex;justify-content:space-between;align-items:baseline;padding:2px 2px}
.cashrow b{font-family:var(--led);font-size:28px;font-weight:400}
.cashrow.tray b{color:var(--sign)}
.cashrow.due{background:var(--tag);border-radius:4px;padding:2px 8px}
.denoms{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.dn{position:relative;padding:10px 0;border-radius:5px;font-weight:500;box-shadow:0 3px 0 rgba(0,0,0,.3);text-align:center}
.dn:active{transform:translateY(3px);box-shadow:none}
.dn.bill{background:#bfe0c8}.dn.coin{background:#e6d7a3}
.dn .cnt{position:absolute;top:-6px;right:-4px;background:var(--ink);color:#fff;font-size:10px;border-radius:9px;padding:0 5px}
.proc{height:14px;background:rgba(0,0,0,.2);border-radius:7px;overflow:hidden}
.proc i{display:block;height:100%;width:0;background:var(--ok);animation:proc 1.2s linear forwards}
@keyframes proc{to{width:100%}}
.paywait{text-align:center;color:#5b5646}

#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;opacity:0;pointer-events:none;transition:.2s;max-width:90vw;text-align:center;z-index:30}
#toast.show{opacity:1;transform:translateX(-50%)}
#toast.bad{background:var(--sign)}#toast.good{background:var(--ok)}

/* Overlay */
#overlay{position:fixed;inset:0;background:rgba(10,24,20,.82);display:none;align-items:flex-start;justify-content:center;padding:16px;z-index:20;overflow:auto}
#overlay.show{display:flex}
.card{margin:auto;background:var(--paper);border-radius:8px;max-width:520px;width:100%;padding:22px;display:flex;flex-direction:column;gap:12px;box-shadow:0 10px 0 rgba(0,0,0,.35)}
.card h1,.card h2{font-family:var(--display);font-weight:400;margin:0;line-height:1.05}
.card h1{font-size:44px;color:var(--sign)}.card h2{font-size:26px}
.card ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.card .sum{display:grid;grid-template-columns:minmax(55%,1fr) auto;gap:2px 12px}
.card .sum b{text-align:right}
.card .sum .tot{border-top:2px dashed var(--ink);padding-top:6px;margin-top:4px;font-weight:500}
.shop{display:flex;flex-direction:column;gap:6px}
.up{display:flex;align-items:center;gap:10px;background:#fff;border-radius:6px;padding:8px 10px}
.up .t{flex:1;font-size:12px}.up .t b{display:block;font-size:13px}
.up .btn{flex:0 0 auto;padding:6px 10px}
.big{padding:14px;font-family:var(--display);font-size:16px;letter-spacing:1px}

.ordlist{max-height:260px;overflow:auto;display:flex;flex-direction:column;background:#fff;border-radius:6px;padding:4px 8px}
.ord{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center;font-size:12px;border-bottom:1px dashed #ddd;padding:5px 0}
.ord .on small{display:block;color:var(--mute);font-size:10px}
.ord .os{grid-column:1;color:#5b5646;font-size:11px}
.ord .oq{grid-column:2;grid-row:1/3;display:flex;align-items:center;gap:6px}
.ord .oq .btn{flex:0 0 auto;padding:3px 9px}
.sups{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.supd{font-size:11px;color:#5b5646}
.routes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hintline{font-size:11px;color:#2a5a75}
.card .sum span.sm,.card .sum b.sm{font-size:12px}

/* Personal: avisos en turno y reunión */
.side{display:flex;flex-direction:column;gap:12px}
.tasks{background:#cfc7b4;border-radius:6px;padding:12px;border-bottom:6px solid #a49d8a;display:flex;flex-direction:column;gap:8px}
.task{background:var(--paper);border-radius:6px;padding:8px 10px;display:flex;flex-direction:column;gap:6px;font-size:12px}
.task .tb{height:5px;background:rgba(0,0,0,.15);border-radius:3px;overflow:hidden}
.task .tb i{display:block;height:100%;width:100%;background:var(--sign)}
.task .who{display:flex;flex-wrap:wrap;gap:6px}
.task .who .btn{flex:0 0 auto;padding:5px 8px;font-size:11px}
.task .who .btn small{opacity:.6}
.task .who .btn.off{background:#e9e2cf}
.crew{display:flex;flex-direction:column;gap:2px;font-size:11px;color:#3d3a30}
/* Ventana de salir de caja, minijuegos y supervisión */
#mg{position:fixed;inset:0;background:rgba(10,24,20,.7);display:none;align-items:flex-start;justify-content:center;padding:16px;z-index:25;overflow:auto}
#mg.show{display:flex}
.mgc{max-width:460px}
/* Pantallas anchas: las ventanas largas usan casi todo el ancho, en columnas tipo periódico. */
@media (min-width:900px){
  .card.wide{max-width:min(1240px,94vw);display:block;columns:2 440px;column-gap:40px;padding:28px 36px;font-size:15px}
  .card.wide>*{margin:0 0 12px}
  .card.wide>h1,.card.wide>h2,.card.wide>.btn.big{column-span:all}
  .card.wide>.btn{display:block;width:100%}
  .card.wide .zone-title{break-after:avoid}
  .card.wide .emp,.card.wide .up,.card.wide .sum,.card.wide .ord,.card.wide .alert,.card.wide label,.card.wide .ordlist,.card.wide .rank,.card.wide .mhud{break-inside:avoid}
  .card.wide .emp{font-size:13px}
  .mgc{max-width:640px}
  .card.wide.hub{display:flex;columns:auto;max-width:min(1100px,94vw)}
  .card.wide.hub>*{margin:0}
  .jobs{grid-template-columns:repeat(5,1fr)}
}
.mgc h3{margin:0;font-family:var(--display);font-weight:400;font-size:18px;line-height:1.15}
.opts{display:flex;flex-direction:column;gap:6px}
.opts .btn{text-align:left}
.opts .btn small{opacity:.6}
.aisles,.zones{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.aisles .btn,.zones .btn{font-size:12px}
.shelf{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;background:#8b6f4e;padding:6px;border-radius:6px}
.slot2{height:40px;background:rgba(255,255,255,.15);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:24px}
.boxes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.box{height:64px;font-size:32px;background:#e9d9b0;border-radius:8px;box-shadow:0 3px 0 rgba(0,0,0,.3)}
.box:active{transform:translateY(3px);box-shadow:none}
.box.done{background:transparent;box-shadow:none;display:flex;align-items:center;justify-content:center}
.bigbox{font-size:64px;line-height:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.bigbox small{font-size:13px}
.btn.sup{flex:none;background:#efe7d0}
.duty{font-size:11px;color:#2a5a75}
.did{margin:0;padding-left:18px;font-size:12px;display:flex;flex-direction:column;gap:1px}
.pname{display:block;width:100%;margin-top:4px;padding:8px 10px;border-radius:6px;border:2px solid #cfc7b4;background:#fff;color:var(--ink);font:inherit;font-size:14px;-webkit-user-select:text;user-select:text}
.rank{margin:0;padding-left:24px;font-size:12px;display:flex;flex-direction:column;gap:2px}
.rank li.me{background:var(--tag);border-radius:4px}
.hub h1{font-size:56px;text-shadow:3px 3px 0 var(--ink);letter-spacing:1px}
.live{display:inline-flex;align-items:center;gap:6px;background:var(--ink);color:#d8ffe6;border-radius:99px;padding:2px 10px 2px 8px;font-size:10px;font-weight:700;letter-spacing:1px;margin-right:4px;vertical-align:middle}
.live i{width:8px;height:8px;border-radius:50%;background:#3ddc84;box-shadow:0 0 6px #3ddc84;animation:livep 1.2s infinite}
.live.off i{background:#ff6b5b;box-shadow:0 0 6px #ff6b5b;animation:none}
@keyframes livep{50%{opacity:.25}}
.jobs{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.job{display:flex;flex-direction:column;align-items:center;gap:4px;background:#fff;border:3px solid var(--ink);border-radius:12px;padding:12px 8px 10px;box-shadow:0 5px 0 var(--ink);cursor:pointer;font:inherit;color:var(--ink);transition:transform .08s,box-shadow .08s;text-align:center}
.job:hover:not([disabled]){transform:translateY(-3px);box-shadow:0 8px 0 var(--ink)}
.job:active:not([disabled]){transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.job[disabled]{opacity:.55;cursor:not-allowed}
.job .ic{font-size:40px;line-height:1.1}
.job b{font-family:var(--display);font-weight:400;font-size:17px}
.job small{font-size:10px;color:#5c5a50;line-height:1.3}
.job em{color:var(--sign);font-style:normal;font-weight:700}
.job.boss{background:var(--tag)}
.slots{display:flex;gap:3px}.slots i{width:14px;height:7px;border-radius:2px;background:#d9d2bf}.slots i.on{background:var(--ok)}
@media (prefers-reduced-motion:reduce){.live i{animation:none}.job{transition:none}}
.sel{-webkit-user-select:all;user-select:all;word-break:break-all}
.rerr{background:#fde2e1;color:#8a1c1f;border-radius:6px;padding:6px 10px;font-size:13px}
.rok{background:#dff3e6;color:#1d5c37;border-radius:6px;padding:6px 10px;font-size:13px}
.mhud{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;background:var(--ink);color:#fff;border-radius:6px;padding:6px 10px}
.mhud b{color:var(--tag)}
.btn.mini{padding:2px 8px;font-size:11px}
.camwin{position:fixed;right:8px;bottom:8px;width:min(calc(100vw - 16px),460px);background:#050807;border:2px solid #2b3a33;border-radius:8px;z-index:15;display:none;box-shadow:0 8px 24px rgba(0,0,0,.5);padding:4px}
.camwin.show{display:block}
.camhead{display:flex;justify-content:space-between;align-items:center;gap:8px;color:#9fd8b4;font-size:10px;padding:2px 2px 4px}
.camcv{display:block;width:100%;border-radius:4px;cursor:pointer;touch-action:manipulation}
.camslot{background:#050807;border-radius:6px;padding:3px}
.alerts{display:flex;flex-direction:column;gap:6px}
.alerts:empty{display:none}
.tabs{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.tabs::-webkit-scrollbar{display:none}
.tabs:empty{display:none}
.tab{flex:1 0 auto;display:flex;align-items:center;justify-content:center;gap:5px;background:#1b2823;color:#d8e8de;border:2px solid #000;border-bottom-width:4px;border-radius:8px;padding:6px 10px;font-family:var(--display);font-size:14px;cursor:pointer;position:relative}
.tab.on{background:var(--tag);color:var(--ink);transform:translateY(2px);border-bottom-width:2px}
.force{font:inherit;font-size:11px;padding:4px 6px;border-radius:6px;border:2px solid var(--ink);background:#fff;color:var(--ink);max-width:170px}
.tab i{background:var(--sign);color:#fff;border-radius:99px;padding:0 6px;font-style:normal;font-size:10px;font-family:inherit;line-height:16px}
.dept{display:flex;flex-direction:column;gap:12px}
.dept[hidden],.stage[hidden]{display:none}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr));gap:12px;align-items:start}
.dpanel{background:var(--paper);color:var(--ink);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:0 6px 0 rgba(0,0,0,.35)}
.dpanel h2{font-family:var(--display);font-weight:400;margin:0;font-size:24px}
.dpanel .sum{display:grid;grid-template-columns:minmax(55%,1fr) auto;gap:2px 12px}.dpanel .sum b{text-align:right}
.ordlist.tall{max-height:440px}
.os.bad{color:var(--sign);font-weight:700}
.dcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.dcard{display:flex;flex-direction:column;gap:3px;text-align:left;background:#fff;border:2px solid var(--ink);border-bottom-width:4px;border-radius:8px;padding:8px 10px;font:inherit;color:var(--ink);cursor:pointer}
.dcard b{font-family:var(--display);font-weight:400;font-size:15px}.dcard span{font-size:11px;color:#5c5a50}
@media (max-width:640px){.tab span{display:none}.tab{font-size:18px;padding:5px 8px}}
.alert{background:var(--tag);border-radius:6px;padding:6px 8px;display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-size:12px;color:var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.3)}
.alert .at{flex:1 1 180px;font-weight:500}
.alert .who{display:flex;flex-wrap:wrap;gap:4px}
.alert .who .btn{flex:0 0 auto;padding:4px 7px;font-size:11px;box-shadow:0 2px 0 rgba(0,0,0,.3)}
.alert .who .btn small{opacity:.6}
.alert .who .btn.off{background:#efe7d0}
.alert .tb{flex-basis:100%;height:4px;background:rgba(0,0,0,.15);border-radius:2px;overflow:hidden}
.alert .tb i{display:block;height:100%;width:100%;background:var(--sign)}
.mood{font-size:20px;line-height:1}
.emp{background:#fff;border-radius:6px;padding:8px 10px;display:flex;flex-direction:column;gap:5px;font-size:12px}
.eh{display:flex;align-items:center;gap:8px}
.ef{font-size:28px;line-height:1}
.eh .t{flex:1;font-size:11px;color:#5b5646}.eh .t b{display:block;font-size:14px;color:var(--ink)}
.es{font-size:11px;color:#5b5646}
.ev{font-weight:500}
.ea{flex-wrap:wrap}.ea .btn{padding:6px 4px;font-size:11px;min-width:64px}
.qa{font-size:11px;color:#2a5a75}.qa i{display:block;color:var(--ink)}
@media (max-width:820px){

function receiveDeliveries(){
  const rr={arrived:0,short:0,shelved:0,pending:0};
  const due=meta.orders.filter(o=>o.day<=meta.day);
  meta.orders=meta.orders.filter(o=>o.day>meta.day);
  due.forEach(o=>{
    const sup=SUPS.find(z=>z.k===o.sup);
    Object.entries(o.items).forEach(([id,q])=>{
      const got=Math.random()<sup.rel?q:Math.ceil(q*0.5);
      rr.arrived+=got;rr.short+=q-got;
      meta.back[id]=(meta.back[id]||0)+got;
    });
  });
  let cap=staffOf('alm').filter(working).reduce((t,e)=>t+Math.round(30+40*e.rap),0);
  const ids=Object.keys(meta.back).filter(id=>meta.back[id]>0).sort((x,y)=>(meta.stock[x]||0)-(meta.stock[y]||0));
  for(const id of ids){
    if(cap<=0)break;
    const mv=Math.min(cap,meta.back[id]);
    meta.back[id]-=mv;meta.stock[id]=(meta.stock[id]||0)+mv;cap-=mv;rr.shelved+=mv;
  }
  rr.pending=Object.values(meta.back).reduce((t,v)=>t+v,0);

  const cost=cartCost(),sup=SUPS.find(z=>z.k===ordSup);
  if(cost<=0||meta.money<cost)return;
  meta.money-=cost;
  meta.orders.push({day:meta.day+sup.lead,sup:ordSup,items:Object.assign({},cart)});
  cart={};sOk();renderHud();refreshView();
  toast('Pedido enviado. Llega en el turno '+(meta.day+sup.lead),'good');
}
function processTickets(){
  const mk=()=>({in:0,ok:0,fail:0,late:0,cost:0});
  const res={back:mk(),rrpp:mk(),alm:mk()};
  ['back','rrpp','alm'].forEach(d=>{
    const r=res[d],ws=staffOf(d).filter(working),slots=[];
    for(let k=0;k<3;k++)ws.forEach(e=>{if(k<(e.rap>0.7?3:2))slots.push(e);});
    run.tickets.filter(t=>t.dept===d).sort((x,y)=>y.sev-x.sev).forEach((t,i)=>{
      r.in++;
      const e=slots[i];
      if(!e){r.late++;meta.rep=clamp(meta.rep-0.15,0,5);return;}
      const dd=run.duty[e.id]||{};
      const p=t.mis?0.3:clamp(perf(e,true)+(dd.seen?0.05:0)-((dd.slackT||0)>15?0.1:0),0.1,0.97);
      if(Math.random()<p){
        const cost=d==='back'?t.refund:d==='rrpp'?500:0;
        r.ok++;r.cost+=cost;meta.rep=clamp(meta.rep+0.1,0,5);e.st.ok++;
      }else{
        const cost=d==='back'?t.refund*2:0;
        r.fail++;r.cost+=cost;meta.rep=clamp(meta.rep-(d==='rrpp'?0.5:0.3),0,5);e.st.fail++;
      }
    });
    if(r.late)ws.forEach(e=>{e.moral=clamp(e.moral-4,0,100);});
    meta.money-=r.cost;
  });
  /* Las que resolvieron en directo los empleados reales (ya pagadas) también cuentan en el resumen. */
  Object.keys(run.liveTk||{}).forEach(d=>{const L=run.liveTk[d],r=res[d];if(r){r.in+=L.ok+L.fail;r.ok+=L.ok;r.fail+=L.fail;r.cost+=L.cost;}});
  return res;
}
function endDay(){
  run.over=true;
  run.tasks.forEach(t=>{if(!t.who&&t.k!=='tk'){meta.rep=clamp(meta.rep-t.pen/2,0,5);run.tlost++;}});
  run.tasks=[];run.away=null;mg=null;pendingLeave=null;closeMG();
  const res=processTickets();
  let payroll=0;
  meta.emp.forEach(e=>{
    const d=run.duty[e.id];
    if(!(d&&(d.st==='abs'||d.st==='gone')))payroll+=e.wage;
    if(working(e)){e.days++;if(e.trial>0)e.trial--;}
    if(e.focus>0)e.focus--;
    e.moral=clamp(e.moral+(meta.rep>=4?2:meta.rep<2?-3:0),0,100);
  });
  meta.money-=payroll;
  meta.best=Math.max(meta.best,meta.day);
  cart={};
  lastEnd={payroll,res};scrTab.shop='sum';pg=0;
  if(isHost())room.rpt=deptReport();
  if(meta.rep<=0||meta.money<-30000){run.over=false;checkRep();return;}
  saveGame(true);
  submitScore(false);
  showShop();
  pubState(true);
}

async function fbInit(){
  if(fb!==null)return fb;

/* ---------- tienda compartida (Firebase Realtime Database, sin servidor) ----------
   Hay UNA sola tienda para todo el mundo: /rooms/VITCH. Al entrar, cada persona pone su nombre y solicita
   un cargo. El jefe (el primero que lo pide con el puesto libre) lleva la Caja 3, contrata a quien solicita
   y su navegador mueve la tienda: publica el estado en /state cada segundo y guarda la partida en /meta.
   Los empleados cogen avisos y hacen el minijuego en su navegador; el resultado va a /acts y el jefe lo aplica.
   Sin jefe conectado la tienda se congela; si lleva más de 2 min fuera, otro puede quedarse el puesto.
   Si no hay conexión al arrancar, se juega en solitario sin conexión (partida guardada en el navegador). */
const SHOP='VITCH',DURS=[[100,'100 s (clásico)'],[600,'10 min'],[1800,'30 min'],[3600,'1 hora'],[10800,'3 horas'],[43200,'12 horas']];
const REAL_LIM=60,TAKEOVER=120000;
const JOB_IC={jefe:'👑',atc:'🧾',alm:'📦',back:'💼',rrpp:'📣',rrhh:'🗂️'};

const isHost=()=>!!(room&&room.host);
const isMember=()=>!!(room&&!room.host);
const plain=o=>JSON.parse(JSON.stringify(o));
const toObj=v=>{if(!Array.isArray(v))return v||{};const o={};v.forEach((x,i)=>{if(x!=null)o[i]=x;});return o;};
const toArr=v=>(Array.isArray(v)?v:Object.values(v||{})).filter(x=>x!=null);
const cleanName=s=>String(s||'').replace(/[<>&"'`]/g,'').trim().slice(0,20)||'Anónimo';
const durTxt=s=>(DURS.find(d=>d[0]===s)||[0,(s||100)<120?(s||100)+' s':Math.round(s/60)+' min'])[1];
const clockOf=(t,dur)=>{const m=540+Math.min(1,(t||0)/(dur||100))*720;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(Math.floor(m%60)).padStart(2,'0');};
const srvNow=()=>Date.now()+((room&&room.off)||0);
/* El nombre se pide una vez: si ya hay uno guardado, se muestra con un botón para cambiarlo. */
const nameInput=label=>`<label class="supd">${label}<input id="pname" class="pname" maxlength="20" value="${esc(playerName())}" placeholder="Tu nombre o mote"></label>`;
const nameField=label=>playerName()?`<div class="supd" data-label="${esc(label)}">Juegas como <b>${esc(playerName())}</b> <button class="btn mini" data-act="rename">Cambiar</button></div>`:nameInput(label);
function nameOk(){const i=$('#pname');if(!i&&playerName())return true;const n=i?cleanName(i.value):'';if(!i||!i.value.trim()){toast('Pon un nombre o un mote','bad');return false;}setPlayerName(n);return true;}

async function bootOnline(){
  showOverlay('<div class="card hub"><h1>VITCHMARKET</h1><div class="supd">📡 Conectando con la tienda…</div></div>');
  const f=await Promise.race([fbInit(),new Promise(r=>setTimeout(()=>r(false),9000))]);

function goOffline(){offline=true;room=null;showStart();toast('📴 Sin conexión con la tienda: juegas en solitario. Recarga para volver a intentarlo.','bad');}
async function enterShared(){
  const f=fb,base='rooms/'+SHOP;
  const info=(await f.get(f.ref(f.db,base+'/info'))).val();
  if(info&&info.host===f.uid&&srvNow()-(info.hb||0)<TAKEOVER*15){
    const ms=await f.get(f.ref(f.db,base+'/meta'));
    meta=ms.exists()?loadRoomMeta(ms.val()):defMeta(meta.best);
    await f.update(f.ref(f.db,base+'/members/'+f.uid),{name:playerName()||'Jefe',role:'jefe',on:true});
    return enterRoom(SHOP,true);
  }
  /* Si el registro falla (reglas, permisos…), no es falta de conexión: se entra igual y se avisa. */
  let regErr=null;
  if(playerName()){
    try{
      const ex=(await f.get(f.ref(f.db,base+'/members/'+f.uid))).val();
      await f.update(f.ref(f.db,base+'/members/'+f.uid),{name:playerName(),on:true,role:ex&&ROLES[ex.role]?ex.role:null});
    }catch(e){console.warn('No se pudo registrar en la tienda:',e);regErr=e;}
  }
  enterRoom(SHOP,false);
  if(regErr){room.msg={t:'⚠️ La tienda no ha aceptado tu registro ('+errMsg(regErr)+'). Si pone PERMISSION_DENIED, las reglas de Firebase no están bien publicadas.',bad:true};room.lastHtml='';renderMember();}
}
/* Firebase convierte los objetos con claves numéricas en arrays y se come los vacíos: se deshace aquí. */
function loadRoomMeta(raw){
  const m=Object.assign(defMeta(),raw);
  m.emp=toArr(raw.emp);m.stock=toObj(raw.stock);m.back=toObj(raw.back);m.regs=raw.regs||{};
  m.up=Object.assign({scanner:0,fan:0,coffee:0},raw.up);
  m.orders=toArr(raw.orders).map(o=>Object.assign(o,{items:toObj(o.items)}));
  m.emp.forEach(e=>{e.langs=toArr(e.langs);if(e.langs.length===0)e.langs=['es'];e.log=toArr(e.log);});
  if(m.closed){if(m.day%3===1)m.emp.forEach(closeSt);m.day++;m.closed=false;}
  return m;

/* --- lado del jefe: empleados reales dentro de meta.emp (e.real = uid) --- */
function syncRealEmps(){
  if(!isHost())return;
  const ms=room.members||{};let ch=false;
  meta.emp.filter(e=>e.real).forEach(e=>{const m=ms[e.real];if(!m||!ROLES[m.role]||e.real===room.uid){dropReal(e);ch=true;}});
  Object.entries(ms).forEach(([u,m])=>{
    if(u===room.uid||!ROLES[m.role])return;
    let e=meta.emp.find(x=>x.real===u);
    const nm=cleanName(m.name);
    if(!e){
      e=newEmp(m.role,meta,{real:u,name:nm,face:'🧑‍💼',rap:0.6,trato:0.6,punt:1,act:0.7,moral:70,pers:null,nat:0,langs:['es'],trial:3});
      meta.emp.push(e);ch=true;
      toast('🎮 '+nm+' entra en '+ROLES[m.role].n,'good');
    }
    if(e.role!==m.role||e.name!==nm){e.role=m.role;e.name=nm;ch=true;}
    if(run&&!run.over&&run.duty){
      const d=run.duty[e.id];
      if(m.on&&(!d||d.st==='gone')){
        run.duty[e.id]={st:'ok',at:run.t,busy:0,task:null,slack:null,slackT:0,seen:0,cnt:1};
        if(!d||!d.cnt)e.st.shifts++;
        ch=true;toast('🎮 '+nm+' se pone a trabajar','good');
      }else if(!m.on&&d&&d.st!=='gone'){releaseReal(e);d.st='gone';ch=true;toast('📴 '+nm+' se ha desconectado','bad');}
    }
  });
  if(ch&&run&&!run.over){renderAll();pubState(true);}
}
function releaseReal(e){
  if(!run)return;
  run.tasks.forEach(t=>{if(t.who===e.id){t.who=null;t.real=0;t.dl=Math.max(t.dl,run.t+10);}});
  const d=run.duty&&run.duty[e.id];if(d){d.busy=0;d.task=null;}
}
function dropReal(e){releaseReal(e);meta.emp=meta.emp.filter(x=>x!==e);if(run&&run.duty)delete run.duty[e.id];}
function giveReal(t,e,byBoss){
  t.who=e.id;t.real=1;t.match=true;t.span=REAL_LIM;t.until=run.t+REAL_LIM;
  const d=run.duty[e.id];d.busy=1;d.task=t.id;d.slack=null;
  if(byBoss)note(e.real,'El jefe te manda: '+t.ic+' '+t.s);
}
function onAct(a){
  if(!a||!isHost())return;
  const e=meta.emp.find(x=>x.real===a.uid);if(!e)return;
  if(a.k==='hire'||a.k==='reject'){
    if(e.role!=='rrhh'){note(e.real,'Eso solo lo puede hacer Recursos Humanos.',true);return;}
    const m=room.members[a.u];if(!m||!m.apply)return;
    if(a.k==='hire'){if(staffOf(m.apply).length>=ROLES[m.apply].max){note(e.real,'Ese puesto está completo.',true);return;}hireReal(a.u);note(e.real,'Has contratado a '+cleanName(m.name)+' en '+ROLES[m.apply].n+'.');}
    else{rejectReal(a.u);note(e.real,'Has rechazado la solicitud de '+cleanName(m.name)+'.');}
    logE(e,(a.k==='hire'?'Contrató a ':'Rechazó a ')+cleanName(m.name));
    return;
  }
  if(!run||run.over)return;
  const t=run.tasks.find(x=>x.id===a.t);
  if(a.k==='take'){
    if(!t||t.who||!isFree(e)){note(e.real,'Llegas tarde: eso ya lo tiene otra persona.',true);return;}
    giveReal(t,e,false);
  }else if(a.k==='done'){
    if(!t||t.who!==e.id)return;
    doneReal(t,e,clamp(+a.sc||0,0,1),!!a.early);
  }else if(a.k==='drop'){if(t&&t.who===e.id)releaseReal(e);}
  if(run&&!run.over)renderAll();
  pubState(true);
}
function doneReal(t,e,sc,early){
  run.tasks=run.tasks.filter(x=>x!==t);
  const d=run.duty[e.id];if(d){d.busy=0;d.task=null;}
  const r=applyMG(t,sc,early,e);
  if(t.k!=='tk'){if(r.good){e.st.tasks++;run.tdone++;}else{e.st.tfail++;run.tlost++;}}
  logE(e,(r.good?'Resolvió':'Hizo mal')+' un aviso: '+t.s);
  toast('🎮 '+e.name+': '+r.msg,r.good?'good':'bad');
  note(e.real,r.msg,!r.good);
  checkRep();
}
function realFail(t){
  const e=empById(t.who);run.tasks=run.tasks.filter(x=>x!==t);
  if(e){const d=run.duty[e.id];if(d){d.busy=0;d.task=null;}}
  if(t.k==='tk'){if(e)note(e.real,'Se te pasó el tiempo con la reclamación. Se queda en la bandeja.',true);renderAll();return;}
  meta.rep=clamp(meta.rep-t.pen/2,0,5);run.tlost++;
  if(e){e.st.tfail++;logE(e,'Dejó a medias un aviso: '+t.s);note(e.real,'Se te pasó el tiempo: '+t.s,true);toast('🎮 '+e.name+' no ha terminado a tiempo: '+t.s,'bad');}
  sBad();renderAll();checkRep();
}
/* Lo que ven los demás: cada segundo mientras el juego del jefe está abierto (si no, se congela). */
function pubState(force){
  if(!isHost()||!fb)return;
  const now=performance.now();
  if(!force&&now-room.lastPub<1000)return;
  room.lastPub=now;
  const tasks=run&&!run.over?run.tasks.map(t=>{

      who:t.who==='me'?'jefe':e?(e.real||e.name):'',bk:t.k==='truck'?Object.keys(meta.back).filter(id=>meta.back[id]>0).map(Number).slice(0,12):[],
      dept:t.dept||'',mis:!!t.mis,refund:t.refund||0};
  }):[];
  const phase=!run?'lobby':run.over?(run.dead?'dead':meet?'meeting':'shop'):run.closing?'closing':'open';
  fb.set(rRef('state'),plain({day:meta.day,t:run?Math.round(run.t):0,dur:run?run.dur:(room.info.dur||100),money:Math.round(meta.money),rep:Math.round(meta.rep*10)/10,
    q:run?run.queue.length:0,dep:depData(),cnt:Object.fromEntries(Object.keys(ROLES).map(r=>[r,staffOf(r).length])),phase,away:!!(run&&run.away),tasks,rpt:run&&run.over&&room.rpt||null,ts:fb.serverTimestamp()})).catch(()=>{});
  if(force||now-room.lastHb>10000){room.lastHb=now;fb.update(rRef('info'),{hb:fb.serverTimestamp(),day:meta.day,status:run&&!run.over?'open':run?'closed':'lobby'}).catch(()=>{});}
}

/* Informe del cierre repartido por departamento: cada empleado real ve el suyo (el jefe lo ve todo en el cierre). */

    rrhh:[['Plantilla',meta.emp.length+' personas'],['Nómina del turno',fmt(lastEnd.payroll)],['Solicitudes pendientes',appsList().length]]};
}

/* Lo que ve cada empleado real de su departamento (lo publica el jefe en state.dep). */
function depData(){
  const live=run&&!run.over;
  return {low:CAT.slice().sort((x,y)=>((meta.stock[x.id]||0)+(meta.back[x.id]||0))-((meta.stock[y.id]||0)+(meta.back[y.id]||0))).slice(0,8).map(x=>[x.e+' '+x.n,meta.stock[x.id]||0,meta.back[x.id]||0]),
    pend:Object.values(meta.back).reduce((t,v)=>t+(v||0),0),out:CAT.filter(x=>(meta.stock[x.id]||0)<=0).length,

function perf(e,match,lang){

/* Al empezar el turno: quién viene, quién llega tarde, quién falta y qué incidentes tendrá. */
function prepShift(){
  const notes=[];
  meta.emp.slice().forEach(e=>{
    if(e.real){const m=room&&room.members[e.real],on=!!(m&&m.on);run.duty[e.id]={st:on?'ok':'gone',at:0,busy:0,task:null,slack:null,slackT:0,seen:0,cnt:on?1:0};if(on)e.st.shifts++;return;}
    if(e.moral<15&&Math.random()<0.4){meta.emp=meta.emp.filter(x=>x!==e);notes.push(e.name+' ha dejado el trabajo');return;}
    const d={st:'ok',at:0,busy:0,task:null,slack:null,slackT:0,seen:0};
    if(e.off===meta.day)d.st='off';
    else if(Math.random()<(e.moral<30?0.3:0.03)*(1.3-e.punt)){d.st='abs';e.st.abs++;notes.push(e.name+' no viene hoy');logE(e,'Faltó sin avisar');}
    else if(Math.random()<0.4*(1-e.punt)){d.st='late';d.at=rnd(8,30);e.st.late++;logE(e,'Llegó tarde');}
    if(d.st==='ok'||d.st==='late'){
      e.st.shifts++;
      if(Math.random()<0.3*(1-e.trato)*(e.moral<50?1.6:1))run.ev.push({t:rnd(20,90),e:e.id,k:'quej'});
      else if(Math.random()<0.25*e.trato)run.ev.push({t:rnd(20,90),e:e.id,k:'fel'});
    }
    run.duty[e.id]=d;
  });
  const wk=meta.emp.filter(working);
  if(wk.some(e=>e.role==='rrhh'))wk.forEach(o=>{o.moral=clamp(o.moral+2,0,100);});
  wk.forEach(e=>{if(e.pers==='bromista'||e.pers==='quejica')wk.forEach(o=>{if(o!==e)o.moral=clamp(o.moral+(e.pers==='bromista'?2:-2),0,100);});});
  run.nextTalk=rnd(10,20);
  return notes;
}

function assignTask(tid,who){
  if(!run||run.over)return;
  const t=run.tasks.find(x=>x.id===tid);if(!t||t.who)return;
  if(who==='me'){
    if(run.away&&run.away.auto){if(mg)return;t.who='me';t.until=Infinity;t.span=1;startMG(t);renderAll();return;}
    if(run.away)return;
    askLeave(()=>{
      if(!run.tasks.includes(t)||t.who){toast('Llegas tarde: eso ya no hace falta.','bad');returnTill();return;}
      t.who='me';t.until=Infinity;t.span=1;startMG(t);
    },'Te vas: '+t.ic+' '+t.s);
    return;
  }
  const e=empById(+who);if(!e||!inStore(e))return;
  if(!isFree(e))pullOff(e);
  if(e.real){giveReal(t,e,true);sOk();renderAll();pubState(true);return;}
  t.match=t.roles.includes(e.role);
  run.duty[e.id].slack=null;
  t.who=e.id;t.span=t.dur*(1.35-0.6*e.rap)*(t.match||e.pers==='servicial'?1:1.4)*(t.lang&&e.langs.includes(t.lang)?0.8:1);t.until=run.t+t.span;
  run.duty[e.id].busy=1;run.duty[e.id].task=t.id;

/* Necesidad del servicio: el jefe saca a alguien de lo que esté haciendo. Su aviso vuelve a la lista
   y, si estaba en la Caja 3, la caja se queda sin nadie hasta que otro cajero quede libre. */
function pullOff(e){
  const d=run.duty[e.id];if(!d)return;
  if(run.away&&run.away.cover===e.id){run.away.cover=null;run.away.mult=1.6;toast(e.name+' deja la Caja 3 por necesidad del servicio.','bad');}
  else{const t2=run.tasks.find(x=>x.id===d.task);if(t2){t2.who=null;t2.real=0;t2.dl=run.t+TLIFE;toast(e.name+' deja «'+t2.s+'» a medias: vuelve a la lista.','bad');}}
  if(e.real)note(e.real,'📢 El jefe te cambia de tarea por necesidad del servicio.');
  d.busy=0;d.task=null;d.slack=null;
  e.moral=clamp(e.moral-2,0,100);
}
/* «Asignar todo»: cada aviso sin dueño va a la mejor persona libre (su puesto, su idioma, su rapidez;
   los jugadores reales, los últimos). Las reclamaciones en directo (tk) se quedan para quien las coja. */
function assignAll(){
  if(!run||run.over)return;
  let n=0;
  run.tasks.filter(t=>!t.who&&t.k!=='tk').forEach(t=>{
    const free=meta.emp.filter(isFree);if(!free.length)return;
    const sc=e=>(t.roles.includes(e.role)||e.pers==='servicial'?2:0)+(t.lang&&e.langs.includes(t.lang)?2:0)-(e.real?1.5:0)+e.rap*0.5-(run.duty[e.id].slack?0.3:0);
    const e=free.sort((a,b)=>sc(b)-sc(a))[0];
    assignTask(t.id,String(e.id));n++;
  });
  const left=run.tasks.filter(t=>!t.who&&t.k!=='tk').length;
  toast(n?'⚡ '+n+(n===1?' aviso asignado':' avisos asignados')+(left?'. Quedan '+left+' sin nadie libre.':'.'):'No hay nadie libre para los avisos pendientes.',n?'good':'bad');
}
function moveStock(id,max){const mv=Math.min(max,meta.back[id]||0);if(mv>0){meta.back[id]-=mv;meta.stock[id]=(meta.stock[id]||0)+mv;}return mv;}
function finishTask(t){
  run.tasks=run.tasks.filter(x=>x!==t);
  let ok=true,nm='Tú';
  if(t.who==='me'){run.away=null;if(t.lang&&t.lang!=='en'&&Math.random()<0.5)ok=false;}
  else{const e=empById(t.who);if(e){nm=e.name;const d=run.duty[e.id];if(d){d.busy=0;d.task=null;}ok=Math.random()<perf(e,t.match,t.lang);if(ok)e.st.tasks++;else e.st.tfail++;logE(e,(ok?'Resolvió':'Hizo mal')+' un aviso: '+t.s);}}
  if(!ok){meta.rep=clamp(meta.rep-t.pen/2,0,5);run.tlost++;
    const why=t.lang?'. No se han entendido':(t.match?'':'. No es su puesto');
    toast((t.who==='me'?'Te ha salido regular en el pasillo '+t.n:nm+' lo ha dejado a medias en el pasillo '+t.n)+why,'bad');sBad();renderAll();checkRep();return;}
  run.tdone++;let extra='';
  if(t.k==='repo'||t.k==='call'){const mv=moveStock(t.pid,8);extra=mv?' (+'+mv+' uds en estantería)':' (en el almacén no quedaba)';}
  else if(t.k==='truck'){let cap=20,tot=0;Object.keys(meta.back).forEach(id=>{if(cap>0){const mv=moveStock(id,cap);cap-=mv;tot+=mv;}});extra=' (+'+tot+' uds)';}
  else meta.rep=clamp(meta.rep+0.05,0,5);
  toast((t.who==='me'?'Hecho. Vuelves a la caja':nm+' ha terminado en el pasillo '+t.n)+extra,'good');
  renderAll();
}
function expireTask(t){
  run.tasks=run.tasks.filter(x=>x!==t);
  if(t.k==='tk'){renderAll();return;}run.tlost++;
  meta.rep=clamp(meta.rep-t.pen,0,5);
  if(t.k==='spill'&&Math.random()<0.3){addTicket('back','Un cliente se resbaló en el pasillo '+t.n,ri(1000,3000),3,false);toast('Nadie limpió el pasillo '+t.n+' y alguien se ha caído','bad');}
  else toast('Nadie atendió: '+t.ic+' pasillo '+t.n,'bad');
  sBad();renderAll();checkRep();
}
function tickStaff(dt){
  if(!run.closing){
    run.nextTask-=dt;
    if(run.nextTask<=0){if(run.tasks.filter(t=>!t.who&&t.k!=='tk').length<3)spawnTask();run.nextTask=rnd(14,24)*Math.max(0.6,1-meta.day*0.04);}
  }
  /* Escaqueos: quien está libre a veces se pone a otra cosa. Menos si tiene actitud o le has visto pasar. */
  meta.emp.forEach(e=>{
    const d=run.duty[e.id];if(!d||!inStore(e)||d.busy||e.real)return;
    if(d.slack){d.slackT=(d.slackT||0)+dt;if(Math.random()<dt*0.06)d.slack=null;}
    else if(Math.random()<dt*0.012*(1.3-e.act)*(e.moral<40?1.6:1)*(d.seen?0.5:1))d.slack=pick(SLACK);
  });
  /* Quien te cubre la caja atiende al cliente de delante. */
  if(run.away&&run.away.cover){
    const e=empById(run.away.cover),c=front();
    if(e&&c){
      if(!c.cv)c.cv={t:0,need:c.phase==='complaint'?4:2.5+c.items.length*(1.3-0.6*e.rap)*(e.role==='atc'||e.pers==='servicial'?1:1.4)};
      c.cv.t+=dt;
      if(c.cv.t>=c.cv.need){coverServe(c,e);if(run.over)return;}
    }
  }
  if(run.away&&run.away.auto&&!run.away.cover&&(run.cashT=(run.cashT||0)+dt)>1){run.cashT=0;const e=pickCashier();if(e){const d=run.duty[e.id];d.busy=1;d.task='caja';run.away.cover=e.id;run.away.mult=1;toast(e.face+' '+e.name+' se pone en la Caja 3.','good');renderAll();}}
  if(run.away&&!run.away.auto&&run.closing&&!run.queue.length&&!run.hintEnd){run.hintEnd=1;toast('Ya no queda nadie en la cola. Vuelve a caja para cerrar.');}
  if(mg&&mg.kind==='sup'){run.supT=(run.supT||0)+dt;if(run.supT>2){run.supT=0;renderSup();}}
  run.nextTalk-=dt;
  if(run.nextTalk<=0){
    run.nextTalk=rnd(14,26);
    const ws=meta.emp.filter(e=>inStore(e)&&!e.real);
    if(ws.length&&!(run.chat&&run.t<run.chat.until)){
      const e=pick(ws),N=NATS[e.nat]||NATS[0];
      const line=Math.random()<0.35?pick(N.tic):pick(TALK[e.pers]||['…']);
      run.chat={face:e.face,text:e.name+' '+N.f+': «'+line+'»',angry:false,until:run.t+3.6};renderChat();
    }
  }
  let dirty=false;
  meta.emp.forEach(e=>{const d=run.duty[e.id];if(d&&d.st==='late'&&!d.ann&&run.t>=d.at){d.ann=1;dirty=true;toast(e.face+' '+e.name+' llega tarde. «Perdón, el bus…»','bad');}});
  run.ev.forEach(v=>{
    if(v.done||run.t<v.t)return;v.done=1;
    const e=empById(v.e);if(!e||!inStore(e))return;
    logE(e,v.k==='quej'?'Un cliente se quejó de su trato':'Un cliente le felicitó');
    if(v.k==='quej'){e.st.quej++;meta.rep=clamp(meta.rep-0.2,0,5);addTicket('rrpp','Queja por el trato de '+e.name,0,2,false);toast('Un cliente se queja de cómo le ha hablado '+e.name,'bad');sBad();}
    else{e.st.fel++;e.moral=clamp(e.moral+5,0,100);meta.rep=clamp(meta.rep+0.1,0,5);toast('Un cliente felicita a '+e.name+' por su trato','good');}
    dirty=true;
  });
  run.tasks.slice().forEach(t=>{
    if(run.over)return;
    if(t.who&&run.t>=t.until)(t.real?realFail(t):finishTask(t));
    else if(!t.who&&run.t>=t.dl)expireTask(t);
  });
  if(dirty&&!run.over)renderAll();
  updateTaskBars();
}
function updateTaskBars(){
  if(!run)return;
  run.tasks.forEach(t=>{
    const el=document.querySelector('[data-tid="'+t.id+'"]');if(!el)return;
    const f=t.who?clamp(1-(t.until-run.t)/t.span,0,1):clamp((t.dl-run.t)/TLIFE,0,1);
    el.style.width=(f*100)+'%';el.style.background=t.who?'var(--ok)':'';
  });
}

/* ---------- salir de caja: qué le dices al cliente, o a quién dejas ---------- */
let mg=null,pendingLeave=null;
function openMG(html){const m=$('#mg');m.innerHTML=html;m.classList.add('show');}
function closeMG(){const m=$('#mg');if(m){m.classList.remove('show');m.innerHTML='';}}
function logE(e,txt){e.log=e.log||[];e.log.push('T'+meta.day+': '+txt);if(e.log.length>6)e.log.shift();}
const LEAVE={
 polite:{t:'🙏 «Perdone, un momentito, que ahora mismo vuelvo.»'},
 rude:{t:'😤 «Espérese un momento, joder, que ya vengo.»'},
 joke:{t:'😂 «Voy a por tabaco y no vuelvo… ¡es broma! Dos minutos.»'},
 silent:{t:'🤐 Irte sin decir nada'}
};
/* Cada cliente reacciona según su carácter. mult = lo rápido que se le agota la paciencia mientras no estás. */
function reactLeave(c,o){
  const pk=c.pk||'normal';
  if(c.complaint)return o==='rude'?{say:'¿Encima me hablas así? Ahora sí que pongo la reclamación.',rep:-0.3,mult:1.8}:{say:'¿Me dejas aquí plantado con mi reclamación?',rep:-0.05,mult:1.6};
  if(c.tour)return{say:pick(['What?? Where are you going?','Pardon ? Je ne comprends pas…','Was? Wohin gehen Sie?','Eh? Cosa succede?']),rep:0,mult:o==='silent'?2.2:1.5};
  if(o==='polite'){
    if(pk==='prisas')return{say:'¿¡Ahora!? ¿En serio? Increíble.',rep:-0.1,mult:2};
    if(pk==='borde')return{say:'Pues date prisa, que no tengo todo el día.',rep:0,mult:1.6};
    if(pk==='abuela'||pk==='majo')return{say:pick(['Ve, ve, que yo espero.','Claro, sin prisa, de verdad.']),rep:0.05,mult:1};
    return{say:'Vale…',rep:0,mult:1.4};
  }
  if(o==='rude'){
    if(pk==='majo')return{say:'¡Jajaja, qué carácter! Anda, ve.',rep:0,mult:1.1};
    if(pk==='abuela')return{say:'¡Qué boca! ¡En mis tiempos esto no pasaba!',rep:-0.3,mult:1.6};
    if(pk==='borde')return{say:'¿Perdona? ¿Así me hablas? Me voy.',rep:-0.3,mult:1,gone:true};
    if(pk==='influencer')return{say:'Esto lo está viendo todo el mundo en directo…',rep:-0.6,mult:1.4};
    if(pk==='prisas')return{say:'¿Joder? ¡Joder digo yo, que llego tarde!',rep:-0.2,mult:2};
    return{say:'Vaya modales…',rep:-0.15,mult:1.5};
  }
  if(o==='joke'){
    if(pk==='majo'||pk==='abuela'||(pk!=='borde'&&pk!=='prisas'&&Math.random()<0.5))return{say:'¡Jajaja! Anda, ve, ve.',rep:0.05,mult:1.1};
    return{say:'No tiene ninguna gracia.',rep:-0.1,mult:1.8};
  }
  return{say:'¿Hola? ¿Se ha ido? ¿En serio?',rep:-0.15,mult:2.2};
}
function askLeave(go,what){
  if(!run||run.over||run.away||mg)return;
  pendingLeave=go;
  const c=front();
  const cov=meta.emp.filter(e=>isFree(e)&&!e.real).sort((a,b)=>(b.role==='atc')-(a.role==='atc')).slice(0,3)
    .map(e=>`<button class="btn" data-act="leave" data-o="cover" data-e="${e.id}">👤 Dejar a ${e.face} ${e.name} en caja <small>${ROLES[e.role].s}${e.role==='atc'?'':' · no es cajero/a'}</small></button>`).join('');
  const ph=c?Object.keys(LEAVE).map(k=>`<button class="btn" data-act="leave" data-o="${k}">${LEAVE[k].t}</button>`).join('')
    :'<button class="btn" data-act="leave" data-o="silent">🚶 No hay nadie en caja: me voy</button>';
  openMG(`<div class="card mgc"><h3>${what}</h3>
    <div class="supd">${c?`Tienes a ${c.face} ${c.lab?'<b>'+c.lab+'</b>':'un cliente'} en caja. ¿Qué le dices antes de irte?`:'Tu caja está vacía.'}</div>
    <div class="opts">${ph}</div>
    ${cov?'<div class="zone-title">O DEJA A ALGUIEN EN TU CAJA</div><div class="opts">'+cov+'</div>':''}
    <button class="btn" data-act="leavecancel">Mejor me quedo</button></div>`);
}
function doLeave(o,eid){
  const c=front(),go=pendingLeave;pendingLeave=null;closeMG();
  if(!go||!run||run.away)return;
  run.away={mult:2.2,cover:null,served:0};
  if(o==='cover'){
    const e=empById(+eid);if(!e||!isFree(e)){run.away=null;renderAll();return;}
    const d=run.duty[e.id];d.busy=1;d.task='caja';d.slack=null;run.away.cover=e.id;
    run.chat={face:e.face,text:e.name+': «Ve tranquilo/a, que ya cobro yo.»',angry:false,until:run.t+3.6};
  }else if(c){
    const r=reactLeave(c,o);run.away.mult=r.mult;
    if(r.rep)meta.rep=clamp(meta.rep+r.rep,0,5);
    run.chat={face:c.face,text:r.say,angry:r.rep<0,until:run.t+4};
    if(r.gone){c.items.forEach(ret);regVisit(c,false);run.queue.shift();frontChanged();run.angry++;toast('Se ha ido ofendido. Normal.','bad');}
  }
  renderAll();renderChat();checkRep();
  if(run&&!run.over)go();
}
function returnTill(){
  if(!run||!run.away)return;
  const cv=run.away.cover&&empById(run.away.cover);
  if(cv){
    const d=run.duty[cv.id];if(d){d.busy=0;d.task=null;}
    if(run.away.served)logE(cv,'Te cubrió la caja ('+run.away.served+(run.away.served===1?' cliente)':' clientes)'));
    toast(cv.name+' te devuelve la caja'+(run.away.served?': '+run.away.served+(run.away.served===1?' cliente atendido':' clientes atendidos'):'')+'.','good');
  }
  run.away=null;mg=null;closeMG();renderAll();
}
/* Quien te cubre atiende solo al cliente de delante, más lento y con fallos según su rendimiento. */
function coverServe(c,e){
  const p=perf(e,e.role==='atc');
  run.away.served++;e.st.cv++;
  if(c.phase==='complaint'){
    const ok=Math.random()<p,dep=ok?c.complaint.dept:pick(['back','rrpp','alm']);
    if(dep!=='atc')addTicket(dep,c.complaint.t,c.complaint.refund,c.complaint.sev,dep!==c.complaint.dept);
    if(!ok)e.st.cvErr++;
    run.served++;removeFront();renderAll();return;
  }
  c.items.forEach(i=>{
    if(i.scanned||i.denied)return;
    if(i.age&&c.minor&&Math.random()<p){i.denied=true;ret(i);return;}
    i.scanned=true;
    if(i.age&&c.minor){c.err++;run.fines+=5000;meta.money-=5000;meta.rep=clamp(meta.rep-1,0,5);toast(e.name+' ha vendido alcohol a un menor. Multa: 50 €','bad');}
  });
  c.bag=Math.random()<p?c.wantsBag:!c.wantsBag;
  if(c.pay==='cash'&&Math.random()<(1-p)*0.6){const loss=ri(50,500);run.fines+=loss;meta.money-=loss;c.err++;toast(e.name+' se ha equivocado con el cambio: −'+fmt(loss),'bad');}
  if(c.err||c.bag!==c.wantsBag)e.st.cvErr++;
  finish(c,false);
}

/* Efectos de un minijuego terminado (lo hagas tú o un empleado real desde su navegador). */
function applyMG(t,sc,early,e){
  const kind=MGK[t.k]||'truck';
  let msg='',good=sc>=0.6;
  if(kind==='shelf'){const mv=moveStock(t.pid,Math.round(8*sc));msg=mv?'Lineal repuesto: +'+mv+' uds en estantería.':'Has colocado lo que había, pero en el almacén no quedaba más.';}
  else if(kind==='mop'){
    if(early&&Math.random()<0.4){addTicket('back','Un cliente se resbaló en el pasillo '+t.n+' (no había cartel)',ri(1000,3000),3,false);meta.rep=clamp(meta.rep-0.3,0,5);msg='Sin cartel, alguien se ha resbalado mientras fregabas. Reclamación en camino.';good=false;}
    else{meta.rep=clamp(meta.rep+0.05,0,5);msg='Pasillo '+t.n+' limpio y seco.';}
  }else if(kind==='ask'){
    meta.rep=clamp(meta.rep+(sc>=1?0.1:sc>=0.5?0:-0.15),0,5);
    msg=sc>=1?'«¡Muchas gracias!» Cliente feliz.':sc>=0.5?'Al final lo encontró. A la segunda.':'Se ha ido sin encontrarlo.';
  }else if(kind==='tk'){
    const tk=run.tickets.find(x=>x.id===t.tkid),d=t.dept;
    if(!tk)msg='Esa reclamación ya estaba resuelta.';
    else{
      run.tickets=run.tickets.filter(x=>x!==tk);
      run.liveTk=run.liveTk||{};const LV=run.liveTk[d]=run.liveTk[d]||{ok:0,fail:0,cost:0},m0=meta.money;
      if(good){const cost=tk.mis?0:d==='back'?tk.refund:d==='rrpp'?500:0;meta.money-=cost;meta.rep=clamp(meta.rep+0.1,0,5);if(e)e.st.ok++;
        msg=tk.mis?'Bien visto: no era de su departamento y la ha devuelto.':'Reclamación resuelta'+(cost?' ('+fmt(cost)+')':'')+'.';}
      else{const cost=d==='back'&&!tk.mis?tk.refund*2:0;meta.money-=cost;meta.rep=clamp(meta.rep-(d==='rrpp'?0.5:0.3),0,5);if(e)e.st.fail++;msg='La reclamación ha salido mal'+(cost?': −'+fmt(cost):'')+'.';}
      LV[good?'ok':'fail']++;LV.cost+=m0-meta.money;
    }
  }else{
    let cap=Math.round(20*sc),tot=0;
    Object.keys(meta.back).forEach(id=>{if(cap>0){const mv=moveStock(id,cap);cap-=mv;tot+=mv;}});
    msg='Camión descargado: '+Math.round(sc*100)+'% bien colocado'+(tot?', +'+tot+' uds a estantería.':'.');
    if(sc<0.6)meta.rep=clamp(meta.rep-0.1,0,5);
  }
  return {msg,good};
}

function genReqs(){

/* ---------- despidos: motivo, pruebas, finiquito e indemnización ----------
   Finiquito: vacaciones no disfrutadas (sueldo × turnos / 30). Indemnización: procedente 1 €/turno (mín. 5 €);
   improcedente 20 € + 3 €/turno. Si el motivo no se sostiene con lo registrado (st + historial), 70% de denuncia;
   si se sostiene pero nunca le diste un toque, 15%. Perder la denuncia = pagar la improcedente + 30–80 € y −0,3 rep. */
const hist=e=>sumSt(e.tot,e.st);
const FIRE={
 trial:{t:'🧪 No supera el periodo de prueba',ok:e=>e.trial>0,ev:e=>'en prueba, le quedan '+e.trial+' turnos'},
 abs:{t:'📅 Faltas sin avisar',ok:(e,h)=>h.abs>=1,ev:(e,h)=>h.abs+(h.abs===1?' falta registrada':' faltas registradas')},
 late:{t:'⏰ Retrasos repetidos',ok:(e,h)=>h.late>=2,ev:(e,h)=>h.late+(h.late===1?' retraso registrado':' retrasos registrados')},
 caught:{t:'📱 Pillado/a sin trabajar',ok:(e,h)=>h.caught>=1,ev:(e,h)=>h.caught+(h.caught===1?' vez pillado/a':' veces pillado/a')},
 quej:{t:'😡 Quejas de clientes por su trato',ok:(e,h)=>h.quej>=1,ev:(e,h)=>h.quej+(h.quej===1?' queja registrada':' quejas registradas')},
 perf:{t:'📉 Bajo rendimiento',ok:(e,h)=>h.fail+h.tfail+h.cvErr>=2&&score(e)<0.5,ev:(e,h)=>(h.fail+h.tfail+h.cvErr)+' fallos registrados · valoración: '+verdict(e).replace(/^\S+ /,'')},

};
const finiquito=e=>Math.round(e.wage*e.days/30);
const indProc=e=>Math.max(500,100*e.days),indImp=e=>2000+300*e.days;
function fireEmp(id,r){
  const e=empById(id),F=FIRE[r];if(!meet||!e||!F||meet.acted[id])return;
  if(r==='trial'&&!(e.trial>0))return;
  const h=hist(e),fin=finiquito(e),bad=score(e)<0.45;
  const just=r==='trial'||(r!=='none'&&F.ok(e,h));
  let ind=r==='trial'?0:r==='none'?indImp(e):indProc(e),cost=fin+ind,extra=0;
  const L=['<b>Carta de despido de '+e.face+' '+e.name+'.</b> Motivo: '+F.t.replace(/^\S+ /,'')+(F.ev(e,h)?' ('+F.ev(e,h)+')':'')+'.',
    'Finiquito por vacaciones no disfrutadas ('+e.days+(e.days===1?' turno':' turnos')+'): '+fmt(fin)+'.',
    (r==='trial'?'Sin indemnización: estaba en periodo de prueba.':r==='none'?'Indemnización por despido improcedente: '+fmt(ind)+'.':just?'Indemnización por despido procedente: '+fmt(ind)+'.':'Le pagas la indemnización de un despido procedente ('+fmt(ind)+'), aunque no tienes pruebas.')];
  const risk=r==='trial'||r==='none'?0:just?(e.warn>0?0:0.15):0.7;
  if(Math.random()<risk){
    extra=Math.max(0,indImp(e)-ind)+ri(3000,8000);cost+=extra;meta.rep=clamp(meta.rep-0.3,0,5);
    L.push(just?'⚖️ Te denuncia: nunca le diste un toque antes de despedirle. El juez lo declara improcedente: −'+fmt(extra)+' y −0,3 de reputación.'
      :'⚖️ Te denuncia: el motivo no se sostiene con lo que hay registrado. Despido improcedente: −'+fmt(extra)+' y −0,3 de reputación.');
  }else if(!just&&r!=='none')L.push('😅 El motivo no se sostenía, pero no te ha denunciado. Esta vez.');
  L.push('Total pagado: <b>'+fmt(cost)+'</b>.');
  meta.money-=cost;meta.emp=meta.emp.filter(x=>x!==e);meet.firing=null;
  meta.emp.forEach(x=>{x.moral=clamp(x.moral+(bad?3:-8),0,100);});
  L.push(bad?'El resto respira aliviado.':'El resto se ha quedado tenso.');
  if(e.real&&isHost()){note(e.real,'Estás despedido/a. Motivo: '+F.t.replace(/^\S+ /,'')+'. Liquidación: '+fmt(fin+ind)+(extra?' (más lo que le ha sacado tu denuncia al jefe: '+fmt(extra)+')':'')+'.',true);fb.update(rRef('members/'+e.real),{role:null}).catch(()=>{});}
  meet.gone.push(L.join('<br>'));scrTab.meet='gone';pg=0;
  sBad();renderHud();showMeeting();

    return `<div class="emp"><div>${txt}</div>${act}</div>`;

/* ---------- acciones ---------- */
function scanItem(id){
  const c=front();if(!c||c.phase!=='scan')return;
  if(run.pendingId){toast('Primero resuelve el DNI','bad');return;}
  const it=c.items.find(i=>i.id===id);
  if(!it||it.scanned||it.denied)return;
  it.done++;sBeep();run.flash=id;
  if(it.done<it.hits){renderBelt();run.flash=0;return;}
  if(it.age){run.pendingId=id;renderAll();run.flash=0;return;}
  it.scanned=true;
  renderAll();run.flash=0;
}
function idDecision(sell){
  const c=front();if(!c||!run.pendingId)return;
  const it=c.items.find(i=>i.id===run.pendingId);
  run.pendingId=null;
  if(sell){
    it.scanned=true;
    if(c.minor){run.fines+=5000;meta.money-=5000;meta.rep=clamp(meta.rep-1,0,5);run.errors++;c.err++;toast('Vendiste alcohol a un menor. Multa: 50 €','bad');sBad();}
    else sOk();
  }else{
    it.denied=true;ret(it);
    if(c.minor){meta.rep=clamp(meta.rep+0.1,0,5);toast('Bien visto. Era menor.','good');sOk();}
    else{meta.rep=clamp(meta.rep-0.4,0,5);c.p=Math.max(0,c.p-c.max*0.3);run.errors++;c.err++;toast('Era mayor de edad. Cliente molesto.','bad');sBad();}
  }
  renderAll();checkRep();
}
function toggleBag(){const c=front();if(!c||c.phase==='done')return;c.bag=!c.bag;sCoin();renderAll();}
function goPay(){
  const c=front();if(!c||c.phase!=='scan'||run.pendingId)return;
  if(c.items.some(i=>!i.scanned&&!i.denied)){toast('Quedan productos sin escanear','bad');return;}
  const t=totalOf(c);
  if(t===0){finish(c,true);return;}
  c.phase='pay';
  if(c.pay==='cash'){
    const P=PERS[c.pk]||{};
    if(P.exact&&Math.random()<P.exact){c.given=t;toast('Te paga con los céntimos justos 🪙. No hay cambio: pulsa «Dar cambio».');}
    else c.given=cashGiven(t);
  }
  renderAll();
}
function payCard(){
  const c=front();if(!c||c.phase!=='pay'||c.pay!=='card'||run.card)return;
  run.card=true;sBeep();renderRegister();
  const mine=c.id;
  setTimeout(()=>{
    if(!run||run.over||!front()||front().id!==mine)return;
    if(!c.declined&&Math.random()<((PERS[c.pk]||{}).decl||0.08)){
      c.declined=true;c.pay='cash';c.given=cashGiven(totalOf(c));run.card=false;
      toast('Tarjeta rechazada. Pagará en efectivo.','bad');sBad();renderAll();
    }else{sOk();finish(c,false);}
  },1200);
}
function addTray(v){const c=front();if(!c||c.phase!=='pay'||c.pay!=='cash')return;run.tray.push(v);sCoin();renderRegister();}
function clearTray(){run.tray=[];renderRegister();}
function deliver(){
  const c=front();if(!c||c.phase!=='pay'||c.pay!=='cash')return;
  const need=c.given-totalOf(c),got=traySum();
  if(got<need){toast('Falta cambio','bad');sBad();c.p=Math.max(0,c.p-2);return;}
  if(got>need){
    const loss=got-need;run.fines+=loss;meta.money-=loss;run.errors++;c.err++;
    toast('Te pasaste de cambio: −'+fmt(loss),'bad');sBad();
  }else sOk();
  finish(c,false);
}
function finish(c,noTip){
  const tot=totalOf(c);if(tot>0){meta.money+=tot;run.sales+=tot;}
  if(c.bag!==c.wantsBag){
    c.err++;run.errors++;meta.rep=clamp(meta.rep-0.3,0,5);
    toast(c.bag?'No pidió bolsa y se la cobraste':'Pidió bolsa y no se la diste','bad');sBad();
  }
  const frac=c.p/c.max,P=PERS[c.pk]||{},rm=c.reg&&meta.regs[c.reg];
  if(!noTip&&c.err===0){
    let tip=Math.round(frac*250*(meta.up.coffee?1.5:1)*(P.tip!=null?P.tip:1)*(rm&&rm.good>=3?1.3:1)/5)*5;
    if(tip>0){run.tips+=tip;meta.money+=tip;toast('Propina: '+fmt(tip),'good');}
    if(frac>0.5)meta.rep=clamp(meta.rep+0.08,0,5);
  }
  if(P.influ){
    if(c.err===0){meta.rep=clamp(meta.rep+0.3,0,5);toast('Te ha sacado en su directo. +reputación 📈','good');}
    else{meta.rep=clamp(meta.rep-0.5,0,5);toast('Tu error ya circula por las redes 📉','bad');}
  }
  if(Math.random()<0.5)addReview(c.err>1?2:c.err?3:frac>0.5?5:4,c.face);
  regVisit(c,c.err===0&&frac>0.3);
  if(c.err>0&&Math.random()<0.4)addTicket('back','Error en su compra',ri(100,600),2,false);
  run.served++;
  removeFront();
  renderAll();checkRep();
}

function renderQueue(){
  const q=$('#queue');let h='';
  const arr=run?run.queue:[];
  arr.forEach((c,i)=>{h+=`<div class="cust ${i===0?'front':''}"><div class="face">${c.face}</div><div class="pbar"><i data-pid="${c.id}"></i></div></div>`;});

function updatePatience(){
  if(!run)return;
  run.queue.forEach(c=>{
    const el=document.querySelector('[data-pid="'+c.id+'"]');if(!el)return;
    const f=clamp(c.p/c.max,0,1);
    el.style.width=(f*100)+'%';
    el.className=f>0.5?'':f>0.25?'mid':'low';
  });
}

const CAMS=[['CAM 1 · SALA',0,0,262,170],['CAM 2 · CAJAS',0,166,262,94],['CAM 3 · ALMACÉN',262,0,138,156],['CAM 4 · OFICINAS',262,152,138,108]];

function toggleCams(){cam.on=!cam.on;const w=$('#camwin');if(w)w.classList.toggle('show',cam.on);try{localStorage.setItem(CAM_KEY,cam.on?'1':'0');}catch(e){}}
const taskSpot=t=>t.k==='truck'?{k:'dock'}:t.k==='tk'?{k:'post',r:t.dept||'back',i:0}:{k:'aisle',n:t.n||1};
function camModel(){
  if(!run||run.over)return null;
  const idx={},staff=[];
  meta.emp.forEach(e=>{
    const i=idx[e.role]=(idx[e.role]||0)+1,d=run.duty&&run.duty[e.id];
    if(!d||d.st==='abs'||d.st==='off'||d.st==='gone'||run.t<d.at)return;
    let w={k:'post',r:e.role,i:i-1},b='',x='en su puesto';

function camPos(w,j){

function camStep(m,dt){
  const T=camTargets(m),S=cam.spr,sp=70*dt;
  Object.keys(T).forEach(id=>{
    let s=S[id];
    if(!s){const st=id[0]==='c'?aislePt():SPOT.door;s=S[id]={x:st[0],y:st[1]};}
    Object.assign(s,T[id],{tx:T[id].x,ty:T[id].y,x:s.x,y:s.y,gone:0});
  });
  Object.keys(S).forEach(id=>{const s=S[id];if(!T[id]&&!s.gone){s.gone=1;s.tx=SPOT.door[0];s.ty=SPOT.door[1]+12;s.hl=false;}});
  Object.keys(S).forEach(id=>{
    const s=S[id],dx=s.tx-s.x,dy=s.ty-s.y,dd=Math.hypot(dx,dy);
    s.mv=dd>1;
    if(dd<=sp){s.x=s.tx;s.y=s.ty;if(s.gone)delete S[id];}else{s.x+=dx/dd*sp;s.y+=dy/dd*sp;}
  });
  /* Gente comprando por los pasillos (decorado: más cuanto más avanzan los días). */
  const want=m&&m.open?clamp(2+(m.d||1),3,8):0;
  while(cam.shop.length<want){const p=SPOT.door;cam.shop.push({x:p[0],y:p[1],tx:p[0],ty:p[1],f:pick(FACES),w:0});}
  cam.shop.forEach((s,i)=>{
    if(i>=want&&!s.gone){s.gone=1;s.tx=SPOT.door[0];s.ty=SPOT.door[1]+12;}
    const dx=s.tx-s.x,dy=s.ty-s.y,dd=Math.hypot(dx,dy),v=sp*0.7;
    s.mv=dd>1;
    if(dd<=v){s.x=s.tx;s.y=s.ty;if(s.gone)s.dead=1;else if((s.w-=dt)<=0){const p=aislePt();s.tx=p[0];s.ty=p[1];s.w=rnd(1,4);}}
    else{s.x+=dx/dd*v;s.y+=dy/dd*v;}
  });
  cam.shop=cam.shop.filter(s=>!s.dead);
}

function drawCams(){

  if(!slot||!slot.offsetParent||cam.noctx)return;
  if(!cam.cv){

    cam.ctx=cam.cv.getContext&&cam.cv.getContext('2d');if(!cam.ctx){cam.noctx=true;return;}

  }

  const dpr=window.devicePixelRatio||1,W=slot.clientWidth||300,H=Math.round(W*(cam.zoom<0?0.62:0.68));
  if(cam.cv.width!==Math.round(W*dpr)||cam.cv.height!==Math.round(H*dpr)){cam.cv.width=Math.round(W*dpr);cam.cv.height=Math.round(H*dpr);cam.cv.style.height=H+'px';}
  const now=performance.now(),dt=Math.min(0.1,(now-cam.last)/1000||0);cam.last=now;

    c.save();c.beginPath();c.rect(gx+2,gy+2,gw-4,gh-4);c.clip();
    c.fillStyle='#0e1512';c.fillRect(gx,gy,gw,gh);

    c.fillStyle='#d8ffe6';c.fillText(lab,gx+7,gy+6);

    c.textAlign='right';c.textBaseline='bottom';c.fillStyle='#d8ffe6';c.fillText(m?'T'+m.d+' '+clockOf(m.t,m.dur):'--:--',gx+gw-7,gy+gh-5);

    c.restore();

  });
}
function camClick(ev){
  const r=cam.cv.getBoundingClientRect(),x=ev.clientX-r.left,y=ev.clientY-r.top;
  const h=cam.hits.find(z=>x>=z.gx&&x<=z.gx+z.gw&&y>=z.gy&&y<=z.gy+z.gh);if(!h)return;
  if(cam.zoom<0){cam.zoom=h.ci;return;}
  const wx=(x-h.ox)/h.sc+h.cx,wy=(y-h.oy)/h.sc+h.cy;
  let best=null,bd=12;
  Object.values(cam.spr).forEach(s=>{const d=Math.hypot(s.x-wx,s.y-wy);if(d<bd&&s.info){bd=d;best=s;}});

}

  const rr=staffOf('rrhh'),realRR=rr.find(e=>e.real&&run&&run.duty&&working(e));
  const rows=meta.emp.map(e=>`<div class="up"><div class="t"><b>${e.face} ${e.real?'🎮':flag(e)} ${e.name} · ${ROLES[e.role].n}</b>${e.days} ${e.days===1?'turno':'turnos'} · ${fmt(e.wage)}/día${e.trial?' · en prueba ('+e.trial+')':''}${e.warn?' · ⚠️×'+e.warn:''}</div><span class="mood">${mood(e)}</span></div>`).join('')||'<div class="supd">Plantilla vacía.</div>';
  const cnt=Object.keys(ROLES).map(k=>`<span>${JOB_IC[k]} ${ROLES[k].n}</span><b>${staffOf(k).length}/${ROLES[k].max}</b>`).join('');
  return `<div class="dgrid"><div class="dpanel"><h2>🗂️ Recursos Humanos</h2>${staffBlock('rrhh')}
    ${isHost()?(appsHtml()||'<div class="zone-title">📝 SOLICITUDES DE EMPLEO</div><div class="supd">No hay solicitudes pendientes.</div>')+(realRR?`<div class="supd">${realRR.name} (RR.HH.) también puede tramitarlas desde su pantalla.</div>`:''):'<div class="supd">En solitario no llegan solicitudes de personas reales: contratas en la reunión de personal.</div>'}
    <div class="zone-title">PLAZAS</div><div class="sum">${cnt}</div>
    <div class="supd">Próxima reunión de personal (valorar, aumentos, contratar y despedir): al cerrar el turno ${meta.day%3===1&&!(run&&!run.over)?meta.day:nm}.</div></div>
    <div class="dpanel"><div class="zone-title">PLANTILLA Y CONTRATOS</div><div class="shop">${rows}</div></div></div>`;
}
function dirHtml(){
  const r=run||{},live=run&&!run.over;
  const card=(k,ic,n,txt)=>`<button class="dcard" data-act="tab" data-k="${k}"><b>${ic} ${n}</b><span>${txt}</span></button>`;
  const present=role=>staffOf(role).filter(e=>live&&inStore(e)).length+'/'+staffOf(role).length+' trabajando';
  const cv=live&&run.away&&run.away.cover&&empById(run.away.cover);
  return `<div class="dgrid"><div class="dpanel"><h2>👑 Dirección</h2>
    <div class="sum"><span>Turno</span><b>${meta.day}</b><span>Bote</span><b>${fmt(meta.money)}</b><span>Reputación</span><b>★ ${meta.rep.toFixed(1)}</b><span>Clientes atendidos</span><b>${r.served||0}</b><span>Se fueron enfadados</span><b>${r.angry||0}</b><span>Ventas</span><b>${fmt(r.sales||0)}</b></div>
    <div class="dcards">
      ${card('caja','🧾','Caja',live?(cv?cv.face+' '+cv.name+' en la Caja 3':run.away?'Caja 3 sin nadie':'Tú en la Caja 3')+' · cola '+run.queue.length:'Cerrada')}
      ${card('alm','📦','Almacén',present('alm')+' · '+tabBadge('alm')+' agotados')}
      ${card('back','💼','Backoffice',present('back')+' · '+(live?run.tickets.filter(t=>t.dept==='back').length:0)+' en bandeja')}
      ${card('rrpp','📣','RR.PP.',present('rrpp')+' · '+tabBadge('rrpp')+' pendientes')}
      ${card('rrhh','🗂️','RR.HH.',present('rrhh')+' · '+(isHost()?appsList().length:0)+' solicitudes')}
    </div></div>
    <div class="dpanel"><div class="zone-title">📹 CÁMARAS · TOCA UNA PARA AMPLIARLA</div><div id="dircams" class="camslot"></div>
    <div class="zone-title">MEJORAS DE LA TIENDA</div><div class="shop">${upsHtml()}</div></div></div>`;
}
function renderDept(force){
  const el=$('#dept');renderTabs();if(!el||tab==='caja'||el.hidden)return;
  const h=tab==='alm'?almHtml():tab==='back'?backHtml():tab==='rrpp'?rrppHtml():tab==='rrhh'?rrhhHtml():dirHtml();
  if(!force&&h===el._h)return;
  const ol=el.querySelector('.ordlist.tall'),o2=el.querySelectorAll('.ordlist')[1],s1=ol?ol.scrollTop:0,s2=o2?o2.scrollTop:0;
  el._h=h;el.innerHTML=h;
  const n1=el.querySelector('.ordlist.tall'),n2=el.querySelectorAll('.ordlist')[1];if(n1)n1.scrollTop=s1;if(n2)n2.scrollTop=s2;
}
/* Pedidos y mejoras se manejan igual desde el cierre que desde las pestañas. */
function refreshView(){if($('#overlay').classList.contains('show')&&$('#overlay [data-act=next],#overlay [data-act=meeting]'))showShop();else renderDept(true);}
addEventListener('resize',()=>{ordPer=0;if($('#overlay').classList.contains('show'))rerenderScreen();});
/* El jefe resuelve una reclamación de la bandeja con el mismo minijuego que los empleados reales. */
function deskTicket(id){
  const tk=run&&!run.over&&run.tickets.find(x=>x.id===id);if(!tk||mg)return;
  startMG({id:'d'+id,k:'tk',ic:'📨',dept:tk.dept,mis:!!tk.mis,refund:tk.refund||0,txt:tk.t,s:'Reclamación: '+tk.t,tkid:tk.id,n:0,pid:0,desk:1});
}
function deskRepo(pid){
  if(!run||run.over)return;
  if(run.tasks.some(t=>t.pid===pid&&(t.k==='repo'||t.k==='call'))){toast('Ya hay un aviso para reponer eso.');return;}
  const p=CAT.find(x=>x.id===pid);if(!p)return;
  const n=aisleOf(pid);
  run.tasks.push({id:++uid,k:'repo',ic:'📦',roles:['alm','atc'],dur:10,pen:0.1,pid,n,lang:null,s:TSHORT.repo.replace('%p%',p.n).replace('%n%',n),txt:'Orden de Dirección: reponer «'+p.n+'» en el pasillo '+n+'.',dl:run.t+TLIFE,who:null,until:0,span:1,match:true});
  toast('📦 Aviso creado: reponer '+p.n+'. Asígnalo arriba.','good');renderAll();
}
function answerReview(id){const r=run&&run.reviews&&run.reviews.find(x=>x.id===id);if(!r||r.ans)return;r.ans=1;meta.rep=clamp(meta.rep+0.04,0,5);sOk();toast('Reseña respondida con mucho tacto.','good');renderAll();}

/* ---------- bucle ---------- */
function tick(ts){
  const dt=Math.min(0.1,(ts-last)/1000||0);last=ts;
  if(run&&!run.over){
    run.t+=dt;
    if(!run.closing&&run.t>=run.dur){run.closing=true;renderQueue();}
    if(!run.closing){
      run.next-=dt;
      if(run.next<=0){
        if(run.queue.length<5){
          const nc=newCustomer();
          if(nc.cut&&run.queue.length>=2){
            run.queue.splice(1,0,nc);
            run.queue.slice(2).forEach(q=>{q.p=Math.max(1,q.p-q.max*0.12);});
            toast('Alguien se ha colado. La cola murmura…','bad');
          }else run.queue.push(nc);
          const ia=Math.max(5.5,10.5-meta.day*0.7);
          run.next=rnd(ia*0.7,ia*1.3);
          renderAll();
        }else run.next=2;
      }
    }
    const helpers=staffOf('atc').filter(e=>isFree(e)&&!run.duty[e.id].slack).length;
    const am=run.away&&!run.away.cover?run.away.mult:0;
    const rate=(meta.up.fan?0.8:1)*(1-0.08*helpers);
    for(let i=run.queue.length-1;i>=0;i--){
      const c=run.queue[i];
      c.p-=dt*rate*(i===0?(am||1):(am?1:0.55));
      c.talk-=dt;
      if(c.talk<=0){c.talk=rnd(7,13);if(c.p>0)say(c,i);}
      if(c.p<=0){leaveAngry(i);if(run.over)break;}
    }
    if(run&&!run.over)tickStaff(dt);
    if(run&&!run.over&&run.closing&&run.queue.length===0&&(!run.away||run.away.auto)&&!mg)endDay();
    updatePatience();
    renderChat();
  }
  renderHud();
  if(isHost())pubState(false);
  if(tab!=='caja'&&!isMember()&&(ts-(window._dT||0))>700){window._dT=ts;renderDept();}
  drawCams();
  requestAnimationFrame(tick);
}

/* ---------- eventos ---------- */
document.addEventListener('change',e=>{
  if(e.target&&e.target.id==='rdur'&&isHost())fb.update(rRef('info'),{dur:+e.target.value}).catch(()=>{});
  if(e.target&&e.target.classList.contains('force')&&e.target.value){const v=e.target.value,t=+e.target.dataset.t;e.target.blur();assignTask(t,v);}
});
function onClick(e){
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const a=b.dataset.act;
  if(run&&run.away&&['scan','idyes','idno','bag','pay','card','den','clear','deliver','route'].includes(a)){toast('Estás en el pasillo. Termina y vuelve a la caja.','bad');return;}
  if((a==='start'||a==='restart')&&$('#pname'))setPlayerName($('#pname').value);
  if(a==='rapply'&&$('#pname')&&isMember()){if(!nameOk())return;room.renaming=false;fb.update(rRef('members/'+room.uid),{name:playerName()}).catch(()=>{});}
  if(a==='start'){beep(1200,.05);startDay();}
  else if(a==='restart'){meta=defMeta(meta.best);meet=null;startDay();}
  else if(a==='next'){meta.day++;startDay();}
  else if(a==='buy'){
    const u=UPS.find(x=>x.k===b.dataset.k);
    if(u&&!meta.up[u.k]&&meta.money>=u.c){meta.money-=u.c;meta.up[u.k]=1;sOk();renderHud();refreshView();
    }
  }
  else if(a==='route')route(b.dataset.d);
  else if(a==='sup'){ordSup=b.dataset.k;refreshView();}
  else if(a==='ordp'){cart[b.dataset.id]=(cart[b.dataset.id]||0)+6;refreshView();}
  else if(a==='ordm'){const q=(cart[b.dataset.id]||0)-6;if(q<=0)delete cart[b.dataset.id];else cart[b.dataset.id]=q;refreshView();}
  else if(a==='tab')setTab(b.dataset.k);
  else if(a==='stab'){scrTab[b.dataset.s]=b.dataset.k;pg=0;rerenderScreen();}
  else if(a==='pg'){pg+=+b.dataset.d;rerenderScreen();}
  else if(a==='side')$('#sidebar').classList.toggle('open');
  else if(a==='aall')assignAll();
  else if(a==='dtk')deskTicket(+b.dataset.id);
  else if(a==='drepo')deskRepo(+b.dataset.id);
  else if(a==='drev')answerReview(+b.dataset.id);
  else if(a==='ordgo')placeOrder();
  else if(a==='meeting')startMeeting();
  else if(a==='endmeet')endMeeting();
  else if(a==='emp')empAct(+b.dataset.e,b.dataset.k);
  else if(a==='fire')fireEmp(+b.dataset.e,b.dataset.r);
  else if(a==='firex'){if(meet){meet.firing=null;showMeeting();}}
  else if(a==='req')applyReq(+b.dataset.r,+b.dataset.o);
  else if(a==='hirec')hireCand(+b.dataset.c);
  else if(a==='assign')assignTask(+b.dataset.t,b.dataset.e);
  else if(a==='leave')doLeave(b.dataset.o,b.dataset.e);
  else if(a==='leavecancel'){pendingLeave=null;closeMG();}
  else if(a==='supervise')openSup();
  else if(a==='return')returnTill();
  else if(a==='supact')supAct(+b.dataset.e,b.dataset.k);
  else if(a.startsWith('mg'))mgAct(a,b);  else if(a==='scan')scanItem(+b.dataset.id);
  else if(a==='idyes')idDecision(true);
  else if(a==='idno')idDecision(false);
  else if(a==='bag')toggleBag();
  else if(a==='pay')goPay();
  else if(a==='card')payCard();
  else if(a==='den')addTray(+b.dataset.v);
  else if(a==='clear')clearTray();
  else if(a==='deliver')deliver();
  else if(a==='cams')toggleCams();
  else if(a==='mute'){muted=!muted;b.textContent=muted?'🔇':'🔊';}
  else if(a==='wipe')showStart(true);
  else if(a==='rename'){if(isMember())room.renaming=true;const w=b.closest('[data-label]');if(w){w.outerHTML=nameInput(w.dataset.label);const i=$('#pname');if(i){i.focus();i.select();}}}
  else if(a==='ropen')openStore();
  else if(a==='rreg')register();
  else if(a==='rapply')applyJob(b.dataset.r);
  else if(a==='rcancel'&&isMember()){room.msg=null;fb.update(rRef('members/'+room.uid),{apply:null}).catch(err=>hubMsg('⚠️ '+errMsg(err),true));}
  else if(a==='rquit'||a==='rresign')resign();
  else if(a==='rhire')hireReal(b.dataset.u);
  else if(a==='rreject')rejectReal(b.dataset.u);
  else if(a==='rtake')roomAct({k:'take',t:+b.dataset.t});
  else if(a==='rhh')roomAct({k:b.dataset.k,u:b.dataset.u});
  else if(a==='rboss')takeOver();
  if(run&&run.over&&!run.dead&&meta.closed)saveGame(true);
}
const errMsg=err=>(err&&(err.code||err.message))||String(err);
document.addEventListener('click',e=>{try{onClick(e);}catch(err){console.error(err);toast('⚠️ Error: '+errMsg(err),'bad');}});
window.addEventListener('unhandledrejection',ev=>{console.error(ev.reason);toast('⚠️ Error: '+errMsg(ev.reason),'bad');});


if(window.claude&&window.claude.hot&&window.claude.hot.snapshot)window.claude.hot.snapshot(()=>({meta}));
function boot(d){
  if(d&&d.meta)meta=Object.assign(defMeta(),d.meta);
  else{
    const m=loadGame();
    if(m){
      /* Guardada tras el cierre: se continúa en el turno siguiente (la reunión pendiente se da por hecha). */
      if(m.closed){if(m.day%3===1)m.emp.forEach(closeSt);m.day++;m.closed=false;}
      meta=Object.assign(defMeta(),m);hasSave=true;
    }
  }
  document.body.dataset.tab=tab;
  ensureMeta();renderAll();requestAnimationFrame(tick);
  if(cam.on)$('#camwin').classList.add('show');
  if(online())bootOnline();else showStart();
}
if(window.claude&&window.claude.hot&&window.claude.hot.ready)window.claude.hot.ready(boot);
else boot((window.claude&&window.claude.hot&&window.claude.hot.data)||{});
})();
</script>
