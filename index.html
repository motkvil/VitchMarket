/* ===== Economía de una pyme real (España, 2026) =====
   Sueldos: SMI 2026 (RD 126/2026, BOE 19-02-2026) = 1.221 €/mes × 14 pagas = 17.094 €/año. Convenio de Comercio de Alimentación
   de la Comunidad de Madrid (BOCM 24-02-2024, tablas 2025, prorrogadas mientras se negocia el nuevo; 15 pagas): grupo I 16.196,55 €,
   II 17.019,30 €, III 17.523,00 €, IV 19.598,85 €/año. Los grupos I y II quedan por debajo del SMI 2026, así que Caja cobra el SMI;
   Almacén = grupo III; Backoffice = grupo IV; RR.PP. y RR.HH. algo más (grupo sin comprobar). Un turno = un día natural (salario anual / 365).
   Seguridad Social a cargo de la empresa (Orden PJC/297/2026): contingencias comunes 23,60 % + desempleo 5,50 % + FOGASA 0,20 %
   + formación profesional 0,60 % + MEI 0,75 % + accidentes de trabajo (comercio al por menor de alimentación) 1,50 % = 32,15 %. */
const SMI_Y=1709400,SS_EMP=0.3215,WAGE_Y={atc:1709400,alm:1752300,back:1959885,rrpp:1980000,rrhh:2100000};
const dayW=y=>Math.round(y/365),SMI_D=dayW(SMI_Y),wageOf=r=>dayW(WAGE_Y[r]||SMI_Y),WAGE=SMI_D;
const HIRE=10000; /* contratar: anuncio en un portal de empleo y reconocimiento médico (≈100 €) */

   Antes era un local de 400 m² (4.800 €/mes de alquiler), demasiado grande para 4–6 personas y 3 cajas. [nombre, €/día en céntimos, IVA soportado %] */
const FIXED=[['Alquiler del local',10000,21],['Luz y frío de las neveras',5000,21],['Agua, basuras y limpieza',2000,10],['Seguros (local y responsabilidad civil)',900,0],['Gestoría, TPV y software',1100,21],['Mantenimiento',1500,21]];

const CREDIT=1500000,CREDIT_I=0.085;

const credLim=()=>(meta&&meta.credit)||CREDIT,credI=()=>(meta&&meta.creditI)||CREDIT_I;

   cada caja despacha como mucho ~240 (20 clientes/hora en 12 h: un cajero de súper despacha 20–30 por hora; antes 150, 12,5/h, lento para una caja que solo cobra).
   Ticket medio 20 € (la cesta media de súper en España ronda los 20 €; antes 18), IVA medio de la cesta ~7,5 % y mermas del 1,5 % de lo vendido. */

const blankSt=()=>({ok:0,fail:0,late:0,abs:0,tasks:0,tfail:0,quej:0,fel:0,shifts:0,caught:0,cv:0,cvErr:0,robo:0});

/* Rasgos ocultos 0–1: rap (rapidez), trato, punt (puntualidad), act (actitud). Moral 0–100. */
function newEmp(role,m,opt,taken){
  const used=new Set(m.emp.map(e=>e.name).concat(taken||[]));
  let nat=wpick(NATS),pool=nat.n.filter(x=>!used.has(x[0]));
  if(!pool.length){nat=NATS[0];pool=nat.n.filter(x=>!used.has(x[0]));if(!pool.length)pool=nat.n;}
  const nm=pick(pool),sk=()=>Math.round(rnd(0.15,0.95)*100)/100,pers=pick(Object.keys(TRAITS));
  m.eid=(m.eid||0)+1;
  const e={id:m.eid,name:nm[0],face:nm[1],role,rap:sk(),trato:sk(),punt:sk(),act:sk(),hon:sk(),moral:ri(55,80),wage:wageOf(role),days:0,warn:0,trial:0,focus:0,off:0,st:blankSt(),
    nat:NATS.indexOf(nat),langs:nat.l.concat(nat.c==='España'&&Math.random()<0.3?['en']:[]),pers};
  const lim=v=>clamp(v,0.05,0.98);
  if(pers==='currante')e.act=lim(e.act+0.15);
  if(pers==='pasota')e.act=lim(e.act-0.15);
  if(pers==='timido'){e.trato=lim(e.trato-0.15);e.punt=lim(e.punt+0.15);}

let ac=null;

function beep(f,d,type,v){
  if(muted||quiet)return;

    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state==='suspended')ac.resume();
    const o=ac.createOscillator(),g=ac.createGain();
    o.type=type||'square';o.frequency.value=f||1800;g.gain.value=v||.04;
    o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+(d||.07));
  }catch(e){}
}

/* ---------- toast ---------- */
function toast(msg,kind){
  try{if(run&&!run.remote&&msg&&kind){run.lastMsg={m:String(msg),k:kind,t:run.t};}}catch(e){}
  if(quiet)return;
  const box=$('#toast');if(!box||msg==null)return;msg=String(msg);
  const same=toastQ.find(x=>x.m===msg)||[...box.children].find(x=>x._m===msg&&!x._out);
  if(same){if(same.nodeType){same._n++;const n=same.querySelector('.tn')||same.appendChild(document.createElement('b'));n.className='tn';n.textContent='×'+same._n;same._t0=Date.now();toastArm(same);}else same.n++;return;}
  toastQ.push({m:msg,k:kind||'',n:1});if(toastQ.length>6)toastQ.shift();
  [...box.children].forEach(toastArm);toastPump();
}
/* Avisos en el carril de la barra roja (.tlane del HUD o del puesto del empleado): 1 a la vez (2 si el carril es ancho);
   sin carril visible (portada, cierre, reunión) flotan arriba, máx. 2. El resto espera y, mientras espera, los visibles duran menos. */
let toastRaf=0,toastKey='';
function toastPlace(){
  const box=$('#toast'),ov=$('#overlay');if(!box)return 0;
  const on=ov&&ov.classList.contains('show'),l=on?ov.querySelector('.tlane'):document.querySelector('.hud .tlane');
  const r=l&&l.getBoundingClientRect(),ok=r&&r.height>0&&r.top>=0&&r.bottom<=window.innerHeight;
  const k=ok?[r.left,r.top,r.width,r.height].map(Math.round).join():'fl';
  if(k!==toastKey){toastKey=k;box.classList.toggle('fl',!ok);
    if(ok){const [x,y,w,h]=k.split(',');Object.assign(box.style,{left:x+'px',top:y+'px',width:w+'px',height:h+'px'});}else box.removeAttribute('style');}
  return ok?r.width:0;
}
function toastFollow(){toastRaf=0;const box=$('#toast');if(!box||!box.children.length)return;toastPlace();if(window.requestAnimationFrame)toastRaf=requestAnimationFrame(toastFollow);}
function toastMax(){const w=toastPlace();return w?(w>=900?2:1):2;}
function toastPump(){
  const box=$('#toast');if(!box)return;
  while(toastQ.length&&[...box.children].length<toastMax()){
    const q=toastQ.shift(),el=document.createElement('div'),tx=document.createElement('span');
    el.className='tst '+q.k;el._m=q.m;el._n=q.n;tx.textContent=q.m;el.title=q.m;el.appendChild(tx);
    if(q.n>1){const n=document.createElement('b');n.className='tn';n.textContent='×'+q.n;el.appendChild(n);}
    el._ms=clamp(3500+60*q.m.length,4000,9000)*(q.k==='bad'?1.25:1);el._t0=Date.now();
    const hold=()=>{el._hold=1;clearTimeout(el._t);},go=()=>{el._hold=0;el._t0=Date.now();toastArm(el);};
    el.addEventListener('mouseenter',hold);el.addEventListener('mouseleave',go);
    el.addEventListener('touchstart',hold,{passive:true});el.addEventListener('touchend',go,{passive:true});el.addEventListener('touchcancel',go,{passive:true});
    el.addEventListener('click',ev=>{ev.stopPropagation();toastOut(el);});
    box.appendChild(el);toastArm(el);
  }
  if(!toastRaf)toastFollow();
}
function toastArm(el){clearTimeout(el._t);if(el._hold||el._out)return;const ms=toastQ.length?Math.max(2500,el._ms*.55):el._ms;el._t=setTimeout(()=>toastOut(el),Math.max(300,ms-(Date.now()-el._t0)));}
function toastOut(el){if(el._out)return;el._out=1;clearTimeout(el._t);el.classList.add('out');setTimeout(()=>{el.remove();toastPump();},260);}

/* ---------- escenas: situaciones puntuales en una tarjeta centrada (#scene), sin mover el panel fijo ----------
   scene({k,who,name,tag,txt,body,choices:[{t,k,cls,key,act,attrs}],def,time,pause,prio,alive,esc,onPick})
   k = id único ('tipo:id'; el tipo, lo de antes de ':', es lo que mira sceneOk); who = cara/emoji; name/tag = nombre y etiqueta;
   txt = la frase (HTML); body = HTML extra (p. ej. el DNI); choices: t texto, k lo que llega a onPick, cls 'go'|'no'|'',
   key = tecla (una letra o número); act = data-act de un botón de siempre (el clic va a su manejador y no a onPick; la escena
   se cierra sola cuando alive() deja de cumplirse); attrs = atributos extra (p. ej. 'data-d="back"').
   def = opción si se acaba el tiempo (y con Esc si esc!==false); time = segundos con barra (sin time, no caduca);
   pause = para el turno mientras está abierta (solo decisiones serias; solo si llevas tú la tienda); prio = mayor sale antes
   y aparta a una de menor prioridad; alive = ()=>bool, si deja de cumplirse se cierra sin aplicar nada.
   Una a la vez, cola sceneQ (máx. 4, sin repetir k). Esperan si hay #overlay, #mg o la guía abiertos.
   En modo silencioso (encargado de relevo) se aplica def al momento. sceneOk(tipo,s) = ¿han pasado s segundos desde la última?
   Aspecto: look 'ticket' (papel de ticket con borde dentado, por defecto) | 'pa' (megafonía «ding-dong», amarilla) | 'label'
   (etiqueta de lineal); head = texto de la franja roja (por defecto «🛒 VITCHMARKET»); sprite = id para pintar a la persona
   en pixel art (pChar(id), la misma que en la caja) con la cara emoji de chapa. Opción: stamp = sello al elegirla
   ('VENDIDO'…), sc 'ok'|'bad' su color, fx = emoji que salta (🪙). */
let sceneCur=null,sceneTok=0;const sceneQ=[],sceneLast={};
const sceneKind=k=>String(k).split(':')[0];
const sceneOk=(k,gap)=>!(sceneLast[sceneKind(k)]&&performance.now()/1000-sceneLast[sceneKind(k)]<gap);
/* over:true = puede salir encima de #overlay (la pantalla del empleado real es un overlay); #mg y la guía la siguen parando. */
const sceneBlocked=s=>[s&&s.over?'':'#overlay','#mg','#guide'].some(id=>{const x=id&&$(id);return x&&x.classList.contains('show');});
const scenePaused=()=>!!(sceneCur&&sceneCur.pause&&(!room||room.host)&&!sceneBlocked(sceneCur));
/* ---------- director de ritmo: presupuesto de tensión de las escenas (todo lo ajustable, en PACE) ----------
   core = flujo de caja que no puede esperar (DNI, reclamación, tarjeta) y continuaciones (carta, nota): siempre pasan.
   ser = serias (y cualquiera con pause). El resto, menores. Tiempos en segundos de juego (run.t); los de serias, ×run.dur/100.
   · tras una seria, otra seria espera gap; como mucho maxSer serias por turno (las demás aplican def en silencio; must nunca);
   · pico (cola ≥ peakQ o burstN escenas en burstW s) → calm s sin escenas que no sean core;
   · las serias prefieren win (40–75 % del turno): antes, esperan como mucho prefW·dur;
   · una escena aplazada que espera más de waitS·dur (serias) o waitM s (menores), o que sigue en cola al cerrar, aplica def. */
const PACE={core:['dni','rec','tarj','carta','nota','bill','cupon','sosp','dimite'],ser:['robo','insp','ins','bank','hac','cons','arq','press','viral','riv'],must:['insp','riv'],
  gap:25,maxSer:3,peakQ:4,burstN:2,burstW:20,calm:10,win:[0.4,0.75],prefW:0.3,waitS:0.5,waitM:25};
const paceLog=[];window.__pace=paceLog;
const paceCls=s=>{const k=sceneKind(s.k);return PACE.core.includes(k)?'core':(PACE.ser.includes(k)||s.pause)?'ser':'min';};
const paceRun=()=>run&&(run.pace||(run.pace={ser:0,lastSer:-1e9,shows:[],calmTo:-1}));
function paceNote(s,a){if(s._pa===a)return;s._pa=a;paceLog.push({d:meta.day,t:run?Math.round(run.t*10)/10:0,k:sceneKind(s.k),c:paceCls(s),a});if(paceLog.length>400)paceLog.shift();}
/* 'ok' | 'wait:motivo' | 'drop:motivo'. Fuera de turno, las de encima del overlay y las ya vistas no esperan. */
function paceGate(s){
  if(!run||run.over||s.over||s.paced||!s.qrun)return 'ok';
  const cl=paceCls(s);if(cl==='core')return 'ok';
  if(s.qrun!==run)return 'drop:fin';
  const P=paceRun(),t=run.t,D=run.dur||100,ser=cl==='ser',must=PACE.must.includes(sceneKind(s.k));
  if(ser&&!must&&P.ser>=PACE.maxSer)return 'drop:tope';
  if(run.queue.length>=PACE.peakQ)P.calmTo=Math.max(P.calmTo,t+PACE.calm);
  let w='';
  if(P.calmTo>t)w='calma';
  else if(ser&&t-P.lastSer<PACE.gap*D/100)w='hueco';
  else if(ser&&t<PACE.win[0]*D&&t-s.q0<PACE.prefW*D)w='pronto';
  if(!w)return 'ok';
  if(must&&(w!=='calma'||run.closing||(s.w0!=null&&t-s.w0>PACE.calm)))return 'ok';
  if(run.closing||(s.w0!=null&&t-s.w0>(ser?PACE.waitS*D:PACE.waitM)))return 'drop:'+(run.closing?'cierre':'espera');
  if(s.w0==null)s.w0=t;
  return 'wait:'+w;
}
function paceDrop(s,why){paceNote(s,why);if(s.def!=null&&s.onPick)try{s.onPick(s.def);}catch(e){console.warn('scene',e);}}
/* Se llama en cada fotograma: aplica def a las que ya no van a salir y apunta por qué esperan las demás. */
/* Reentrante: el def de una escena descartada puede repintar (renderAll → sceneSync → pacePrune) y tocar sceneQ. */
let paceBusy=false;
function pacePrune(){
  if(paceBusy)return;paceBusy=true;
  try{for(let i=Math.min(sceneQ.length,99)-1;i>=0;i--){if(i>=sceneQ.length)continue;const s=sceneQ[i];if(!s||!s.qrun||s.paced)continue;
    const g=(run&&!run.over&&s.qrun===run)?paceGate(s):'drop:fin';
    if(g.startsWith('drop')){sceneQ.splice(i,1);paceDrop(s,g);}else if(g!=='ok')paceNote(s,g);}}
  finally{paceBusy=false;}
}
function paceShown(s){
  if(s.paced||!run||run.over)return;s.paced=1;const P=paceRun(),t=run.t;
  P.shows=P.shows.filter(x=>t-x<PACE.burstW);P.shows.push(t);if(P.shows.length>=PACE.burstN)P.calmTo=Math.max(P.calmTo,t+PACE.calm);
  if(paceCls(s)==='ser'){P.ser++;P.lastSer=t;}
  paceNote(s,'show');
}
function scene(o){
  if(!o||!o.k)return false;
  if(quiet){if(o.def!=null&&o.onPick)try{o.onPick(o.def);}catch(e){console.warn('scene',e);}return false;}
  if((sceneCur&&sceneCur.k===o.k)||sceneQ.some(x=>x.k===o.k))return false;
  if(run&&!run.over){o.qrun=run;o.q0=run.t;}
  const g=paceGate(o);if(g.startsWith('drop')){paceDrop(o,g);return true;}
  if(sceneCur&&g==='ok'&&(o.prio||0)>(sceneCur.prio||0)){sceneQ.unshift(sceneCur);sceneCur=null;}
  sceneQ.push(o);
  if(sceneQ.length>4){sceneQ.sort((a,b)=>(b.prio||0)-(a.prio||0));const x=sceneQ.pop();if(x.def!=null&&x.onPick)try{x.onPick(x.def);}catch(e){console.warn('scene',e);}}
  scenePump();return true;
}
function scenePump(){
  const el=$('#scene');if(sceneCur||!sceneQ.length||sceneBlocked({over:1})||(el&&(el.classList.contains('hold')||el.classList.contains('out'))))return;
  sceneQ.sort((a,b)=>(b.prio||0)-(a.prio||0));
  const bl=sceneBlocked();let s;
  for(;;){const i=sceneQ.findIndex(x=>(!bl||x.over)&&paceGate(x)==='ok');if(i<0)return;s=sceneQ.splice(i,1)[0];if(!(s.alive&&!s.alive()))break;}
  sceneShow(s);
}
function sceneShow(s){

  el.style.setProperty('--scnT',(r&&r.bottom>0&&r.bottom<innerHeight/3?Math.round(r.bottom):0)+'px');
  const ch=(s.choices||[]).map(c=>`<button class="btn ${c.cls||''}" data-act="${c.act||'scene'}" data-k="${c.k}"${String(c.k)===String(s.def)?' data-def="1"':''}${c.key?` data-key="${String(c.key).toLowerCase()}"`:''} ${c.attrs||''}>${c.key?`<i class="kk">${c.key}</i>`:''}${c.t}</button>`).join('');
  const spr=s.sprite!=null&&PIX.ok,look=s.look||'ticket';

    <div class="scn-head"><span>${look==='pa'?'🔔 ding-dong · ':''}${s.head||'🛒 VITCHMARKET'}</span>${s.tag?`<span class="scn-tag">${s.tag}</span>`:''}</div><div class="scn-belt"></div>
    <div class="scn-row"><div class="scn-who${spr?' spr':''}">${spr?'<canvas width="18" height="17"></canvas><span class="scn-face">'+(s.who||'🙂')+'</span>':(s.who||'🙂')}</div>
    <div class="scn-main">${s.name?`<b class="scn-name">${s.name}</b>`:''}<div class="scn-say">${s.txt||''}</div>${s.body||''}</div></div>
    <div class="scn-ch">${ch}</div>${s.time?'<div class="scn-bar"><i></i></div>':''}</div></div>`;
  if(spr)try{const cv=el.querySelector('.scn-who canvas'),g=cv.getContext('2d');g.imageSmoothingEnabled=false;pPerson(g,9,16,{ch:s.role==='alm'?PWORK:pChar(s.sprite),dir:'d',s:1,staff:!!s.role,role:s.role});}catch(e){}
  el.classList.remove('out','hold');el.classList.toggle('top',!!s.over);el.classList.toggle('free',!s.pause&&!s.over);el.classList.add('show');
}
function sceneClose(){
  const el=$('#scene'),s=sceneCur;sceneCur=null;if(s&&run&&run.pace&&s.paced&&paceCls(s)==='ser')run.pace.lastSer=run.t;if(!el)return;
  const tok=++sceneTok,c=s&&s.hit!=null&&(s.choices||[]).find(x=>String(x.k)===String(s.hit));
  const out=()=>{if(tok!==sceneTok)return;el.classList.remove('hold');el.classList.add('out');
    setTimeout(()=>{if(tok!==sceneTok)return;el.classList.remove('show','out');el.innerHTML='';scenePump();},170);};
  const card=el.querySelector('.scn-wrap');

    setTimeout(out,520);}

function scenePick(k){const s=sceneCur;if(!s)return;s.hit=k;sceneClose();if(s.onPick)try{s.onPick(k);}catch(e){console.warn('scene',e);}}
/* Se llama en cada fotograma (step) y en renderAll: caduca, cierra lo que ya no pinta nada y saca la siguiente. */
function sceneSync(){
  for(let i=sceneQ.length-1;i>=0;i--)if(sceneQ[i].alive&&!sceneQ[i].alive())sceneQ.splice(i,1);
  if(sceneCur&&sceneCur.alive&&!sceneCur.alive())sceneClose();
  if(sceneCur&&sceneBlocked(sceneCur)){const el=$('#scene');sceneQ.unshift(sceneCur);sceneCur=null;sceneTok++;if(el){el.classList.remove('show','out','hold');el.innerHTML='';}}
  try{cajaScenes();}catch(e){console.warn('cajaScenes',e);}
  try{backScenes();}catch(e){console.warn('backScenes',e);}
  pacePrune();scenePump();
  if(sceneCur&&sceneCur.tick)try{sceneCur.tick();}catch(e){}
  if(sceneCur&&sceneCur.time){const f=1-(performance.now()-sceneCur.t0)/1000/sceneCur.time,b=document.querySelector('#scene .scn-bar i');
    if(f<=0)scenePick(sceneCur.def);else if(b)b.style.width=(f*100).toFixed(1)+'%';}
}

const DNI_AP=['García','López','Martín','Sánchez','Pérez','Gómez','Ruiz','Díaz','Moreno','Jiménez','Romero','Navarro'];
function cajaScenes(){
  if(!tillOn())return;

  if(c.phase==='scan'&&!meta.ageWarn&&c.items.some(i=>i.age&&!i.scanned)){ageWarn();return;}

      choices:[['atc','🙋 Resolver yo','go','RESUELTO'],['back','💼 Backoffice','','DERIVADO'],['rrpp','📣 RR.PP.','','DERIVADO'],['alm','📦 Almacén','','DERIVADO'],['no','✋ Rechazar','no','RECHAZADO']].map(([d,t,cls,st],i)=>({t,k:d,cls,key:String(i+1),act:'route',attrs:`data-d="${d}"`,stamp:d===q.dept||(d==='atc'&&q.dept==='atc')?st:d==='no'?st:d==='atc'?'':'MAL DERIVADO',sc:d===q.dept?'ok':'bad'})),

/* ===== Normas nuevas en caja (estilo «Papers, Please»: una regla más cada pocos turnos; UNLOCK 'falso' T4, 'cupon' T6) =====

   Billetes falsos: quien paga en efectivo con 20 o 50 € puede dar uno falso (fakeP: 3 % + 0,6 %/turno, máx. 15 %). El billete sale en la
   registradora con lo que se nota a simple vista (los buenos a veces también tienen «algo raro»); al tocarlo (o L), lupa con 3 medidas de
   seguridad de la serie Europa. Aceptar uno falso = su valor a pérdidas al dar el cambio (run.fines y run.fakes); rechazar uno bueno =

const THF={look:[16,26],out:6,seg:4000,stop:0.65,arco:0.8,arcoT:0.85,obs:['🧥 Capucha y gafas de sol dentro de la tienda','🧺 Sin cesta ni carro'],

function pickProduct(arr){

  const w=a.map(x=>{const t=promoOf(x.id);return (x.id%3===0?3:1)*(t?PROMO[t].w:1);});
  let r=Math.random()*w.reduce((t,v)=>t+v,0);

function receiveDeliveries(){
  const rr={arrived:0,short:0,shelved:0,pending:0,lines:[]};
  const due=meta.orders.filter(o=>o.day<=meta.day);
  meta.orders=meta.orders.filter(o=>o.day>meta.day);
  due.forEach(o=>{
    const sup=SUPS.find(z=>z.k===o.sup)||SUPS[0];
    Object.entries(o.items).forEach(([id,q])=>{
      const got=Math.random()<sup.rel+(sup.k==='hac'&&meta.provRel||0)?q:Math.ceil(q*0.5);
      rr.arrived+=got;rr.short+=q-got;
      meta.back[id]=(meta.back[id]||0)+got;
      rr.lines.push({id:+id,q,got,sup:sup.k});
    });
  });
  /* Antes de abrir, quien trabaja en Almacén sube a la estantería lo que puede (30 + 40·rapidez uds cada uno);
     lo que no le da tiempo se queda en el muelle y lo van colocando durante el turno con el aviso 🚚 (almRoutine). */
  let cap=staffOf('alm').filter(e=>working(e)&&!e.real).reduce((t,e)=>t+Math.round(30+40*e.rap),0);
  const ids=Object.keys(meta.back).filter(id=>meta.back[id]>0).sort((x,y)=>(meta.stock[x]||0)-(meta.stock[y]||0));
  for(const id of ids){
    if(cap<=0)break;
    const mv=Math.min(cap,meta.back[id]);
    meta.back[id]-=mv;meta.stock[id]=(meta.stock[id]||0)+mv;cap-=mv;rr.shelved+=mv;
  }
  rr.pending=Object.values(meta.back).reduce((t,v)=>t+v,0);
  return rr;
}

    return `<div class="dcard ${g[2]}"><div class="dch"><b>${ic} ${n}</b><span class="dpp" title="Trabajaron / plantilla">👥 ${o.w}/${o.n}</span><span class="grade" title="Nota">${g[1]} ${g[0]}</span></div>
      <div class="sum">${o.kv.map(x=>`<span>${x[0]}</span><b class="${x[2]?'neg':''}">${x[1]}</b>`).join('')}<span>Coste del día</span><b>${o.cost?'−'+fmt(o.cost):'0'}</b></div>
      <div class="dhint ${/^Bien/.test(o.h)?'ok':''}">${o.h}</div></div>`;}).join('')+'</div>';
}
/* ---------- el jefe, socio único de la SL ----------
   Su dinero (meta.boss) no es el de la tienda (meta.money). Solo cobra dividendos (Ley de Sociedades de Capital, simplificada):
   del beneficio acumulado (patrimonio − capital − reserva legal), sin bajar el patrimonio del capital ni tirar de la póliza.
   La empresa paga el bruto; Hacienda retiene el IRPF del ahorro (19/21/23/27/30%) sobre lo cobrado en el año (365 turnos). */
const bossOf=()=>meta.boss=meta.boss||{cash:0,div:0,divY:0,ret:0,y:0};
const canDiv=()=>!room||!!(room.host&&!room.sim);
function divData(){const b=balData(),res=meta.resLeg||0,dist=Math.max(0,b.pat-CAP0-res);return {dist,res,max:Math.max(0,Math.min(dist,meta.money))};}
const IRPF_A=[[600000,0.19],[5000000,0.21],[20000000,0.23],[30000000,0.27],[Infinity,0.30]];
function irpfAh(y,g){let t=0,lo=0;for(const [top,r] of IRPF_A){const a=Math.max(lo,y),b=Math.min(top,y+g);if(b>a)t+=(b-a)*r;lo=top;}return Math.round(t);}
const divYear=()=>{const B=bossOf(),yr=Math.floor((meta.day-1)/365);if(B.y!==yr){B.y=yr;B.divY=0;}return B;};
function payDiv(pct){
  if(!canDiv()||!run||!run.over)return;
  const d=divData(),g=Math.floor(d.max*pct/100);if(g<=0)return;
  divPay(g);
  if(lastEnd&&lastEnd.fin)lastEnd.fin.div=(lastEnd.fin.div||0)+g;
  saveGame(true);
  renderHud();rerenderScreen();
}
/* Paga g céntimos brutos al socio (la retención va a Hacienda). La escena del dividendo lo usa durante el turno (run.div). */
function divPay(g){
  const B=divYear(),ret=irpfAh(B.divY,g);
  achCheck('div');
  meta.money-=g;B.divY+=g;B.div+=g;B.ret+=ret;B.cash+=g-ret;if(meta.week)meta.week.div=(meta.week.div||0)+g;
  sOk();toast('👑 Dividendo de '+fmt(g)+': Hacienda retiene '+fmt(ret)+', a tu bolsillo '+fmt(g-ret)+'.','good');
}
function bossHtml(){
  const B=divYear(),d=divData(),k=(ic,l,v,c)=>`<div class="kpi ${c||''}"><small>${ic} ${l}</small><b>${v}</b></div>`;

  const why=!canDiv()?'Solo el jefe reparte dividendos.':d.dist<=0?'No hay beneficio acumulado que repartir (sin tocar capital ni reserva legal).':meta.money<=0?'Sin caja: no puedes tirar de la póliza para pagarte.':'';
  return `<div class="kpis">${k('👑','Tu bolsillo',fmt(B.cash),'pos')}${k('💸','Repartible',fmt(d.max))}${k('🏛️','Reserva legal',fmt(d.res)+' <small>/ '+fmt(CAP0*0.2)+'</small>')}</div>

    <div class="supd">El bote es de la empresa, no tuyo: solo te llevas dividendos del beneficio, sin tocar el capital (${fmt(CAP0)}) ni la reserva legal. Hacienda retiene 19–30%; el botón dice lo que te llega.</div>`;

/* ---------- cierre en tres frases ----------
   Lo primero del cierre: ¿gané o perdí? (beneficio neto y bote), ¿por qué? (las 2–3 partidas que más pesan, de lastEnd.fin)
   y ¿qué cambio mañana? (el consejo más urgente de adviceList, con un botón a su pestaña). El detalle sigue en las pestañas. */
const sgnP=v=>(v<0?'−':'+')+fmt(Math.abs(v));
function heroWhy(f){
  if(!f)return [];
  const D=[],sales=f.S+(f.O||0),add=(ic,t,v,w)=>{if(v)D.push({ic,t,v,w:Math.abs(v)*(w||1)});};
  const F=f.F||0,ins=run.insp||0,con=run.consumo||0;
  add('👥','Nómina y Seguridad Social',-f.P);
  add('🏠','Alquiler, luz y gastos fijos',-(f.FX||0));
  add('🚔',ins>=F/2?'Multa del inspector':con>=F/2?'Sanción de Consumo':'Multas y pérdidas en caja',-F,2.5);
  add('📨','Reclamaciones al cierre',-(f.K||0),2);
  add('🏦','Intereses de la póliza',-(f.INT||0),2);
  add('🏛️','Impuesto de sociedades',-(f.is||0));
  if(f.oth<0)add('💸','Reembolsos y compensaciones',f.oth,2);else add('🎁','Abonos y otros ingresos',f.oth||0);
  const C=D.sort((a,b)=>b.w-a.w).slice(0,sales?2:3);
  if(sales){const m=sales-(f.cogs||0)-((f.ivaR||0)-(f.ivaS||0)),big=(f.O||0)>f.S;
    C.unshift({ic:big?'🛒':'🧾',t:(big?'Las otras cajas vendieron '+fmt(f.O)+(f.S?' y tu caja '+fmt(f.S):''):'Tu caja vendió '+fmt(f.S)+(f.O?' y las otras '+fmt(f.O):''))+' · margen',v:m});}
  return C;
}

/* ---------- guardado de partida (localStorage) ----------

   desde su inicio. Si se recarga tras el cierre, se pasa al turno siguiente. */

function wipeGame(){if(daily)return;if(room){if(room.host&&!room.sim)fb.remove(rRef('meta')).catch(()=>{});return;}try{localStorage.removeItem(SAVE_KEY);}catch(e){}hasSave=false;}

/* ---------- ranking online (Firebase Realtime Database, opcional) ----------
   Solo se activa si firebase-config.js define window.FIREBASE_CONFIG. Sin él (o dentro de un artifact
   de Claude, que no deja cargar scripts de gstatic) el juego funciona igual, sin ranking.
   Cada partida (meta.runId) es una entrada en /ranking, escrita con login anónimo. */
const FB_V='10.12.2',NAME_KEY='vitchmarket.nombre';
let fb=null;
const online=()=>!!(window.FIREBASE_CONFIG&&window.FIREBASE_CONFIG.databaseURL)&&!(window.claude&&window.claude.hot);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function playerName(){try{return (localStorage.getItem(NAME_KEY)||'').trim();}catch(e){return '';}}
function setPlayerName(n){try{localStorage.setItem(NAME_KEY,String(n).trim().slice(0,20));}catch(e){}}
async function fbInit(){
  if(fb!==null)return fb;
  if(!online()){fb=false;return fb;}
  if(window.FB_MOCK){fb=await window.FB_MOCK();return fb;}
  try{
    const B='https://www.gstatic.com/firebasejs/'+FB_V+'/';
    const [A,D,U]=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-database.js'),import(B+'firebase-auth.js')]);
    const app=A.initializeApp(window.FIREBASE_CONFIG),cred=await U.signInAnonymously(U.getAuth(app));
    fb=Object.assign({db:D.getDatabase(app),uid:cred.user.uid},D);
  }catch(e){console.warn('Ranking no disponible:',e);fb=false;}
  return fb;
}
async function submitScore(final){
  if(daily||meta.relax)return;
  const name=playerName(),days=final?meta.day-1:meta.day;
  if(!online()||!name||days<1)return;
  const f=await fbInit();if(!f)return;
  try{
    await f.set(f.ref(f.db,'ranking/'+meta.runId),{uid:f.uid,name,days,money:Math.round(meta.money),rep:Math.round(meta.rep*10)/10,
      staff:meta.emp.length,score:days*100000+clamp(Math.round(meta.money/100),0,99999),final:!!final,ts:f.serverTimestamp()});
  }catch(e){console.warn('No se pudo subir la puntuación:',e);}
}
async function fillRanking(){
  if(!$('#rank'))return;
  if(!online()){$('#rank').innerHTML='';return;}
  $('#rank').innerHTML='<div class="supd">Cargando ranking…</div>';
  const f=await fbInit(),box=()=>$('#rank');
  if(!f){if(box())box().innerHTML='<div class="supd">El ranking no está disponible ahora mismo.</div>';return;}
  try{
    const s=await f.get(f.query(f.ref(f.db,'ranking'),f.orderByChild('score'),f.limitToLast(10)));
    const rows=[];s.forEach(c=>{rows.push(Object.assign({id:c.key},c.val()));});rows.reverse();
    if(!box())return;
    box().innerHTML=rows.length?'<ol class="rank">'+rows.map(r=>`<li class="${r.id===meta.runId?'me':''}"><b>${esc(r.name)}</b> · ${r.days} ${r.days===1?'turno':'turnos'} · ${fmt(r.money)}${r.final?' 🪦':''}</li>`).join('')+'</ol>'

/* ---------- 🗓️ Reto del día (como el diario de Spelunky) ----------
   Un solo turno, igual para todo el mundo ese día (fecha de Madrid): mientras dura el reto, Math.random es un generador
   con semilla (mulberry32 del hash de la fecha) y al acabar se devuelve el de siempre. Los clientes y su ritmo de llegada
   salen de un segundo generador propio (daily.cr, custRng) para que no dependan de los fotogramas (lo que se dibuja también
   tira dados); los tickets de las otras cajas, de un tercero (daily.or). El tiempo de reacción del jugador sigue cambiando el resultado: eso es el reto.
   Arranque fijo: plantilla inicial de defMeta y turno 3 con Almacén abierto (camión, muelle, caducados y alcohol con DNI
   ya en juego); Backoffice, RR.PP. y RR.HH. siguen cerrados, como en una partida normal ese turno. La partida guardada
   no se toca: meta va aparte (daily.saved), saveGame/wipeGame/submitScore no hacen nada y al terminar se vuelve a ella.
   Puntuación = beneficio neto del turno (lastEnd.fin.net). Un intento oficial al día (vitchmarket.reto.<fecha>, se marca
   al empezar para que recargar no dé otro); el resto, «de práctica». Con Firebase: /daily/<fecha>/<uid> (una sola vez) y top 10. */
const RETO_K='vitchmarket.reto.';
let daily=null;
const mulb=a=>()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};
const hashS=s=>{let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;};
function madDate(){
  try{const p={};new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Madrid',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()).forEach(x=>{p[x.type]=x.value;});
    if(p.year&&p.month&&p.day)return p.year+'-'+p.month+'-'+p.day;}catch(e){}
  return new Date().toISOString().slice(0,10);
}
const retoDM=d=>d.slice(8,10)+'/'+d.slice(5,7);
function retoGet(d){try{const s=localStorage.getItem(RETO_K+d);return s?JSON.parse(s):null;}catch(e){return null;}}
function retoSet(d,v){try{localStorage.setItem(RETO_K+d,JSON.stringify(v));}catch(e){}}
/* Corre f con un generador propio del reto (cr = clientes, or = tickets de las otras cajas); fuera del reto, igual que siempre. */
const custRng=(f,k)=>{const g=daily&&daily[k||'cr'];if(!g)return f();const R=Math.random;Math.random=g;try{return f();}finally{Math.random=R;}};
function sceneClear(){sceneQ.length=0;sceneCur=null;sceneTok++;const el=$('#scene');if(el){el.classList.remove('show','out','hold');el.innerHTML='';}}

}
function startDaily(){
  const d=madDate(),seed=hashS('VitchMarket·reto·'+d),prev=daily;

  if(daily.official)retoSet(d,{d,started:1});
  room=null;   /* online: la portada y la tienda compartida se apartan mientras dura el reto (sus avisos miran room) */
  Math.random=mulb(seed);daily.cr=mulb((seed^0x9E3779B9)>>>0);daily.or=mulb((seed^0x85EBCA6B)>>>0);
  meta=defMeta(1);meta.day=3;meta.unl={caja:1,alm:1};meta.reto=d;
  meet=null;cart={};lastEnd=null;mg=null;closeMG();sceneClear();
  tab='caja';document.body.dataset.tab=tab;

}

/* ---------- tienda compartida (Firebase Realtime Database, sin servidor) ----------
   Hay UNA sola tienda para todo el mundo: /rooms/VITCH. Al entrar, cada persona pone su nombre y solicita
   un cargo. El jefe (el primero que lo pide con el puesto libre) lleva la Caja 3, contrata a quien solicita
   y su navegador mueve la tienda: publica el estado en /state cada segundo y guarda la partida en /meta.
   Los empleados cogen avisos y hacen el minijuego en su navegador; el resultado va a /acts y el jefe lo aplica.
   Sin jefe conectado la tienda se congela; si lleva más de 2 min fuera, otro puede quedarse el puesto.
   Si no hay conexión al arrancar, se juega en solitario sin conexión (partida guardada en el navegador). */
/* Versión del juego: súbela en cada cambio que toque la tienda compartida. Si el jefe y un empleado tienen
   versiones distintas (caché del navegador), a los dos les sale un aviso para recargar. */
const APPV='2026.11.18-100';
/* Compara versiones por números («-9» < «-11»), no como texto. */
const verCmp=(a,b)=>{const x=String(a).split(/[.-]/).map(Number),y=String(b).split(/[.-]/).map(Number);for(let i=0;i<Math.max(x.length,y.length);i++){const d=(x[i]||0)-(y[i]||0);if(d)return d;}return 0;};
try{const vt=document.createElement('div');vt.id='vtag';vt.textContent='v'+APPV;document.body.appendChild(vt);}catch(e){}
const SHOP='VITCH',DURS=[[100,'100 s (clásico)'],[600,'10 min'],[1800,'30 min'],[3600,'1 hora'],[10800,'3 horas'],[43200,'12 horas']];
const REAL_LIM=60,TAKEOVER=120000;
const JOB_IC={jefe:'👑',atc:'🧾',alm:'📦',back:'💼',rrpp:'📣',rrhh:'🗂️'};
let room=null,offline=false,rankCache='',rankAt=0;
const rRef=p=>fb.ref(fb.db,'rooms/'+room.code+(p?'/'+p:''));
const isHost=()=>!!(room&&(room.host||room.sim));
const isMember=()=>!!(room&&!room.host);
const plain=o=>JSON.parse(JSON.stringify(o));
const toObj=v=>{if(!Array.isArray(v))return v||{};const o={};v.forEach((x,i)=>{if(x!=null)o[i]=x;});return o;};
const toArr=v=>(Array.isArray(v)?v:Object.values(v||{})).filter(x=>x!=null);
const cleanName=s=>String(s||'').replace(/[<>&"'`]/g,'').trim().slice(0,20)||'Anónimo';
const durTxt=s=>(DURS.find(d=>d[0]===s)||[0,(s||100)<120?(s||100)+' s':Math.round(s/60)+' min'])[1];
const clockOf=(t,dur)=>{const m=540+Math.min(1,(t||0)/(dur||100))*720;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(Math.floor(m%60)).padStart(2,'0');};
const srvNow=()=>Date.now()+((room&&room.off)||0);
/* El nombre se pide una vez: si ya hay uno guardado, se muestra con un botón para cambiarlo. */
const nameInput=label=>`<label class="supd">${label}<input id="pname" class="pname" maxlength="20" value="${esc(playerName())}" placeholder="Tu nombre o mote"></label>`;
const nameField=label=>playerName()?`<div class="supd" data-label="${esc(label)}">Juegas como <b>${esc(playerName())}</b> <button class="btn mini" data-act="rename">Cambiar</button></div>`:nameInput(label);
function nameOk(){const i=$('#pname');if(!i&&playerName())return true;const n=i?cleanName(i.value):'';if(!i||!i.value.trim()){toast('Pon un nombre o un mote','bad');return false;}setPlayerName(n);return true;}

/* Arranque: siempre online; si no hay conexión en 9 s, modo sin conexión. */
async function bootOnline(){

function goOffline(){offline=true;room=null;showStart();toast('📴 Sin conexión con la tienda: juegas en solitario. Recarga para volver a intentarlo.','bad');}
async function enterShared(){
  const f=fb,base='rooms/'+SHOP;
  const info=(await f.get(f.ref(f.db,base+'/info'))).val();
  if(info&&info.host===f.uid&&srvNow()-(info.hb||0)<TAKEOVER*15){
    const ms=await f.get(f.ref(f.db,base+'/meta'));
    meta=ms.exists()?loadRoomMeta(ms.val()):defMeta(meta.best);
    await f.update(f.ref(f.db,base+'/members/'+f.uid),{name:playerName()||'Jefe',role:'jefe',on:true});
    let rl=null;try{rl=(await f.get(f.ref(f.db,base+'/relay'))).val();}catch(e){}
    return enterRoom(SHOP,true,rl);
  }
  /* Si el registro falla (reglas, permisos…), no es falta de conexión: se entra igual y se avisa. */
  let regErr=null;
  if(playerName()){
    try{
      const ex=(await f.get(f.ref(f.db,base+'/members/'+f.uid))).val();
      await f.update(f.ref(f.db,base+'/members/'+f.uid),{name:playerName(),on:true,role:ex&&ROLES[ex.role]?ex.role:null});
    }catch(e){console.warn('No se pudo registrar en la tienda:',e);regErr=e;}
  }
  enterRoom(SHOP,false);
  if(regErr){room.msg={t:'⚠️ La tienda no ha aceptado tu registro ('+errMsg(regErr)+'). Si pone PERMISSION_DENIED, las reglas de Firebase no están bien publicadas.',bad:true};room.lastHtml='';renderMember();}
}
/* Firebase convierte los objetos con claves numéricas en arrays y se come los vacíos: se deshace aquí. */
function loadRoomMeta(raw){
  const m=Object.assign(defMeta(),raw);
  m.emp=toArr(raw.emp);m.stock=toObj(raw.stock);m.back=toObj(raw.back);m.regs=raw.regs||{};
  m.up=Object.assign({scanner:0,fan:0,coffee:0},raw.up);
  m.orders=toArr(raw.orders).map(o=>Object.assign(o,{items:toObj(o.items)}));
  m.emp.forEach(e=>{e.langs=toArr(e.langs);if(e.langs.length===0)e.langs=['es'];e.log=toArr(e.log);});
  if(m.closed){if(m.day%3===1)m.emp.forEach(closeSt);m.day++;m.closed=false;}
  return m;
}
function presence(){

/* ===== Relevo (encargado/a): si el jefe deja de dar señal 25 s con la tienda abierta, el navegador de un empleado
   conectado (Almacén, Backoffice, RR.PP. o RR.HH.; los cajeros tienen su caja) sigue moviendo la tienda: reloj, clientes, avisos,
   otras cajas y cierres, sin decisiones de jefe (no hay reunión ni pedidos manuales). Guarda la partida cada 15 s. Cuando el jefe
   vuelve, avisa con info.ret; el encargado guarda y suelta (/relay) y el jefe retoma el turno donde iba. */
const RELAY_T=25000,RELAY_ROLES=['alm','back','rrpp','rrhh'];
const relayActive=()=>{const r=room&&room.relay;return !!(r&&r.uid&&srvNow()-(r.hb||0)<RELAY_T);};
const bossAway=()=>{const inf=room&&room.info||{};return !!inf.host&&srvNow()-(inf.hb||0)>RELAY_T&&inf.status&&inf.status!=='lobby';};
function relayCheck(){
  if(!room||!fb||offline)return;
  if(room.sim){
    /* Si el nodo ya no es mío (otro encargado, o el jefe lo ha borrado), suelto sin guardar. */
    if(!room.relay||room.relay.uid!==room.uid){dropSim('👔 Otra persona lleva ahora la tienda.');return;}
    fb.update(rRef('relay'),{hb:fb.serverTimestamp()}).catch(()=>{});
    const inf=room.info||{},r=room.relay||{};
    if((inf.ret&&r.since&&inf.ret>r.since)||!bossAway())stopRelay('👑 Ha vuelto el jefe: te devuelve la tienda y sigues en tu puesto.');
    return;
  }
  if(room.host||room.relayBusy||!bossAway()||relayActive()||(run&&run.remote))return;
  const ms=room.members||{},me=ms[room.uid];if(!me||!RELAY_ROLES.includes(me.role))return;
  const c=Object.entries(ms).filter(([u,m])=>m&&m.on&&RELAY_ROLES.includes(m.role)&&u!==room.info.host).map(([u])=>u).sort();
  if(c[0]===room.uid)startRelay();
}
async function startRelay(){
  room.relayBusy=true;
  try{
    await fb.set(rRef('relay'),{uid:room.uid,name:playerName()||'Encargado/a',hb:fb.serverTimestamp(),since:fb.serverTimestamp()});
    try{fb.onDisconnect(rRef('relay')).remove();}catch(e){}
    const raw=(await fb.get(rRef('meta'))).val();
    if(!raw){await fb.remove(rRef('relay'));room.relayBusy=false;return;}
    meta=loadRoomMeta(raw);room.sim=true;ensureMeta();
    room.actsOff=fb.onChildAdded(rRef('acts'),s=>{const a=s.val();fb.remove(s.ref).catch(()=>{});quiet=true;try{onAct(a);}finally{quiet=false;}});
    resumeDay(meta.liveT||0);if(run&&!run.away)autoTill();
    toast('👔 El jefe no está: tu navegador lleva la tienda como encargado/a hasta que vuelva. No cierres la app.','good');
    room.lastHtml='';renderMember();
  }catch(e){console.warn('Relevo:',e);room.sim=false;}
  room.relayBusy=false;
}
/* Copia de la partida para guardar a mitad de turno: lo que llevan los clientes en cola vuelve a la estantería
   (si se retoma en otro navegador, esa cola no existe). */
function liveMeta(){
  const m=plain(meta);
  if(run&&!run.over){m.liveT=run.t;m.closed=false;run.queue.forEach(c=>c.items.forEach(i=>{if(!i.scanned&&!i.denied)m.stock[i.pid]=(m.stock[i.pid]||0)+1;}));}
  return m;
}
function dropSim(msg){

async function stopRelay(msg){

function relayNextDay(){

/* El jefe vuelve con un encargado al mando: le pide la tienda y espera a que la suelte. */
function waitRelay(){

/* ---------- cajas de verdad para los cajeros reales ----------
   El navegador del jefe crea los clientes y reparte la cola entre su Caja 3 y las cajas abiertas por
   jugadores de Caja (Caja 1 y 2): cada cliente se manda entero a /till/{uid}/{cid}. El cajero lo atiende en su
   navegador con la caja de siempre (run.remote) y cada segundo manda lo que ha pasado (act «till»: dinero,
   reputación, atendidos, enfadados, reclamaciones, reseñas, unidades devueltas y clientes terminados).
   El jefe lo suma a la tienda. Si el cajero se desconecta, sus clientes se pierden y el stock vuelve. */
const TILL_MAX=5;
/* --- lado del jefe --- */
function tillOf(e){return run&&run.tills&&e.real?run.tills[e.real]:null;}
function syncTills(){
  if(!isHost()||!run||run.over)return;
  run.tills=run.tills||{};
  const want=meta.emp.filter(e=>e.real&&e.role==='atc'&&inStore(e)).slice(0,2);
  Object.keys(run.tills).forEach(u=>{if(!want.some(e=>e.real===u))closeTill(u,'se ha ido de la caja');});
  want.forEach(e=>{
    if(run.tills[e.real])return;
    const used=Object.values(run.tills).map(t=>t.n),n=[1,2].find(x=>!used.includes(x));
    run.tills[e.real]={n,out:{},eid:e.id};
    toast('🧾 '+e.name+' abre la Caja '+n,'good');note(e.real,'🧾 Tienes abierta la Caja '+n+'. ¡A cobrar!');
  });
}
function closeTill(u,why){
  const t=run&&run.tills&&run.tills[u];if(!t)return;
  Object.values(t.out).forEach(pids=>toArr(pids).forEach(pid=>{meta.stock[pid]=(meta.stock[pid]||0)+1;}));
  fb.remove(rRef('till/'+u)).catch(()=>{});
  delete run.tills[u];
  if(why)toast('🧾 La Caja '+t.n+' cierra: '+why,'bad');
}
const tillsBusy=()=>run&&run.tills?Object.values(run.tills).reduce((s,t)=>s+Object.keys(t.out).length,0):0;
/* Manda el cliente a la caja real con menos cola si tiene menos gente que la Caja 3. Devuelve true si lo ha mandado. */
function sendToTill(c){
  if(!isHost()||!run.tills||c.cut)return false;
  const ts=Object.entries(run.tills).filter(([u,t])=>Object.keys(t.out).length<TILL_MAX);
  if(!ts.length)return false;
  const [u,t]=ts.sort((a,b)=>Object.keys(a[1].out).length-Object.keys(b[1].out).length)[0];
  if(Object.keys(t.out).length>run.queue.length)return false;
  t.out[c.id]=c.items.map(i=>i.pid);
  fb.set(rRef('till/'+u+'/'+c.id),plain(Object.assign({},c,{birth:+c.birth}))).catch(()=>{});
  return true;
}
/* Lo que manda el cajero real cada segundo. */
function applyTill(e,a){
  const t=run.tills&&run.tills[e.real],d=a.d||{};
  meta.money+=Math.round(+d.money||0);repAdd(+(+d.rep||0),'Cajas de los cajeros reales');
  ['served','angry','errors','tips','sales','fines','pd','promoU','promoV','promoC'].forEach(k=>{run[k]=(run[k]||0)+Math.round(+d[k]||0);});
  run.ivaR=(run.ivaR||0)+Math.round(+d.sales||0)*OFF.iva/(1+OFF.iva);
  e.st.cv+=Math.round(+d.served||0);e.st.cvErr+=Math.round(+d.errors||0);
  toArr(a.ret).forEach(pid=>{meta.stock[pid]=(meta.stock[pid]||0)+1;});
  toArr(a.tk).forEach(x=>{if(x&&ROLES[x.dept])addTicket(x.dept,String(x.t||'Reclamación').slice(0,120),+x.refund||0,+x.sev||1,!!x.mis);});
  toArr(a.rev).forEach(x=>{if(x)addReview(clamp(+x[0]||3,1,5),x[1]);});
  if(t)toArr(a.done).forEach(cid=>{delete t.out[cid];});
  renderAll();checkRep();
}

/* --- lado del cajero real --- */
let tillOff=null;
function startRemoteTill(n){
  document.body.classList.add('cashier');
  const st=room.state||{};
  meta=defMeta();meta.emp=[];meta.regs={};meta.money=0;meta.rep=2.5;meta.day=st.day||1;meta.up=Object.assign({scanner:0,fan:0,coffee:0},st.up);
  run={remote:1,till:n,t:0,dur:1e9,queue:[],next:1e9,served:0,angry:0,errors:0,tips:0,fines:0,closing:false,over:false,tray:[],card:false,pendingId:null,flash:0,
    tickets:[],sales:0,tasks:[],nextTask:1e9,away:null,tdone:0,tlost:0,duty:{},ev:[],reviews:[],outTk:[],outRet:[],outRev:[],done:[],syncT:0};
  room.panel=false;tab='caja';document.body.dataset.tab='caja';$('.stage').hidden=false;$('#dept').hidden=true;
  tillOff=fb.onChildAdded(rRef('till/'+room.uid),s=>{
    const c=s.val();fb.remove(s.ref).catch(()=>{});
    if(!c)return;
    if(!run||!run.remote){roomAct({k:'till',d:{},ret:toArr(c.items).map(i=>i.pid),done:[c.id]});return;}
    c.items=toArr(c.items);c.birth=new Date(c.birth);c.p=c.max;
    run.queue.push(c);renderAll();beep(990,.06,'triangle',.04);
  });

}
function stopRemoteTill(){
  if(!run||!run.remote)return;
  tillSync(true);
  if(tillOff){tillOff();tillOff=null;}
  document.body.classList.remove('cashier');
  run=null;mg=null;closeMG();room.lastHtml='';renderAll();renderMember();
}
function tillSync(force){
  if(!run||!run.remote)return;
  const d={money:meta.money,rep:Math.round((meta.rep-2.5)*100)/100,served:run.served,angry:run.angry,errors:run.errors,tips:run.tips,sales:run.sales,fines:run.fines,pd:run.pd||0,promoU:run.promoU||0,promoV:Math.round(run.promoV||0),promoC:Math.round(run.promoC||0)};
  const any=Object.values(d).some(v=>v)||run.outTk.length||run.outRet.length||run.outRev.length||run.done.length;
  if(!any)return;
  roomAct({k:'till',d,tk:run.outTk,ret:run.outRet,rev:run.outRev,done:run.done});
  meta.money=0;meta.rep=2.5;['served','angry','errors','tips','sales','fines','pd','promoU','promoV','promoC'].forEach(k=>{run[k]=0;});
  run.outTk=[];run.outRet=[];run.outRev=[];run.done=[];

/* Al cajero le llega su caja cuando la tienda está abierta y el jefe le ha dado una. */
function checkRemoteTill(){
  if(!isMember())return;
  const st=room.state,me=(room.members||{})[room.uid]||{};
  const n=st&&st.tills&&st.tills[room.uid],open=st&&(st.phase==='open'||st.phase==='closing')&&st.ts&&srvNow()-st.ts<6000;
  if(me.role==='atc'&&n&&open){if(!run||!run.remote)startRemoteTill(n);else run.till=n;if(st.up)meta.up=Object.assign(meta.up,st.up);}
  else if(run&&run.remote)stopRemoteTill();

/* --- lado del jefe: empleados reales dentro de meta.emp (e.real = uid) --- */
function syncRealEmps(){
  if(!isHost())return;
  const ms=room.members||{};let ch=false;
  const hostU=room.sim?room.info.host:room.uid;
  meta.emp.filter(e=>e.real).forEach(e=>{const m=ms[e.real];if(!m||!ROLES[m.role]||e.real===hostU){dropReal(e);ch=true;}});
  Object.entries(ms).forEach(([u,m])=>{
    if(u===hostU||!ROLES[m.role])return;
    let e=meta.emp.find(x=>x.real===u);
    const nm=cleanName(m.name);
    if(!e){
      e=newEmp(m.role,meta,{real:u,name:nm,face:'🧑‍💼',rap:0.6,trato:0.6,punt:1,act:0.7,hon:1,moral:70,pers:null,nat:0,langs:['es'],trial:3});
      meta.emp.push(e);ch=true;
      toast('🎮 '+nm+' entra en '+ROLES[m.role].n,'good');
    }
    if(e.role!==m.role||e.name!==nm){e.role=m.role;e.name=nm;ch=true;}
    if(run&&!run.over&&run.duty){
      const d=run.duty[e.id];
      if(m.on&&(!d||d.st==='gone')){
        run.duty[e.id]={st:'ok',at:run.t,busy:0,task:null,slack:null,slackT:0,seen:0,cnt:1};
        if(!d||!d.cnt)e.st.shifts++;
        ch=true;toast('🎮 '+nm+' se pone a trabajar','good');
      }else if(!m.on&&d&&d.st!=='gone'){releaseReal(e);d.st='gone';ch=true;toast('📴 '+nm+' se ha desconectado','bad');}
    }
  });
  if(run&&!run.over)syncTills();
  if(ch&&run&&!run.over){renderAll();pubState(true);}
}
function releaseReal(e){
  if(!run)return;
  run.tasks.forEach(t=>{if(t.who===e.id){t.who=null;t.real=0;t.dl=Math.max(t.dl,run.t+10);}});
  const d=run.duty&&run.duty[e.id];if(d){d.busy=0;d.task=null;}
}
function dropReal(e){releaseReal(e);meta.emp=meta.emp.filter(x=>x!==e);if(run&&run.duty)delete run.duty[e.id];baja(e,'Jugador/a: dejó el puesto o cambió de cargo');}
/* Herramientas del puesto de trabajo del empleado real: se piden con un act «take» de t negativo
   (−1 inventario, −2 pedido, −3 arqueo, −4 entrevista, −(1000+pid) reponer, −(5000+id) responder una reseña).
   El jefe crea el aviso y se lo da a quien lo ha pedido. */
function toolTask(e,code){
  if(!run||run.over||!isFree(e)){note(e.real,'Termina lo que tienes entre manos primero.',true);return;}
  const r=e.role,open=k=>run.tasks.find(t=>t.k===k&&!t.who);
  let t=null;
  if(code<=-5000&&code>-7000&&r==='rrpp'){
    const id=-code-5000,rv=run.reviews&&run.reviews.find(x=>x.id===id);
    if(!rv||rv.ans){note(e.real,'Esa reseña ya está contestada.',true);return;}
    rv.ans=1;const good=Math.random()<perf(e,true);repAdd(+(good?0.05:-0.03),'Reseñas contestadas por RR.PP.');if(good)e.st.tasks++;else e.st.tfail++;
    logE(e,'Contestó una reseña de '+rv.st+' estrellas');note(e.real,good?'💬 Respuesta publicada: el cliente se ha quedado más tranquilo (+reputación).':'💬 Tu respuesta ha sentado regular: más tacto la próxima vez.',!good);return;
  }
  if(code<=-1000&&r==='alm'){
    const pid=-code-1000,p=CAT.find(x=>x.id===pid);if(!p)return;
    if(!(meta.back[pid]>0)){note(e.real,'De '+p.n+' no queda nada en el almacén: hay que pedirlo.',true);return;}
    t=run.tasks.find(x=>(x.k==='repo'||x.k==='call')&&x.pid===pid&&!x.who);
    if(!t){const n=aisleOf(pid);t=almTask('repo','📦',10,TSHORT.repo.replace('%p%',p.n).replace('%n%',n),'Reponer «'+p.n+'» en el pasillo '+n+'.',{pid,n,roles:['alm','atc']});}
  }
  else if(code===-1&&r==='alm'){t=open('inv');if(!t){const n=ri(1,9);t=almTask('inv','📋',9,'Inventario del pasillo '+n,'Contar lo que queda en el pasillo '+n+' y apuntar lo que falta.',{n});}}
  else if(code===-2&&r==='alm'){t=open('order')||almTask('order','🧾',8,'Pedido a Hacendado de lo que se acaba','Hacer el pedido de lo que se acaba al distribuidor.');}
  else if(code===-3&&r==='back'){t=open('cash');if(!t){const n=ri(1,3);t=almTask('cash','🧮',12,TSHORT.cash.replace('%n%',n),'Arqueo de la caja '+n+': contar el cajón y ver si cuadra.',{n,roles:['back']});}}
  else if(code===-9&&r==='alm'){t=open('truck');if(!t){const pend=Object.values(meta.back).reduce((a,v)=>a+v,0);if(!pend){note(e.real,'En el muelle no hay nada que colocar.',true);return;}t=almTask('truck','🚚',14,'Colocar mercancía del muelle ('+pend+' uds)','Hay '+pend+' uds en el muelle: descargar, almacenar y subir a la estantería.');}}
  else if(code===-7&&r==='rrpp'){
    if(run.t-(run.promoT||-99)<45){note(e.real,'Ya hay una campaña en marcha: espera un poco.',true);return;}
    if(meta.money<1000){note(e.real,'No hay bote para pagar la campaña.',true);return;}
    run.promoT=run.t;meta.money-=1000;const good=Math.random()<perf(e,true);repAdd(+(good?0.1:0.02),'Campaña en redes');if(good)e.st.tasks++;else e.st.tfail++;
    logE(e,'Lanzó una campaña en redes');note(e.real,good?'📣 La campaña ha funcionado: más gente habla bien de la tienda (+reputación, −10 €).':'📣 La campaña ha pasado sin pena ni gloria (−10 €).',!good);return;
  }
  else if(code<=-8000&&code>-9000&&r==='rrhh'){
    const k=-code-8000,rl=Object.keys(ROLES)[Math.floor(k/10)],msg=setVac(rl,k%10===1?1:-1,e);note(e.real,msg||'—');return;
  }
  else if(code<=-7000&&code>-8000&&r==='rrhh'){
    const m=empById(-code-7000);run.cheer=run.cheer||{};
    if(!m||m.real){return;}
    if(run.t-(run.cheer[m.id]||-99)<30){note(e.real,m.name+' ya ha tenido su charla: espera un poco.',true);return;}
    run.cheer[m.id]=run.t;const good=Math.random()<perf(e,true);m.moral=clamp(m.moral+(good?7:2),0,100);if(good)e.st.tasks++;
    logE(e,'Habló con '+m.name+' para animarle');note(e.real,good?'👍 '+m.name+' sale de la charla con otra cara (+ánimo).':'🙂 '+m.name+' te escucha, pero sin mucho entusiasmo.');return;
  }
  else if(code===-4&&r==='rrhh'){if(!open('cv')&&!vacRoles().length){note(e.real,'No hay vacantes publicadas: publica una antes de entrevistar.',true);return;}t=open('cv')||almTask('cv','🧑‍💼',14,TSHORT.cv,'Un candidato espera en la puerta para la entrevista.',{roles:['rrhh'],cand:makeCand()});}
  if(!t){note(e.real,'Eso no es de tu puesto.',true);return;}
  giveReal(t,e,false);
}
function giveReal(t,e,byBoss){
  t.who=e.id;t.real=1;t.match=true;t.span=REAL_LIM;t.until=run.t+REAL_LIM;
  const d=run.duty[e.id];d.busy=1;d.task=t.id;d.slack=null;
  if(byBoss)note(e.real,'El jefe te manda: '+t.ic+' '+t.s);
}
function onAct(a){
  if(!a||!isHost())return;
  const e=meta.emp.find(x=>x.real===a.uid);if(!e)return;
  if(a.k==='till'){if(run&&!run.over)applyTill(e,a);else{toArr(a.ret).forEach(pid=>{meta.stock[pid]=(meta.stock[pid]||0)+1;});}return;}
  if(a.k==='hire'||a.k==='reject'){
    if(e.role!=='rrhh'){note(e.real,'Eso solo lo puede hacer Recursos Humanos.',true);return;}
    const m=room.members[a.u];if(!m||!m.apply)return;
    if(a.k==='hire'){if(staffOf(m.apply).length>=ROLES[m.apply].max){note(e.real,'Ese puesto está completo.',true);return;}hireReal(a.u);note(e.real,'Has contratado a '+cleanName(m.name)+' en '+ROLES[m.apply].n+'.');}
    else{rejectReal(a.u);note(e.real,'Has rechazado la solicitud de '+cleanName(m.name)+'.');}
    logE(e,(a.k==='hire'?'Contrató a ':'Rechazó a ')+cleanName(m.name));
    return;
  }
  if(!run||run.over)return;
  if(a.k==='take'&&+a.t<0){toolTask(e,+a.t);renderAll();pubState(true);return;}
  const t=run.tasks.find(x=>x.id===a.t);
  if(a.k==='take'){
    if(!t||t.who||!isFree(e)){note(e.real,'Llegas tarde: eso ya lo tiene otra persona.',true);return;}
    if(!toArr(t.roles).includes(e.role)){note(e.real,'Eso no es de tu departamento.',true);return;}
    giveReal(t,e,false);
  }else if(a.k==='done'){
    if(!t||t.who!==e.id)return;
    doneReal(t,e,clamp(+a.sc||0,0,1),!!a.early,a.x||{});
  }else if(a.k==='drop'){if(t&&t.who===e.id)releaseReal(e);}
  if(run&&!run.over)renderAll();
  pubState(true);
}
function doneReal(t,e,sc,early,x){
  run.tasks=run.tasks.filter(x=>x!==t);
  const d=run.duty[e.id];if(d){d.busy=0;d.task=null;}
  const r=applyMG(t,sc,early,e,x);
  if(t.k!=='tk'){if(r.good)e.st.tasks++;else e.st.tfail++;tStat(t,r.good,e);}
  logE(e,(r.good?'Resolvió':'Hizo mal')+' un aviso: '+t.s);
  toast('🎮 '+e.name+': '+r.msg,r.good?'good':'bad');
  note(e.real,r.msg,!r.good);
  checkRep();
}
function realFail(t){
  const e=empById(t.who);run.tasks=run.tasks.filter(x=>x!==t);
  if(e){const d=run.duty[e.id];if(d){d.busy=0;d.task=null;}}
  if(t.k==='tk'){if(e)note(e.real,'Se te pasó el tiempo con la reclamación. Se queda en la bandeja.',true);renderAll();return;}
  repAdd(-t.pen/2,'Avisos que salieron mal');tStat(t,false,e);
  if(e){e.st.tfail++;logE(e,'Dejó a medias un aviso: '+t.s);note(e.real,'Se te pasó el tiempo: '+t.s,true);toast('🎮 '+e.name+' no ha terminado a tiempo: '+t.s,'bad');}
  if(t.chk)albApply(false);
  sBad();renderAll();checkRep();
}
/* Lo que ven los demás: cada segundo mientras el juego del jefe está abierto (si no, se congela). */
function pubState(force){
  if(!isHost()||!fb)return;
  const now=performance.now();
  if(!force&&now-room.lastPub<1000)return;
  room.lastPub=now;
  const tasks=run&&!run.over?run.tasks.map(t=>{
    const e=typeof t.who==='number'?empById(t.who):null,left=(t.who?t.until:t.dl)-run.t;
    return {id:t.id,k:t.k,ic:t.ic,s:t.s,txt:t.txt,n:t.n||0,cand:t.cand||null,fd:t.fd||null,pid:t.pid||0,lang:t.lang||'',roles:t.roles,npc:t.npc?1:0,left:isFinite(left)?Math.max(0,Math.round(left)):-1,
      who:t.who==='me'?'jefe':e?(e.real||e.name):'',inv:t.k==='inv'?(t.inv||(t.inv=invData(t.n))):null,ord:t.k==='order'?(t.ord||(t.ord=ordData())):null,bk:t.k==='truck'?Object.keys(meta.back).filter(id=>meta.back[id]>0).map(Number).slice(0,12):[],
      dept:t.dept||'',mis:!!t.mis,refund:t.refund||0};
  }):[];
  const phase=!run?'lobby':run.over?(run.dead?'dead':meet?'meeting':'shop'):run.closing?'closing':'open';
  fb.set(rRef('state'),plain({day:meta.day,t:run?Math.round(run.t):0,dur:run?run.dur:(room.info.dur||100),money:Math.round(meta.money),rep:Math.round(meta.rep*10)/10,
    q:run?run.queue.length:0,v:APPV,tills:run&&run.tills?Object.fromEntries(Object.entries(run.tills).map(([u,t])=>[u,t.n])):{},tq:run&&run.tills?Object.fromEntries(Object.entries(run.tills).map(([u,t])=>[t.n,Object.keys(t.out).length])):{},up:meta.up,dep:depData(),cnt:Object.fromEntries(Object.keys(ROLES).map(r=>[r,staffOf(r).length])),vac:Object.fromEntries(Object.keys(ROLES).map(r=>[r,vacOpen(r)])),phase,away:!!(run&&run.away),tasks,rpt:run&&run.over&&room.rpt||null,cam:run&&!run.over?camModel():null,ts:fb.serverTimestamp()})).catch(()=>{});
  if(!room.sim&&!room.waitRelay&&!relayActive()&&(force||now-room.lastHb>10000)){room.lastHb=now;fb.update(rRef('info'),{hb:fb.serverTimestamp(),day:meta.day,status:run&&!run.over?'open':run?'closed':'lobby'}).catch(()=>{});}
}

/* Al empezar el turno: quién viene, quién llega tarde, quién falta y qué incidentes tendrá. */
function prepShift(){
  const notes=[],quit=[];
  meta.emp.slice().forEach(e=>{
    if(e.real){const m=room&&room.members[e.real],on=!!(m&&m.on);run.duty[e.id]={st:on?'ok':'gone',at:0,busy:0,task:null,slack:null,slackT:0,seen:0,cnt:on?1:0};if(on)e.st.shifts++;return;}
    /* Dimisión: si llevas tú la tienda, te lo dice a la cara (escena) y viene a trabajar mientras decides. */
    if(e.moral<15&&Math.random()<0.4){if(!bossScn()){meta.emp=meta.emp.filter(x=>x!==e);baja(e,'Dimitió con el ánimo por los suelos (estaba el encargado)',true);notes.push(e.name+' ha dejado el trabajo');return;}quit.push(e);}
    const d={st:'ok',at:0,busy:0,task:null,slack:null,slackT:0,seen:0};
    if(e.off===meta.day)d.st='off';
    else if(Math.random()<(e.moral<30?0.3:0.03)*(1.3-e.punt)){d.st='abs';e.st.abs++;notes.push(e.name+' no viene hoy');logE(e,'Faltó sin avisar');}
    else if(Math.random()<0.4*(1-e.punt)){d.st='late';d.at=rnd(8,30);e.st.late++;logE(e,'Llegó tarde');}
    if(d.st==='ok'||d.st==='late'){
      e.st.shifts++;
      if(Math.random()<0.3*(1-e.trato)*(e.moral<50?1.6:1))run.ev.push({t:rnd(20,90),e:e.id,k:'quej'});
      else if(Math.random()<0.25*e.trato)run.ev.push({t:rnd(20,90),e:e.id,k:'fel'});
      /* Merma interna: la poca honestidad (y el poco ánimo o la poca responsabilidad) acaba en un hurto pequeño durante el turno; a veces se pilla (theft). */
      if(Math.random()<0.12*(1-(e.hon==null?0.6:e.hon))*(e.moral<40?1.8:1)*(1.3-(e.punt+e.act)/2))run.ev.push({t:rnd(25,85),e:e.id,k:'robo',v:ri(3,40)*100});
    }
    run.duty[e.id]=d;
  });
  quit.forEach(quitScene);
  const wk=meta.emp.filter(working);
  if(wk.some(e=>e.role==='rrhh'))wk.forEach(o=>{o.moral=clamp(o.moral+2,0,100);});

/* Quien te cubre atiende solo al cliente de delante, más lento y con fallos según su rendimiento. */
function coverServe(c,e){
  const p=perf(e,e.role==='atc');
  run.away.served++;e.st.cv++;
  if(c.phase==='complaint'){
    const ok=Math.random()<p,dep=ok?c.complaint.dept:pick(['back','rrpp','alm']);
    if(dep!=='atc')addTicket(dep,c.complaint.t,c.complaint.refund,c.complaint.sev,dep!==c.complaint.dept);
    if(!ok)e.st.cvErr++;
    run.served++;removeFront();renderAll();return;
  }
  c.items.forEach(i=>{
    if(i.scanned||i.denied)return;
    if(i.age&&c.minor&&Math.random()<Math.max(p,0.95)){i.denied=true;ret(i);return;}
    i.scanned=true;
    if(i.age&&c.minor){c.err++;const m=minorSale(e.name+' ha vendido');if(m)toast(m,'bad');}
  });
  c.bag=Math.random()<p?c.wantsBag:!c.wantsBag;
  /* Normas de caja: el que te cubre acierta con el cupón y con el billete falso según su rendimiento. */
  if(c.cup&&c.cup.d==null)cupPick(c,(Math.random()<p)===!!c.cup.ok?'ok':'no',true);
  if(c.pay==='cash'&&ruleOn('falso')&&totalOf(c)>=1000&&Math.random()<fakeP()&&Math.random()>p){const v=totalOf(c)>2000?5000:2000;run.fines+=v;meta.money-=v;run.fakes=(run.fakes||0)+v;run.fakeIn=(run.fakeIn||0)+1;toast('💶 '+e.name+' ha aceptado un billete falso de '+v/100+' €: −'+fmt(v),'bad');}
  if(c.pay==='cash'&&Math.random()<(1-p)*0.6){const loss=ri(50,500);run.fines+=loss;meta.money-=loss;c.err++;toast(e.name+' se ha equivocado con el cambio: −'+fmt(loss),'bad');}
  if(c.err||c.bag!==c.wantsBag)e.st.cvErr++;
  finish(c,false);
}

/* Repartir la cola: un cajero/a de la casa libre abre otra caja y se lleva a los últimos de tu cola (las reclamaciones se quedan contigo).
   Lo hace solo cada cierto tiempo si ve tu cola larga (según su actitud y su ánimo), o cuando el jefe lo dice. */
const freeTill=()=>run&&!run.remote&&Object.keys(run.tills||{}).length<2?staffOf('atc').find(e=>!e.real&&isFree(e)&&!run.duty[e.id].slack&&!(run.away&&run.away.cover===e.id)):null;
function sendQueue(e,n,boss){
  if(!run||run.remote||!e)return 0;let k=0;
  for(let i=1;i<run.queue.length&&k<n;){const c=run.queue[i];if(c.phase==='complaint'||c.complaint){i++;continue;}
    const v=c.items.filter(x=>!x.age||!c.minor).reduce((a,x)=>a+x.p,0),cost=Math.round(v*(SUPS[0].cf+OFF.merma));
    c.items.filter(x=>x.age&&c.minor).forEach(ret);

    run.queue.splice(i,1);k++;}
  if(k){run.callT=run.t;toast((boss?'📢 Tú: «¡Pasen a la otra caja, por favor!» ':'📢 ')+e.face+' '+e.name+': «¡'+(k===1?'El siguiente':'Los siguientes')+', por aquí!» '+(k===1?'Pasa el primero de la cola.':'Pasan los '+k+' primeros de la cola.'),'good');
    if(boss)e.moral=clamp(e.moral+1,0,100);renderAll();}

}

function startRot(t,p){
  const sameA=shuffle(CAT.filter(x=>x.id!==p.id&&!x.age&&aisleOf(x.id)===aisleOf(p.id)));
  const decoys=sameA.slice(0,2).concat(shuffle(CAT.filter(x=>x.id!==p.id&&!x.age&&!sameA.slice(0,2).includes(x))).slice(0,1));
  const per=perish(p.id),front=[];

  if(!front.some(u=>u&&u.bad)){const i=front.findIndex(u=>u);const k=i<0?0:i;front[k]={bad:per?'cad':'roto',d:per?-ri(1,5):null,out:false};}

  return {kind:'rot',t,p,step:0,crates:shuffle([p].concat(decoys)).map(x=>({id:x.id,e:x.e,n:x.n,f:x.f||''})),front,back:[null,null,null,null],newLeft:4,
    wrongBox:0,goodOut:0,badOut:0,rotErr:0,priceErr:false,pda};

function startRecv(t){
  const ids=t.remote?(t.bk||[]):Object.keys(meta.back).filter(id=>meta.back[id]>0).map(Number);
  const pool=shuffle(ids.length?ids.map(id=>CAT.find(x=>x.id===id)).filter(Boolean):CAT.filter(x=>!x.age));
  const extra=shuffle(CAT.filter(x=>!x.age&&!pool.includes(x)));
  const prods=pool.concat(extra).slice(0,4);
  const lines=prods.map(x=>{const q=ri(1,3),r=Math.random();const falta=r<0.25&&q>1?1:0,roto=!falta&&r<0.45?1:0;
    return {id:x.id,e:x.e,n:x.n,q,got:q-falta,roto,mark:null};});

function almAct(a,b){

    else if(a==='mgout'){const u=mg.front[+b.dataset.i];if(!u||u.out)return;u.out=true;if(u.bad){mg.badOut++;sCoin();}else{mg.goodOut++;sBad();mg.fx={sel:'.gondola',k:'bad'};toast('Eso estaba bien: lo has tirado','bad');}}
    else if(a==='mgnext'){mg.front=mg.front.map(u=>u&&u.out?null:u);mg.step=2;}
    else if(a==='mgput'){
      const row=b.dataset.r,i=+b.dataset.i,arr=row==='b'?mg.back:mg.front;if(arr[i]||mg.newLeft<=0)return;
      arr[i]={isNew:1};mg.newLeft--;

      if(mg.newLeft<=0||![...mg.back,...mg.front].some(u=>!u))mg.step=3;
    }
    else if(a==='mgprice'){const x=mg.pda[+b.dataset.i];if(!x)return;mg.priceErr=x.id!==mg.p.id;if(mg.priceErr)toast('Esa etiqueta es de otro producto: en caja se cobrará mal','bad');return finishRot();}
  }else if(mg.kind==='recv'){
    if(a==='mgmark'){const l=mg.lines[+b.dataset.i];if(l){l.mark=b.dataset.k;sCoin();mg.fx={sel:`[data-act=mgmark][data-i="${b.dataset.i}"][data-k="${b.dataset.k}"]`,k:'ok'};}}
    else if(a==='mgsignalb'){if(!mg.lines.every(l=>l.mark))return;recvToDock();sCoin();if(!mg.dock.length)return finishRecv();}
    else if(a==='mgpick'){mg.sel=+b.dataset.i;}

      const bx=mg.dock[mg.sel];if(!bx||bx.done)return;

      mg.dock.forEach(o=>{if(!o.done&&o.life!=null&&bx.life==null){o.life--;if(o.life<=0){o.done=true;mg.spoiled++;toast('❄️ '+o.n+' ha perdido la cadena de frío: a la basura','bad');}}});
      mg.sel=-1;if(mg.dock.every(o=>o.done))return finishRecv();
    }
  }else{
    if(a==='mgsign'){mg.sign=true;sCoin();}
    else if(a==='mgshard'){if(mg.shards>0){mg.shards--;sCoin();}}
    else if(a==='mgmop2'){const i=+b.dataset.i;if(!mg.sign)mg.early=true;if(mg.shards>0&&!mg.cut){mg.cut=true;sBad();toast('🩸 Has fregado con cristales en el suelo y te has cortado','bad');}mg.spots[i]++;sCoin();}

    else if(a==='mgend2')return finishSpill();
  }
  renderMG();
}

/* ---------- minijuegos de Backoffice ----------
   refund (reclamación de dinero): el ticket del cliente y lo que dice. Escenarios: cobrado dos veces, precio
          distinto del de la etiqueta, cambio mal dado o el cliente se equivoca. 1 marcar el error en el ticket
          (o «no hay error», o «no es de Backoffice» si viene mal derivada) · 2 preparar el reembolso exacto con
          billetes y monedas · 3 devolverlo por donde pagó (tarjeta o efectivo). El importe correcto es t.refund.
   cash  (arqueo): contar el cajón contra lo que dice el sistema y dar el resultado (cuadra, falta o sobra). */
function startRefund(t){
  const R=Math.max(5,Math.round(t.refund||ri(200,1500))),wrong=!t.mis&&Math.random()<0.2;
  const sc=wrong?'none':pick(['dup','price','change']);
  const pool=shuffle(CAT.filter(x=>!x.age)).slice(0,ri(4,6));
  const lines=pool.map(x=>({n:x.n,e:x.e,q:1,p:x.p,bad:false}));
  let claim='',shelf=null,cash=null;
  if(sc==='dup'){const l=lines[0];l.p=R;lines.splice(ri(2,lines.length),0,Object.assign({},l,{bad:true}));claim='«¡Me habéis cobrado dos veces lo mismo!»';}
  else if(sc==='price'){const l=lines[ri(0,lines.length-1)];shelf=l.p;l.p+=R;l.bad=true;claim='«En la estantería ponía otro precio, que lo he visto yo.»';}
  else if(sc==='change'){claim='«Me disteis mal el cambio, me falta dinero.»';}
  else claim=pick(['«Me habéis cobrado de más, seguro.»','«Esto me ha salido carísimo, revisadlo.»']);
  const total=lines.reduce((s,l)=>s+l.q*l.p,0),pay=sc==='change'?'cash':pick(['card','cash']);
  if(pay==='cash'){const need=total+(sc==='change'?R:0),given=[500,1000,2000,5000,10000].find(b=>b>=need)||Math.ceil(need/5000)*5000;cash={given,change:given-total-(sc==='change'?R:0)};}
  return {kind:'refund',t,step:0,scen:sc,need:sc==='none'?0:R,lines,claim,shelf,cash,pay,mark:null,tray:[],method:null,mis:!!t.mis};
}
function startCash(t){
  const D=[[5000,'50 €'],[2000,'20 €'],[1000,'10 €'],[500,'5 €'],[200,'2 €'],[100,'1 €'],[50,'0,50'],[20,'0,20'],[10,'0,10']];
  const piles=D.map(([v,l])=>({v,l,n:ri(0,v>=2000?3:v>=500?6:9)})).filter(p=>p.n>0);
  const real=piles.reduce((s,p)=>s+p.v*p.n,0),r=Math.random();
  const diff=r<0.4?-pick([500,1000,200,50,2000]):r<0.6?pick([100,500,20]):0;
  const sys=real-diff;
  const opts=shuffle([0,diff||-pick([500,1000]),diff?-diff:pick([100,200])].filter((v,i,a)=>a.indexOf(v)===i)).slice(0,3);
  if(!opts.includes(diff))opts[0]=diff;
  return {kind:'cash',t,piles,sys,real,diff,counted:{},opts:shuffle(opts)};
}

const vacOpen=r=>Math.max(0,Math.min((meta.vac||{})[r]||0,ROLES[r].max-staffOf(r).length));

  if(nv===cur)return d>0?'No quedan plazas libres en '+ROLES[r].n+'.':'No había vacante publicada en '+ROLES[r].n+'.';
  meta.vac[r]=nv;if(e)logE(e,(d>0?'Publicó una vacante de ':'Retiró una vacante de ')+ROLES[r].n);

function rrhhAct(a,b){

      mg.x={hire:hire?1:0,wage:c.wage+mg.offer,ask:c.wage,q:Math.round(q*100)/100,cand:c,integ:mg.integ?1:0};

const INTEG=1500,integBand=h=>{const v=(h==null?0.6:h)+rnd(-0.15,0.15);return v>0.62?'alta':v<0.38?'baja':'media';};
function hireFromCv(c,wage,mine){

function applyFeud(x,ok){
  const A=empById(+x.a),B=empById(+x.b);if(!A||!B)return 'Ya no trabajan juntos.';
  if(ok){[A,B].forEach(e=>{e.moral=clamp(e.moral+4,0,100);});const w=x.truth==='a'?A:x.truth==='b'?B:null;if(w)w.moral=clamp(w.moral+3,0,100);return 'Bronca resuelta entre '+A.name+' y '+B.name+'. Vuelven al trabajo.';}

}

/* Reclamación de producto agotado (Almacén): la PDA dice si queda en el almacén, si llega mañana y si hay
   algo parecido. Apartárselo si queda; si no, ofrecer el parecido; si tampoco, que vuelva cuando llegue. */
function startAgot(t){
  const p=pick(CAT.filter(x=>!x.age)),back=Math.random()<0.55?ri(1,6):0,inc=Math.random()<0.5;
  const alt=Math.random()<0.7?pick(CAT.filter(x=>!x.age&&x.id!==p.id&&aisleOf(x.id)===aisleOf(p.id))):null;
  const best=back?'apart':alt?'alt':inc?'wait':'sorry';
  const o=[['apart','📦 Ir al almacén y apartárselo'],['alt','🔁 Ofrecerle '+(alt?alt.e+' '+alt.n:'algo parecido')],['wait','📅 Que vuelva mañana, que llega en el camión'],['sorry','🙄 «No hay y punto»']]
    .map(([k,lb])=>[lb,t.mis?0:k===best?1:(k==='wait'&&!back?0.5:0)]);
  if(t.mis)o.push(['↩️ Esto no es de Almacén: devolverla',1]);
  return {kind:'agot',t,p,back,inc,alt,opts:shuffle(o)};
}

  else{

    for(let i=0;i<8;i++)list.push(CAT.find(x=>x.id===(ids.length?pick(ids):pick(CAT).id))||CAT[0]);
    mg={kind:'truck',t,list,i:0,ok:0};

const MGK={inv:'inv',order:'order',repo:'rot',call:'rot',spill:'spill2',help:'ask',tour:'ask',truck:'recv',tk:'tk',cash:'cash',cv:'cv',feud:'feud'};

/* Efectos de un minijuego terminado (lo hagas tú o un empleado real desde su navegador). */
function applyMG(t,sc,early,e,x){
  const kind=MGK[t.k]||'recv';x=x||{};
  let msg='',good=sc>=0.6;
  const lose=(id,n)=>{n=Math.max(0,Math.round(+n||0));const s=Math.min(n,meta.stock[id]||0);meta.stock[id]=(meta.stock[id]||0)-s;return n;};
  if(kind==='inv'){
    const low=toArr(x.low).map(Number).filter(id=>CAT.some(y=>y.id===id));
    if(good){run.prio=(run.prio||[]).concat(low);run.ordAt=-99;}
    msg='Inventario del pasillo '+t.n+': '+(+x.ok||0)+' de '+(+x.n||0)+' bien contados'+(good?(low.length?' · '+low.length+' a pedidos':' · nada que pedir'):' · recuento poco fiable, no se manda a pedidos')+'.';
  }else if(kind==='order'){
    let cost=0;const items={};
    Object.keys(x.items||{}).forEach(id=>{const p=CAT.find(y=>y.id===+id);if(!p)return;const c=6*unitCost(p,'hac');if(cost+c<=meta.money){items[id]=6;cost+=c;}});
    if(cost){meta.money-=cost;noteBuy(cost);run.autoBuy=(run.autoBuy||0)+cost;meta.orders.push({day:meta.day+1,sup:'hac',items});}
    run.ordAt=run.t;
    msg=(cost?'Pedido a Hacendado: '+Object.keys(items).length+' productos ('+fmt(cost)+'), llega mañana':'Sin pedido')+(+x.miss?' · se han quedado '+x.miss+' sin pedir':'')+(+x.waste?' · '+x.waste+' iban sobrados':'')+'.';
  }else if(kind==='rot'){
    const mv=moveStock(t.pid,Math.round(8*sc)),p=CAT.find(y=>y.id===t.pid)||CAT[0],L=[];
    const merma=lose(t.pid,x.merma);if(merma)L.push(merma+' a merma');
    if(+x.badLeft>0&&Math.random()<0.5){addTicket('rrpp','Ha encontrado '+p.n+' caducado en la estantería',0,2,false);repAdd(-0.15,'Caducado a la vista');L.push('se ha quedado algo caducado a la vista');}
    if(+x.priceErr){addTicket('back','Le cobraron '+p.n+' a otro precio que el de la etiqueta',Math.max(50,Math.round(p.p*0.3)),1,false);L.push('etiqueta equivocada');}

/* En la entrevista mienten un 25% de las veces (siempre para quedar mejor). */
function interview(k,v){let l=v>0.62?'hi':v<0.38?'lo':'mid';if(Math.random()<0.25)l='hi';return{q:IV[k].q,a:pick(IV[k][l])};}
function genCands(){
  const out=[],vr=vacRoles();
  /* Ventaja de la carrera «Contactos en el barrio»: uno bueno de más en la primera reunión. */
  if(meta.perkCand){meta.perkCand=0;const c=newEmp(vr[0]||'atc',meta,{},[]);['rap','trato','punt','act'].forEach(k=>{c[k]=Math.round(rnd(0.75,0.95)*100)/100;});c.hon=Math.round(rnd(0.8,1)*100)/100;
    c.wage=Math.round(wageOf(c.role)*1.04);c.exp=ri(4,10);c.ref='Te lo recomienda un contacto del barrio';c.qa=['rap','trato'].map(k=>interview(k,c[k]));out.push(c);}
  if(!vr.length)return out;
  for(let i=0;i<3;i++){
    const c=newEmp(vr[i%vr.length],meta,{},out.map(x=>x.name));
    c.wage=Math.round(wageOf(c.role)*(1+ri(0,4)*0.02));c.exp=ri(0,8);
    c.qa=['rap','trato','punt','act'].sort(()=>Math.random()-0.5).slice(0,2).map(k=>interview(k,c[k]));
    out.push(c);
  }

}
function genReqs(){
  const npc=meta.emp.filter(e=>!e.real),r=[],used=new Set(),n=Math.min(npc.length,ri(1,2));
  for(let i=0;i<n;i++){
    const a=pick(npc.filter(e=>!used.has(e.id)));if(!a)break;used.add(a.id);
    const types=['raise','off','extra'].concat(a.pers==='quejica'?['raise','raise']:[]);const others=npc.filter(e=>!used.has(e.id));if(others.length)types.push('feud');
    const k=pick(types);
    if(k==='feud'){const b=pick(others);used.add(b.id);r.push({k,a:a.id,b:b.id,done:null});}
    else r.push({k,a:a.id,done:null});
  }
  return r;
}
const RUMOR={punt:'llega tarde a todo y ficha como si nada',trato:'contesta fatal a los clientes cuando no miras',rap:'va a cámara lenta cuando no hay nadie',act:'se escaquea en cuanto puede'};

/* ---------- despidos: motivo, pruebas, finiquito e indemnización ----------
   Finiquito: vacaciones no disfrutadas (sueldo × turnos / 30). Indemnización: procedente 1 €/turno (mín. 5 €);
   improcedente 20 € + 3 €/turno. Si el motivo no se sostiene con lo registrado (st + historial), 70% de denuncia;

const FIRE={

/* Liquidación (Estatuto de los Trabajadores): vacaciones no disfrutadas (30 días naturales al año, prorrateados);
   despido objetivo procedente: 20 días de salario por año trabajado; improcedente: 33 días por año (art. 56). Un turno = un día. */

/* Vender alcohol a un menor en la Comunidad de Madrid: Ley 5/2002, de 27 de junio, sobre Drogodependencias y otros Trastornos Adictivos
   (prohibición en el art. 30.2; cuantías en el art. 59). Solo se multa si hay inspección o denuncia (12 %).

   grave 30.050,62–60.101,21 €; muy grave 60.101,22–601.012,10 € (caso real en Coslada: 60.102 € por venta reiterada).
   La primera, grave en su grado mínimo (30.050,62 €); la segunda, grave reincidente (30.051–60.101 €); desde la tercera, muy grave en su mínimo (60.101,22 €). */
function minorSale(who){
  repAdd(-0.3,'Alcohol vendido a un menor');
  if(Math.random()<0.12){const n=meta.minorFine=(meta.minorFine||0)+1,f=n>=3?6010122:n===2?ri(30051,60101)*100:3005062;

/* El cálculo del despido (liquidación, denuncia, ánimo del resto, nota al real); lo usan la reunión y el hurto pillado (fireNow). */
function fireCore(e,r){
  const F=FIRE[r],h=hist(e),fin=finiquito(e),bad=score(e)<0.45;
  const just=r==='trial'||(r!=='none'&&F.ok(e,h));
  let ind=r==='trial'?0:r==='none'?indImp(e):indProc(e),cost=fin+ind,extra=0;
  const L=['<b>Carta de despido de '+e.face+' '+e.name+'.</b> Motivo: '+F.t.replace(/^\S+ /,'')+(F.ev(e,h)?' ('+F.ev(e,h)+')':'')+'.',
    'Finiquito por vacaciones no disfrutadas ('+e.days+(e.days===1?' turno':' turnos')+'): '+fmt(fin)+'.',
    (r==='trial'?'Sin indemnización: estaba en periodo de prueba.':r==='none'?'Indemnización por despido improcedente: '+fmt(ind)+'.':just?'Indemnización por despido procedente: '+fmt(ind)+'.':'Le pagas la indemnización de un despido procedente ('+fmt(ind)+'), aunque no tienes pruebas.')];
  if(just&&!e.warn&&['abs','late','caught','quej','robo'].includes(r))L.push('Sin amonestación previa por escrito.');
  const risk=r==='trial'||r==='none'?0:just?(e.warn>0?0:0.15):0.7;
  if(Math.random()<risk){
    extra=Math.max(0,indImp(e)-ind)+ri(600,1500)*100;cost+=extra;repAdd(-0.3,'Despido denunciado y perdido');
    L.push(just?'⚖️ Te denuncia: nunca le diste un toque antes de despedirle. El juez lo declara improcedente: −'+fmt(extra)+' y −0,3 de reputación.'
      :'⚖️ Te denuncia: el motivo no se sostiene con lo que hay registrado. Despido improcedente: −'+fmt(extra)+' y −0,3 de reputación.');
  }else if(!just&&r!=='none')L.push('😅 El motivo no se sostenía, pero no te ha denunciado. Esta vez.');
  achCheck('fire',just&&r!=='trial'&&!extra);
  L.push('Total pagado: <b>'+fmt(cost)+'</b>.');
  meta.money-=cost;meta.emp=meta.emp.filter(x=>x!==e);baja(e,'Despedido/a por ti: '+((FIRE[r]&&FIRE[r].t)||r||'sin motivo'),true);
  meta.emp.forEach(x=>{x.moral=clamp(x.moral+(bad?3:-8),0,100);});
  /* Síndrome del superviviente: tras un despido el resto rinde menos (nada si era malo; menos si el despido era justo). */
  const sv=r==='trial'||bad?0:just?1:2;meta.surv=Math.max(meta.surv||0,sv);
  L.push(bad?'El resto respira aliviado.':'El resto se ha quedado tenso'+(sv?': rendirá menos '+sv+(sv===1?' turno':' turnos'):'')+'.');
  if(e.real&&isHost()){note(e.real,'Estás despedido/a. Motivo: '+F.t.replace(/^\S+ /,'')+'. Liquidación: '+fmt(fin+ind)+(extra?' (más lo que le ha sacado tu denuncia al jefe: '+fmt(extra)+')':'')+'.',true,'fire');fb.update(rRef('members/'+e.real),{role:null}).catch(()=>{});}
  return {L,sv};
}

/* ---------- acciones ---------- */
function scanItem(id){
  const c=front();if(!c||c.phase!=='scan')return;
  if(run.pendingId){toast('Primero resuelve el DNI','bad');return;}
  const it=c.items.find(i=>i.id===id);
  if(!it||it.scanned||it.denied)return;
  it.done++;comboTap();run.flash=id;
  if(it.done<it.hits){renderBelt();run.flash=0;return;}
  if(it.age&&c.idOk==='deny'){it.denied=true;ret(it);toast('Ya le viste el DNI: esto tampoco se le vende.');renderAll();run.flash=0;return;}
  if(it.age&&!c.idOk){run.pendingId=id;renderAll();run.flash=0;return;}
  it.scanned=true;
  renderAll();run.flash=0;
}
function idDecision(sell){
  const c=front();if(!c||!run.pendingId)return;
  const it=c.items.find(i=>i.id===run.pendingId);
  run.pendingId=null;
  c.idOk=sell?'sell':'deny';
  if(sell){
    it.scanned=true;
    if(c.minor){run.errors++;c.err++;const m=minorSale('has vendido');if(m)toast(m,'bad');sBad();}
    else sOk();
  }else{
    it.denied=true;ret(it);
    if(c.minor){repAdd(+0.1,'Negaste alcohol a un menor');achCheck('minors',achCount('minors')>=5);toast('Bien visto. Era menor.','good');sOk();}
    else{repAdd(-0.4,'Negaste alcohol a un adulto');c.p=Math.max(0,c.p-c.max*0.3);run.errors++;c.err++;toast('Era mayor de edad. Cliente molesto.','bad');sBad();}
  }
  renderAll();checkRep();
}
function toggleBag(){const c=front();if(!c||c.phase==='done'||run.card)return;c.bag=!c.bag;sCoin();
  /* Si ya estaba pagando en efectivo y con la bolsa no le llega, saca más dinero. */
  if(c.phase==='pay'&&c.pay==='cash'&&c.given<totalOf(c)){c.given=cashGiven(totalOf(c));toast('Saca un poco más para la bolsa: entrega '+fmt(c.given)+'.');}
  renderAll();}
function goPay(){
  const c=front();if(!c||c.phase!=='scan'||run.pendingId)return;
  if(c.items.some(i=>!i.scanned&&!i.denied)){toast('Quedan productos sin escanear','bad');return;}
  /* Si no se lleva nada (menor al que se le negó todo), se va sin pagar y sin cuenta de bolsa. */
  if(c.items.every(i=>i.denied)){c.bag=c.wantsBag=false;toast('No se lleva nada. Siguiente.');finish(c,true);return;}
  /* Cupón (norma de caja del turno 6): primero se decide si se aplica. */
  if(c.cup&&c.cup.d==null){cupScene(c);return;}
  const t=totalOf(c);
  if(t===0){finish(c,true);return;}
  c.phase='pay';
  if(c.pay==='cash'){
    const P=PERS[c.pk]||{};
    if(P.exact&&Math.random()<P.exact){c.given=t;toast('Te paga con los céntimos justos 🪙. No hay cambio.','good');sCoin();finish(c,false);return;}
    else{c.given=cashGiven(t);noteFor(c);}
  }
  renderAll();
}
function payCard(){

function deliver(){
  const c=front();if(!c||c.phase!=='pay'||c.pay!=='cash')return;
  const need=c.given-totalOf(c),got=traySum();
  if(got<need){toast('Falta cambio','bad');sBad();c.p=Math.max(0,c.p-2);return;}
  if(got>need){
    const loss=got-need;run.fines+=loss;meta.money-=loss;run.errors++;c.err++;
    toast('Te pasaste de cambio: −'+fmt(loss),'bad');sBad();

function finish(c,noTip){
  const tot=totalOf(c);if(tot>0){meta.money+=tot;run.sales+=tot;}
  /* IVA de cada producto según su tipo legal (la bolsa, 21 %). */
  const PL=promoLines(c),ivaOf=pid=>(CAT.find(x=>x.id===pid)||{}).iva||10;
  run.ivaR=(run.ivaR||0)+c.items.filter(i=>i.scanned).reduce((a,i)=>{const v=ivaOf(i.pid);return a+i.p*v/(100+v);},0)-PL.reduce((a,x)=>{const v=ivaOf(x.pid);return a+x.d*v/(100+v);},0)+(c.bag?BAG*21/121:0);
  /* Promos: el descuento de caja (para el coste de lo vendido) y lo vendido en promo para el cierre. */
  PL.forEach(x=>{const y=CAT.find(z=>z.id===x.pid);run.pd=(run.pd||0)+x.d;run.promoU=(run.promoU||0)+x.u;run.promoV=(run.promoV||0)+x.u*x.p-x.d;run.promoC=(run.promoC||0)+(y?x.u*unitCost(y,'hac'):0);(run.promoBy=run.promoBy||{})[x.pid]=(run.promoBy[x.pid]||0)+x.u;});
  if(c.bag!==c.wantsBag){
    c.err++;run.errors++;repAdd(-0.3,'Errores de cobro y bolsa');
    toast(c.bag?'No pidió bolsa y se la cobraste':'Pidió bolsa y no se la diste','bad');sBad();
  }
  const frac=c.p/c.max,P=PERS[c.pk]||{},rm=c.reg&&meta.regs[c.reg];
  if(!noTip&&c.err===0){
    const cbB=comboBonus(c);
    let tip=Math.round(frac*250*(meta.up.coffee?1.5:1)*(P.tip!=null?P.tip:1)*(rm&&rm.good>=3?1.3:1)*(1+cbB)/5)*5;
    if(tip>0){run.tips+=tip;toast('Propina para el bote del personal: '+fmt(tip)+(cbB?' · racha +'+Math.round(cbB*100)+'%':''),'good');}
    if(frac>0.5)repAdd(+0.08,'Clientes contentos');
  }
  if(P.influ){
    if(c.err===0){repAdd(+0.3,'Influencer contento');toast('Te ha sacado en su directo. +reputación 📈','good');}
    else{repAdd(-0.5,'Influencer que vio un error');toast('Tu error ya circula por las redes 📉','bad');}
  }
  if(Math.random()<0.5)addReview(c.err>1?2:c.err?3:frac>0.5?5:4,c.face);
  regVisit(c,c.err===0&&frac>0.3);
  if(c.err>0&&Math.random()<0.4)addTicket('back','Error en su compra',ri(100,600),2,false);
  run.served++;if(rushOn())run.rushN=(run.rushN||0)+1;
  achCheck('diva',c.pk==='diva'&&c.err===0&&tot>0);
  juiceDone(c,tot,frac);
  removeFront();
  renderAll();checkRep();
}
/* ---------- sensación de juego en la caja (también en la de los cajeros reales: es el mismo código) ----------
   Racha (CB): escaneos seguidos con ≤ gap s de juego entre toques y sin errores; desde x3 sale «¡Racha!» junto a la cesta

function camStep(m,dt){

  Object.keys(S).forEach(id=>{
    const s=S[id],dx=s.tx-s.x,dy=s.ty-s.y,dd=Math.hypot(dx,dy);
    s.mv=dd>1;

  });
  /* Gente comprando por los pasillos (decorado: más cuanto más avanzan los días). */

  while(cam.shop.filter(s=>!s.th).length<want){const p=SPOT.door;cam.shop.push({x:p[0],y:p[1],tx:p[0],ty:p[1],f:pick(FACES),w:0});}
  let di=0;

    if(s.th){const th=run&&run.th&&run.th.find(x=>x.id===s.th);if(th&&th.ph==='look'&&!s.gone){s.tx=laneX(th.a)+(Math.sin(performance.now()/1500+th.y)>0?14:-4);s.ty=th.y;s.w=1e9;}else if(!s.gone){s.tx=SPOT.door[0];s.ty=SPOT.door[1]+12;}}
