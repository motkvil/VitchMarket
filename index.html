<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VitchMarket</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=DM+Mono:wght@400;500&family=VT323&family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout: HUD arriba, cola de clientes, mostrador (cinta) a la izquierda y caja registradora a la derecha. */
:root{
  --floor:#17352f; --floor2:#1d443b; --paper:#f6f1e4; --ink:#1b1f1d;
  --sign:#e5383b; --tag:#ffd23f; --ok:#2a9d5c; --mute:#7c8a84; --belt:#2b2f2e;
  --display:'Bungee',Impact,sans-serif; --body:'DM Mono',ui-monospace,Menlo,monospace; --led:'VT323',ui-monospace,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;}
body{
  background:var(--floor);
  background-image:
    linear-gradient(var(--floor2) 1px,transparent 1px),
    linear-gradient(90deg,var(--floor2) 1px,transparent 1px);
  background-size:48px 48px;
  color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.4;
  -webkit-user-select:none;user-select:none;
}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--tag);outline-offset:2px}
#app{max-width:1060px;margin:0 auto;padding:0 16px 40px;display:flex;flex-direction:column;gap:12px}
.sticky{position:sticky;top:0;z-index:10;display:flex;flex-direction:column;gap:12px;padding:12px 0 8px;background:var(--floor);box-shadow:0 8px 12px -6px rgba(0,0,0,.45)}

/* HUD */
.hud{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;background:var(--sign);color:#fff;padding:10px 16px;border-radius:6px;border-bottom:5px solid #9f1d20}
.brand{font-family:var(--display);font-size:20px;letter-spacing:.5px;margin-right:auto;line-height:1}
.brand small{display:block;font-family:var(--body);font-size:11px;letter-spacing:2px;opacity:.85;margin-top:4px}
.stat{display:flex;flex-direction:column;align-items:flex-end;min-width:64px}
.stat span{font-size:10px;letter-spacing:1.5px;opacity:.8;text-transform:uppercase}
.stat b{font-family:var(--led);font-size:30px;line-height:.9;font-weight:400;color:var(--tag)}
.daybar{height:6px;background:rgba(0,0,0,.25);border-radius:3px;overflow:hidden;flex-basis:100%}
.daybar i{display:block;height:100%;width:0;background:var(--tag)}
.mute{background:rgba(0,0,0,.25);border-radius:4px;padding:4px 8px;font-size:12px}

/* Cola */
.queue-wrap{background:rgba(0,0,0,.22);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.queue{display:flex;gap:10px;align-items:flex-end}
.cust,.slot{width:64px;flex:0 0 64px;display:flex;flex-direction:column;align-items:center;gap:4px}
.slot{height:68px;border:2px dashed rgba(255,255,255,.18);border-radius:8px}
.face{font-size:34px;line-height:1;filter:grayscale(.25)}
.cust.front .face{font-size:46px;filter:none}
.cust.front{flex-basis:84px;width:84px}
.pbar{width:100%;height:7px;background:rgba(0,0,0,.35);border-radius:4px;overflow:hidden}
.pbar i{display:block;height:100%;width:100%;background:var(--ok)}
.pbar i.mid{background:var(--tag)}.pbar i.low{background:var(--sign)}
.bubble{background:var(--paper);border-radius:10px;padding:8px 12px;font-size:13px;min-height:36px;display:flex;align-items:center;gap:8px;position:relative}
.chat{min-height:22px;color:#fff;font-size:13px;display:flex;align-items:center;gap:8px}
.chat .who{font-size:20px;line-height:1}
.chat.angry{color:var(--tag)}
.bubble.muted{background:transparent;color:rgba(255,255,255,.6);padding-left:0}

/* Escenario */
.stage{display:grid;grid-template-columns:1.25fr 1fr;gap:12px;align-items:start}
.counter{background:#e4dccb;border-radius:6px;padding:12px;border-bottom:6px solid #b8ad94;display:flex;flex-direction:column;gap:8px;min-height:340px}
.zone-title{font-family:var(--display);font-size:11px;letter-spacing:2px;color:#5b5646}
.belt{background:var(--belt);background-image:repeating-linear-gradient(90deg,transparent 0 22px,rgba(255,255,255,.06) 22px 24px);border-radius:6px;padding:12px;min-height:128px;display:flex;flex-wrap:wrap;gap:10px;align-content:flex-start}
.hint{color:rgba(255,255,255,.4);align-self:center;margin:auto}
.item{position:relative;width:84px;background:var(--paper);border-radius:8px;padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 3px 0 rgba(0,0,0,.35);transition:transform .08s}
.item:active{transform:translateY(3px);box-shadow:0 0 0 rgba(0,0,0,.35)}
.item .em{font-size:30px;line-height:1}
.item .nm{font-size:11px;text-align:center;line-height:1.1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .fm{font-size:9px;color:var(--mute);text-align:center;line-height:1.05}
.item .code{font-size:11px;color:var(--sign);letter-spacing:2px}
.item.dmg{outline:2px dashed var(--sign);outline-offset:-3px}
.item .age{position:absolute;top:-6px;right:-6px;background:var(--sign);color:#fff;font-size:10px;font-weight:500;border-radius:10px;padding:1px 6px}
.item.flash{animation:shake .25s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.bagged{display:flex;flex-wrap:wrap;gap:6px;min-height:42px;background:rgba(0,0,0,.08);border-radius:6px;padding:8px;font-size:24px;line-height:1}
.bagged .none{font-size:12px;color:#7a735f;align-self:center}

/* Caja */
.register{background:#d9d4c7;border-radius:6px;padding:12px;border-bottom:6px solid #a49d8a;display:flex;flex-direction:column;gap:10px}
.led{background:#0d1f1a;color:#6dffb0;font-family:var(--led);border-radius:4px;padding:6px 12px;display:flex;justify-content:space-between;align-items:baseline;border:3px solid #3a403d}
.led small{font-size:18px;opacity:.7;letter-spacing:2px}
.led b{font-size:46px;font-weight:400;line-height:1}
.receipt{background:var(--paper);padding:10px 12px 16px;max-height:176px;overflow:auto;font-size:12px;
  -webkit-mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/12px 100%;mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/12px 100%}
.receipt .ln{display:flex;justify-content:space-between;gap:8px}
.receipt .ln.den{text-decoration:line-through;color:var(--mute)}
.receipt.empty{color:var(--mute);text-align:center;padding:24px 12px}
.row{display:flex;gap:8px}
.btn{flex:1;background:var(--paper);border-radius:6px;padding:10px 8px;font-weight:500;box-shadow:0 3px 0 rgba(0,0,0,.3);text-align:center}
.btn:active{transform:translateY(3px);box-shadow:none}
.btn.on{background:var(--tag)}
.btn.go{background:var(--ok);color:#fff}
.btn.no{background:var(--sign);color:#fff}
.btn[disabled]{opacity:.4;cursor:not-allowed;transform:none;box-shadow:0 3px 0 rgba(0,0,0,.3)}
.idcard{background:#cfe8f5;border:2px solid #6aa5c4;border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px}
.idcard h4{margin:0;font-family:var(--display);font-size:12px;letter-spacing:1.5px;font-weight:400;color:#2a5a75}
.idcard dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:2px 10px}
.idcard dt{color:#2a5a75;font-size:11px}.idcard dd{margin:0;font-weight:500}
.cashrow{display:flex;justify-content:space-between;align-items:baseline;padding:2px 2px}
.cashrow b{font-family:var(--led);font-size:28px;font-weight:400}
.cashrow.tray b{color:var(--sign)}
.cashrow.due{background:var(--tag);border-radius:4px;padding:2px 8px}
.denoms{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.dn{position:relative;padding:10px 0;border-radius:5px;font-weight:500;box-shadow:0 3px 0 rgba(0,0,0,.3);text-align:center}
.dn:active{transform:translateY(3px);box-shadow:none}
.dn.bill{background:#bfe0c8}.dn.coin{background:#e6d7a3}
.dn .cnt{position:absolute;top:-6px;right:-4px;background:var(--ink);color:#fff;font-size:10px;border-radius:9px;padding:0 5px}
.proc{height:14px;background:rgba(0,0,0,.2);border-radius:7px;overflow:hidden}
.proc i{display:block;height:100%;width:0;background:var(--ok);animation:proc 1.2s linear forwards}
@keyframes proc{to{width:100%}}
.paywait{text-align:center;color:#5b5646}

/* Avisos emergentes: carril dentro de la barra roja (.tlane reserva el sitio; #toast se coloca encima con toastPlace).
   Sin carril visible (portada, cierre, reunión), #toast.fl flota arriba al centro. */
.tlane{flex-basis:100%;height:44px;border-radius:10px;background:rgba(0,0,0,.16)}
.gs-hud .tlane{grid-column:1/-1;order:9}
#toast{position:fixed;left:0;top:0;width:0;height:0;display:flex;gap:8px;align-items:stretch;overflow:hidden;pointer-events:none;z-index:30}
#toast:empty{display:none}
#toast .tst{flex:0 1 auto;min-width:0;max-width:100%;display:flex;align-items:center;gap:8px;background:#fff8ef;color:#3a1012;border-left:6px solid #ffb400;border-radius:9px;padding:2px 12px;font:600 16px/1.2 var(--display);pointer-events:auto;cursor:pointer;animation:tstIn .2s ease-out;transition:opacity .25s}
#toast .tst>span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#toast .tst.good{border-left-color:#1f9a55}#toast .tst.bad{border-left-color:#d62f3a;background:#fff0f0}
#toast .tst.out{opacity:0}
#toast .tst .tn{flex:none;padding:0 7px;border-radius:9px;background:#3a1012;color:#fff;font-size:.8em}
#toast.fl{top:6px;left:50%;transform:translateX(-50%);width:min(620px,94vw);height:auto;flex-direction:column}
#toast.fl .tst{padding:8px 14px;border:2px solid #7a0d12;border-left-width:6px;box-shadow:0 6px 18px rgba(0,0,0,.3)}
@keyframes tstIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (max-width:820px){.tlane{height:42px}.hud .tlane{flex-basis:calc(100% + 56px);margin-right:-56px}#toast .tst{font-size:15px;padding:2px 10px}}
@media (prefers-reduced-motion:reduce){#toast .tst{animation:none;transition:none}}

/* Overlay */
#overlay{position:fixed;inset:0;background:rgba(10,24,20,.82);display:none;align-items:flex-start;justify-content:center;padding:16px;z-index:20;overflow:auto}
#overlay.show{display:flex}
.card{margin:auto;background:var(--paper);border-radius:8px;max-width:520px;width:100%;padding:22px;display:flex;flex-direction:column;gap:12px;box-shadow:0 10px 0 rgba(0,0,0,.35)}
.card h1,.card h2{font-family:var(--display);font-weight:400;margin:0;line-height:1.05}
.card h1{font-size:44px;color:var(--sign)}.card h2{font-size:26px}
.card ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.card .sum{display:grid;grid-template-columns:minmax(55%,1fr) auto;gap:2px 12px}
.card .sum b{text-align:right}
.card .sum .tot{border-top:2px dashed var(--ink);padding-top:6px;margin-top:4px;font-weight:500}
.shop{display:flex;flex-direction:column;gap:6px}
.gshelf.inv5{grid-template-columns:repeat(5,1fr)}.gshelf.inv5 .fc{min-height:44px}.gshelf.inv5 .fc .pk{font-size:22px}
.numpad{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.nk{font-family:var(--led);font-size:22px;background:linear-gradient(#4a5157,#353b40);color:#e9f1ec;border-radius:8px;padding:8px 0;box-shadow:0 3px 0 #0d0f10}
.nk:active{transform:translateY(2px);box-shadow:0 1px 0 #0d0f10}
.ordleg{font-size:10px;color:#5b5646;text-align:center}
.ordl{position:relative;display:grid;grid-template-columns:26px 1fr auto 60px;gap:8px;align-items:center;width:100%;min-height:44px;padding:4px 8px;background:#fff;border:2px solid #e3dccb;border-radius:9px;text-align:left;box-shadow:0 2px 0 #d8cfb9;transition:background .15s,border-color .15s}
.ordl .ock{width:24px;height:24px;border-radius:50%;border:2px solid #b9b09a;display:grid;place-items:center;font-size:14px;font-weight:900;color:#fff;background:#fff}
.ordl .onm{min-width:0;display:flex;flex-direction:column;gap:3px}.ordl .onm b{font-size:13px;line-height:1.15;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}.ordl .ol2{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.ordl .ol2 small{font-size:9px;color:#5b5646;white-space:nowrap}
.ordl .gauge{display:flex;gap:2px}.ordl .gauge i{width:9px;height:9px;border-radius:2px;background:#e9e3d4;border:1px solid #d5ccb6}.ordl .gauge i.f{background:#2a9d5c;border-color:#1f7a47}.ordl.low .gauge i.f{background:var(--sign,#e5383b);border-color:#a61e22}
.ordl .oq{font-family:var(--led);font-size:28px;line-height:1;min-width:22px;text-align:center}.ordl.low .oq{color:var(--sign,#e5383b)}
.ordl .opr{font-family:var(--led);font-size:13px;text-align:right;white-space:nowrap}
.ordl.on{background:#fff1f1;border-color:var(--sign,#e5383b);box-shadow:0 2px 0 #a61e22}.ordl.on .ock{background:var(--sign,#e5383b);border-color:#a61e22}
.ordl .ostamp{position:absolute;right:8px;top:-8px;transform:rotate(-6deg);border:2px solid var(--sign,#e5383b);color:var(--sign,#e5383b);font-weight:900;font-size:11px;letter-spacing:1px;padding:0 5px;border-radius:4px;background:rgba(255,255,255,.85);pointer-events:none}
.ordl.rv{cursor:default}.ordl.rv.r-ok{background:#e8f6ee;border-color:#2a9d5c}.ordl.rv.r-miss,.ordl.rv.r-waste{background:#fff1f1;border-color:var(--sign,#e5383b)}.ordl.rv.r-no{opacity:.55}
.ordl .ovd{font-weight:900;font-size:11px;text-align:right;white-space:nowrap}.r-ok .ovd{color:#1f7a47}.r-miss .ovd,.r-waste .ovd{color:var(--sign,#e5383b)}
.ordrows{display:flex;flex-direction:column;gap:5px}
@media (max-width:480px){.ordl{grid-template-columns:24px 1fr auto 50px;gap:6px;padding:4px 6px}.ordl .ock{width:22px;height:22px}.ordl .gauge{gap:1px}.ordl .gauge i{width:7px}.ordl .ol2{gap:4px}.ordl .opr{font-size:11px}.ordl .onm b{font-size:12px}.ordl .oq{font-size:24px}}
.ordt{display:flex;justify-content:space-between;font-weight:700;font-size:13px;padding-top:4px}.ordt b{font-family:var(--led);font-weight:400;font-size:16px}.ordt.bad{color:var(--sign)}
.kk{display:none;font-style:normal;font-family:var(--led);font-size:11px;background:rgba(0,0,0,.12);border-radius:4px;padding:0 4px;margin-right:4px}
.kbd{display:none;font-size:10px;color:var(--mute);text-align:center;padding:4px 0 0;line-height:1.5}.kbd b{font-family:var(--led);font-weight:400;background:#fff;border:1px solid #cfc8b6;border-radius:4px;padding:0 4px;color:var(--ink)}
@media (hover:hover) and (pointer:fine){.kbd{display:block}.kk{display:inline}}
.card.screen.ws-screen{max-width:1680px}
.scr-body>.ws{flex:1;min-height:0}
.th-atc{--thc:#2a9d5c}
.ws{display:flex;flex-direction:column;gap:10px;min-height:0}
.ws-head{display:grid;grid-template-columns:auto 1fr auto;gap:10px 16px;align-items:center;background:linear-gradient(135deg,var(--thc),color-mix(in srgb,var(--thc) 70%,#000));color:#fff;border-radius:14px;padding:10px 14px;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.ws-id{display:flex;gap:10px;align-items:center}
.ws-ic{font-size:32px;background:rgba(255,255,255,.2);border-radius:12px;width:52px;height:52px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.ws-id b{font-family:var(--display);font-size:22px;letter-spacing:1px;display:block;line-height:1.1}.ws-id small{opacity:.92;font-size:12px}
.ws-shift{display:flex;flex-direction:column;gap:4px;min-width:0}.ws-st{font-size:11px}.ws-st b{color:#fff}
.ws-clock{display:flex;align-items:center;gap:8px;font-size:12px}.ws-clock b{font-family:var(--led);font-size:18px;font-weight:400}
.ws-bar{flex:1;height:8px;background:rgba(0,0,0,.25);border-radius:99px;overflow:hidden;display:block;min-width:40px}.ws-bar i{display:block;height:100%;background:var(--tag);border-radius:99px}
.ws-kpis{display:flex;gap:6px;align-items:center}.ws-kpis span{background:rgba(0,0,0,.22);border-radius:10px;padding:4px 10px;display:flex;flex-direction:column;align-items:center}
.ws-kpis small{font-size:9px;letter-spacing:1px;opacity:.85}.ws-kpis b{font-family:var(--led);font-size:18px;font-weight:400;color:var(--tag);white-space:nowrap}
.ws-kpis .btn{width:auto;padding:8px 10px}
.ws-grid{flex:1;min-height:0;display:grid;grid-template-columns:1.05fr 1.35fr .95fr;gap:12px}
.ws-col{min-height:0;overflow:auto;scrollbar-width:thin;background:#fffaf0;border:2px solid #e3dccb;border-top:5px solid var(--thc);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.ws-col h4{font-family:var(--display);font-size:13px;letter-spacing:1px;margin:2px 0;color:var(--ink)}
.ws-col h5{font-size:10px;letter-spacing:1.5px;color:var(--mute);margin:6px 0 0;display:flex;flex-wrap:wrap;align-items:center;gap:4px}.ws-col h5 small{letter-spacing:0;font-weight:400}
.wcard{background:#fff;border:2px solid #e3dccb;border-radius:10px;padding:8px 10px;font-size:12px;line-height:1.4}
.wcard.mine{border-color:var(--ok);background:#effaf3;animation:fxok .4s}.wcard.mine b{display:block;font-size:14px}.wcard.mine small{color:#1d6e40}
.wcard.alertc{display:flex;gap:10px;align-items:center;border-left:6px solid var(--thc)}
.wcard.alertc>div{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}.wcard.alertc b{font-size:13px}.wcard.alertc small{color:#5b5646;font-size:11px}
.wcard.alertc .btn{width:auto;display:flex;flex-direction:column;align-items:center;white-space:nowrap;padding:8px 12px}.wcard.alertc .btn small{font-size:10px;color:inherit;opacity:.85}
.wcard .ws-bar{background:#eee}.wcard .ws-bar i{background:var(--thc)}
.wcard.warn{background:#fff8e1;border-color:#f1d27a}
.wcard.boss{background:#fff3c4;border-color:#f1d27a}.wcard.boss.bad{background:#ffe9e7;border-color:#f3b3ad}
.wempty{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;color:var(--mute);font-size:12px;padding:18px 10px}.wempty span{font-size:40px}
.wempty.small{padding:6px;flex-direction:row;justify-content:center}
.wbig{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--ok);color:#fff;border-radius:14px;padding:14px;box-shadow:0 4px 0 #1d6e40;width:100%}.wbig span{font-size:36px}.wbig b{font-size:18px}.wbig small{font-size:11px;opacity:.9}
.wrow{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-size:12px;padding:5px 0;border-bottom:1px dashed #e3dccb}.wrow small{color:var(--mute)}
.wbtns{margin-left:auto;display:flex;gap:4px}.wbtns .btn{width:auto}
.wtiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:6px}.wtiles.two{grid-template-columns:1fr 1fr}
.wtile{background:#fff;border:2px solid #e3dccb;border-radius:10px;padding:6px 8px;display:flex;flex-direction:column;min-width:0}
.wtile small{font-size:9px;letter-spacing:1px;color:var(--mute);text-transform:uppercase}.wtile b{font-family:var(--led);font-size:20px;font-weight:400;white-space:nowrap}
.wtile.good b{color:var(--ok)}.wtile.bad{border-color:#f3b3ad;background:#fff5f4}.wtile.bad b{color:var(--sign)}
.wtools{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.wtool{display:grid;grid-template-columns:auto 1fr;column-gap:10px;align-items:center;text-align:left;background:var(--thc);color:#fff;border-radius:12px;padding:10px 12px;box-shadow:0 4px 0 rgba(0,0,0,.25);width:100%}
.wtool span{grid-row:1/3;font-size:28px}.wtool b{font-size:14px}.wtool small{font-size:10px;opacity:.9}
.wtool:disabled{filter:grayscale(.85);opacity:.45;box-shadow:none;cursor:default}
.wtool:not(:disabled):hover{filter:brightness(1.08)}.wtool:not(:disabled):active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.25)}

.wh{background:repeating-linear-gradient(90deg,#5d646b 0 18px,#666e75 18px 20px);border-radius:8px;padding:12px 10px 0;box-shadow:inset 0 -18px 0 #8a8d8f}

.gondola{background:radial-gradient(circle,#c9ced2 1.2px,transparent 1.5px) 0 0/10px 10px,#dfe3e6;border-radius:8px;padding:8px;border:3px solid #b9c0c5;display:flex;flex-direction:column;gap:2px}

.fc.empty{background:rgba(255,255,255,.25);box-shadow:inset 0 0 0 2px dashed rgba(0,0,0,.15);border:2px dashed rgba(0,0,0,.18);color:#5b6670;font-size:20px}

/* PDA de mano */

/* Suelo del pasillo con el derrame */
.floor{position:relative;height:190px;border-radius:8px;overflow:hidden;background:repeating-conic-gradient(#e9ecef 0 25%,#d6dbdf 0 50%) 0 0/36px 36px;box-shadow:inset 0 0 0 3px #c4cbd1}
.wetsign{position:absolute;left:10px;top:12px;width:62px;height:76px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:8px;z-index:2}

.shard{position:absolute;width:20px;height:20px;background:linear-gradient(135deg,#fff,#a8d8ff);clip-path:polygon(50% 0,100% 70%,30% 100%,0 40%);box-shadow:0 0 6px #fff;z-index:2;animation:glint 1.2s ease-in-out infinite}

.mop{position:absolute;right:10px;bottom:6px;font-size:30px}
.miniShelf{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:#dfe3e6;border-radius:8px;padding:8px;border-bottom:6px solid #9aa3a9}

/* ================= TEMA «VITCHMARKET» (pixel art rosa y morado) =================
   Capa de estilo por encima de todo lo anterior: paleta, fuentes, HUD con pastillas, pestañas,
   paneles con barra de título y botones. Las reglas de maquetación de arriba siguen valiendo. */
:root{
  --pk:#e5383b;--pk2:#a8161c;--pu:#c62828;--pu2:#7f0f14;--navy:#3a1012;--navy2:#b3141c;--cream:#fffdfc;--line:#7a1418;
  --display:'Fredoka','Bungee',sans-serif;--body:'Nunito',system-ui,sans-serif;--pix:'Pixelify Sans','VT323',monospace;
}
body{background:linear-gradient(180deg,#ffffff 0%,#fff1f1 45%,#ffdede 100%);background-attachment:fixed;font-weight:600;color:#2b1d1d}
body::before{content:'';position:fixed;inset:0;pointer-events:none;opacity:.35;background-image:radial-gradient(#fff 1.2px,transparent 1.4px);background-size:22px 22px;z-index:0}
#app{position:relative;z-index:1}
/* HUD */
.hud{background:linear-gradient(180deg,#e5383b,var(--navy2));border:3px solid #6b0b0f;border-bottom-width:6px;border-radius:16px;padding:8px 12px;gap:8px 10px;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:28px;letter-spacing:1px;color:#ff4d4f;text-shadow:3px 3px 0 #6b0b0f,-1px -1px 0 #6b0b0f,1px -1px 0 #6b0b0f,-1px 1px 0 #6b0b0f}
.brand small{font-family:var(--body);font-weight:700;font-size:11px;letter-spacing:.5px;color:#ffe0e0;text-shadow:none;opacity:1}
.logo-cart{font-style:normal;font-size:30px;background:#fff;border-radius:12px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 -4px 0 #ffd0d0,0 3px 0 #6b0b0f;text-shadow:none}
.stat{flex-direction:row;align-items:center;gap:6px;background:#8f1015;border:2px solid #c9252b;border-radius:12px;padding:3px 10px 3px 4px;min-width:0}
.stat i{font-style:normal;font-size:20px;width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff8,transparent 60%),#c9252b;display:flex;align-items:center;justify-content:center}
.stat.s-money i{background:radial-gradient(circle at 35% 30%,#fff8,transparent 60%),#f5b301}
.stat.s-rep i{background:radial-gradient(circle at 35% 30%,#fff8,transparent 60%),#ffcf3f}
.stat span{display:none}
.stat b{font-family:var(--pix);font-weight:700;font-size:20px;color:#ffe066;line-height:1}
.mute{background:#c9252b;color:#fff;border-radius:10px;padding:6px 9px;box-shadow:0 3px 0 #6b0b0f}
.daybar{height:8px;background:#6b0b0f;border-radius:99px}.daybar i{background:linear-gradient(90deg,#ff4d4f,#ffd23f);border-radius:99px}
/* Pestañas */
.tab{background:linear-gradient(180deg,#e04345,var(--pu2));color:#fff;border:3px solid #5c0a0d;border-bottom-width:5px;border-radius:14px;font-family:var(--display);font-weight:600;font-size:16px;padding:6px 12px;text-shadow:0 2px 0 rgba(0,0,0,.3)}
.tab.on{background:linear-gradient(180deg,#ff5a5c,var(--pk2));color:#fff;border-color:#6b0b0f;transform:translateY(2px);border-bottom-width:3px}
.tab i{background:#ffd23f;color:#3a1d00}
/* Paneles con barra de título */
.queue-wrap,.counter,.register,.sidebar,.dept,.isostore{background:var(--cream);border:3px solid var(--line);border-radius:16px;box-shadow:0 5px 0 var(--line);color:#2b1d1d}
.queue-wrap{padding:8px 10px}
.counter{border-bottom-width:3px}
.register{border-bottom-width:3px}
.sidebar{padding:0 8px 8px}
.sidehead{margin:0 -8px 4px;padding:7px 10px;background:linear-gradient(180deg,#ff4d4f,var(--pk2));color:#fff;border-radius:12px 12px 0 0;font-family:var(--display);font-weight:600;font-size:16px;letter-spacing:.5px;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.sidehead .aall:disabled{border-color:#ffd6d6;color:#fff}
.zone-title{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.5px;color:#fff;background:linear-gradient(180deg,#ff4d4f,var(--pk2));border-radius:10px;padding:4px 10px;align-self:flex-start;text-shadow:0 1px 0 rgba(0,0,0,.25);box-shadow:0 2px 0 #6b0b0f}
.tasks{background:#f6f1f0;border:2px solid #e3cccc;border-bottom-width:2px}
.task{background:#fff;border:2px solid #ecdcdc}
.crew{color:#4a3a3a}
.bubble{background:#fff;border:2px solid #ecdcdc}
.bubble.muted{background:transparent;border:0;color:#a37878}
.chat{color:#6b3d3d}.chat.angry{color:var(--pk2)}
.slot{border-color:#e3cccc}
.pbar{background:#ecdcdc}
.belt{background:#3b2f2f;background-image:repeating-linear-gradient(90deg,transparent 0 22px,rgba(255,255,255,.07) 22px 24px);border:3px solid #5c0a0d}
.item{background:#fff;border:2px solid #ecdcdc;border-radius:12px}
.bagged{background:#f6f1f0}
.led{border-color:#5c0a0d;border-radius:10px}
.receipt{border-radius:8px}
/* Botones */
.btn{font-family:var(--display);font-weight:600;border-radius:12px;background:#fff;border:2px solid #e3cccc;box-shadow:0 3px 0 #c9a5a5;color:#3a2323}
.btn.go{background:linear-gradient(180deg,#3fcf7e,#1f9a55);border-color:#136b3a;box-shadow:0 4px 0 #136b3a;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.25)}
.btn.no{background:linear-gradient(180deg,#ff6b6b,#d62f3a);border-color:#8e1a22;box-shadow:0 4px 0 #8e1a22;color:#fff}
.btn.on{background:#ffd23f;border-color:#b08a00}
.dn{border-radius:10px;font-family:var(--display);font-weight:600}
.alert{background:#fff4c2;border:2px solid #f0c94a;border-radius:12px;box-shadow:0 3px 0 #d6a91f}
.force{border-radius:10px;border-color:#c9a5a5}
/* Ventanas y pantallas */
#overlay{background:rgba(42,30,72,.7)}
#mg{background:rgba(42,30,72,.6)}
.card{background:var(--cream);border:3px solid var(--line);border-radius:18px;box-shadow:0 8px 0 var(--line)}
.card h1,.card h2,.card h3{font-family:var(--display);font-weight:700;color:#4a1414}
.card h1{color:var(--pk)}
.logo{font-family:var(--display);font-weight:700;color:#ff4d4f;text-shadow:3px 3px 0 #3a1012}
.stab{font-family:var(--display);font-weight:600;border-radius:12px}
.stab.on{background:linear-gradient(180deg,#ff5a5c,var(--pk2));color:#fff;border-color:#6b0b0f}
.dpanel{background:var(--cream);border:3px solid var(--line);border-radius:16px;box-shadow:0 5px 0 var(--line)}
.dpanel h2{font-family:var(--display);font-weight:700;color:#4a1414}
.up,.emp{border:2px solid #ecdcdc;border-radius:12px}
.supd{color:#7a5a5a}
#vtag{background:rgba(42,30,72,.7)}
/* La tienda en directo (isométrica, pixel art) */
.isostore{display:none;min-height:0;flex-direction:column;overflow:hidden;padding:0}
.isostore .ptitle{display:flex;justify-content:space-between;align-items:center;padding:7px 12px;background:linear-gradient(180deg,#ff4d4f,var(--pk2));color:#fff;font-family:var(--display);font-weight:600;font-size:16px;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.isostore .ptitle small{font-family:var(--body);font-size:11px;opacity:.9}
#isoslot{flex:1;min-height:0;position:relative;background:linear-gradient(180deg,#ffffff,#fde3e3)}
#isoslot canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;cursor:pointer}

/* ---------- toast ---------- */
function toast(msg,kind){
  try{if(run&&!run.remote&&msg&&kind){run.lastMsg={m:String(msg),k:kind,t:run.t};}}catch(e){}
  if(quiet)return;
  const box=$('#toast');if(!box||msg==null)return;msg=String(msg);
  const same=toastQ.find(x=>x.m===msg)||[...box.children].find(x=>x._m===msg&&!x._out);
  if(same){if(same.nodeType){same._n++;const n=same.querySelector('.tn')||same.appendChild(document.createElement('b'));n.className='tn';n.textContent='×'+same._n;same._t0=Date.now();toastArm(same);}else same.n++;return;}
  toastQ.push({m:msg,k:kind||'',n:1});if(toastQ.length>6)toastQ.shift();
  [...box.children].forEach(toastArm);toastPump();
}
/* Avisos en el carril de la barra roja (.tlane del HUD o del puesto del empleado): 1 a la vez (2 si el carril es ancho);
   sin carril visible (portada, cierre, reunión) flotan arriba, máx. 2. El resto espera y, mientras espera, los visibles duran menos. */
let toastRaf=0,toastKey='';
function toastPlace(){
  const box=$('#toast'),ov=$('#overlay');if(!box)return 0;
  const on=ov&&ov.classList.contains('show'),l=on?ov.querySelector('.tlane'):document.querySelector('.hud .tlane');
  const r=l&&l.getBoundingClientRect(),ok=r&&r.height>0&&r.top>=0&&r.bottom<=window.innerHeight;
  const k=ok?[r.left,r.top,r.width,r.height].map(Math.round).join():'fl';
  if(k!==toastKey){toastKey=k;box.classList.toggle('fl',!ok);
    if(ok){const [x,y,w,h]=k.split(',');Object.assign(box.style,{left:x+'px',top:y+'px',width:w+'px',height:h+'px'});}else box.removeAttribute('style');}
  return ok?r.width:0;
}
function toastFollow(){toastRaf=0;const box=$('#toast');if(!box||!box.children.length)return;toastPlace();if(window.requestAnimationFrame)toastRaf=requestAnimationFrame(toastFollow);}
function toastMax(){const w=toastPlace();return w?(w>=900?2:1):2;}
function toastPump(){
  const box=$('#toast');if(!box)return;
  while(toastQ.length&&[...box.children].length<toastMax()){
    const q=toastQ.shift(),el=document.createElement('div'),tx=document.createElement('span');
    el.className='tst '+q.k;el._m=q.m;el._n=q.n;tx.textContent=q.m;el.title=q.m;el.appendChild(tx);
    if(q.n>1){const n=document.createElement('b');n.className='tn';n.textContent='×'+q.n;el.appendChild(n);}
    el._ms=clamp(3500+60*q.m.length,4000,9000)*(q.k==='bad'?1.25:1);el._t0=Date.now();
    const hold=()=>{el._hold=1;clearTimeout(el._t);},go=()=>{el._hold=0;el._t0=Date.now();toastArm(el);};
    el.addEventListener('mouseenter',hold);el.addEventListener('mouseleave',go);
    el.addEventListener('touchstart',hold,{passive:true});el.addEventListener('touchend',go,{passive:true});el.addEventListener('touchcancel',go,{passive:true});
    el.addEventListener('click',ev=>{ev.stopPropagation();toastOut(el);});
    box.appendChild(el);toastArm(el);
  }
  if(!toastRaf)toastFollow();
}
function toastArm(el){clearTimeout(el._t);if(el._hold||el._out)return;const ms=toastQ.length?Math.max(2500,el._ms*.55):el._ms;el._t=setTimeout(()=>toastOut(el),Math.max(300,ms-(Date.now()-el._t0)));}
function toastOut(el){if(el._out)return;el._out=1;clearTimeout(el._t);el.classList.add('out');setTimeout(()=>{el.remove();toastPump();},260);}

function receiveDeliveries(){
  const rr={arrived:0,short:0,shelved:0,pending:0};
  const due=meta.orders.filter(o=>o.day<=meta.day);
  meta.orders=meta.orders.filter(o=>o.day>meta.day);
  due.forEach(o=>{
    const sup=SUPS.find(z=>z.k===o.sup);
    Object.entries(o.items).forEach(([id,q])=>{
      const got=Math.random()<sup.rel?q:Math.ceil(q*0.5);
      rr.arrived+=got;rr.short+=q-got;
      meta.back[id]=(meta.back[id]||0)+got;
    });
  });
  /* Antes de abrir, quien trabaja en Almacén sube a la estantería lo que puede (30 + 40·rapidez uds cada uno);
     lo que no le da tiempo se queda en el muelle y lo van colocando durante el turno con el aviso 🚚 (almRoutine). */
  let cap=staffOf('alm').filter(e=>working(e)&&!e.real).reduce((t,e)=>t+Math.round(30+40*e.rap),0);
  const ids=Object.keys(meta.back).filter(id=>meta.back[id]>0).sort((x,y)=>(meta.stock[x]||0)-(meta.stock[y]||0));
  for(const id of ids){
    if(cap<=0)break;
    const mv=Math.min(cap,meta.back[id]);
    meta.back[id]-=mv;meta.stock[id]=(meta.stock[id]||0)+mv;cap-=mv;rr.shelved+=mv;
  }
  rr.pending=Object.values(meta.back).reduce((t,v)=>t+v,0);
  return rr;
}

  if(r){[['back','Backoffice'],['rrpp','RR.PP.'],['alm','Almacén']].forEach(([k,n])=>{if(r[k].late>0)(room0(k)>0?hot:tip)('➕','Contrata en '+n,r[k].late+(r[k].late===1?' reclamación se quedó':' reclamaciones se quedaron')+' sin atender por falta de gente'+(room0(k)>0?' (quedan '+room0(k)+' plazas).':', pero ya está lleno: mejora a los que hay.'));});}

  /* Echar o cuidar */
  meta.emp.forEach(e=>{if(e.real)return;const v=score(e),h=hist(e);
    if(e.trial>0&&v<0.45)hot('🚪','Echa a '+e.name+' ('+ROLES[e.role].s+')','Está en prueba y '+verdict(e).toLowerCase().replace(/^\S+ /,'')+'. Ahora sale gratis: sin indemnización. Hazlo '+meetTxt+'.');

    if(why)(meta.money>=u.c*2?hot:tip)('⭐','Compra: '+u.n+' ('+fmt(u.c)+')',why+(meta.money<u.c?' Aún no te llega el bote.':''));
  });
  if(run.vacNote)tip('📢','RR.HH. ha publicado vacantes',run.vacNote.join(' · '));
  if(meta.rep<2.5)hot('⭐','Reputación baja (★ '+meta.rep.toFixed(1)+')','Menos errores en caja y responde las malas reseñas en RR.PP. A cero, te despiden.');
  return A;
}

/* ---------- ranking online (Firebase Realtime Database, opcional) ----------
   Solo se activa si firebase-config.js define window.FIREBASE_CONFIG. Sin él (o dentro de un artifact
   de Claude, que no deja cargar scripts de gstatic) el juego funciona igual, sin ranking.
   Cada partida (meta.runId) es una entrada en /ranking, escrita con login anónimo. */
const FB_V='10.12.2',NAME_KEY='vitchmarket.nombre';
let fb=null;
const online=()=>!!(window.FIREBASE_CONFIG&&window.FIREBASE_CONFIG.databaseURL)&&!(window.claude&&window.claude.hot);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function playerName(){try{return (localStorage.getItem(NAME_KEY)||'').trim();}catch(e){return '';}}
function setPlayerName(n){try{localStorage.setItem(NAME_KEY,String(n).trim().slice(0,20));}catch(e){}}
async function fbInit(){
  if(fb!==null)return fb;
  if(!online()){fb=false;return fb;}
  if(window.FB_MOCK){fb=await window.FB_MOCK();return fb;}
  try{
    const B='https://www.gstatic.com/firebasejs/'+FB_V+'/';
    const [A,D,U]=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-database.js'),import(B+'firebase-auth.js')]);
    const app=A.initializeApp(window.FIREBASE_CONFIG),cred=await U.signInAnonymously(U.getAuth(app));
    fb=Object.assign({db:D.getDatabase(app),uid:cred.user.uid},D);
  }catch(e){console.warn('Ranking no disponible:',e);fb=false;}
  return fb;
}
async function submitScore(final){

      staff:meta.emp.length,score:days*100000+clamp(Math.round(meta.money/100),0,99999),final:!!final,ts:f.serverTimestamp()});
  }catch(e){console.warn('No se pudo subir la puntuación:',e);}
}
async function fillRanking(){

/* ---------- tienda compartida (Firebase Realtime Database, sin servidor) ----------
   Hay UNA sola tienda para todo el mundo: /rooms/VITCH. Al entrar, cada persona pone su nombre y solicita
   un cargo. El jefe (el primero que lo pide con el puesto libre) lleva la Caja 3, contrata a quien solicita
   y su navegador mueve la tienda: publica el estado en /state cada segundo y guarda la partida en /meta.
   Los empleados cogen avisos y hacen el minijuego en su navegador; el resultado va a /acts y el jefe lo aplica.
   Sin jefe conectado la tienda se congela; si lleva más de 2 min fuera, otro puede quedarse el puesto.
   Si no hay conexión al arrancar, se juega en solitario sin conexión (partida guardada en el navegador). */
/* Versión del juego: súbela en cada cambio que toque la tienda compartida. Si el jefe y un empleado tienen
   versiones distintas (caché del navegador), a los dos les sale un aviso para recargar. */
const APPV='2026.11.17-64';
/* Compara versiones por números («-9» < «-11»), no como texto. */
const verCmp=(a,b)=>{const x=String(a).split(/[.-]/).map(Number),y=String(b).split(/[.-]/).map(Number);for(let i=0;i<Math.max(x.length,y.length);i++){const d=(x[i]||0)-(y[i]||0);if(d)return d;}return 0;};
try{const vt=document.createElement('div');vt.id='vtag';vt.textContent='v'+APPV;document.body.appendChild(vt);}catch(e){}
const SHOP='VITCH',DURS=[[100,'100 s (clásico)'],[600,'10 min'],[1800,'30 min'],[3600,'1 hora'],[10800,'3 horas'],[43200,'12 horas']];
const REAL_LIM=60,TAKEOVER=120000;
const JOB_IC={jefe:'👑',atc:'🧾',alm:'📦',back:'💼',rrpp:'📣',rrhh:'🗂️'};
let room=null,offline=false,rankCache='',rankAt=0;
const rRef=p=>fb.ref(fb.db,'rooms/'+room.code+(p?'/'+p:''));
const isHost=()=>!!(room&&(room.host||room.sim));
const isMember=()=>!!(room&&!room.host);
const plain=o=>JSON.parse(JSON.stringify(o));
const toObj=v=>{if(!Array.isArray(v))return v||{};const o={};v.forEach((x,i)=>{if(x!=null)o[i]=x;});return o;};
const toArr=v=>(Array.isArray(v)?v:Object.values(v||{})).filter(x=>x!=null);
const cleanName=s=>String(s||'').replace(/[<>&"'`]/g,'').trim().slice(0,20)||'Anónimo';
const durTxt=s=>(DURS.find(d=>d[0]===s)||[0,(s||100)<120?(s||100)+' s':Math.round(s/60)+' min'])[1];
const clockOf=(t,dur)=>{const m=540+Math.min(1,(t||0)/(dur||100))*720;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(Math.floor(m%60)).padStart(2,'0');};
const srvNow=()=>Date.now()+((room&&room.off)||0);
/* El nombre se pide una vez: si ya hay uno guardado, se muestra con un botón para cambiarlo. */
const nameInput=label=>`<label class="supd">${label}<input id="pname" class="pname" maxlength="20" value="${esc(playerName())}" placeholder="Tu nombre o mote"></label>`;
const nameField=label=>playerName()?`<div class="supd" data-label="${esc(label)}">Juegas como <b>${esc(playerName())}</b> <button class="btn mini" data-act="rename">Cambiar</button></div>`:nameInput(label);
function nameOk(){const i=$('#pname');if(!i&&playerName())return true;const n=i?cleanName(i.value):'';if(!i||!i.value.trim()){toast('Pon un nombre o un mote','bad');return false;}setPlayerName(n);return true;}

/* Arranque: siempre online; si no hay conexión en 9 s, modo sin conexión. */
async function bootOnline(){
  showOverlay('<div class="card hub"><h1>VITCHMARKET</h1><div class="supd">📡 Conectando con la tienda…</div></div>');
  const f=await Promise.race([fbInit(),new Promise(r=>setTimeout(()=>r(false),9000))]);
  if(!f){goOffline();return;}
  try{await enterShared();}catch(e){console.warn(e);goOffline();}
}
function goOffline(){offline=true;room=null;showStart();toast('📴 Sin conexión con la tienda: juegas en solitario. Recarga para volver a intentarlo.','bad');}
async function enterShared(){
  const f=fb,base='rooms/'+SHOP;
  const info=(await f.get(f.ref(f.db,base+'/info'))).val();
  if(info&&info.host===f.uid&&srvNow()-(info.hb||0)<TAKEOVER*15){
    const ms=await f.get(f.ref(f.db,base+'/meta'));
    meta=ms.exists()?loadRoomMeta(ms.val()):defMeta(meta.best);
    await f.update(f.ref(f.db,base+'/members/'+f.uid),{name:playerName()||'Jefe',role:'jefe',on:true});
    let rl=null;try{rl=(await f.get(f.ref(f.db,base+'/relay'))).val();}catch(e){}
    return enterRoom(SHOP,true,rl);
  }
  /* Si el registro falla (reglas, permisos…), no es falta de conexión: se entra igual y se avisa. */
  let regErr=null;
  if(playerName()){
    try{
      const ex=(await f.get(f.ref(f.db,base+'/members/'+f.uid))).val();
      await f.update(f.ref(f.db,base+'/members/'+f.uid),{name:playerName(),on:true,role:ex&&ROLES[ex.role]?ex.role:null});
    }catch(e){console.warn('No se pudo registrar en la tienda:',e);regErr=e;}
  }
  enterRoom(SHOP,false);
  if(regErr){room.msg={t:'⚠️ La tienda no ha aceptado tu registro ('+errMsg(regErr)+'). Si pone PERMISSION_DENIED, las reglas de Firebase no están bien publicadas.',bad:true};room.lastHtml='';renderMember();}
}
/* Firebase convierte los objetos con claves numéricas en arrays y se come los vacíos: se deshace aquí. */
function loadRoomMeta(raw){
  const m=Object.assign(defMeta(),raw);
  m.emp=toArr(raw.emp);m.stock=toObj(raw.stock);m.back=toObj(raw.back);m.regs=raw.regs||{};

/* ===== Relevo (encargado/a): si el jefe deja de dar señal 25 s con la tienda abierta, el navegador de un empleado
   conectado (Almacén, Backoffice, RR.PP. o RR.HH.; los cajeros tienen su caja) sigue moviendo la tienda: reloj, clientes, avisos,
   otras cajas y cierres, sin decisiones de jefe (no hay reunión ni pedidos manuales). Guarda la partida cada 15 s. Cuando el jefe
   vuelve, avisa con info.ret; el encargado guarda y suelta (/relay) y el jefe retoma el turno donde iba. */
const RELAY_T=25000,RELAY_ROLES=['alm','back','rrpp','rrhh'];
const relayActive=()=>{const r=room&&room.relay;return !!(r&&r.uid&&srvNow()-(r.hb||0)<RELAY_T);};
const bossAway=()=>{const inf=room&&room.info||{};return !!inf.host&&srvNow()-(inf.hb||0)>RELAY_T&&inf.status&&inf.status!=='lobby';};
function relayCheck(){
  if(!room||!fb||offline)return;
  if(room.sim){
    /* Si el nodo ya no es mío (otro encargado, o el jefe lo ha borrado), suelto sin guardar. */
    if(!room.relay||room.relay.uid!==room.uid){dropSim('👔 Otra persona lleva ahora la tienda.');return;}
    fb.update(rRef('relay'),{hb:fb.serverTimestamp()}).catch(()=>{});
    const inf=room.info||{},r=room.relay||{};
    if((inf.ret&&r.since&&inf.ret>r.since)||!bossAway())stopRelay('👑 Ha vuelto el jefe: te devuelve la tienda y sigues en tu puesto.');
    return;
  }
  if(room.host||room.relayBusy||!bossAway()||relayActive()||(run&&run.remote))return;
  const ms=room.members||{},me=ms[room.uid];if(!me||!RELAY_ROLES.includes(me.role))return;
  const c=Object.entries(ms).filter(([u,m])=>m&&m.on&&RELAY_ROLES.includes(m.role)&&u!==room.info.host).map(([u])=>u).sort();
  if(c[0]===room.uid)startRelay();
}
async function startRelay(){
  room.relayBusy=true;
  try{
    await fb.set(rRef('relay'),{uid:room.uid,name:playerName()||'Encargado/a',hb:fb.serverTimestamp(),since:fb.serverTimestamp()});
    try{fb.onDisconnect(rRef('relay')).remove();}catch(e){}
    const raw=(await fb.get(rRef('meta'))).val();
    if(!raw){await fb.remove(rRef('relay'));room.relayBusy=false;return;}
    meta=loadRoomMeta(raw);room.sim=true;ensureMeta();
    room.actsOff=fb.onChildAdded(rRef('acts'),s=>{const a=s.val();fb.remove(s.ref).catch(()=>{});quiet=true;try{onAct(a);}finally{quiet=false;}});
    resumeDay(meta.liveT||0);if(run&&!run.away)autoTill();
    toast('👔 El jefe no está: tu navegador lleva la tienda como encargado/a hasta que vuelva. No cierres la app.','good');
    room.lastHtml='';renderMember();
  }catch(e){console.warn('Relevo:',e);room.sim=false;}
  room.relayBusy=false;
}
/* Copia de la partida para guardar a mitad de turno: lo que llevan los clientes en cola vuelve a la estantería
   (si se retoma en otro navegador, esa cola no existe). */
function liveMeta(){
  const m=plain(meta);
  if(run&&!run.over){m.liveT=run.t;m.closed=false;run.queue.forEach(c=>c.items.forEach(i=>{if(!i.scanned&&!i.denied)m.stock[i.pid]=(m.stock[i.pid]||0)+1;}));}
  return m;
}

async function relayChanged(force){

    if(relayActive()&&!room.waitRelay){if(run&&run.tills)Object.keys(run.tills).forEach(u=>closeTill(u,'cambio de encargado'));run=null;mg=null;pendingLeave=null;closeMG();

/* ---------- cajas de verdad para los cajeros reales ----------
   El navegador del jefe crea los clientes y reparte la cola entre su Caja 3 y las cajas abiertas por
   jugadores de Caja (Caja 1 y 2): cada cliente se manda entero a /till/{uid}/{cid}. El cajero lo atiende en su
   navegador con la caja de siempre (run.remote) y cada segundo manda lo que ha pasado (act «till»: dinero,
   reputación, atendidos, enfadados, reclamaciones, reseñas, unidades devueltas y clientes terminados).
   El jefe lo suma a la tienda. Si el cajero se desconecta, sus clientes se pierden y el stock vuelve. */
const TILL_MAX=5;
/* --- lado del jefe --- */
function tillOf(e){return run&&run.tills&&e.real?run.tills[e.real]:null;}
function syncTills(){
  if(!isHost()||!run||run.over)return;
  run.tills=run.tills||{};
  const want=meta.emp.filter(e=>e.real&&e.role==='atc'&&inStore(e)).slice(0,2);
  Object.keys(run.tills).forEach(u=>{if(!want.some(e=>e.real===u))closeTill(u,'se ha ido de la caja');});
  want.forEach(e=>{
    if(run.tills[e.real])return;
    const used=Object.values(run.tills).map(t=>t.n),n=[1,2].find(x=>!used.includes(x));
    run.tills[e.real]={n,out:{},eid:e.id};
    toast('🧾 '+e.name+' abre la Caja '+n,'good');note(e.real,'🧾 Tienes abierta la Caja '+n+'. ¡A cobrar!');
  });
}
function closeTill(u,why){
  const t=run&&run.tills&&run.tills[u];if(!t)return;
  Object.values(t.out).forEach(pids=>toArr(pids).forEach(pid=>{meta.stock[pid]=(meta.stock[pid]||0)+1;}));
  fb.remove(rRef('till/'+u)).catch(()=>{});
  delete run.tills[u];
  if(why)toast('🧾 La Caja '+t.n+' cierra: '+why,'bad');
}
const tillsBusy=()=>run&&run.tills?Object.values(run.tills).reduce((s,t)=>s+Object.keys(t.out).length,0):0;
/* Manda el cliente a la caja real con menos cola si tiene menos gente que la Caja 3. Devuelve true si lo ha mandado. */
function sendToTill(c){
  if(!isHost()||!run.tills||c.cut)return false;
  const ts=Object.entries(run.tills).filter(([u,t])=>Object.keys(t.out).length<TILL_MAX);
  if(!ts.length)return false;
  const [u,t]=ts.sort((a,b)=>Object.keys(a[1].out).length-Object.keys(b[1].out).length)[0];
  if(Object.keys(t.out).length>run.queue.length)return false;
  t.out[c.id]=c.items.map(i=>i.pid);
  fb.set(rRef('till/'+u+'/'+c.id),plain(Object.assign({},c,{birth:+c.birth}))).catch(()=>{});
  return true;
}
/* Lo que manda el cajero real cada segundo. */
function applyTill(e,a){
  const t=run.tills&&run.tills[e.real],d=a.d||{};
  meta.money+=Math.round(+d.money||0);meta.rep=clamp(meta.rep+(+d.rep||0),0,5);
  ['served','angry','errors','tips','sales','fines'].forEach(k=>{run[k]=(run[k]||0)+Math.round(+d[k]||0);});

/* Herramientas del puesto de trabajo del empleado real: se piden con un act «take» de t negativo
   (−1 inventario, −2 pedido, −3 arqueo, −4 entrevista, −(1000+pid) reponer, −(5000+id) responder una reseña).
   El jefe crea el aviso y se lo da a quien lo ha pedido. */
function toolTask(e,code){
  if(!run||run.over||!isFree(e)){note(e.real,'Termina lo que tienes entre manos primero.',true);return;}
  const r=e.role,open=k=>run.tasks.find(t=>t.k===k&&!t.who);
  let t=null;
  if(code<=-5000&&code>-7000&&r==='rrpp'){
    const id=-code-5000,rv=run.reviews&&run.reviews.find(x=>x.id===id);
    if(!rv||rv.ans){note(e.real,'Esa reseña ya está contestada.',true);return;}
    rv.ans=1;const good=Math.random()<perf(e,true);meta.rep=clamp(meta.rep+(good?0.05:-0.03),0,5);if(good)e.st.tasks++;else e.st.tfail++;
    logE(e,'Contestó una reseña de '+rv.st+' estrellas');note(e.real,good?'💬 Respuesta publicada: el cliente se ha quedado más tranquilo (+reputación).':'💬 Tu respuesta ha sentado regular: más tacto la próxima vez.',!good);return;
  }
  if(code<=-1000&&r==='alm'){
    const pid=-code-1000,p=CAT.find(x=>x.id===pid);if(!p)return;
    if(!(meta.back[pid]>0)){note(e.real,'De '+p.n+' no queda nada en el almacén: hay que pedirlo.',true);return;}
    t=run.tasks.find(x=>(x.k==='repo'||x.k==='call')&&x.pid===pid&&!x.who);
    if(!t){const n=aisleOf(pid);t=almTask('repo','📦',10,TSHORT.repo.replace('%p%',p.n).replace('%n%',n),'Reponer «'+p.n+'» en el pasillo '+n+'.',{pid,n,roles:['alm','atc']});}
  }
  else if(code===-1&&r==='alm'){t=open('inv');if(!t){const n=ri(1,9);t=almTask('inv','📋',9,'Inventario del pasillo '+n,'Contar lo que queda en el pasillo '+n+' y apuntar lo que falta.',{n});}}
  else if(code===-2&&r==='alm'){t=open('order')||almTask('order','🧾',8,'Pedido a Hacendado de lo que se acaba','Hacer el pedido de lo que se acaba al distribuidor.');}
  else if(code===-3&&r==='back'){t=open('cash');if(!t){const n=ri(1,3);t=almTask('cash','🧮',12,TSHORT.cash.replace('%n%',n),'Arqueo de la caja '+n+': contar el cajón y ver si cuadra.',{n,roles:['back']});}}
  else if(code===-9&&r==='alm'){t=open('truck');if(!t){const pend=Object.values(meta.back).reduce((a,v)=>a+v,0);if(!pend){note(e.real,'En el muelle no hay nada que colocar.',true);return;}t=almTask('truck','🚚',14,'Colocar mercancía del muelle ('+pend+' uds)','Hay '+pend+' uds en el muelle: descargar, almacenar y subir a la estantería.');}}
  else if(code===-7&&r==='rrpp'){
    if(run.t-(run.promoT||-99)<45){note(e.real,'Ya hay una campaña en marcha: espera un poco.',true);return;}
    if(meta.money<1000){note(e.real,'No hay bote para pagar la campaña.',true);return;}
    run.promoT=run.t;meta.money-=1000;const good=Math.random()<perf(e,true);meta.rep=clamp(meta.rep+(good?0.1:0.02),0,5);if(good)e.st.tasks++;else e.st.tfail++;
    logE(e,'Lanzó una campaña en redes');note(e.real,good?'📣 La campaña ha funcionado: más gente habla bien de la tienda (+reputación, −10 €).':'📣 La campaña ha pasado sin pena ni gloria (−10 €).',!good);return;
  }
  else if(code<=-8000&&code>-9000&&r==='rrhh'){
    const k=-code-8000,rl=Object.keys(ROLES)[Math.floor(k/10)],msg=setVac(rl,k%10===1?1:-1,e);note(e.real,msg||'—');return;
  }
  else if(code<=-7000&&code>-8000&&r==='rrhh'){
    const m=empById(-code-7000);run.cheer=run.cheer||{};
    if(!m||m.real){return;}
    if(run.t-(run.cheer[m.id]||-99)<30){note(e.real,m.name+' ya ha tenido su charla: espera un poco.',true);return;}
    run.cheer[m.id]=run.t;const good=Math.random()<perf(e,true);m.moral=clamp(m.moral+(good?7:2),0,100);if(good)e.st.tasks++;
    logE(e,'Habló con '+m.name+' para animarle');note(e.real,good?'👍 '+m.name+' sale de la charla con otra cara (+ánimo).':'🙂 '+m.name+' te escucha, pero sin mucho entusiasmo.');return;
  }
  else if(code===-4&&r==='rrhh'){if(!open('cv')&&!vacRoles().length){note(e.real,'No hay vacantes publicadas: publica una antes de entrevistar.',true);return;}t=open('cv')||almTask('cv','🧑‍💼',14,TSHORT.cv,'Un candidato espera en la puerta para la entrevista.',{roles:['rrhh'],cand:makeCand()});}
  if(!t){note(e.real,'Eso no es de tu puesto.',true);return;}
  giveReal(t,e,false);
}
function giveReal(t,e,byBoss){
  t.who=e.id;t.real=1;t.match=true;t.span=REAL_LIM;t.until=run.t+REAL_LIM;
  const d=run.duty[e.id];d.busy=1;d.task=t.id;d.slack=null;

function onAct(a){
  if(!a||!isHost())return;
  const e=meta.emp.find(x=>x.real===a.uid);if(!e)return;
  if(a.k==='till'){if(run&&!run.over)applyTill(e,a);else{toArr(a.ret).forEach(pid=>{meta.stock[pid]=(meta.stock[pid]||0)+1;});}return;}
  if(a.k==='hire'||a.k==='reject'){
    if(e.role!=='rrhh'){note(e.real,'Eso solo lo puede hacer Recursos Humanos.',true);return;}
    const m=room.members[a.u];if(!m||!m.apply)return;
    if(a.k==='hire'){if(staffOf(m.apply).length>=ROLES[m.apply].max){note(e.real,'Ese puesto está completo.',true);return;}hireReal(a.u);note(e.real,'Has contratado a '+cleanName(m.name)+' en '+ROLES[m.apply].n+'.');}
    else{rejectReal(a.u);note(e.real,'Has rechazado la solicitud de '+cleanName(m.name)+'.');}
    logE(e,(a.k==='hire'?'Contrató a ':'Rechazó a ')+cleanName(m.name));
    return;
  }
  if(!run||run.over)return;
  if(a.k==='take'&&+a.t<0){toolTask(e,+a.t);renderAll();pubState(true);return;}
  const t=run.tasks.find(x=>x.id===a.t);
  if(a.k==='take'){
    if(!t||t.who||!isFree(e)){note(e.real,'Llegas tarde: eso ya lo tiene otra persona.',true);return;}
    if(!toArr(t.roles).includes(e.role)){note(e.real,'Eso no es de tu departamento.',true);return;}
    giveReal(t,e,false);
  }else if(a.k==='done'){
    if(!t||t.who!==e.id)return;
    doneReal(t,e,clamp(+a.sc||0,0,1),!!a.early,a.x||{});
  }else if(a.k==='drop'){if(t&&t.who===e.id)releaseReal(e);}
  if(run&&!run.over)renderAll();
  pubState(true);
}
function doneReal(t,e,sc,early,x){
  run.tasks=run.tasks.filter(x=>x!==t);
  const d=run.duty[e.id];if(d){d.busy=0;d.task=null;}
  const r=applyMG(t,sc,early,e,x);
  if(t.k!=='tk'){if(r.good){e.st.tasks++;run.tdone++;}else{e.st.tfail++;run.tlost++;}}
  logE(e,(r.good?'Resolvió':'Hizo mal')+' un aviso: '+t.s);
  toast('🎮 '+e.name+': '+r.msg,r.good?'good':'bad');
  note(e.real,r.msg,!r.good);
  checkRep();
}
function realFail(t){
  const e=empById(t.who);run.tasks=run.tasks.filter(x=>x!==t);
  if(e){const d=run.duty[e.id];if(d){d.busy=0;d.task=null;}}
  if(t.k==='tk'){if(e)note(e.real,'Se te pasó el tiempo con la reclamación. Se queda en la bandeja.',true);renderAll();return;}
  meta.rep=clamp(meta.rep-t.pen/2,0,5);run.tlost++;
  if(e){e.st.tfail++;logE(e,'Dejó a medias un aviso: '+t.s);note(e.real,'Se te pasó el tiempo: '+t.s,true);toast('🎮 '+e.name+' no ha terminado a tiempo: '+t.s,'bad');}
  sBad();renderAll();checkRep();
}

const inStore=e=>working(e)&&run.t>=run.duty[e.id].at;

function perf(e,match,lang){
  let b=0.5+0.35*(e.rap+e.act)/2+(e.moral-50)/300+(e.focus>0?0.08:0)+Math.min(e.days,15)*0.004;
  if(!match&&e.pers!=='servicial')b-=0.15;
  if(e.pers==='capullo')b+=0.1;
  if(meta.surv>0&&!e.real)b-=0.05;
  if(lang)b+=e.langs.includes(lang)?0.15:-0.15;
  if(run&&run.duty&&meta.emp.some(x=>x!==e&&x.pers==='lider'&&x.role===e.role&&working(x)))b+=0.05;
  return clamp(b,0.15,0.97);
}

function score(e){const s=e.st,g=s.ok+s.tasks+s.fel*2+s.cv,b=s.fail+s.tfail+s.quej*2+s.late+s.abs*2+s.caught*2+s.cvErr+(s.robo||0)*3;return (g+1)/(g+b+2);}
/* b: un escalón mejor (sesgo con quien contrataste tú). Keeper test: ¿lucharías por retenerle? */
const vIdx=(e,b)=>{const v=score(e);return Math.max(0,(v>=0.7?0:v>=0.5?1:v>=0.35?2:3)-(b?1:0));};

/* Al empezar el turno: quién viene, quién llega tarde, quién falta y qué incidentes tendrá. */
function prepShift(){
  const notes=[];
  meta.emp.slice().forEach(e=>{
    if(e.real){const m=room&&room.members[e.real],on=!!(m&&m.on);run.duty[e.id]={st:on?'ok':'gone',at:0,busy:0,task:null,slack:null,slackT:0,seen:0,cnt:on?1:0};if(on)e.st.shifts++;return;}
    if(e.moral<15&&Math.random()<0.4){meta.emp=meta.emp.filter(x=>x!==e);notes.push(e.name+' ha dejado el trabajo');return;}
    const d={st:'ok',at:0,busy:0,task:null,slack:null,slackT:0,seen:0};
    if(e.off===meta.day)d.st='off';
    else if(Math.random()<(e.moral<30?0.3:0.03)*(1.3-e.punt)){d.st='abs';e.st.abs++;notes.push(e.name+' no viene hoy');logE(e,'Faltó sin avisar');}
    else if(Math.random()<0.4*(1-e.punt)){d.st='late';d.at=rnd(8,30);e.st.late++;logE(e,'Llegó tarde');}
    if(d.st==='ok'||d.st==='late'){
      e.st.shifts++;
      if(Math.random()<0.3*(1-e.trato)*(e.moral<50?1.6:1))run.ev.push({t:rnd(20,90),e:e.id,k:'quej'});
      else if(Math.random()<0.25*e.trato)run.ev.push({t:rnd(20,90),e:e.id,k:'fel'});
    }
    run.duty[e.id]=d;
  });
  const wk=meta.emp.filter(working);
  if(wk.some(e=>e.role==='rrhh'))wk.forEach(o=>{o.moral=clamp(o.moral+2,0,100);});
  wk.forEach(e=>{const d={bromista:2,quejica:-2,capullo:-3}[e.pers];if(d)wk.forEach(o=>{if(o!==e)o.moral=clamp(o.moral+d,0,100);});});
  run.nextTalk=rnd(10,20);
  return notes;
}

function assignTask(tid,who){

/* Necesidad del servicio: el jefe saca a alguien de lo que esté haciendo. Su aviso vuelve a la lista
   y, si estaba en la Caja 3, la caja se queda sin nadie hasta que otro cajero quede libre. */
function pullOff(e){
  const d=run.duty[e.id];if(!d)return;
  if(run.away&&run.away.cover===e.id){run.away.cover=null;run.away.mult=1.6;toast(e.name+' deja la Caja 3 por necesidad del servicio.','bad');}
  else{const t2=run.tasks.find(x=>x.id===d.task);if(t2){t2.who=null;t2.real=0;t2.dl=run.t+TLIFE;toast(e.name+' deja «'+t2.s+'» a medias: vuelve a la lista.','bad');}}
  if(e.real)note(e.real,'📢 El jefe te cambia de tarea por necesidad del servicio.');
  d.busy=0;d.task=null;d.slack=null;
  e.moral=clamp(e.moral-2,0,100);
}
/* «Asignar todo»: cada aviso sin dueño va a la mejor persona libre (su puesto, su idioma, su rapidez;
   los jugadores reales, los últimos). Las reclamaciones en directo (tk) se quedan para quien las coja. */
function assignAll(){
  if(!run||run.over)return;
  let n=0;
  run.tasks.filter(t=>!t.who&&t.k!=='tk').forEach(t=>{
    const free=meta.emp.filter(e=>isFree(e)&&t.roles.includes(e.role)&&!(t.npc&&e.real));if(!free.length)return;
    const sc=e=>(t.roles.includes(e.role)?2:0)+(t.lang&&e.langs.includes(t.lang)?2:0)-(e.real?1.5:0)+e.rap*0.5-(run.duty[e.id].slack?0.3:0);
    const e=free.sort((a,b)=>sc(b)-sc(a))[0];
    assignTask(t.id,String(e.id));n++;
  });
  const left=run.tasks.filter(t=>!t.who&&t.k!=='tk').length;
  toast(n?'⚡ '+n+(n===1?' aviso asignado':' avisos asignados')+(left?'. Quedan '+left+' sin nadie libre de su departamento.':'.'):'No hay nadie libre del departamento que toca.',n?'good':'bad');
}
function moveStock(id,max){const mv=Math.min(max,meta.back[id]||0);if(mv>0){meta.back[id]-=mv;meta.stock[id]=(meta.stock[id]||0)+mv;}return mv;}
function finishTask(t){

  if(t.k==='order'){run.tdone++;autoOrder(empById(t.who)||{name:'Tú',st:{}},ok);renderAll();return;}

    const out=ps.filter(x=>!(meta.stock[x.id]>0)),low=ps.filter(x=>meta.stock[x.id]>0&&meta.stock[x.id]<=2);

    if(ok)run.ordAt=-99;renderAll();return;}
  if(!ok){meta.rep=clamp(meta.rep-t.pen/2,0,5);run.tlost++;
    const why=t.lang?'. No se han entendido':(t.match?'':'. No es su puesto');

  run.tdone++;let extra='';
  if(t.k==='repo'||t.k==='call'){const mv=moveStock(t.pid,8);extra=mv?' (+'+mv+' uds en estantería)':' (en el almacén no quedaba)';}
  else if(t.k==='truck'){let cap=40,tot=0;Object.keys(meta.back).sort((x,y)=>(meta.stock[x]||0)-(meta.stock[y]||0)).forEach(id=>{if(cap>0){const mv=moveStock(id,cap);cap-=mv;tot+=mv;}});extra=' (+'+tot+' uds)';}

function tickStaff(dt){
  if(isHost()&&(run.tillT=(run.tillT||0)+dt)>2){run.tillT=0;syncTills();}
  if(!run.closing){
    run.nextTask-=dt;
    if(run.nextTask<=0){if(run.tasks.filter(t=>!t.who&&t.k!=='tk').length<3)spawnTask();run.nextTask=rnd(14,24)*Math.max(0.6,1-meta.day*0.04);}
  }
  /* Escaqueos: quien está libre a veces se pone a otra cosa. Menos si tiene actitud o le has visto pasar. */
  meta.emp.forEach(e=>{
    const d=run.duty[e.id];if(!d||!inStore(e)||d.busy||e.real)return;
    if(d.slack){d.slackT=(d.slackT||0)+dt;if(Math.random()<dt*0.06)d.slack=null;}
    else if(Math.random()<dt*0.012*(1.3-e.act)*(e.moral<40?1.6:1)*(d.seen?0.5:1))d.slack=pick(SLACK);
  });
  /* Cada uno hace su trabajo sin que se lo manden: quien está libre (y no escaqueándose) coge solo
     los avisos de su departamento a los 3 s de salir (antes el jefe puede elegir a quién mandar). */
  if(!run.remote)run.tasks.forEach(t=>{
    if(run.over||t.who||t.k==='tk'||TLIFE-(t.dl-run.t)<3)return;
    /* No se lo quitan al jefe mientras decide: «Voy yo» pendiente o el desplegable de ese aviso abierto. */
    if(pendingLeave&&run.hold===t.id)return;
    {const ae=document.activeElement;if(ae&&ae.classList&&ae.classList.contains('force')&&+ae.dataset.t===t.id)return;}
    const c=meta.emp.filter(e=>isFree(e)&&!e.real&&!run.duty[e.id].slack&&t.roles.includes(e.role));if(!c.length)return;
    const sc=e=>(t.lang&&e.langs.includes(t.lang)?2:0)+e.rap;
    const e=c.sort((a,b)=>sc(b)-sc(a))[0];
    assignTask(t.id,String(e.id));toast(e.face+' '+e.name+' se encarga: '+t.s);
  });
  if(!run.remote&&(run.almT=(run.almT||0)+dt)>3){run.almT=0;almRoutine();}
  /* Quien te cubre la caja atiende al cliente de delante. */
  if(run.away&&run.away.cover){
    const e=empById(run.away.cover),c=front();
    if(e&&c){
      if(!c.cv)c.cv={t:0,need:c.phase==='complaint'?4:2.5+c.items.length*(1.3-0.6*e.rap)*(e.role==='atc'||e.pers==='servicial'?1:1.4)};
      c.cv.t+=dt;
      if(c.cv.t>=c.cv.need){coverServe(c,e);if(run.over)return;}
    }
  }
  if(run.away&&run.away.auto&&!run.away.cover&&(run.cashT=(run.cashT||0)+dt)>1){run.cashT=0;const e=pickCashier();if(e){const d=run.duty[e.id];d.busy=1;d.task='caja';run.away.cover=e.id;run.away.mult=1;toast(e.face+' '+e.name+' se pone en la Caja 3.','good');renderAll();}}
  if(run.away&&!run.away.auto&&run.closing&&!run.queue.length&&!run.hintEnd){run.hintEnd=1;toast('Ya no queda nadie en la cola. Vuelve a caja para cerrar.');}
  if(mg&&mg.kind==='sup'){run.supT=(run.supT||0)+dt;if(run.supT>2){run.supT=0;renderSup();}}
  run.nextTalk-=dt;
  if(run.nextTalk<=0){
    run.nextTalk=rnd(14,26);
    const ws=meta.emp.filter(e=>inStore(e)&&!e.real);
    if(ws.length&&!(run.chat&&run.t<run.chat.until)){
      const e=pick(ws),N=NATS[e.nat]||NATS[0];
      const line=Math.random()<0.35?pick(N.tic):pick(TALK[e.pers]||['…']);
      run.chat={face:e.face,text:e.name+' '+N.f+': «'+line+'»',angry:false,until:run.t+3.6};renderChat();
    }
  }
  let dirty=false;
  meta.emp.forEach(e=>{const d=run.duty[e.id];if(d&&d.st==='late'&&!d.ann&&run.t>=d.at){d.ann=1;dirty=true;toast(e.face+' '+e.name+' llega tarde. «Perdón, el bus…»','bad');}});
  run.ev.forEach(v=>{
    if(v.done||run.t<v.t)return;v.done=1;
    const e=empById(v.e);if(!e||!inStore(e))return;
    logE(e,v.k==='quej'?'Un cliente se quejó de su trato':'Un cliente le felicitó');
    if(v.k==='quej'){e.st.quej++;meta.rep=clamp(meta.rep-0.2,0,5);addTicket('rrpp','Queja por el trato de '+e.name,0,2,false);toast('Un cliente se queja de cómo le ha hablado '+e.name,'bad');sBad();}
    else{e.st.fel++;e.moral=clamp(e.moral+5,0,100);meta.rep=clamp(meta.rep+0.1,0,5);toast('Un cliente felicita a '+e.name+' por su trato','good');}
    dirty=true;
  });
  run.tasks.slice().forEach(t=>{
    if(run.over)return;

function coverServe(c,e){

  run.away.served++;e.st.cv++;
  if(c.phase==='complaint'){
    const ok=Math.random()<p,dep=ok?c.complaint.dept:pick(['back','rrpp','alm']);
    if(dep!=='atc')addTicket(dep,c.complaint.t,c.complaint.refund,c.complaint.sev,dep!==c.complaint.dept);

  }
  c.items.forEach(i=>{
    if(i.scanned||i.denied)return;
    if(i.age&&c.minor&&Math.random()<p){i.denied=true;ret(i);return;}
    i.scanned=true;

function sendQueue(e,n,boss){

  for(let i=1;i<run.queue.length&&k<n;){const c=run.queue[i];if(c.phase==='complaint'||c.complaint){i++;continue;}

   rot   (reponer / megafonía): 1 coger la caja buena del almacén · 2 retirar del lineal lo caducado o roto

const dayMs=864e5,today0=(()=>{const d=new Date(TODAY);d.setHours(0,0,0,0);return d;})();

const perish=id=>zoneOf(id)==='frio'||zoneOf(id)==='fruta'||aisleOf(id)===2;
const shuffle=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
function startRot(t,p){
  const sameA=shuffle(CAT.filter(x=>x.id!==p.id&&!x.age&&aisleOf(x.id)===aisleOf(p.id)));
  const decoys=sameA.slice(0,2).concat(shuffle(CAT.filter(x=>x.id!==p.id&&!x.age&&!sameA.slice(0,2).includes(x))).slice(0,1));
  const per=perish(p.id),front=[];
  for(let i=0;i<4;i++){

    const r=Math.random(),bad=r<0.4?(per&&Math.random()<0.75?'cad':'roto'):null;
    front.push({bad,d:per?(bad==='cad'?-ri(1,6):ri(2,15)):null,out:false});
  }
  if(!front.some(u=>u&&u.bad)){const i=front.findIndex(u=>u);const k=i<0?0:i;front[k]={bad:per?'cad':'roto',d:per?-ri(1,5):null,out:false};}
  const pda=shuffle([p].concat(sameA.slice(0,2).length?sameA.slice(0,2):decoys.slice(0,2))).map(x=>({id:x.id,n:x.n,f:x.f||'',p:x.p}));
  return {kind:'rot',t,p,step:0,crates:shuffle([p].concat(decoys)).map(x=>({id:x.id,e:x.e,n:x.n,f:x.f||''})),front,back:[null,null,null,null],newLeft:4,
    wrongBox:0,goodOut:0,badOut:0,rotErr:0,priceErr:false,pda};
}
function startRecv(t){
  const ids=t.remote?(t.bk||[]):Object.keys(meta.back).filter(id=>meta.back[id]>0).map(Number);
  const pool=shuffle(ids.length?ids.map(id=>CAT.find(x=>x.id===id)).filter(Boolean):CAT.filter(x=>!x.age));
  const extra=shuffle(CAT.filter(x=>!x.age&&!pool.includes(x)));
  const prods=pool.concat(extra).slice(0,4);
  const lines=prods.map(x=>{const q=ri(1,3),r=Math.random();const falta=r<0.25&&q>1?1:0,roto=!falta&&r<0.45?1:0;
    return {id:x.id,e:x.e,n:x.n,q,got:q-falta,roto,mark:null};});
  if(!lines.some(l=>l.got<l.q||l.roto)){const l=lines[ri(0,lines.length-1)];if(l.q>1)l.got=l.q-1;else l.roto=1;}
  return {kind:'recv',t,step:0,lines,dock:[],sel:-1,placedOk:0,placedBad:0,spoiled:0};
}

function almAct(a,b){
  if(mg.kind==='rot'){
    if(a==='mgcrate'){const c=mg.crates[+b.dataset.i];if(!c)return;if(c.id===mg.p.id){mg.step=1;sBeep();}else{mg.wrongBox++;sBad();mg.fx={sel:`[data-act=mgcrate][data-i="${b.dataset.i}"]`,k:'bad'};toast(c.n+' no es lo que hay que reponer','bad');}}
    else if(a==='mgout'){const u=mg.front[+b.dataset.i];if(!u||u.out)return;u.out=true;if(u.bad){mg.badOut++;sCoin();}else{mg.goodOut++;sBad();mg.fx={sel:'.gondola',k:'bad'};toast('Eso estaba bien: lo has tirado','bad');}}
    else if(a==='mgnext'){mg.front=mg.front.map(u=>u&&u.out?null:u);mg.step=2;}
    else if(a==='mgput'){
      const row=b.dataset.r,i=+b.dataset.i,arr=row==='b'?mg.back:mg.front;if(arr[i]||mg.newLeft<=0)return;
      arr[i]={isNew:1};mg.newLeft--;
      if(row==='f'&&mg.front.some(u=>u&&!u.isNew)){mg.rotErr++;sBad();mg.fx={sel:'.gondola',k:'bad'};toast('Nuevo delante de lo viejo: lo viejo acabará caducando','bad');}else sBeep();
      if(mg.newLeft<=0||![...mg.back,...mg.front].some(u=>!u))mg.step=3;
    }
    else if(a==='mgprice'){const x=mg.pda[+b.dataset.i];if(!x)return;mg.priceErr=x.id!==mg.p.id;if(mg.priceErr)toast('Esa etiqueta es de otro producto: en caja se cobrará mal','bad');return finishRot();}
  }else if(mg.kind==='recv'){
    if(a==='mgmark'){const l=mg.lines[+b.dataset.i];if(l){l.mark=b.dataset.k;sCoin();mg.fx={sel:`[data-act=mgmark][data-i="${b.dataset.i}"][data-k="${b.dataset.k}"]`,k:'ok'};}}
    else if(a==='mgsignalb'){if(!mg.lines.every(l=>l.mark))return;recvToDock();sCoin();if(!mg.dock.length)return finishRecv();}
    else if(a==='mgpick'){mg.sel=+b.dataset.i;}
    else if(a==='mgzone2'){
      const bx=mg.dock[mg.sel];if(!bx||bx.done)return;
      bx.done=true;bx.ok=b.dataset.z===bx.z;mg.fx={sel:`[data-act=mgzone2][data-z="${b.dataset.z}"]`,k:bx.ok?'ok':'bad'};if(bx.ok){mg.placedOk++;sBeep();}else{mg.placedBad++;sBad();toast(bx.n+' no va en esa zona','bad');}
      mg.dock.forEach(o=>{if(!o.done&&o.life!=null&&bx.life==null){o.life--;if(o.life<=0){o.done=true;mg.spoiled++;toast('❄️ '+o.n+' ha perdido la cadena de frío: a la basura','bad');}}});
      mg.sel=-1;if(mg.dock.every(o=>o.done))return finishRecv();
    }
  }else{
    if(a==='mgsign'){mg.sign=true;sCoin();}
    else if(a==='mgshard'){if(mg.shards>0){mg.shards--;sCoin();}}
    else if(a==='mgmop2'){const i=+b.dataset.i;if(!mg.sign)mg.early=true;if(mg.shards>0&&!mg.cut){mg.cut=true;sBad();toast('🩸 Has fregado con cristales en el suelo y te has cortado','bad');}mg.spots[i]++;sCoin();}
    else if(a==='mgout2'){const c=mg.cands[+b.dataset.i];if(!c)return;if(c.id===mg.p.id){mg.out=true;sBeep();}else{mg.wrongOut++;sBad();mg.fx={sel:`[data-act=mgout2][data-i="${b.dataset.i}"]`,k:'bad'};toast(c.n+' estaba bien','bad');}}
    else if(a==='mgend2')return finishSpill();
  }
  renderMG();
}

/* ---------- minijuegos de Backoffice ----------
   refund (reclamación de dinero): el ticket del cliente y lo que dice. Escenarios: cobrado dos veces, precio
          distinto del de la etiqueta, cambio mal dado o el cliente se equivoca. 1 marcar el error en el ticket
          (o «no hay error», o «no es de Backoffice» si viene mal derivada) · 2 preparar el reembolso exacto con
          billetes y monedas · 3 devolverlo por donde pagó (tarjeta o efectivo). El importe correcto es t.refund.
   cash  (arqueo): contar el cajón contra lo que dice el sistema y dar el resultado (cuadra, falta o sobra). */
function startRefund(t){
  const R=Math.max(5,Math.round(t.refund||ri(200,1500))),wrong=!t.mis&&Math.random()<0.2;
  const sc=wrong?'none':pick(['dup','price','change']);
  const pool=shuffle(CAT.filter(x=>!x.age)).slice(0,ri(4,6));
  const lines=pool.map(x=>({n:x.n,e:x.e,q:1,p:x.p,bad:false}));
  let claim='',shelf=null,cash=null;
  if(sc==='dup'){const l=lines[0];l.p=R;lines.splice(ri(2,lines.length),0,Object.assign({},l,{bad:true}));claim='«¡Me habéis cobrado dos veces lo mismo!»';}
  else if(sc==='price'){const l=lines[ri(0,lines.length-1)];shelf=l.p;l.p+=R;l.bad=true;claim='«En la estantería ponía otro precio, que lo he visto yo.»';}
  else if(sc==='change'){claim='«Me disteis mal el cambio, me falta dinero.»';}

function hireFromCv(c,wage,mine){

function applyFeud(x,ok){
  const A=empById(+x.a),B=empById(+x.b);if(!A||!B)return 'Ya no trabajan juntos.';
  if(ok){[A,B].forEach(e=>{e.moral=clamp(e.moral+4,0,100);});const w=x.truth==='a'?A:x.truth==='b'?B:null;if(w)w.moral=clamp(w.moral+3,0,100);return 'Bronca resuelta entre '+A.name+' y '+B.name+'. Vuelven al trabajo.';}
  const wronged=x.truth==='a'?A:x.truth==='b'?B:null;
  if(wronged)wronged.moral=clamp(wronged.moral-12,0,100);else[A,B].forEach(e=>{e.moral=clamp(e.moral-5,0,100);});
  return wronged?'Le has quitado la razón a '+wronged.name+', que la tenía. Está que trina.':'Has dado la razón a uno cuando los dos tenían parte. Mal ambiente.';
}

/* Reclamación de producto agotado (Almacén): la PDA dice si queda en el almacén, si llega mañana y si hay

function startAgot(t){

  const alt=Math.random()<0.7?pick(CAT.filter(x=>!x.age&&x.id!==p.id&&aisleOf(x.id)===aisleOf(p.id))):null;
  const best=back?'apart':alt?'alt':inc?'wait':'sorry';
  const o=[['apart','📦 Ir al almacén y apartárselo'],['alt','🔁 Ofrecerle '+(alt?alt.e+' '+alt.n:'algo parecido')],['wait','📅 Que vuelva mañana, que llega en el camión'],['sorry','🙄 «No hay y punto»']]
    .map(([k,lb])=>[lb,t.mis?0:k===best?1:(k==='wait'&&!back?0.5:0)]);
  if(t.mis)o.push(['↩️ Esto no es de Almacén: devolverla',1]);
  return {kind:'agot',t,p,back,inc,alt,opts:shuffle(o)};
}

function mgAct(a,b){

  if(mg.kind==='refund'||mg.kind==='cash')return backAct(a,b);
  if(mg.kind==='social'||mg.kind==='map')return rrppAct(a,b);
  if(mg.kind==='cv'||mg.kind==='feud')return rrhhAct(a,b);

  else if(a==='mgaisle'){
    if(+b.dataset.a===aisleOf(mg.p.id))return endMG(mg.tries===0?1:mg.tries===1?0.5:0.2);
    mg.tries++;sBad();if(mg.tries>=3)return endMG(0);
  }else if(a==='mgtk'){const o=mg.opts[+b.dataset.i];if(o)return endMG(o[1]?1:0);

  if(t.desk){const r=applyMG(t,sc,early,null,x);toast(r.msg,r.good?'good':'bad');r.good?sOk():sBad();renderAll();checkRep();return;}
  if(remote&&run&&run.remote){run.away=null;renderAll();}
  if(remote){room.done[t.id]=1;roomAct({k:'done',t:t.id,sc,early:!!early,x});toast(sc>=0.6?'Hecho. Se lo cuentas al jefe…':'Regular… Se lo cuentas al jefe.',sc>=0.6?'good':'bad');sc>=0.6?sOk():sBad();room.lastHtml='';renderMember();return;}
  run.tasks=run.tasks.filter(y=>y!==t);
  const r=applyMG(t,sc,early,null,x);
  if(r.good)run.tdone++;else run.tlost++;
  if(run.away&&run.away.auto)renderAll();else returnTill();
  toast(r.msg,r.good?'good':'bad');if(r.good)sOk();else sBad();
  checkRep();
}
/* Efectos de un minijuego terminado (lo hagas tú o un empleado real desde su navegador). */
function applyMG(t,sc,early,e,x){
  const kind=MGK[t.k]||'recv';x=x||{};
  let msg='',good=sc>=0.6;
  const lose=(id,n)=>{n=Math.max(0,Math.round(+n||0));const s=Math.min(n,meta.stock[id]||0);meta.stock[id]=(meta.stock[id]||0)-s;return n;};
  if(kind==='inv'){
    const low=toArr(x.low).map(Number).filter(id=>CAT.some(y=>y.id===id));
    if(good){run.prio=(run.prio||[]).concat(low);run.ordAt=-99;}
    msg='Inventario del pasillo '+t.n+': '+(+x.ok||0)+' de '+(+x.n||0)+' bien contados'+(good?(low.length?' · '+low.length+' a pedidos':' · nada que pedir'):' · recuento poco fiable, no se manda a pedidos')+'.';
  }else if(kind==='order'){
    let cost=0;const items={};
    Object.keys(x.items||{}).forEach(id=>{const p=CAT.find(y=>y.id===+id);if(!p)return;const c=6*unitCost(p,'hac');if(cost+c<=meta.money){items[id]=6;cost+=c;}});
    if(cost){meta.money-=cost;noteBuy(cost);run.autoBuy=(run.autoBuy||0)+cost;meta.orders.push({day:meta.day+1,sup:'hac',items});}
    run.ordAt=run.t;
    msg=(cost?'Pedido a Hacendado: '+Object.keys(items).length+' productos ('+fmt(cost)+'), llega mañana':'Sin pedido')+(+x.miss?' · se han quedado '+x.miss+' sin pedir':'')+(+x.waste?' · '+x.waste+' iban sobrados':'')+'.';
  }else if(kind==='rot'){
    const mv=moveStock(t.pid,Math.round(8*sc)),p=CAT.find(y=>y.id===t.pid)||CAT[0],L=[];
    const merma=lose(t.pid,x.merma);if(merma)L.push(merma+' a merma');
    if(+x.badLeft>0&&Math.random()<0.5){addTicket('rrpp','Ha encontrado '+p.n+' caducado en la estantería',0,2,false);meta.rep=clamp(meta.rep-0.15,0,5);L.push('se ha quedado algo caducado a la vista');}
    if(+x.priceErr){addTicket('back','Le cobraron '+p.n+' a otro precio que el de la etiqueta',Math.max(50,Math.round(p.p*0.3)),1,false);L.push('etiqueta equivocada');}
    if(+x.rotErr)L.push('lo nuevo quedó delante');
    msg=(mv?'Lineal repuesto: +'+mv+' uds en estantería':'Lineal revisado, pero en el almacén no quedaba más')+(L.length?' · '+L.join(' · '):'')+'.';
  }else if(kind==='recv'){
    meta.money+=Math.round(+x.abono||0)-Math.round(+x.lost||0);
    let cap=Math.min(24,6*Math.round(+x.placed||0)),tot=0;
    toArr(x.ids).forEach(id=>{if(cap>0){const mv=moveStock(id,Math.min(6,cap));cap-=mv;tot+=mv;}});
    Object.keys(meta.back).forEach(id=>{if(cap>0){const mv=moveStock(id,cap);cap-=mv;tot+=mv;}});
    if(+x.falsas)meta.rep=clamp(meta.rep-0.05*x.falsas,0,5);
    const L=[];if(+x.abono)L.push('abono del proveedor +'+fmt(+x.abono));if(+x.lost)L.push('firmaste sin apuntar faltas o roturas −'+fmt(+x.lost));if(+x.spoiled)L.push(x.spoiled+' sin cadena de frío');if(+x.falsas)L.push('reclamaste cosas que estaban bien');
    msg='Camión descargado'+(tot?': +'+tot+' uds a estantería':'')+(L.length?' · '+L.join(' · '):'')+'.';
    if(sc<0.6)meta.rep=clamp(meta.rep-0.1,0,5);
  }else if(kind==='cv'){
    const c=x.cand;
    if(+x.integ)meta.money-=INTEG;
    msg=+x.hire?hireFromCv(c,+x.wage,!e):'Entrevista hecha: no le contratamos.';
    if(+x.hire&&c&&+x.q<0.45)msg+=' Mmm… no pinta bien.';
  }else if(kind==='feud'){
    msg=applyFeud(x,good);
  }else if(kind==='cash'){
    const d=Math.round(+x.diff||0),said=Math.round(+x.said||0);
    if(said===d){if(d<0){meta.money+=-d;msg='Arqueo: faltaban '+fmt(-d)+'. Encontrado el ticket mal cobrado y recuperado.';}else msg=d?'Arqueo: sobraban '+fmt(d)+'. Apuntado como sobrante.':'Arqueo: la caja cuadra al céntimo.';meta.rep=clamp(meta.rep+0.03,0,5);}
    else msg='Arqueo mal hecho: '+(d?'el descuadre de '+fmt(Math.abs(d))+' se queda sin explicar.':'la caja cuadraba y has dado una falsa alarma.');
  }else if(kind==='spill2'){
    const L=[];
    if(early&&Math.random()<0.4){addTicket('back','Un cliente se resbaló en el pasillo '+t.n+' (no había cartel)',ri(1000,3000),3,false);meta.rep=clamp(meta.rep-0.3,0,5);L.push('sin cartel, alguien se ha resbalado');good=false;}
    if(+x.wetLeft&&Math.random()<0.3){addTicket('back','Un cliente se resbaló en el pasillo '+t.n+' (suelo mojado sin cartel)',ri(800,2000),2,false);L.push('quitaste el cartel con el suelo mojado');good=false;}
    if(+x.cut){if(e)e.moral=clamp(e.moral-6,0,100);L.push('corte con los cristales');}
    if(+x.notOut&&Math.random()<0.4){addTicket('alm','Un cliente ha cogido un '+((CAT.find(y=>y.id===+x.pid)||{}).n||'producto')+' roto',0,1,false);L.push('el producto roto seguía en la estantería');}
    else if(!+x.notOut)lose(+x.pid,1);
    if(good)meta.rep=clamp(meta.rep+0.05,0,5);
    msg='Pasillo '+t.n+(good?' limpio y seco':' recogido a medias')+(L.length?' · '+L.join(' · '):'')+'.';
  }else
  if(kind==='shelf'){const mv=moveStock(t.pid,Math.round(8*sc));msg=mv?'Lineal repuesto: +'+mv+' uds en estantería.':'Has colocado lo que había, pero en el almacén no quedaba más.';}
  else if(kind==='mop'){
    if(early&&Math.random()<0.4){addTicket('back','Un cliente se resbaló en el pasillo '+t.n+' (no había cartel)',ri(1000,3000),3,false);meta.rep=clamp(meta.rep-0.3,0,5);msg='Sin cartel, alguien se ha resbalado mientras fregabas. Reclamación en camino.';good=false;}
    else{meta.rep=clamp(meta.rep+0.05,0,5);msg='Pasillo '+t.n+' limpio y seco.';}
  }else if(kind==='ask'){
    meta.rep=clamp(meta.rep+(sc>=1?0.1:sc>=0.5?0:-0.15),0,5);
    msg=sc>=1?'«¡Muchas gracias!» Cliente feliz.':sc>=0.5?'Al final lo encontró. A la segunda.':'Se ha ido sin encontrarlo.';
  }else if(kind==='tk'){
    const tk=run.tickets.find(x=>x.id===t.tkid),d=t.dept;
    if(!tk)msg='Esa reclamación ya estaba resuelta.';
    else{
      run.tickets=run.tickets.filter(x=>x!==tk);
      run.liveTk=run.liveTk||{};const LV=run.liveTk[d]=run.liveTk[d]||{ok:0,fail:0,cost:0},m0=meta.money;
      if(d==='rrpp'&&x.anger!=null||d==='rrpp'&&x.mis!=null&&x.cost!=null){
        const cost=Math.max(0,Math.round(+x.cost||0)),an=+x.anger||0;meta.money-=cost;
        if(+x.mis)msg=+x.misOk?'Bien visto: no era de RR.PP. y la has devuelto.':'La has devuelto, pero era de RR.PP.: el cliente se calienta más.';
        else if(good){meta.rep=clamp(meta.rep+0.1,0,5);msg='Respuesta publicada y cliente calmado'+(cost?' (vale de '+fmt(cost)+')':'')+'.';}
        else{meta.rep=clamp(meta.rep-(an>=60?0.5:0.25),0,5);msg=(an>=60?'🔥 La respuesta se ha hecho viral, y no para bien':'La respuesta no ha convencido')+(cost?' (y encima, vale de '+fmt(cost)+')':'')+'.';}
        if(e){good?e.st.ok++:e.st.fail++;}
      }
      else if(d==='back'&&x.paid!=null){
        const paid=Math.max(0,Math.round(+x.paid||0)),need=Math.max(0,Math.round(+x.need||0));meta.money-=paid;
        if(good){meta.rep=clamp(meta.rep+0.1,0,5);if(e)e.st.ok++;}else{meta.rep=clamp(meta.rep-0.3,0,5);if(e)e.st.fail++;}
        if(+x.mis)msg=+x.misOk?'Bien visto: no era de Backoffice y la has devuelto.':'La has devuelto, pero sí era de Backoffice. El cliente se va sin su dinero.';
        else if(paid<need){msg='Le has devuelto '+fmt(paid)+' y le tocaban '+fmt(need)+'. Se va quejándose.';if(paid===0&&need>0)addTicket('rrpp','Le negaron un reembolso que le tocaba',0,2,false);}
        else if(paid>need)msg='Le has devuelto '+fmt(paid)+' y eran '+fmt(need)+': '+fmt(paid-need)+' regalados.';
        else msg=need?'Reembolso exacto de '+fmt(need)+(+x.wrongMethod?', aunque no por donde pagó':'')+'.':'Bien: el cliente se equivocaba y no había nada que devolver.';
      }
      else if(good){const cost=tk.mis?0:d==='back'?tk.refund:d==='rrpp'?500:0;meta.money-=cost;meta.rep=clamp(meta.rep+0.1,0,5);if(e)e.st.ok++;
        msg=tk.mis?'Bien visto: no era de su departamento y la ha devuelto.':'Reclamación resuelta'+(cost?' ('+fmt(cost)+')':'')+'.';}
      else{const cost=d==='back'&&!tk.mis?tk.refund*2:0;meta.money-=cost;meta.rep=clamp(meta.rep-(d==='rrpp'?0.5:0.3),0,5);if(e)e.st.fail++;msg='La reclamación ha salido mal'+(cost?': −'+fmt(cost):'')+'.';}
      LV[good?'ok':'fail']++;LV.cost+=m0-meta.money;
    }
  }else{
    let cap=Math.round(20*sc),tot=0;
    Object.keys(meta.back).forEach(id=>{if(cap>0){const mv=moveStock(id,cap);cap-=mv;tot+=mv;}});
    msg='Camión descargado: '+Math.round(sc*100)+'% bien colocado'+(tot?', +'+tot+' uds a estantería.':'.');
    if(sc<0.6)meta.rep=clamp(meta.rep-0.1,0,5);
  }
  return {msg,good};
}

const TKN={back:'de dinero',rrpp:'por trato o redes',alm:'por producto agotado'};
function didList(e){
  const s=e.st,L=[];

  const tn=s.ok+s.fail,tk=TKN[e.role]||'';
  if(tn===1)L.push((s.ok?'Resolvió bien':'Resolvió mal')+' la única reclamación '+tk+' que le llegó.');
  else if(tn)L.push(`Resolvió bien ${s.ok} de las ${tn} reclamaciones ${tk} que le llegaron.`);
  else if(e.role!=='atc'&&e.role!=='rrhh')L.push('No le llegó ninguna reclamación.');
  if(s.tasks+s.tfail)L.push(`Atendió ${s.tasks+s.tfail} ${s.tasks+s.tfail===1?'aviso':'avisos'} en la tienda${s.tfail?` (${s.tfail} mal)`:''}.`);
  if(s.cv)L.push(`Te cubrió la caja: ${s.cv} ${s.cv===1?'cliente':'clientes'}${s.cvErr?` (${s.cvErr} con fallos)`:''}.`);
  if(s.late)L.push(`Llegó tarde ${s.late} ${s.late===1?'vez':'veces'}.`);
  if(s.caught)L.push(`Le pillaste sin hacer nada ${s.caught} ${s.caught===1?'vez':'veces'}.`);
  if(s.quej)L.push(`Un cliente se quejó de su trato ${s.quej} ${s.quej===1?'vez':'veces'}.`);
  if(s.fel)L.push(`Le felicitaron ${s.fel} ${s.fel===1?'vez':'veces'}.`);
  if(s.robo)L.push(`Le pillaron llevándose género o dinero ${s.robo} ${s.robo===1?'vez':'veces'}.`);
