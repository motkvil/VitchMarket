let meet=null;
const IV={
 rap:{q:'¿Cómo trabajas bajo presión?',hi:['En mi último súper reponía un palé en media hora.','Rápido. Si voy lento, me aburro.'],mid:['Normal, a mi ritmo.'],lo:['Yo voy tranquilo, que con prisas se rompe todo.']},
 trato:{q:'¿Qué haces si un cliente te grita?',hi:['Sonrío y le pregunto qué necesita. Funciona siempre.','Me encanta la gente, hasta los pesados.'],mid:['Aguanto, que es mi trabajo.'],lo:['Si se pone borde, yo también. Por respeto.']},
 punt:{q:'¿Eres puntual?',hi:['No he llegado tarde en mi vida.','Llego diez minutos antes. Siempre.'],mid:['Casi siempre.'],lo:['El bus me deja tirado a veces, pero me apaño.']},
 act:{q:'¿Harías tareas que no son de tu puesto?',hi:['Donde haga falta, me pongo.','Claro, aquí se rema entre todos.'],mid:['Si me lo piden, sí.'],lo:['Lo que no es mi trabajo, no es mi trabajo.']}
};
/* En la entrevista mienten un 25% de las veces (siempre para quedar mejor). */
function interview(k,v){let l=v>0.62?'hi':v<0.38?'lo':'mid';if(Math.random()<0.25)l='hi';return{q:IV[k].q,a:pick(IV[k][l])};}
function genCands(){
  const out=[],vr=vacRoles();if(!vr.length)return out;
  for(let i=0;i<3;i++){
    const c=newEmp(vr[i%vr.length],meta,{},out.map(x=>x.name));
    c.wage=Math.round(wageOf(c.role)*(1+ri(0,4)*0.02));c.exp=ri(0,8);
    c.qa=['rap','trato','punt','act'].sort(()=>Math.random()-0.5).slice(0,2).map(k=>interview(k,c[k]));
    out.push(c);
  }
  return out;
}
function genReqs(){
  const npc=meta.emp.filter(e=>!e.real),r=[],used=new Set(),n=Math.min(npc.length,ri(1,2));
  for(let i=0;i<n;i++){
    const a=pick(npc.filter(e=>!used.has(e.id)));if(!a)break;used.add(a.id);
    const types=['raise','off','extra'].concat(a.pers==='quejica'?['raise','raise']:[]);const others=npc.filter(e=>!used.has(e.id));if(others.length)types.push('feud');
    const k=pick(types);
    if(k==='feud'){const b=pick(others);used.add(b.id);r.push({k,a:a.id,b:b.id,done:null});}
    else r.push({k,a:a.id,done:null});
  }
  return r;
}
const RUMOR={punt:'llega tarde a todo y ficha como si nada',trato:'contesta fatal a los clientes cuando no miras',rap:'va a cámara lenta cuando no hay nadie',act:'se escaquea en cuanto puede'};
/* Los cotillas cuentan el punto débil real de un compañero (80%) o se lo inventan (20%). */
function genRumors(){
  return meta.emp.filter(e=>e.pers==='chismoso'&&e.days>=1).map(s=>{
    const o=pick(meta.emp.filter(x=>x!==s&&!x.real));if(!o)return null;
    const ks=['punt','trato','rap','act'],low=ks.slice().sort((a,b)=>o[a]-o[b])[0];
    return `${s.face} <b>${s.name}</b> te dice en voz baja: «Que sepas que ${o.name} ${RUMOR[Math.random()<0.8?low:pick(ks)]}.»`;
  }).filter(Boolean);
}
function startMeeting(){scrTab.meet='emp';pg=0;meet={acted:{},gone:[],reqs:genReqs(),cands:genCands(),rumors:genRumors()};showMeeting();}
function empAct(id,k){
  const e=empById(id);if(!meet||!e||meet.acted[id])return;
  let msg='';
  if(k==='praise'){e.moral=clamp(e.moral+12,0,100);msg='👏 Felicitado. Se le nota en la cara.';}
  else if(k==='warn'){
    e.warn++;e.moral=clamp(e.moral-12,0,100);e.focus=3;msg='⚠️ Toque dado (lleva '+e.warn+'). Va a espabilar… o no.';
    if(!e.real&&e.moral<20&&Math.random()<0.3){meta.emp=meta.emp.filter(x=>x!==e);meet.gone.push(e.face+' '+e.name+' se lo tomó fatal y se fue dando un portazo.');scrTab.meet='gone';pg=0;sBad();renderHud();showMeeting();return;}
  }
  else if(k==='raise'){e.wage=Math.round(e.wage*1.05);e.moral=clamp(e.moral+20,0,100);msg='💶 +5% de sueldo: '+monthTxt(e.wage)+'. Ahora te quiere un poquito más.';}
  else if(k==='fire'){meet.firing=id;showMeeting();return;}
  if(e.real)note(e.real,{praise:'👏 El jefe te ha felicitado en la reunión.',warn:'⚠️ El jefe te ha dado un toque en la reunión.',raise:'💶 ¡Aumento! +5% de sueldo.'}[k],k==='warn');
  meet.acted[id]=msg;sOk();renderHud();showMeeting();
}
/* ---------- despidos: motivo, pruebas, finiquito e indemnización ----------
   Finiquito: vacaciones no disfrutadas (sueldo × turnos / 30). Indemnización: procedente 1 €/turno (mín. 5 €);
   improcedente 20 € + 3 €/turno. Si el motivo no se sostiene con lo registrado (st + historial), 70% de denuncia;
   si se sostiene pero nunca le diste un toque, 15%. Perder la denuncia = pagar la improcedente + 30–80 € y −0,3 rep. */
const hist=e=>sumSt(e.tot,e.st);
const FIRE={
 trial:{t:'🧪 No supera el periodo de prueba',ok:e=>e.trial>0,ev:e=>'en prueba, le quedan '+e.trial+' turnos'},
 abs:{t:'📅 Faltas sin avisar',ok:(e,h)=>h.abs>=1,ev:(e,h)=>h.abs+(h.abs===1?' falta registrada':' faltas registradas')},
 late:{t:'⏰ Retrasos repetidos',ok:(e,h)=>h.late>=2,ev:(e,h)=>h.late+(h.late===1?' retraso registrado':' retrasos registrados')},
 caught:{t:'📱 Pillado/a sin trabajar',ok:(e,h)=>h.caught>=1,ev:(e,h)=>h.caught+(h.caught===1?' vez pillado/a':' veces pillado/a')},
 robo:{t:'🕵️ Hurto de género o dinero',ok:(e,h)=>h.robo>=1,ev:(e,h)=>h.robo+(h.robo===1?' hurto registrado':' hurtos registrados')},
 quej:{t:'😡 Quejas de clientes por su trato',ok:(e,h)=>h.quej>=1,ev:(e,h)=>h.quej+(h.quej===1?' queja registrada':' quejas registradas')},
 perf:{t:'📉 Bajo rendimiento',ok:(e,h)=>h.fail+h.tfail+h.cvErr>=2&&score(e)<0.5,ev:(e,h)=>(h.fail+h.tfail+h.cvErr)+' fallos registrados · valoración: '+verdict(e).replace(/^\S+ /,'')},

};
/* Liquidación (Estatuto de los Trabajadores): vacaciones no disfrutadas (30 días naturales al año, prorrateados);
   despido objetivo procedente: 20 días de salario por año trabajado; improcedente: 33 días por año (art. 56). Un turno = un día. */
const finiquito=e=>Math.round(e.wage*30*e.days/365);
const indProc=e=>Math.round(e.wage*20*e.days/365),indImp=e=>Math.round(e.wage*33*e.days/365);
/* Vender alcohol a un menor: infracción de la ley autonómica de drogodependencias. Solo se multa si hay inspección o denuncia (12 %):
   la primera, grave (3.001–6.000 €); la segunda, grave en su tramo alto (9.000–30.000 €); desde la tercera, muy grave (30.001–60.000 €). */
function minorSale(who){
  meta.rep=clamp(meta.rep-0.3,0,5);
  if(Math.random()<0.12){const n=meta.minorFine=(meta.minorFine||0)+1,f=(n>=3?ri(30001,60000):n===2?ri(9000,30000):ri(3001,6000))*100;
    run.fines+=f;meta.money-=f;meta.rep=clamp(meta.rep-1,0,5);
    return '🚔 Inspección: '+who+' alcohol a un menor. Multa '+(n>=3?'muy grave':'grave')+' de '+fmt(f)+(n>1?' (reincidencia)':'')+'.';}
  return '⚠️ '+who.replace(/^h/,'H')+' alcohol a un menor. Nadie lo ha denunciado… esta vez (multa grave: desde 3.001 €).';
}
function fireEmp(id,r){
  const e=empById(id),F=FIRE[r];if(!meet||!e||!F||meet.acted[id])return;
  if(r==='trial'&&!(e.trial>0))return;
  const h=hist(e),fin=finiquito(e),bad=score(e)<0.45;
  const just=r==='trial'||(r!=='none'&&F.ok(e,h));
  let ind=r==='trial'?0:r==='none'?indImp(e):indProc(e),cost=fin+ind,extra=0;
  const L=['<b>Carta de despido de '+e.face+' '+e.name+'.</b> Motivo: '+F.t.replace(/^\S+ /,'')+(F.ev(e,h)?' ('+F.ev(e,h)+')':'')+'.',
    'Finiquito por vacaciones no disfrutadas ('+e.days+(e.days===1?' turno':' turnos')+'): '+fmt(fin)+'.',
    (r==='trial'?'Sin indemnización: estaba en periodo de prueba.':r==='none'?'Indemnización por despido improcedente: '+fmt(ind)+'.':just?'Indemnización por despido procedente: '+fmt(ind)+'.':'Le pagas la indemnización de un despido procedente ('+fmt(ind)+'), aunque no tienes pruebas.')];
  if(just&&!e.warn&&['abs','late','caught','quej','robo'].includes(r))L.push('Sin amonestación previa por escrito.');
  const risk=r==='trial'||r==='none'?0:just?(e.warn>0?0:0.15):0.7;
  if(Math.random()<risk){
    extra=Math.max(0,indImp(e)-ind)+ri(600,1500)*100;cost+=extra;meta.rep=clamp(meta.rep-0.3,0,5);
    L.push(just?'⚖️ Te denuncia: nunca le diste un toque antes de despedirle. El juez lo declara improcedente: −'+fmt(extra)+' y −0,3 de reputación.'
      :'⚖️ Te denuncia: el motivo no se sostiene con lo que hay registrado. Despido improcedente: −'+fmt(extra)+' y −0,3 de reputación.');
  }else if(!just&&r!=='none')L.push('😅 El motivo no se sostenía, pero no te ha denunciado. Esta vez.');
  L.push('Total pagado: <b>'+fmt(cost)+'</b>.');
  meta.money-=cost;meta.emp=meta.emp.filter(x=>x!==e);meet.firing=null;
  meta.emp.forEach(x=>{x.moral=clamp(x.moral+(bad?3:-8),0,100);});
  /* Síndrome del superviviente: tras un despido el resto rinde menos (nada si era malo; menos si el despido era justo). */
  const sv=r==='trial'||bad?0:just?1:2;meta.surv=Math.max(meta.surv||0,sv);if(sv)meet.expl=0;
  L.push(bad?'El resto respira aliviado.':'El resto se ha quedado tenso'+(sv?': rendirá menos '+sv+(sv===1?' turno':' turnos'):'')+'.');
  if(e.real&&isHost()){note(e.real,'Estás despedido/a. Motivo: '+F.t.replace(/^\S+ /,'')+'. Liquidación: '+fmt(fin+ind)+(extra?' (más lo que le ha sacado tu denuncia al jefe: '+fmt(extra)+')':'')+'.',true);fb.update(rRef('members/'+e.real),{role:null}).catch(()=>{});}
  meet.gone.push(L.join('<br>'));scrTab.meet='gone';pg=0;
  sBad();renderHud();showMeeting();
}

/* ---------- acciones ---------- */
function scanItem(id){
  const c=front();if(!c||c.phase!=='scan')return;
  if(run.pendingId){toast('Primero resuelve el DNI','bad');return;}
  const it=c.items.find(i=>i.id===id);
  if(!it||it.scanned||it.denied)return;
  it.done++;sBeep();run.flash=id;
  if(it.done<it.hits){renderBelt();run.flash=0;return;}
  if(it.age&&c.idOk==='deny'){it.denied=true;ret(it);toast('Ya le viste el DNI: esto tampoco se le vende.');renderAll();run.flash=0;return;}
  if(it.age&&!c.idOk){run.pendingId=id;renderAll();run.flash=0;return;}
  it.scanned=true;
  renderAll();run.flash=0;
}
function idDecision(sell){
  const c=front();if(!c||!run.pendingId)return;
  const it=c.items.find(i=>i.id===run.pendingId);
  run.pendingId=null;
  c.idOk=sell?'sell':'deny';
  if(sell){
    it.scanned=true;
    if(c.minor){run.errors++;c.err++;toast(minorSale('has vendido'),'bad');sBad();}
    else sOk();
  }else{
    it.denied=true;ret(it);
    if(c.minor){meta.rep=clamp(meta.rep+0.1,0,5);toast('Bien visto. Era menor.','good');sOk();}
    else{meta.rep=clamp(meta.rep-0.4,0,5);c.p=Math.max(0,c.p-c.max*0.3);run.errors++;c.err++;toast('Era mayor de edad. Cliente molesto.','bad');sBad();}
  }
  renderAll();checkRep();
}
function toggleBag(){const c=front();if(!c||c.phase==='done'||run.card)return;c.bag=!c.bag;sCoin();
  /* Si ya estaba pagando en efectivo y con la bolsa no le llega, saca más dinero. */
  if(c.phase==='pay'&&c.pay==='cash'&&c.given<totalOf(c)){c.given=cashGiven(totalOf(c));toast('Saca un poco más para la bolsa: entrega '+fmt(c.given)+'.');}
  renderAll();}
function goPay(){
  const c=front();if(!c||c.phase!=='scan'||run.pendingId)return;
  if(c.items.some(i=>!i.scanned&&!i.denied)){toast('Quedan productos sin escanear','bad');return;}
  /* Si no se lleva nada (menor al que se le negó todo), se va sin pagar y sin cuenta de bolsa. */
  if(c.items.every(i=>i.denied)){c.bag=c.wantsBag=false;toast('No se lleva nada. Siguiente.');finish(c,true);return;}
  const t=totalOf(c);
  if(t===0){finish(c,true);return;}
  c.phase='pay';
  if(c.pay==='cash'){
    const P=PERS[c.pk]||{};
    if(P.exact&&Math.random()<P.exact){c.given=t;toast('Te paga con los céntimos justos 🪙. No hay cambio.','good');sCoin();finish(c,false);return;}
    else c.given=cashGiven(t);
  }
  renderAll();
}
function payCard(){
  const c=front();if(!c||c.phase!=='pay'||c.pay!=='card'||run.card)return;
  run.card=true;sBeep();renderRegister();
  const mine=c.id;
  setTimeout(()=>{
    if(!run||run.over||!front()||front().id!==mine)return;
    if(!c.declined&&Math.random()<((PERS[c.pk]||{}).decl||0.08)){
      c.declined=true;c.pay='cash';c.given=cashGiven(totalOf(c));run.card=false;
      toast('Tarjeta rechazada. Pagará en efectivo.','bad');sBad();renderAll();
    }else{sOk();finish(c,false);}
  },1200);
}
function addTray(v){const c=front();if(!c||c.phase!=='pay'||c.pay!=='cash')return;run.tray.push(v);sCoin();renderRegister();}
function clearTray(){run.tray=[];renderRegister();}
function deliver(){
  const c=front();if(!c||c.phase!=='pay'||c.pay!=='cash')return;
  const need=c.given-totalOf(c),got=traySum();
  if(got<need){toast('Falta cambio','bad');sBad();c.p=Math.max(0,c.p-2);return;}
  if(got>need){
    const loss=got-need;run.fines+=loss;meta.money-=loss;run.errors++;c.err++;
    toast('Te pasaste de cambio: −'+fmt(loss),'bad');sBad();
  }else sOk();
  finish(c,false);
}
function finish(c,noTip){
  const tot=totalOf(c);if(tot>0){meta.money+=tot;run.sales+=tot;}
  /* IVA de cada producto según su tipo legal (la bolsa, 21 %). */
  run.ivaR=(run.ivaR||0)+c.items.filter(i=>i.scanned).reduce((a,i)=>{const v=(CAT.find(x=>x.id===i.pid)||{}).iva||10;return a+i.p*v/(100+v);},0)+(c.bag?BAG*21/121:0);
  if(c.bag!==c.wantsBag){
    c.err++;run.errors++;meta.rep=clamp(meta.rep-0.3,0,5);
    toast(c.bag?'No pidió bolsa y se la cobraste':'Pidió bolsa y no se la diste','bad');sBad();
  }
  const frac=c.p/c.max,P=PERS[c.pk]||{},rm=c.reg&&meta.regs[c.reg];
  if(!noTip&&c.err===0){
    let tip=Math.round(frac*250*(meta.up.coffee?1.5:1)*(P.tip!=null?P.tip:1)*(rm&&rm.good>=3?1.3:1)/5)*5;
    if(tip>0){run.tips+=tip;toast('Propina para el bote del personal: '+fmt(tip),'good');}
    if(frac>0.5)meta.rep=clamp(meta.rep+0.08,0,5);
  }
  if(P.influ){
    if(c.err===0){meta.rep=clamp(meta.rep+0.3,0,5);toast('Te ha sacado en su directo. +reputación 📈','good');}
    else{meta.rep=clamp(meta.rep-0.5,0,5);toast('Tu error ya circula por las redes 📉','bad');}
  }
  if(Math.random()<0.5)addReview(c.err>1?2:c.err?3:frac>0.5?5:4,c.face);
  regVisit(c,c.err===0&&frac>0.3);
  if(c.err>0&&Math.random()<0.4)addTicket('back','Error en su compra',ri(100,600),2,false);
  run.served++;
  removeFront();
  renderAll();checkRep();
}

function renderHud(){

  $('#hMoney').textContent=fmt(meta.money);$('#hMoney').parentNode.classList.toggle('neg',meta.money<0);

function renderQueue(){
  const q=$('#queue');let h='';
  const arr=run?run.queue:[];
  arr.forEach((c,i)=>{h+=`<div class="cust ${i===0?'front':''}"><div class="face">${c.face}</div><div class="pbar"><i data-pid="${c.id}"></i></div></div>`;});
  for(let i=arr.length;i<5;i++)h+='<div class="slot"></div>';
  q.innerHTML=h;
  const b=$('#bubble'),c=front();
  if(!c){b.className='bubble muted';b.textContent=run&&run.closing?'Cerrando. Atiende a los que quedan.':'Nadie en caja. Respira.';}
  else{
    b.className='bubble';
    const lab=c.lab?`<b>${c.lab}${c.tour?' '+c.tour.f:''}</b> · `:'';
    b.innerHTML=c.complaint?'📣 '+c.complaint.t:lab+(c.wantsBag?(c.tour?'🛍️ «'+c.tour.bag+'» ':'🛍️ ¿Me pones una bolsa? '):'')+(c.pay==='card'?'💳 Pago con tarjeta.':'💶 Pago en efectivo.');
  }

}
function updatePatience(){
  if(!run)return;
  run.queue.forEach(c=>{
    const el=document.querySelector('[data-pid="'+c.id+'"]');if(!el)return;
    const f=clamp(c.p/c.max,0,1);
    el.style.width=(f*100)+'%';
    el.className=f>0.5?'':f>0.25?'mid':'low';
  });
}

/* ---------- cámaras de seguridad: la tienda vista desde arriba (canvas 2D, sin librerías) ----------
   camModel() resume quién está dónde (sirve igual en solitario, para el jefe y, publicado en state.cam,
   para los empleados reales). drawCams() lo pinta cada frame en 4 cámaras; las personas caminan hacia
   su sitio (sprites con posición propia) y los clientes de la cola entran desde los pasillos. */
const CAMS=[['CAM 1 · SALA',0,0,262,170],['CAM 2 · CAJAS',0,166,262,94],['CAM 3 · ALMACÉN',262,0,138,156],['CAM 4 · OFICINAS',262,152,138,108]];
const CAM_KEY='vitchmarket.camaras';
const SPOT={till:[192,228],door:[250,252],dock:[368,28],brk:[384,132],
  post:{atc:[[50,228],[118,228],[84,242]],alm:[[298,72],[336,72],[298,112],[336,112]],back:[[296,210],[296,240],[318,210],[318,240]],rrpp:[[352,210],[352,240],[376,210],[376,240]],rrhh:[[340,250],[372,250]]}};
const laneX=n=>10+(clamp(n||1,1,9)-1)*27+18;
const aislePt=()=>[laneX(ri(1,9)),rnd(30,140)];

const taskSpot=t=>t.k==='truck'?{k:'dock'}:t.k==='order'?{k:'post',r:'alm',i:1}:t.k==='cash'?{k:'post',r:'back',i:1}:t.k==='cv'||t.k==='feud'?{k:'post',r:'rrhh',i:1}:t.k==='tk'?{k:'post',r:t.dept||'back',i:0}:{k:'aisle',n:t.n||1};
function camModel(){
  if(!run||run.over)return null;
  const idx={},staff=[];
  meta.emp.forEach(e=>{
    const i=idx[e.role]=(idx[e.role]||0)+1,d=run.duty&&run.duty[e.id];
    if(!d||d.st==='abs'||d.st==='off'||d.st==='gone'||run.t<d.at)return;
    let w={k:'post',r:e.role,i:i-1},b='',x='en su puesto';
    if(run.away&&run.away.cover===e.id){w={k:'till'};b='🧾';x='te está cubriendo la caja';}
    else if(d.busy){const t=run.tasks.find(y=>y.id===d.task);if(t){w=taskSpot(t);b=t.ic;x='con un aviso: '+t.s;}}
    else if(run.tills&&e.real&&run.tills[e.real]){const tl=run.tills[e.real];w={k:'till',n:tl.n};b='🧾';x='en la Caja '+tl.n+' ('+Object.keys(tl.out).length+' en cola)';}
    else if(d.slack){const p=d.slack.split(' ');b=p[0];x=p.slice(1).join(' ');if(b==='☕')w={k:'brk'};else if(b==='🚬')w={k:'door'};}
    staff.push({id:e.id,f:e.face,n:e.name,u:e.real||'',r:e.role,w,b,x});
  });
  let me={w:{k:'till'},b:'',x:'en la caja 3'};
  if(run.away){
    if(mg&&mg.t)me={w:taskSpot(mg.t),b:mg.t.ic,x:'fuera de caja: '+mg.t.s};
    else me={w:{k:'roam'},b:run.away.auto?'📋':'👀',x:run.away.auto?'dirigiendo la tienda':'supervisando la tienda'};
  }
  me.n=isHost()?(playerName()||'Jefe'):'Tú';
  return {d:meta.day,t:Math.round(run.t),dur:run.dur,open:!run.closing,me,staff,
    q:run.queue.map(c=>({id:c.id,f:c.face,a:c.p<c.max*0.3?1:0})),
    tasks:run.tasks.filter(t=>!t.who).map(t=>({id:t.id,k:t.k,ic:t.ic,n:t.n||0}))};
}
function camPos(w,j){
  if(w.k==='till')return w.n===1?[52,228]:w.n===2?[120,228]:SPOT.till;
  if(w.k==='door')return SPOT.door;
  if(w.k==='dock')return SPOT.dock;
  if(w.k==='brk')return SPOT.brk;
  if(w.k==='roam'){const s=performance.now()/1000;return [130+100*Math.sin(s/3),90+50*Math.sin(s/2.1)];}
  if(w.k==='aisle')return [laneX(w.n),60+(j*23)%60];
  const a=SPOT.post[w.r]||SPOT.post.back;return a[(w.i||0)%a.length];
}
function camTargets(m){
  const T={},myUid=room&&room.uid;
  if(!m)return T;
  toArr(m.staff).forEach((s,j)=>{
    const p=camPos(s.w||{},j),you=isMember()&&s.u===myUid;
    T['s'+s.id]={r:s.r,x:p[0],y:p[1],f:s.f,lab:you?'Tú':s.n+(s.u?' 🎮':''),b:s.b||'',hl:you,info:(you?'Tú':s.n)+' · '+(ROLES[s.r]?ROLES[s.r].n:'')+' · '+(s.x||'')};
  });
  const me=m.me||{w:{k:'till'}},p=camPos(me.w||{},0);
  T.me={x:p[0],y:p[1],f:'🧑‍💼',lab:isMember()?'👑 '+(me.n||'Jefe'):'Tú',b:me.b||'',hl:!isMember(),info:(isMember()?'👑 '+(me.n||'El jefe'):'Tú')+' · '+(me.x||'')};
  toArr(m.q).forEach((c,i)=>{T['c'+c.id]={x:i===0?200:200-22*i,y:i===0?196:188,f:c.f,lab:'',b:c.a?'😠':'',hl:false,cust:1,info:i===0?'Cliente en caja':'Cliente en la cola ('+(i+1)+'º)'};});
  return T;
}
function camStep(m,dt){
  const T=camTargets(m),S=cam.spr,sp=70*dt;
  Object.keys(T).forEach(id=>{
    let s=S[id];
    if(!s){const st=id[0]==='c'?aislePt():SPOT.door;s=S[id]={x:st[0],y:st[1]};}
    Object.assign(s,T[id],{tx:T[id].x,ty:T[id].y,x:s.x,y:s.y,gone:0});
  });
  Object.keys(S).forEach(id=>{const s=S[id];if(!T[id]&&!s.gone){s.gone=1;s.tx=SPOT.door[0];s.ty=SPOT.door[1]+12;s.hl=false;}});
  Object.keys(S).forEach(id=>{
    const s=S[id],dx=s.tx-s.x,dy=s.ty-s.y,dd=Math.hypot(dx,dy);
    s.mv=dd>1;
    if(dd<=sp){s.x=s.tx;s.y=s.ty;if(s.gone)delete S[id];}else{s.x+=dx/dd*sp;s.y+=dy/dd*sp;}
  });
  /* Gente comprando por los pasillos (decorado: más cuanto más avanzan los días). */
  const want=m&&m.open?clamp(2+(m.d||1),3,8):0;
  while(cam.shop.length<want){const p=SPOT.door;cam.shop.push({x:p[0],y:p[1],tx:p[0],ty:p[1],f:pick(FACES),w:0});}
  cam.shop.forEach((s,i)=>{
    if(i>=want&&!s.gone){s.gone=1;s.tx=SPOT.door[0];s.ty=SPOT.door[1]+12;}
    const dx=s.tx-s.x,dy=s.ty-s.y,dd=Math.hypot(dx,dy),v=sp*0.7;
    s.mv=dd>1;
    if(dd<=v){s.x=s.tx;s.y=s.ty;if(s.gone)s.dead=1;else if((s.w-=dt)<=0){const p=aislePt();s.tx=p[0];s.ty=p[1];s.w=rnd(1,4);}}
    else{s.x+=dx/dd*v;s.y+=dy/dd*v;}
  });
  cam.shop=cam.shop.filter(s=>!s.dead);
}

function drawCams(){
  const slot=isMember()?null:tab==='dir'?document.getElementById('dircams'):cam.on?document.getElementById('camslot'):null;
  if(!slot||!slot.offsetParent||cam.noctx)return;
  if(!cam.cv){
    cam.cv=document.createElement('canvas');cam.cv.className='camcv';
    cam.ctx=cam.cv.getContext&&cam.cv.getContext('2d');if(!cam.ctx){cam.noctx=true;return;}
    cam.cv.addEventListener('click',camClick);
  }
  if(cam.cv.parentNode!==slot)slot.appendChild(cam.cv);
  let m=null;
  m=camModel();
  const dpr=window.devicePixelRatio||1,W=slot.clientWidth||300,H=Math.round(W*(cam.zoom<0?0.62:0.68));
  if(cam.cv.width!==Math.round(W*dpr)||cam.cv.height!==Math.round(H*dpr)){cam.cv.width=Math.round(W*dpr);cam.cv.height=Math.round(H*dpr);cam.cv.style.height=H+'px';}
  const now=performance.now(),dt=Math.min(0.1,(now-cam.last)/1000||0);cam.last=now;
  camStep(m,dt);cam.stepAt=now;
  const c=cam.ctx;c.setTransform(dpr,0,0,dpr,0,0);c.fillStyle='#050807';c.fillRect(0,0,W,H);
  const cells=cam.zoom<0?[0,1,2,3]:[cam.zoom];cam.hits=[];
  cells.forEach((ci,k)=>{
    const [lab,cx,cy,cw,ch]=CAMS[ci],g=cam.zoom<0;
    const gx=g?(k%2)*W/2:0,gy=g?Math.floor(k/2)*H/2:0,gw=g?W/2:W,gh=g?H/2:H;

    if(it.age){g.fillStyle='#e5383b';g.fillRect(X(x)+S*.14,Y(y)-S*.5,S*.38,S*.24);g.fillStyle='#fff';g.font='700 '+Math.round(S*.18)+'px sans-serif';g.fillText('18',X(x)+S*.33,Y(y)-S*.38);}});
  const bc=Math.max(1,Math.floor((bw-4)/10));
  ptl.bask.forEach((b,j)=>{g.font=Math.round(9*v.k)+'px sans-serif';g.fillText(b.e,X(bxx+7+(j%bc)*10),Y(byy+bh-8-Math.floor(j/bc)*6));});
  ptl.fly=ptl.fly.filter(f=>{f.t=Math.min(1,f.t+dt*2.6);const x=f.x+(bxx+bw/2-f.x)*f.t,y=f.y+(byy+bh/2-f.y)*f.t-Math.sin(f.t*Math.PI)*28;const sz=f.s*(1-.5*f.t)*v.k;g.font=Math.round(sz)+'px sans-serif';g.fillText(f.e,X(x),Y(y));if(f.t>=1){ptl.bask.push({e:f.e});return false;}return true;});

/* ===== Dirección: cómo va hoy contra ayer a la misma hora =====

   variación del bote desde la apertura, clientes de todas las cajas, reputación]. Al cerrar pasa a meta.prevCurve. */
const DIRM=[['s','💶 Ventas',v=>fmt(v)],['m','💰 Bote',v=>(v>=0?'+':'')+fmt(v)],['c','🙂 Clientes',v=>Math.round(v)],['r','⭐ Reputación',v=>'★ '+(+v).toFixed(1)]];
const DIRI={s:1,m:2,c:3,r:4};let dirM='s';

function dirLive(){

  let g='';for(let h=9;h<=21;h+=3){const x=X((h-9)*4);g+=`<line x1="${x}" y1="${pt}" x2="${x}" y2="${H-pb}" class="dg"/><text x="${x}" y="${H-6}" class="dt" text-anchor="middle">${h}:00</text>`;}
  [lo,(lo+hi)/2,hi].forEach(v=>{g+=`<line x1="${pl}" y1="${Y(v)}" x2="${W-pr}" y2="${Y(v)}" class="dg"/><text x="${pl-4}" y="${Y(v)+4}" class="dt" text-anchor="end">${dirM==='s'||dirM==='m'?Math.round(v/100)+'€':dirM==='r'?(+v).toFixed(1):Math.round(v)}</text>`;});
  if(lo<0)g+=`<line x1="${pl}" y1="${Y(0)}" x2="${W-pr}" y2="${Y(0)}" class="d0"/>`;

  const delta=(a,b,fm)=>{if(b==null)return '<em>sin datos de ayer</em>';const d=a-b,good=d>=0;return `<em class="${d===0?'':good?'up':'down'}">${d>0?'▲':d<0?'▼':'='} ${String(fm(Math.abs(d))).replace(/^\+/,'')}${b&&dirM!=='r'?` (${d>=0?'+':'−'}${Math.round(Math.abs(d)/Math.abs(b)*100)}%)`:''}</em>`;};
  const tiles=DIRM.map(([key,l,fm])=>{const kk=DIRI[key],a=now?+now[kk]:0,b=pv?+pv[kk]:null;

/* Las otras cajas: cada cajero/a de la casa libre (máx. 3) despacha clientes que no ves. Entra más gente con buena reputación
   y se vende menos si hay productos agotados. Cada venta trae su coste de mercancía (la repone el proveedor habitual). */
function offTick(dt){
  const n=Math.min(3,staffOf('atc').filter(e=>!e.real&&isFree(e)&&!run.duty[e.id].slack).length);if(!n)return;
  const out=CAT.filter(x=>(meta.stock[x.id]||0)<=0).length/CAT.length;
  const dem=OFF.dem*(0.4+0.12*meta.rep)*(1-0.6*out)*(1+0.03*Math.min(meta.day,10));
  const rate=Math.min(dem,n*OFF.cap)/(run.dur||100);
  run.offAcc=(run.offAcc||0)+dt*rate;
  while(run.offAcc>=1){run.offAcc--;const v=Math.round(OFF.ticket*rnd(0.4,1.6)),c=Math.round(v*(SUPS[0].cf+OFF.merma));
    run.offS+=v;run.offC+=c;run.offN++;meta.money+=v-c;}
}
function tick(ts){try{step(ts,false);}catch(e){console.warn('tick',e);quiet=false;}requestAnimationFrame(tick);}
function step(ts,hid){
  if(room&&(room.waitRelay||room.yieldR||room.stopping))return;
  quiet=!!(room&&room.sim);
  const dt=Math.min(0.1,(ts-last)/1000||0);last=ts;
  if(run&&!run.over&&!guide){
    run.t+=dt;
    if(!run.closing&&run.t>=run.dur){run.closing=true;renderQueue();}
    if(!run.closing){
      run.next-=dt;
      if(run.next<=0){
        if(run.queue.length<5||(run.tills&&Object.values(run.tills).some(t=>Object.keys(t.out).length<TILL_MAX))){
          const nc=newCustomer();
          if(sendToTill(nc)){}
          else if(run.queue.length>=5){nc.items.forEach(ret);}
          else if(nc.cut&&run.queue.length>=2){
            run.queue.splice(1,0,nc);
            run.queue.slice(2).forEach(q=>{q.p=Math.max(1,q.p-q.max*0.12);});
            toast('Alguien se ha colado. La cola murmura…','bad');
          }else run.queue.push(nc);
          const ia=Math.max(5.5,9.5-meta.day*0.6);
          run.next=rnd(ia*0.7,ia*1.3);
          renderAll();
        }else run.next=2;
      }
    }
    const helpers=staffOf('atc').filter(e=>isFree(e)&&!run.duty[e.id].slack).length;
    const am=run.away&&!run.away.cover?run.away.mult:0;
    const rate=(meta.up.fan?0.8:1)*(1-0.08*helpers);
    for(let i=run.queue.length-1;i>=0;i--){
      const c=run.queue[i];
      c.p-=dt*rate*(i===0?(am||1):(am?1:0.55));
      c.talk-=dt;
      if(c.talk<=0){c.talk=rnd(7,13);if(c.p>0)say(c,i);}
      if(c.p<=0){leaveAngry(i);if(run.over)break;}
    }
    if(run&&!run.remote&&!run.closing&&!run.over)offTick(dt);
    if(run&&!run.remote&&!run.over&&run.queue.length>=2&&run.t-(run.callT||0)>(run.dur||100)/40){const e=freeTill();if(e)sendQueue(e,1,false);else run.callT=run.t-(run.dur||100)/80;}
    if(run&&run.remote){run.syncT+=dt;if(run.syncT>1){run.syncT=0;tillSync();}}
    else{
    if(run&&!run.over)tickStaff(dt);
    if(run&&!run.over&&run.closing&&run.queue.length===0&&tillsBusy()&&(run.waitT=(run.waitT||0)+dt)>45)Object.keys(run.tills).forEach(u=>closeTill(u,'se acabó el turno'));
    if(run&&!run.over&&run.closing&&run.queue.length===0&&!tillsBusy()&&(!run.away||run.away.auto)&&!mg)endDay();
    }
    updatePatience();
    renderChat();
  }
  renderHud();
  if(isHost()&&run&&!run.over&&!run.remote&&run.t-(run.saveT||0)>15){run.saveT=run.t;meta.liveT=run.t;if(room)fb.set(rRef('meta'),liveMeta()).catch(e=>console.warn('No se pudo guardar en la sala:',e));}
  if((!room||isHost())&&run&&!run.over&&!run.remote)curveSample(false);
  quiet=false;
  if(isHost())pubState(false);
  if(hid)return;
  if(tab!=='caja'&&!isMember()&&(ts-(window._dT||0))>700){window._dT=ts;renderDept();if(tab==='dir')dirLive();}
  drawCams();drawIso();if(tab!=='caja'&&!isMember())drawDeptScene();till3d();if((iso.infoT=(iso.infoT||0)+1)%20===0)isoInfo();
}
/* Con la pestaña oculta el navegador no pinta (no hay requestAnimationFrame): si llevas la tienda, se sigue moviendo en segundo plano. */
/* El reloj de fondo va en un Worker: los temporizadores de la pestaña se congelan (Chrome los baja a uno por minuto
   tras 5 min oculta), los mensajes de un Worker no. Si no se puede crear, setInterval de siempre. */
function bgStep(){
  if(room&&!offline&&(performance.now()-(room.rcT||0))>3000){room.rcT=performance.now();try{relayCheck();}catch(e){}}
  if(!room||!isHost()||offline||performance.now()-last<1000)return;
  let n=Math.min(600,Math.floor((performance.now()-last)/100));try{while(n-->0)step(last+100,true);}catch(e){console.warn('bgStep',e);quiet=false;}
}
try{const w=new Worker(URL.createObjectURL(new Blob(['setInterval(function(){postMessage(0)},1000)'],{type:'text/javascript'})));w.onmessage=bgStep;w.onerror=()=>setInterval(bgStep,1000);}
catch(e){setInterval(bgStep,1000);}
setInterval(relayCheck,3000);
/* Si el jefe se va a otra pestaña o bloquea el móvil, un cajero de la casa lleva su Caja 3 hasta que vuelva. */
document.addEventListener('visibilitychange',()=>{
  if(room&&room.host&&room.yieldR&&!document.hidden){room.yieldR=false;if(relayActive())waitRelay();else{room.waitRelay=true;relayChanged(true);}return;}
  if(!room||!room.host||room.sim||!run||run.over||run.remote||mg)return;
  if(document.hidden){if(!run.away)autoTill();}
  else if(tab==='caja'&&run.away&&run.away.auto)returnTill();
});

document.addEventListener('change',e=>{
  if(e.target&&e.target.id==='rdur'&&isHost())fb.update(rRef('info'),{dur:+e.target.value}).catch(()=>{});
  if(e.target&&e.target.classList.contains('force')&&e.target.value){const v=e.target.value,t=+e.target.dataset.t;e.target.blur();assignTask(t,v);}
});
function onClick(e){
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const a=b.dataset.act;
  if(run&&run.away&&['scan','idyes','idno','bag','pay','card','den','clear','deliver','route'].includes(a)){toast('Estás en el pasillo. Termina y vuelve a la caja.','bad');return;}
  if((a==='start'||a==='restart')&&$('#pname'))setPlayerName($('#pname').value);
  if(a==='rapply'&&$('#pname')&&isMember()){if(!nameOk())return;room.renaming=false;fb.update(rRef('members/'+room.uid),{name:playerName()}).catch(()=>{});}
  if(a==='start'){beep(1200,.05);startDay();}
  else if(a==='restart'){meta=defMeta(meta.best);meet=null;startDay();}
  else if(a==='next'){meta.day++;startDay();}
  else if(a==='buy'){
    const u=UPS.find(x=>x.k===b.dataset.k);
    if(u&&!meta.up[u.k]&&meta.money>=u.c){meta.money-=u.c;meta.up[u.k]=1;sOk();renderHud();refreshView();
    }
  }
  else if(a==='route')route(b.dataset.d);
  else if(a==='sup'){ordSup=b.dataset.k;refreshView();}
  else if(a==='ordp'){cart[b.dataset.id]=(cart[b.dataset.id]||0)+6;refreshView();}
  else if(a==='ordm'){const q=(cart[b.dataset.id]||0)-6;if(q<=0)delete cart[b.dataset.id];else cart[b.dataset.id]=q;refreshView();}
  else if(a==='tab')setTab(b.dataset.k);
  else if(a==='dirm'){dirM=b.dataset.k;dirLive();}
  else if(a==='stab'){scrTab[b.dataset.s]=b.dataset.k;pg=0;rerenderScreen();}
  else if(a==='pg'){pg+=+b.dataset.d;rerenderScreen();}
  else if(a==='side')$('#sidebar').classList.toggle('open');
  else if(a==='aall')assignAll();
  else if(a==='guide')openGuide(guideKey(),false);
  else if(a==='gpg'&&guide){guide.pg+=+b.dataset.d;renderGuide();}
  else if(a==='gclose'){guide=null;renderGuide();}
  else if(a==='rpanel'&&isMember()){room.panel=true;room.lastHtml='';renderMember();}
  else if(a==='rtill'&&isMember()){room.panel=false;hideOverlay();renderAll();}
  else if(a==='dtk')deskTicket(+b.dataset.id);
  else if(a==='drepo')deskRepo(+b.dataset.id);
  else if(a==='drev')answerReview(+b.dataset.id);
  else if(a==='ordgo')placeOrder();
  else if(a==='meeting')startMeeting();
  else if(a==='endmeet')endMeeting();
  else if(a==='emp')empAct(+b.dataset.e,b.dataset.k);
  else if(a==='fire')fireEmp(+b.dataset.e,b.dataset.r);
  else if(a==='integc'){const c=meet&&meet.cands[+b.dataset.c];if(c&&!c.integ&&meta.money>=INTEG){meta.money-=INTEG;c.integ=integBand(c.hon);sCoin();renderHud();showMeeting();}}
  else if(a==='explfire'){if(meet&&!meet.expl){meet.expl=1;meta.surv=0;meta.emp.forEach(x=>{x.moral=clamp(x.moral+2,0,100);});toast('📣 Lo has explicado claro. El equipo lo entiende.','good');sOk();showMeeting();}}
  else if(a==='firex'){if(meet){meet.firing=null;showMeeting();}}
  else if(a==='req')applyReq(+b.dataset.r,+b.dataset.o);
  else if(a==='hirec')hireCand(+b.dataset.c);
  else if(a==='assign')assignTask(+b.dataset.t,b.dataset.e);
  else if(a==='leave')doLeave(b.dataset.o,b.dataset.e);
  else if(a==='leavecancel'){pendingLeave=null;closeMG();}
  else if(a==='supervise')openSup();
  else if(a==='callq'){const e=freeTill();if(e)sendQueue(e,2,true);else toast('No hay ningún cajero libre ahora mismo.','bad');}
  else if(a==='return')returnTill();
  else if(a==='supact')supAct(+b.dataset.e,b.dataset.k);
  else if(a.startsWith('mg'))mgAct(a,b);  else if(a==='scan')scanItem(+b.dataset.id);
  else if(a==='idyes')idDecision(true);
  else if(a==='idno')idDecision(false);
  else if(a==='bag')toggleBag();
  else if(a==='pay')goPay();
  else if(a==='card')payCard();
  else if(a==='den')addTray(+b.dataset.v);
  else if(a==='clear')clearTray();
  else if(a==='undo'){run.tray.pop();sCoin();renderRegister();}
  else if(a==='deliver')deliver();
  else if(a==='cams')toggleCams();
  else if(a==='mute'){muted=!muted;b.textContent=muted?'🔇':'🔊';}
  else if(a==='wipe')showStart(true);
  else if(a==='rename'){if(isMember())room.renaming=true;const w=b.closest('[data-label]');if(w){w.outerHTML=nameInput(w.dataset.label);const i=$('#pname');if(i){i.focus();i.select();}}}
  else if(a==='ropen')openStore();
  else if(a==='rreg')register();
  else if(a==='rapply')applyJob(b.dataset.r);
  else if(a==='rcancel'&&isMember()){room.msg=null;fb.update(rRef('members/'+room.uid),{apply:null}).catch(err=>hubMsg('⚠️ '+errMsg(err),true));}
  else if(a==='rquit'||a==='rresign')resign();
  else if(a==='rhire')hireReal(b.dataset.u);
  else if(a==='rreject')rejectReal(b.dataset.u);
  else if(a==='rtake')roomAct({k:'take',t:+b.dataset.t});
  else if(a==='rtool'){roomAct({k:'take',t:+b.dataset.c});toast('Se lo pides al jefe…');}
  else if(a==='vac'){const m=setVac(b.dataset.r,+b.dataset.d);toast(m,'good');renderDept(true);saveGame(!(run&&!run.over));}
  else if(a==='wpick'){room.wpick=b.dataset.k||null;room.lastHtml='';renderMember();}
  else if(a==='rhh')roomAct({k:b.dataset.k,u:b.dataset.u});
  else if(a==='rboss')takeOver();
  if(run&&run.over&&!run.dead&&meta.closed)saveGame(true);
}
const errMsg=err=>(err&&(err.code||err.message))||String(err);
/* Atajos de teclado en la caja (solo con ratón y teclado): Espacio escanea, B bolsa, Intro cobra o da el cambio,
   S/N en el DNI, Retroceso quita la última moneda, 1–5 deriva una reclamación y Esc cancela una ventana. */
const KBD='<div class="kbd">⌨️ <b>Espacio</b> escanear · <b>B</b> bolsa · <b>Intro</b> cobrar / dar cambio · <b>S</b>/<b>N</b> DNI · <b>⌫</b> quitar moneda · <b>1–5</b> reclamación</div>';
document.addEventListener('keydown',ev=>{
  const tg=ev.target;if(tg&&(tg.tagName==='INPUT'||tg.tagName==='TEXTAREA'||tg.tagName==='SELECT'||tg.isContentEditable))return;
  if(ev.ctrlKey||ev.metaKey||ev.altKey)return;
  const k=ev.key.toLowerCase(),show=id=>{const x=$(id);return x&&x.classList.contains('show');};
  if(k==='escape'){const x=document.querySelector('#mg.show [data-act=leavecancel],#guide.show [data-act=gclose],#overlay.show .gs-pick [data-act=wpick]');if(x){ev.preventDefault();x.click();}return;}
  /* En el puesto de trabajo del empleado real, 1–6 son los botones de la barra de acciones. */
  if(isMember()&&show('#overlay')&&!show('#mg')&&!show('#guide')&&/^[1-6]$/.test(k)){const b=document.querySelectorAll('#overlay .gs-bar2 .hk')[+k-1];if(b&&!b.disabled){ev.preventDefault();b.click();}return;}
  if(!run||run.over||show('#overlay')||show('#mg')||show('#guide'))return;
  if(!run.remote&&tab!=='caja')return;
  const q=sel=>document.querySelector('#register '+sel+':not([disabled])');
  let el=null;
  if(k===' ')el=document.querySelector('#belt .item');
  else if(k==='b')el=q('[data-act=bag]');
  else if(k==='enter')el=q('[data-act=pay]')||q('[data-act=card]')||q('[data-act=deliver]')||q('[data-act=return]');
  else if(k==='s')el=q('[data-act=idyes]');
  else if(k==='n')el=q('[data-act=idno]');
  else if(k==='backspace')el=q('[data-act=undo]');
  else if(/^[1-5]$/.test(k))el=q('[data-act=route][data-d="'+['atc','back','rrpp','alm','no'][+k-1]+'"]');
  if(el){ev.preventDefault();if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();el.click();}
});
document.addEventListener('click',e=>{try{onClick(e);}catch(err){console.error(err);toast('⚠️ Error: '+errMsg(err),'bad');}});
window.addEventListener('unhandledrejection',ev=>{console.error(ev.reason);toast('⚠️ Error: '+errMsg(ev.reason),'bad');});


if(window.claude&&window.claude.hot&&window.claude.hot.snapshot)window.claude.hot.snapshot(()=>({meta}));
function boot(d){
  if(d&&d.meta)meta=Object.assign(defMeta(),d.meta);
  else{
    const m=loadGame();
    if(m){
      /* Guardada tras el cierre: se continúa en el turno siguiente (la reunión pendiente se da por hecha). */
      if(m.closed){if(m.day%3===1)m.emp.forEach(closeSt);m.day++;m.closed=false;}
      meta=Object.assign(defMeta(),m);hasSave=true;
    }
  }
  document.body.dataset.tab=tab;
  ensureMeta();renderAll();requestAnimationFrame(tick);
  if(cam.on)$('#camwin').classList.add('show');
  if(online())bootOnline();else showStart();
}
if(window.claude&&window.claude.hot&&window.claude.hot.ready)window.claude.hot.ready(boot);
else boot((window.claude&&window.claude.hot&&window.claude.hot.data)||{});
})();
</script>
</body>
