<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>VitchMarket · Cliente perdido</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&family=Pixelify+Sans:wght@500;700&display=swap">
<style>
body{margin:0}
.vm{--brand:#d92d30;--brand-dk:#9f1d20;--brand-soft:#fde7e7;--paper:#faf6ea;--card:#ffffff;--ink:#1b1f1d;--mute:#56635d;--line:rgba(27,31,29,0.12);--tag:#ffd23f;--ok:#1f7a46;--ok-soft:#e3f3ea;--warn:#7a4f00;--warn-soft:#fff1c2;--floor:#17352f}
.vm a{text-decoration:none;color:inherit}
.vm button{font-family:inherit;cursor:pointer}
.ais{height:72px;border:0;border-radius:14px;background:#2b4a42;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;font-weight:800;box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
.ais span{font-size:26px;line-height:30px}
</style>
</helmet>
<div class="vm" style="position:relative;width:390px;height:844px;overflow:hidden;box-sizing:border-box;background:var(--paper);color:var(--ink);font-family:'Nunito',system-ui,sans-serif;">

  <header style="position:absolute;top:0;left:0;right:0;height:96px;box-sizing:border-box;padding:44px 8px 0;background:var(--brand);border-bottom:5px solid var(--brand-dk);color:#fff;display:flex;align-items:center;">
    <a href="Mapa.dc.html" aria-label="Salir" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
    <div style="flex:1;font-family:'Fredoka',sans-serif;font-weight:600;font-size:18px;">Cliente perdido</div>
    <button aria-label="Ver cómo se juega" style="width:44px;height:44px;border:0;border-radius:22px;background:rgba(255,255,255,0.2);color:#fff;font-family:'Fredoka',sans-serif;font-weight:700;font-size:20px;">?</button>
  </header>

  <div style="position:absolute;top:108px;left:16px;right:16px;display:flex;flex-direction:column;gap:12px;">

    <section style="border-radius:20px;background:var(--tag);padding:12px 16px;">
      <div style="font-family:'Fredoka',sans-serif;font-weight:600;font-size:20px;line-height:26px;">Llévale al pasillo que busca.</div>
      <div style="margin-top:2px;font-size:13px;line-height:18px;">Lee lo que pide y toca el pasillo donde está.</div>
    </section>

    <section style="border-radius:20px;background:var(--card);box-shadow:0 4px 14px rgba(27,31,29,0.1);padding:12px 16px;display:flex;align-items:center;gap:12px;">
      <div style="flex:none;width:52px;height:52px;border-radius:26px;background:var(--paper);display:flex;align-items:center;justify-content:center;font-size:30px;">🧓</div>
      <div style="flex:1;min-width:0;"><b style="display:block;font-size:12px;line-height:14px;color:var(--mute);">CLIENTE</b><span style="font-size:15px;line-height:22px;font-weight:700;">«¿Dónde tienen la pasta?»</span></div>
      <span style="flex:none;font-size:40px;">🍝</span>
    </section>

    <section style="border-radius:20px;background:var(--floor);padding:14px 16px;">
      <div style="font-size:12px;line-height:14px;color:#cfe3da;font-weight:800;">PLANO · TOCA UN PASILLO</div>
      <div style="margin-top:8px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;">
        <button class="ais"><span>🥛</span>Pasillo 1</button>
        <button class="ais" style="background:var(--tag);color:var(--ink);box-shadow:0 0 0 4px var(--brand);"><span>🍝</span>Pasillo 2</button>
        <button class="ais"><span>🍷</span>Pasillo 3</button>
        <button class="ais"><span>🥣</span>Pasillo 4</button>
        <button class="ais"><span>🍞</span>Pasillo 5</button>
        <button class="ais"><span>🧴</span>Pasillo 6</button>
      </div>
    </section>

    <section style="font-size:13px;line-height:18px;color:var(--mute);">Si te equivocas, pierde un poco de paciencia pero puedes volver a elegir. Sin cronómetro.</section>
  </div>

  <div style="position:absolute;left:16px;right:16px;bottom:24px;">
    <a href="Mapa.dc.html" style="height:56px;border-radius:16px;background:var(--brand);box-shadow:0 4px 0 var(--brand-dk);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Fredoka',sans-serif;font-weight:600;font-size:20px;">Llevarle al pasillo 2</a>
  </div>
</div>
</x-dc>

</html>
