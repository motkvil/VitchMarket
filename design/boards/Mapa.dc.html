<!doctype html>

<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&family=Pixelify+Sans:wght@500;700&display=swap">
<style>
body{margin:0}
.vm{--brand:#d92d30;--brand-dk:#9f1d20;--brand-soft:#fde7e7;--paper:#faf6ea;--card:#ffffff;--ink:#1b1f1d;--mute:#56635d;--line:rgba(27,31,29,0.12);--tag:#ffd23f;--ok:#1f7a46;--ok-soft:#e3f3ea;--warn:#7a4f00;--warn-soft:#fff1c2;--floor:#17352f}
.vm a{text-decoration:none;color:inherit}
.vm svg{shape-rendering:crispEdges}
.pin{position:absolute;width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;box-sizing:border-box;border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink)}
.pin.t{background:var(--tag)}
.pin.u{background:var(--brand);animation:vmpulse 1.2s infinite}
.pin.d{background:var(--ok-soft);opacity:.85}
.tag{position:absolute;height:18px;border-radius:9px;padding:0 6px;background:rgba(27,31,29,.85);color:#fff;font-size:12px;line-height:18px;font-weight:800;white-space:nowrap}
@keyframes vmpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
.row{display:flex;align-items:center;gap:10px;min-height:56px;border-top:1px solid var(--line)}
</style>
</helmet>
