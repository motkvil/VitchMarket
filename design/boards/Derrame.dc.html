<style>

.vm{--brand:#d92d30;--brand-dk:#9f1d20;--brand-soft:#fde7e7;--paper:#faf6ea;--card:#ffffff;--ink:#1b1f1d;--mute:#56635d;--line:rgba(27,31,29,0.12);--tag:#ffd23f;--ok:#1f7a46;--ok-soft:#e3f3ea;--warn:#7a4f00;--warn-soft:#fff1c2;--floor:#17352f}

<div class="vm" style="position:relative;width:390px;height:844px;overflow:hidden;box-sizing:border-box;background:var(--paper);color:var(--ink);font-family:'Nunito',system-ui,sans-serif;">

  <header style="position:absolute;top:0;left:0;right:0;height:96px;box-sizing:border-box;padding:44px 8px 0;background:var(--brand);border-bottom:5px solid var(--brand-dk);color:#fff;display:flex;align-items:center;">

    <div style="flex:1;font-family:'Fredoka',sans-serif;font-weight:600;font-size:18px;">Derrame en pasillo 2</div>
    <button aria-label="Ver cómo se juega" style="width:44px;height:44px;border:0;border-radius:22px;background:rgba(255,255,255,0.2);color:#fff;font-family:'Fredoka',sans-serif;font-weight:700;font-size:20px;">?</button>
  </header>

  <div style="position:absolute;top:108px;left:16px;right:16px;display:flex;flex-direction:column;gap:12px;">

    <section style="border-radius:20px;background:var(--tag);padding:12px 16px;">
      <div style="font-family:'Fredoka',sans-serif;font-weight:600;font-size:20px;line-height:26px;">Frota el charco hasta secarlo.</div>
      <div style="margin-top:2px;font-size:13px;line-height:18px;">Arrastra la fregona por encima de toda la mancha.</div>
    </section>

    <section style="display:flex;align-items:center;gap:12px;">
      <div style="flex:1;height:14px;border-radius:7px;background:var(--line);overflow:hidden;"><div style="width:55%;height:100%;background:var(--ok);"></div></div>
      <b style="font-family:'Pixelify Sans',monospace;font-size:18px;">55 % seco</b>
    </section>

    <section style="position:relative;height:300px;border-radius:20px;background:var(--floor);overflow:hidden;" aria-label="Suelo del pasillo">
      <div style="position:absolute;left:40px;top:60px;width:300px;height:180px;border-radius:90px;background:rgba(255,210,63,0.35);box-shadow:inset 0 0 0 3px var(--tag);"></div>
      <div style="position:absolute;left:40px;top:60px;width:150px;height:180px;border-radius:90px 0 0 90px;background:#2b4a42;"></div>
      <div style="position:absolute;left:150px;top:130px;font-size:56px;line-height:60px;">🧹</div>
      <div style="position:absolute;left:14px;top:12px;font-size:12px;line-height:14px;color:#cfe3da;font-weight:800;">AMARILLO = MOJADO</div>
    </section>

    <section style="border-radius:14px;background:var(--warn-soft);padding:8px 12px;font-size:13px;line-height:18px;color:var(--warn);font-weight:700;">Mientras esté mojado, un cliente puede resbalar: multa de 60 € y reputación −1.</section>
  </div>

  <div style="position:absolute;left:16px;right:16px;bottom:24px;">
    <a href="Mapa.dc.html" style="height:56px;border-radius:16px;background:var(--brand);box-shadow:0 4px 0 var(--brand-dk);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Fredoka',sans-serif;font-weight:600;font-size:20px;">Poner cartel y terminar</a>
