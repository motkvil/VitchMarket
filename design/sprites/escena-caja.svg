<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 195 220" width="390" height="440" role="img" aria-label="Interior del súper: cajera tras la cinta y tres clientes en cola">
      <defs>
        <pattern id="tile" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#ead9ae"/><rect width="12" height="12" fill="#dcc895"/><rect x="12" y="12" width="12" height="12" fill="#dcc895"/></pattern>
        <g id="cust">
          <rect x="2" y="0" width="6" height="2" style="fill:var(--h,#3b2a20)"/>
          <rect x="2" y="2" width="6" height="5" fill="#f2c9a0"/>
          <rect x="3" y="4" width="1" height="1" fill="#1b1f1d"/><rect x="6" y="4" width="1" height="1" fill="#1b1f1d"/>
          <rect x="1" y="7" width="8" height="6" fill="currentColor"/>
          <rect x="0" y="8" width="1" height="4" fill="currentColor"/><rect x="9" y="8" width="1" height="4" fill="currentColor"/>
          <rect x="2" y="13" width="2" height="4" fill="#33406b"/><rect x="6" y="13" width="2" height="4" fill="#33406b"/>
          <rect x="1" y="17" width="3" height="1" fill="#1b1f1d"/><rect x="6" y="17" width="3" height="1" fill="#1b1f1d"/>
        </g>
      </defs>

      <!-- pared -->
      <rect x="0" y="0" width="195" height="84" fill="#f6e2b3"/>
      <rect x="0" y="0" width="195" height="16" fill="#d92d30"/>
      <rect x="10" y="0" width="10" height="16" fill="#fff"/><rect x="30" y="0" width="10" height="16" fill="#fff"/><rect x="50" y="0" width="10" height="16" fill="#fff"/><rect x="70" y="0" width="10" height="16" fill="#fff"/><rect x="90" y="0" width="10" height="16" fill="#fff"/><rect x="110" y="0" width="10" height="16" fill="#fff"/><rect x="130" y="0" width="10" height="16" fill="#fff"/><rect x="150" y="0" width="10" height="16" fill="#fff"/><rect x="170" y="0" width="10" height="16" fill="#fff"/>
      <rect x="0" y="16" width="195" height="3" fill="#9f1d20"/>
      <text x="97" y="40" text-anchor="middle" font-family="Pixelify Sans" font-weight="700" font-size="10" fill="#d92d30">VITCHMARKET</text>
      <!-- estantes -->
      <rect x="8" y="58" width="100" height="3" fill="#8a5a2b"/><rect x="8" y="76" width="100" height="3" fill="#8a5a2b"/>
      <rect x="12" y="48" width="8" height="10" fill="#fff"/><rect x="22" y="48" width="8" height="10" fill="#5aa9e6"/><rect x="32" y="48" width="8" height="10" fill="#fff"/><rect x="42" y="48" width="8" height="10" fill="#f4a261"/><rect x="52" y="48" width="8" height="10" fill="#5aa9e6"/>
      <rect x="12" y="66" width="10" height="10" fill="#e9c46a"/><rect x="24" y="66" width="10" height="10" fill="#e76f51"/><rect x="36" y="66" width="10" height="10" fill="#e9c46a"/><rect x="48" y="66" width="10" height="10" fill="#e76f51"/><rect x="60" y="66" width="10" height="10" fill="#e9c46a"/>
      <!-- hueco: lineal vacío -->
      <rect x="70" y="48" width="38" height="10" fill="#d9c28d"/>
      <!-- suelo -->
      <rect x="0" y="84" width="195" height="136" fill="url(#tile)"/>
      <rect x="0" y="84" width="195" height="3" fill="#b99b63"/>

      <!-- cajera -->
      <g transform="translate(140,86) scale(1.3)" style="color:#d92d30;--h:#6b2d1f"><use href="#cust"/></g>
      <rect x="150" y="104" width="7" height="3" fill="#d92d30"/>

      <!-- caja registradora -->
      <rect x="116" y="104" width="30" height="22" fill="#9aa5a0"/><rect x="116" y="104" width="30" height="3" fill="#c8d0cc"/>
      <rect x="120" y="108" width="22" height="9" fill="#10261f"/>
      <text x="131" y="115.5" text-anchor="middle" font-family="Pixelify Sans" font-weight="700" font-size="7" fill="#5dff9d">2,24</text>

      <!-- cinta -->
      <rect x="56" y="124" width="124" height="26" fill="#2b2f2e"/>
      <rect x="56" y="124" width="124" height="3" fill="#4a504e"/>
      <rect x="62" y="141" width="8" height="2" fill="#ffd23f"/><rect x="82" y="141" width="8" height="2" fill="#ffd23f"/><rect x="102" y="141" width="8" height="2" fill="#ffd23f"/><rect x="122" y="141" width="8" height="2" fill="#ffd23f"/><rect x="142" y="141" width="8" height="2" fill="#ffd23f"/><rect x="162" y="141" width="8" height="2" fill="#ffd23f"/>
      <!-- productos en la cinta -->
      <rect x="64" y="128" width="9" height="12" fill="#fff"/><rect x="64" y="128" width="9" height="3" fill="#5aa9e6"/>
      <rect x="82" y="130" width="12" height="10" fill="#e9c46a"/>
      <rect x="102" y="128" width="10" height="12" fill="#e76f51"/><rect x="104" y="131" width="6" height="2" fill="#ffd23f"/>
      <rect x="124" y="127" width="7" height="13" fill="#7b2d3b"/><rect x="126" y="125" width="3" height="3" fill="#7b2d3b"/>
      <!-- mostrador -->
      <rect x="52" y="150" width="132" height="34" fill="#d92d30"/>
      <rect x="52" y="150" width="132" height="4" fill="#ff6b6e"/>
      <rect x="52" y="180" width="132" height="4" fill="#9f1d20"/>
      <text x="118" y="170" text-anchor="middle" font-family="Pixelify Sans" font-weight="700" font-size="9" fill="#fff">CAJA 3</text>

      <!-- clientes en cola -->
      <g transform="translate(40,98) scale(1.5)" style="color:#2a9d8f;--h:#1b1f1d"><use href="#cust"/></g>
      <g transform="translate(20,118) scale(1.5)" style="color:#4361ee;--h:#8d5524"><use href="#cust"/></g>
      <g transform="translate(2,140) scale(1.5)" style="color:#f4a261;--h:#c9a227"><use href="#cust"/></g>
      <!-- cejas enfadadas -->
      <rect x="5" y="146" width="4" height="1" fill="#1b1f1d"/><rect x="10" y="146" width="4" height="1" fill="#1b1f1d"/>
      <!-- barras de paciencia -->
      <rect x="40" y="94" width="16" height="3" fill="#1b1f1d"/><rect x="41" y="95" width="11" height="1" fill="#5dff9d"/>
      <rect x="20" y="114" width="16" height="3" fill="#1b1f1d"/><rect x="21" y="115" width="8" height="1" fill="#ffd23f"/>
      <rect x="2" y="136" width="16" height="3" fill="#1b1f1d"/><rect x="3" y="137" width="3" height="1" fill="#d92d30"/>
      <!-- globo de diálogo -->
      <rect x="4" y="70" width="58" height="16" fill="#fff" stroke="#1b1f1d" stroke-width="1.5"/>
      <rect x="42" y="86" width="5" height="5" fill="#fff"/>
      <text x="33" y="81" text-anchor="middle" font-family="Nunito" font-weight="800" font-size="6" fill="#1b1f1d">¿Me pones bolsa?</text>

      <!-- charco -->
      <ellipse cx="112" cy="204" rx="22" ry="7" fill="#ffd23f" opacity="0.85"/>
      <ellipse cx="112" cy="204" rx="22" ry="7" fill="none" stroke="#c98a00" stroke-width="1.5"/>
    </svg>
